html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
button,input,select,textarea{font-family:inherit}
.wrap{max-width:1600px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
header img{height:44px}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px;line-height:1.45}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border-radius:12px;padding:12px 14px}
.tile .k{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--num);font-size:38px;letter-spacing:.5px;line-height:1.05;margin-top:2px}
.tile .s{font-size:13px;color:var(--muted)}
.tile.bad .v{color:var(--bad)} .tile.acc .v{color:var(--accent)} .tile.good .v{color:var(--good)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
nav.tabs button{background:var(--panel);color:var(--ink);border:2px solid transparent;border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer}
nav.tabs button.on{border-color:var(--accent);color:var(--accent)}
nav.tabs .n{display:inline-block;background:var(--panel2);border-radius:999px;padding:0 8px;margin-left:6px;font-size:13px;color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar input[type=search]{flex:1;min-width:220px;max-width:520px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.chip{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
.chip.on{color:#262727;background:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:10px}
@media (max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;border-left:6px solid var(--line)}
.card.red{border-left-color:var(--bad)} .card.amber{border-left-color:var(--accent)} .card.blue{border-left-color:var(--blue)} .card.green{border-left-color:var(--good)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-weight:700;font-size:17px;line-height:1.25}
.amt{font-family:var(--num);font-size:30px;letter-spacing:.5px;line-height:1;white-space:nowrap}
.meta{font-size:13px;color:var(--muted);line-height:1.5}
.meta a{color:var(--blue);text-decoration:none}
.warn{font-size:13px;background:rgba(238,209,7,.1);border:1px solid rgba(238,209,7,.5);border-radius:8px;padding:6px 9px;line-height:1.4}
.last{font-size:13px;background:rgba(255,255,255,.04);border-radius:8px;padding:6px 9px;line-height:1.4}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--accent);color:#262727;border-color:var(--accent)}
.btn.ok{background:var(--good);color:#262727;border-color:var(--good)}
.btn.red{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
details{font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-weight:600}
table.inv{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
table.inv td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
table.inv td.r{text-align:right;font-variant-numeric:tabular-nums}
.late{color:var(--bad);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:4px;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.tag.red{border-color:var(--bad);color:var(--bad)} .tag.amber{border-color:var(--accent);color:var(--accent)} .tag.green{border-color:var(--good);color:var(--good)}
.rows{background:var(--panel);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:110px minmax(0,1fr) 110px 120px 140px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .no{font-family:var(--num);font-size:22px;letter-spacing:.5px}
.row .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:760px){.row{grid-template-columns:90px minmax(0,1fr) 90px}.row .hide-s{display:none}}
h2{font-family:var(--num);font-weight:400;font-size:26px;letter-spacing:1px;margin:18px 0 4px}
h2 .n{font-family:var(--body);font-size:14px;color:var(--muted);letter-spacing:0;margin-left:8px}
.explain{font-size:14px;color:var(--muted);margin:0 0 10px;line-height:1.5;max-width:1000px}
.empty{color:var(--muted);padding:18px 4px;font-size:15px}
footer{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#262727;border-radius:10px;padding:12px 16px;font-weight:600;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:20;gap:12px;align-items:center}
#toast button{background:#262727;color:var(--accent);border:0;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
#modal .box{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
#modal h3{margin:0;font-family:var(--num);font-weight:400;font-size:28px;letter-spacing:1px}
#modal textarea,#modal input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px}
#modal textarea{min-height:90px}
#modal .row2{display:flex;gap:10px;justify-content:flex-end}
#modal .err{color:var(--bad);font-size:14px;min-height:16px}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
</style>
</head>

<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/accounts';
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
};
let token = store.get('tsd_me_token');
let D = null, tab = store.get('acc_tab') || 'invoice', ccFilter = 'due', ccQ = '', busy = false, timer;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gbp = v => '£' + (+v || 0).toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const gbp0 = v => '£' + Math.round(+v || 0).toLocaleString('en-GB');
const k = v => { v = +v || 0; return Math.abs(v) >= 1000 ? '£' + (v / 1000).toLocaleString('en-GB', {maximumFractionDigits: 1}) + 'k' : gbp0(v); };
const dmy = s => s ? new Date(String(s).slice(0,10) + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'2-digit'}) : '';
const dshort = s => s ? new Date(String(s).slice(0,10) + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}) : '';
const ago = s => { if (!s) return ''; const m = Math.round((Date.now() - new Date(s)) / 60000); return m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} days ago`; };
const ACT = {no_answer:'📞 No answer', spoke:'💬 Spoke', promised:'🤝 Promised to pay', reminder:'✉ Reminder sent', stop_flag:'🛑 Flagged for stop', note:'📝 Note'};
function toast(t, undo){ const e = document.getElementById('toast'); e.innerHTML = esc(t) + (undo ? ' <button id="tu">Undo</button>' : ''); e.style.display = 'flex';
  if (undo) document.getElementById('tu').onclick = () => { e.style.display = 'none'; undo(); };
  clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', undo ? 6000 : 3500); }
const closeModal = () => document.getElementById('modal').style.display = 'none';
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

async function api(method, body){
  const r = await fetch(API, {method, cache:'no-store', headers: {'Content-Type':'application/json', Authorization: 'Bearer ' + token}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { showLogin(); throw new Error('logged out'); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 403) throw new Error(j.error || 'no access');
  return j;
}
async function load(){
  if (busy) return;
  try {
    const j = await api('GET');
    if (j.error) throw new Error(j.error);
    D = j; render();
  } catch(e) { if (e.message !== 'logged out') document.getElementById('out').innerHTML = `<div class="empty">Couldn't load: ${esc(e.message)}</div>`; }
}

// ---------- top tiles + tabs ----------
function tiles(){
  const s = D.accounts.summary || {}, ti = Array.isArray(D.to_invoice) ? D.to_invoice : [];
  const ready = ti.filter(o => o.can_invoice);
  const rc = D.accounts.reconcile || {}; const nrec = Object.values(rc).reduce((a, l) => a + (l || []).length, 0);
  document.getElementById('tiles').innerHTML = `
    <div class="tile acc"><div class="k">To invoice</div><div class="v">${ready.length}</div><div class="s">${k(ready.reduce((a, o) => a + (+o.value || 0), 0))} shipped, not invoiced</div></div>
    <div class="tile"><div class="k">Owed to us</div><div class="v">${k(s.outstanding)}</div><div class="s">${s.customers || 0} customers, after their credits${D.accounts.all_outstanding != null ? ` · Xero total ${k(D.accounts.all_outstanding)} incl. suspense &amp; internal` : ''}</div></div>
    <div class="tile bad"><div class="k">Overdue invoices</div><div class="v">${k(s.overdue)}</div><div class="s">over 60 days: ${k((+s.b3||0) + (+s.b4||0))}</div></div>
    <div class="tile"><div class="k">Unused credit</div><div class="v">${k(s.credits)}</div><div class="s">credit notes &amp; overpayments not matched</div></div>
    <div class="tile good"><div class="k">Paid this week</div><div class="v">${k(D.accounts.collected_week)}</div><div class="s">invoices marked paid in Xero</div></div>`;
  const nd = (D.accounts.debtors || []).filter(d => d.bucket === 'due').length;
  const T = [['invoice', 'To invoice', ready.length], ['credit', 'Credit control', nd], ['recon', 'Clean-up', nrec]];
  document.getElementById('tabs').innerHTML = T.map(([id, n, c]) => `<button class="${tab === id ? 'on' : ''}" data-tab="${id}">${n}<span class="n">${c}</span></button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; store.set('acc_tab', tab); render(); });
}
function render(){
  if (!D) return;
  tiles();
  const out = document.getElementById('out');
  out.innerHTML = tab === 'credit' ? creditHtml() : tab === 'recon' ? reconHtml() : invoiceHtml();
  wire();
  document.getElementById('foot').innerHTML = `Xero last synced ${ago(D.accounts.synced_at)} · Cin7 orders checked just now · logged in as ${esc(D.me)}`;
}

// ---------- to invoice ----------
function invoiceHtml(){
  if (!Array.isArray(D.to_invoice)) return `<div class="empty">Couldn't check Cin7: ${esc(D.to_invoice && D.to_invoice.error)}</div>`;
  const ready = D.to_invoice.filter(o => o.can_invoice), part = D.to_invoice.filter(o => !o.can_invoice && !o.internal), internal = D.to_invoice.filter(o => o.internal);
  const row = (o, btn) => `<div class="row">
      <div class="no">${esc(o.no)}</div>
      <div><div class="name" style="font-size:15px">${esc(o.customer)}</div><div class="meta">Ordered ${dmy(o.order_date)}${o.rep ? ' · ' + esc(o.rep === 'WooCommerce' ? 'Website' : o.rep) : ''}${o.carrier ? ' · “' + esc(o.carrier) + '”' : ''}${o.shipped_at ? ' · shipped ' + dshort(o.shipped_at) : ''}</div></div>
      <div class="r">${o.value ? gbp(o.value) : ''}</div>
      <div class="hide-s">${o.cash ? '<span class="tag">Cash sale</span>' : o.web ? '<span class="tag">Website</span>' : ''}${o.ship === 'PARTIALLY SHIPPED' ? '<span class="tag amber">Part shipped</span>' : ''}${o.invoice === 'PARTIALLY INVOICED' ? '<span class="tag amber">Part invoiced</span>' : ''}</div>
      <div style="text-align:right">${btn}</div></div>`;
  let h = `<p class="explain">Orders that have gone out (shipped or collected) but haven't been invoiced in Cin7. <b>Invoice</b> authorises the invoice in Cin7, exactly like pressing it in Cin7, and Cin7 sends it to Xero. Invoice date is today; the due date follows the customer's terms in Cin7.</p>`;
  h += `<div class="bar"><b>Ready to invoice</b><span class="sub">${ready.length} orders · ${gbp(ready.reduce((a, o) => a + (+o.value || 0), 0))} ex VAT</span>${ready.length > 1 ? '<button class="btn go" id="invall">Invoice all ready</button>' : ''}</div>`;
  h += ready.length ? `<div class="rows">${ready.map(o => row(o, `<button class="btn go" data-inv="${o.id}">Invoice</button>`)).join('')}</div>` : '<div class="empty">Nothing waiting. Every shipped order is invoiced. ✓</div>';
  if (part.length) {
    h += `<h2>Part shipped / part invoiced<span class="n">${part.length}</span></h2><p class="explain">Some of the order has gone, the rest is still to come. Invoice what's been sent in Cin7 (Bob leaves these alone so nothing gets invoiced twice).</p>`;
    h += `<div class="rows">${part.map(o => row(o, '<span class="sub">Invoice in Cin7</span>')).join('')}</div>`;
  }
  if (internal.length) h += `<h2>Internal orders<span class="n">${internal.length}</span></h2><p class="explain">Stock moved internally (not sold). They don't need invoicing, but they're sitting open in Cin7. Close them off in Cin7 when you get a chance.</p><div class="rows">${internal.map(o => row(o, '')).join('')}</div>`;
  const log = D.invoice_log || [];
  if (log.length) h += `<details style="margin-top:14px"><summary>Recent invoicing from Bob (${log.length})</summary><table class="inv">${log.map(l => `<tr><td>${esc(l.order_number)}</td><td class="${l.ok ? '' : 'late'}">${esc(l.message)}</td><td>${esc(l.by_name)}</td><td class="r">${dshort(l.at)} ${new Date(l.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</td></tr>`).join('')}</table></details>`;
  return h;
}
async function invoiceOne(id){
  const o = D.to_invoice.find(x => x.id === id); if (!o) return false;
  const j = await api('POST', {action:'invoice', id}).catch(e => ({ok:false, error:e.message}));
  if (!j.ok) { alertBox(`Couldn't invoice ${esc(o.no)}`, esc(j.error || 'Unknown error')); return false; }
  D.to_invoice = D.to_invoice.filter(x => x.id !== id);
  return j;
}
function alertBox(title, body){
  document.getElementById('mbox').innerHTML = `<h3>${title}</h3><div class="sub" style="color:var(--ink);font-size:15px">${body}</div><div class="row2"><button class="btn go" id="mok">OK</button></div>`;
  document.getElementById('modal').style.display = 'flex'; document.getElementById('mok').onclick = closeModal;
}

// ---------- credit control ----------
function creditHtml(){
  const all = D.accounts.debtors || [];
  const counts = {due: 0, promised: 0, later: 0, all: all.length, stop: 0};
  for (const d of all) { counts[d.bucket] = (counts[d.bucket] || 0) + 1; if (d.stop_flagged) counts.stop++; }
  const q = ccQ.toLowerCase();
  let list = all.filter(d => ccFilter === 'all' ? true : ccFilter === 'stop' ? d.stop_flagged : d.bucket === ccFilter);
  if (q) list = all.filter(d => (d.name || '').toLowerCase().includes(q) || (d.invoices || []).some(i => String(i.number).toLowerCase().includes(q)));
  const F = [['due', 'To chase'], ['promised', 'Promised'], ['later', 'Chased, waiting'], ['stop', '🛑 Flagged'], ['all', 'Everyone']];
  let h = `<p class="explain">Customers with overdue invoices, biggest first. Log every call with a button; the customer then drops off <b>To chase</b> until they're due again (no answer: 2 working days, spoke: 5, promised: the day after the date they gave). Unused credit on the account is shown so you can allocate it in Xero before chasing.</p>
    <div class="bar"><input type="search" id="ccq" placeholder="Search customer or invoice number" value="${esc(ccQ)}">${F.map(([id, n]) => `<button class="chip ${!q && ccFilter === id ? 'on' : ''}" data-f="${id}">${n} ${counts[id] || 0}</button>`).join('')}</div>`;
  if (!list.length) return h + `<div class="empty">${q ? 'No match.' : ccFilter === 'due' ? 'Nobody to chase right now. ✓' : 'Nobody here.'}</div>`;
  h += '<div class="grid">' + list.map(d => {
    const col = d.stop_flagged ? 'red' : d.oldest_days > 60 ? 'red' : d.oldest_days > 30 ? 'amber' : 'blue';
    const inv = d.invoices || [];
    return `<div class="card ${col}">
      <div class="top"><div class="name">${esc(d.name)}</div><div class="amt" style="color:var(--bad)">${gbp(d.overdue)}</div></div>
      <div class="meta">${d.n_overdue} overdue invoice${d.n_overdue === 1 ? '' : 's'} · oldest <b class="${d.oldest_days > 60 ? 'late' : ''}">${d.oldest_days} days</b> late · total owed ${gbp(d.owed)}</div>
      <div class="meta">${d.contact ? esc(d.contact) + ' · ' : ''}${d.phone ? `<a href="tel:${esc(d.phone.replace(/\s/g,''))}">📞 ${esc(d.phone)}</a>` : ''}${d.mobile && d.mobile !== d.phone ? ` · <a href="tel:${esc(d.mobile.replace(/\s/g,''))}">📱 ${esc(d.mobile)}</a>` : ''}${d.email ? ` · <a href="mailto:${esc(d.email)}">${esc(d.email)}</a>` : ''}${!d.phone && !d.mobile && !d.email ? '<span class="late">No phone or email in Xero</span>' : ''}</div>
      ${+d.credit > 0 ? `<div class="warn">💡 They've got <b>${gbp(d.credit)}</b> of unused credit. Allocate it in Xero first, it may clear some of this.</div>` : ''}
      ${d.last ? `<div class="last"><b>${ACT[d.last.action] || esc(d.last.action)}</b> · ${esc(d.last.by || '')} ${ago(d.last.at)}${d.promised_date ? ` · promised <b>${dshort(d.promised_date)}</b>` : ''}${d.next_date ? ` · chase again ${dshort(d.next_date)}` : ''}${d.last.note ? `<br>“${esc(d.last.note)}”` : ''}</div>` : ''}
      <details><summary>Overdue invoices (${inv.length})</summary><table class="inv">${inv.map(i => `<tr><td>${esc(i.number)}</td><td>${esc(i.ref || '')}</td><td>due ${dmy(i.due)}</td><td class="r ${i.days > 60 ? 'late' : ''}">${i.days}d</td><td class="r">${gbp(i.amount)}</td></tr>`).join('')}</table></details>
      <div class="btns">
        <button class="btn" data-c="no_answer" data-id="${d.contact_id}">📞 No answer</button>
        <button class="btn" data-c="spoke" data-id="${d.contact_id}">💬 Spoke</button>
        <button class="btn ok" data-c="promised" data-id="${d.contact_id}">🤝 Promised</button>
        <button class="btn" data-c="reminder" data-id="${d.contact_id}">✉ Reminder</button>
        <button class="btn" data-c="note" data-id="${d.contact_id}">📝 Note</button>
        <button class="btn red" data-c="stop_flag" data-id="${d.contact_id}">🛑 Flag stop</button>
      </div></div>`;
  }).join('') + '</div>';
  return h;
}
function reminderText(d){
  const inv = d.invoices || [];
  const lines = inv.map(i => `${i.number}${i.ref ? ' (' + i.ref + ')' : ''}  due ${dmy(i.due)}  ${gbp(i.amount)}`).join('\n');
  const first = d.contact ? d.contact.split(' ')[0] : '';
  return { subject: `Overdue invoices – ${d.name}`,
    body: `Hi${first ? ' ' + first : ''},\n\nI hope you're well. Our records show the following invoice${inv.length === 1 ? ' is' : 's are'} now past due:\n\n${lines}\n\nTotal overdue: ${gbp(d.overdue)}\n\nCould you let me know when we can expect payment? If you've already paid, please send over the remittance and I'll get it matched up.\n\nOur bank details are on the invoice. If you need copies of any invoices, just let me know.\n\nThanks,\n` };
}
function chase(id, what){
  const d = (D.accounts.debtors || []).find(x => x.contact_id === id); if (!d) return;
  const send = async (note, promised) => {
    const j = await api('POST', {action:'chase', contact_id: id, name: d.name, what, note, promised, amount: d.overdue}).catch(e => ({ok:false, error:e.message}));
    if (!j.ok) { toast(j.error || "Couldn't save"); return false; }
    d.last = {action: what, note, at: new Date().toISOString(), by: D.me};
    if (what === 'promised') d.promised_date = promised;
    if (what !== 'note') { d.next_date = j.next; d.bucket = j.next && j.next > new Date().toISOString().slice(0,10) ? (what === 'promised' ? 'promised' : 'later') : 'due'; }
    if (what === 'stop_flag') d.stop_flagged = true;
    render(); toast(`${d.name}: ${ACT[what]}${j.next && what !== 'note' ? ' · back on the list ' + dshort(j.next) : ''}`); return true;
  };
  if (what === 'no_answer') return send('', null);
  if (what === 'reminder') {
    const r = reminderText(d);
    document.getElementById('mbox').innerHTML = `<h3>Reminder · ${esc(d.name)}</h3>
      <div class="sub">This opens an email in Outlook${d.email ? ' to <b>' + esc(d.email) + '</b>' : ''}. Check it, then send. Bob logs it as a reminder sent.</div>
      <textarea id="mt" style="min-height:240px">${esc(r.body)}</textarea>
      <div class="err" id="me"></div>
      <div class="row2"><button class="btn" id="mc">Cancel</button><button class="btn go" id="mg">Open in Outlook</button></div>`;
    document.getElementById('modal').style.display = 'flex';
    document.getElementById('mc').onclick = closeModal;
    document.getElementById('mg').onclick = async () => {
      const body = document.getElementById('mt').value;
      location.href = `mailto:${encodeURIComponent(d.email || '')}?subject=${encodeURIComponent(r.subject)}&body=${encodeURIComponent(body)}`;
      closeModal(); await send('Reminder email', null);
    };
    return;
  }
  const head = {spoke: 'What did they say?', promised: 'When did they say they would pay?', note: 'Add a note', stop_flag: 'Flag for account stop'}[what];
  const sub = what === 'stop_flag' ? 'This flags the account for Denver/Rose to decide. It does not stop the account in Cin7.' : '';
  document.getElementById('mbox').innerHTML = `<h3>${head}</h3><div class="sub">${esc(d.name)} · ${gbp(d.overdue)} overdue${sub ? '<br>' + sub : ''}</div>
    ${what === 'promised' ? `<input type="date" id="mdt" min="${new Date().toISOString().slice(0,10)}">` : ''}
    <textarea id="mt" placeholder="${what === 'promised' ? 'Optional: how much, who you spoke to' : what === 'stop_flag' ? 'Why? e.g. no reply to 3 calls, promised twice and not paid' : 'Notes'}"></textarea>
    <div class="err" id="me"></div>
    <div class="row2"><button class="btn" id="mc">Cancel</button><button class="btn go" id="mg">Save</button></div>`;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('mc').onclick = closeModal;
  document.getElementById('mg').onclick = async () => {
    const note = document.getElementById('mt').value.trim(), dt = what === 'promised' ? document.getElementById('mdt').value : null;
    if (what === 'promised' && !dt) { document.getElementById('me').textContent = 'Pick the date they promised.'; return; }
    if ((what === 'note' || what === 'stop_flag') && !note) { document.getElementById('me').textContent = 'Add a few words.'; return; }
    if (await send(note, dt)) closeModal();
  };
}

// ---------- clean-up ----------
const GROUPS = [
  ['internal', 'Suspense, cash sale & internal accounts', "Not real customers: Receipts Suspense, Cash Sale, Trade Sale, website/receipt accounts, write-off accounts and TSD Hire (inter-company). Money parked here is usually payments that couldn't be matched at the time. Each one needs clearing down: match the payments to the right customers' invoices, or journal them off with the accountant. These are left out of credit control.", 'Cleared'],
  ['allocate', 'Credits to match up', 'These customers owe us money <b>and</b> have unused credit (credit notes, overpayments) on their account. In Xero, open the customer, allocate the credit against their oldest invoices, and both sides clear. Quick wins.', 'Allocated in Xero'],
  ['same_day', 'Paid on the day but still showing unpaid', 'Invoices due the same day they were raised (cash, card, website, pay-before-shipping) that are still open after 3 days. Almost always the payment came in but was never matched in Xero. Find the payment in the bank feed / Stripe and match it.', 'Matched / sorted'],
  ['credit_only', 'Credit sitting on accounts that owe nothing', "These customers don't owe anything but have credit left over. Decide for each: leave it for their next order, refund it, or write it off if it's tiny or years old.", 'Dealt with'],
  ['pre_cin7', 'Old invoices from before Cin7 (before 7 July)', 'Still showing as unpaid in Xero from the Sage days. Some are genuinely owed, some will be payments that were never matched or should have been credited. Check each and either chase it, match it or credit it off.', 'Checked'],
  ['on_hold', 'On-hold / replaced accounts', 'Accounts marked ON HOLD or "do not use" that still have open items. Move the balance to the live account or clear it.', 'Sorted'],
];
function reconHtml(){
  const rc = D.accounts.reconcile || {};
  let h = `<p class="explain">The clean-up list for you and Rose. Each item stays until it's fixed in Xero (it then disappears on the next sync, within 30 minutes) or someone ticks it off as sorted.</p>`;
  for (const [id, name, explain, okText] of GROUPS) {
    const list = rc[id] || [];
    const total = list.reduce((a, r) => a + Math.abs(+r.amount || 0), 0);
    h += `<h2>${name}<span class="n">${list.length} · ${gbp0(total)}</span></h2><p class="explain">${explain}</p>`;
    if (!list.length) { h += '<div class="empty">Nothing here. ✓</div>'; continue; }
    h += '<div class="grid">' + list.map(r => `<div class="card amber">
      <div class="top"><div class="name">${esc(r.name)}</div><div class="amt">${gbp(Math.abs(r.amount))}</div></div>
      ${id === 'allocate' ? `<div class="meta">Owes ${gbp(r.owed)} · has ${gbp(r.credit)} credit</div>` : r.n ? `<div class="meta">${r.n} item${r.n === 1 ? '' : 's'}</div>` : ''}
      <details><summary>Show items (${(r.items || []).length})</summary><table class="inv">${(r.items || []).map(i => `<tr><td>${i.kind === 'invoice' ? esc(i.number || 'Invoice') : i.kind === 'credit' ? esc(i.number || 'Credit note') : i.kind === 'overpay' ? 'Overpayment' : 'Prepayment'}</td><td>${esc(i.ref || '')}</td><td>${dmy(i.date)}</td><td class="r">${gbp(i.amount)}</td></tr>`).join('')}</table></details>
      <div class="btns"><button class="btn ok" data-done="${esc(r.key)}" data-name="${esc(r.name)}">✓ ${okText}</button></div></div>`).join('') + '</div>';
  }
  return h;
}
async function done(key, name){
  const j = await api('POST', {action:'done', key}).catch(e => ({ok:false, error:e.message}));
  if (!j.ok) return toast(j.error || "Couldn't save");
  const rc = D.accounts.reconcile; let removed = null, gid = null;
  for (const g in rc) { const i = rc[g].findIndex(r => r.key === key); if (i >= 0) { removed = rc[g].splice(i, 1)[0]; gid = g; } }
  render();
  toast(`${name} ticked off`, async () => { await api('POST', {action:'undone', key}); if (removed) rc[gid].push(removed); render(); });
}

function wire(){
  document.querySelectorAll('[data-inv]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Invoicing…'; busy = true;
    const j = await invoiceOne(b.dataset.inv); busy = false;
    if (j) { toast(j.already ? 'Already invoiced in Cin7' : `Invoiced ${j.number || ''} · ${gbp(j.total)} · due ${dshort(j.due)}`); render(); }
    else { b.disabled = false; b.textContent = 'Invoice'; }
  });
  const all = document.getElementById('invall');
  if (all) all.onclick = () => {
    const ready = D.to_invoice.filter(o => o.can_invoice);
    document.getElementById('mbox').innerHTML = `<h3>Invoice ${ready.length} orders?</h3><div class="sub" style="color:var(--ink);font-size:15px">This authorises ${ready.length} invoices in Cin7 (${gbp(ready.reduce((a, o) => a + (+o.value || 0), 0))} ex VAT). Cin7 then sends them to Xero. It takes a few seconds each.</div><div class="err" id="me"></div><div class="row2"><button class="btn" id="mc">Cancel</button><button class="btn go" id="mg">Invoice them all</button></div>`;
    document.getElementById('modal').style.display = 'flex';
    document.getElementById('mc').onclick = closeModal;
    document.getElementById('mg').onclick = async () => {
      const g = document.getElementById('mg'), c = document.getElementById('mc'); g.disabled = c.disabled = true; busy = true;
      let n = 0, bad = [];
      for (const o of ready) {
        g.textContent = `Invoicing ${n + bad.length + 1} of ${ready.length}…`;
        const j = await api('POST', {action:'invoice', id: o.id}).catch(e => ({ok:false, error:e.message}));
        if (j.ok) { n++; D.to_invoice = D.to_invoice.filter(x => x.id !== o.id); } else bad.push(`${o.no}: ${j.error}`);
      }
      busy = false; closeModal(); render();
      if (bad.length) alertBox(`${n} invoiced, ${bad.length} didn't go`, bad.map(esc).join('<br>'));
      else toast(`${n} orders invoiced. They'll be in Xero shortly.`);
    };
  };
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => chase(b.dataset.id, b.dataset.c));
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { ccFilter = b.dataset.f; ccQ = ''; render(); });
  const q = document.getElementById('ccq');
  if (q) q.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { ccQ = q.value.trim(); const pos = q.selectionStart; render(); const n = document.getElementById('ccq'); n.focus(); n.setSelectionRange(pos, pos); }, 250); };
  document.querySelectorAll('[data-done]').forEach(b => b.onclick = () => done(b.dataset.done, b.dataset.name));
}

function showLogin(){ document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; }
function showApp(){ document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block'; load(); }
if (token) showApp(); else showLogin();
TSDAuth.mount(t => { token = t; showApp(); });
setInterval(() => { if (document.getElementById('modal').style.display !== 'flex') load(); }, 5 * 60000);
window.addEventListener('message', e => { if (e.data && e.data.tsd === 'refresh') load(); });
</script>
<script>
// Self-update: every 2 minutes, check GitHub for a newer copy of this page and reload into it (not while a pop-up is open).
(function(){
  const BUILD = '20261029092315';
  let newer = false;
  async function check(){
    try {
      if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); }
      if (newer && document.getElementById('modal').style.display !== 'flex') location.reload();
    } catch(e){}
  }
  setInterval(check, 120000);
})();
</script>

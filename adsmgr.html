.wrap{padding:18px 20px 40px;max-width:1300px;margin:0 auto}
h1{font-family:var(--num);font-size:42px;letter-spacing:1px;margin:0;line-height:1}
.sub{color:var(--muted);font-size:14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{background:none;border:1px solid transparent;color:var(--muted);font:inherit;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#262727}
.tabs button .cnt{background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;margin-left:5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;padding:6px 14px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--ink)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:600;padding:7px 13px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--muted)}.btn.y{background:var(--accent);color:#262727;border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}.btn.g{border-color:var(--good);color:var(--good)}.btn.r{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{background:#1c1d1d;border:1px solid var(--line);color:var(--ink);font:inherit;padding:7px 10px;border-radius:10px;color-scheme:dark}
.banner{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.lock{background:rgba(125,219,152,.08);border:1px solid var(--good)}
.banner.live{background:rgba(255,122,107,.1);border:1px solid var(--bad)}
.banner.learn{background:rgba(238,209,7,.08);border:1px solid var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .k{color:var(--muted);font-size:14px;font-weight:600}
.tile .n{font-family:var(--num);font-size:44px;line-height:1.05;margin-top:2px}
.tile .s{color:var(--muted);font-size:13px}
.prog{height:8px;background:var(--panel2);border-radius:9px;margin-top:8px;position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:9px}
.prog b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h2{font-family:var(--num);font-size:28px;letter-spacing:.5px;margin:0 0 4px;font-weight:400}
.rhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.hrow{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;margin-top:4px}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.hrow .nm{font-weight:700}.hrow .nw{font-size:14px}.hrow .fx{color:var(--muted);font-size:13px;margin-top:2px}
.pill{display:inline-block;padding:2px 9px;border-radius:9px;background:var(--panel2);font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.pill.y{background:rgba(238,209,7,.15);color:var(--accent)}.pill.g{background:rgba(125,219,152,.15);color:var(--good)}.pill.r{background:rgba(255,122,107,.15);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td.l{white-space:normal}
.scroll{overflow-x:auto}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.flag{color:var(--warn);font-size:12px;font-weight:700}
.chart{width:100%;display:block}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}.cols>*{min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent)}
.chg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;background:var(--panel2)}
.chg .what{flex:1;min-width:240px}.chg .what b{font-size:15px}.chg .meta{color:var(--muted);font-size:12px;margin-top:3px}
.chg .acts{display:flex;gap:6px;flex-wrap:wrap}
.guide h3{font-family:var(--num);font-size:24px;font-weight:400;letter-spacing:.5px;margin:18px 0 6px}
.guide p,.guide li{font-size:15px;line-height:1.5}.guide dt{font-weight:700;margin-top:10px}.guide dd{margin:2px 0 0;color:var(--muted)}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:8px 0}.step .n{font-family:var(--num);font-size:26px;color:var(--accent);line-height:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:560px;width:100%}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.frow label{font-size:15px}.frow .h{color:var(--muted);font-size:12px;display:block}
.frow input,.frow select{width:150px;text-align:right}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:#262727;font-weight:700;padding:10px 16px;border-radius:10px;display:none;z-index:60}
@media (max-width:640px){.hm{display:none}.wrap{padding:14px 12px 30px}.tile .n{font-size:34px}.cols{grid-template-columns:1fr}h1{font-size:34px}}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none">
  <h1>ADS MANAGER</h1>
  <div class="sub">Google Ads at a glance: what we spend, whether the tracking can be trusted, and the changes waiting for a yes.</div>
  <div class="tabs" id="tabs">
    <button data-t="overview">Overview</button><button data-t="campaigns">Campaigns</button><button data-t="terms">Search terms</button>
    <button data-t="products">Products</button><button data-t="changes">Changes</button><button data-t="settings">Settings</button><button data-t="guide">How to use</button>
  </div>
  <div id="out"><div class="empty">Loading…</div></div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script src="auth.js?v=20261116211322"></script>
<script src="activity.js?v=20261116211322"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/adsmgr';
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
let token = store.get('tsd_me_token');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = v => Number(v) || 0;
const gbp = (v, dp = 0) => (N(v) < 0 ? '−£' : '£') + Math.abs(N(v)).toLocaleString('en-GB', {minimumFractionDigits: dp, maximumFractionDigits: dp});
const int = v => Math.round(N(v)).toLocaleString('en-GB');
const dshort = s => new Date(String(s).slice(0, 10) + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short'});
const dt = s => s ? new Date(s).toLocaleString('en-GB', {timeZone:'Europe/London', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '–';
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2600); };
const CH = { PERFORMANCE_MAX: 'PMax', SHOPPING: 'Shopping', SEARCH: 'Search', DISPLAY: 'Display', VIDEO: 'Video', DEMAND_GEN: 'Demand Gen' };
const TYPE_TEXT = { add_negative: 'Block search', pause_campaign: 'Pause campaign', enable_campaign: 'Switch campaign on', set_budget: 'Change budget',
  pause_adgroup: 'Pause ad group', enable_adgroup: 'Switch ad group on', pause_keyword: 'Pause keyword', enable_keyword: 'Switch keyword on', add_keyword: 'Add keyword' };
const MERCHANTS = /(travis|selco|brewers|jewson|wickes|screwfix|toolstation|topps|b&q|bss|city plumbing|howdens|mkm|huws|buildbase|trade account|account sign|application)/i;
const BRAND = /(tiling|tile|tiles) ?supplies ?direct|\btsd\b/i;

let tab = (location.hash || '').slice(1) || store.get('ads_tab') || 'overview';
let days = Number(store.get('ads_days')) || 30;
let OV = null, CHG = null;
const tf = { terms: { q: '', noconv: false, chip: '' }, products: { q: '', noconv: false }, campaigns: { small: false } };

async function api(qs, body){
  const r = await fetch(API + (qs || ''), body ? {method:'POST', headers:{Authorization:'Bearer ' + token, 'Content-Type':'application/json'}, body: JSON.stringify(body)}
    : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('Please log in again'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || 'Something went wrong');
  return j;
}
function showLogin(msg){ $('app').style.display = 'none'; $('login').style.display = 'flex'; if (msg) $('lerr').textContent = msg; }
function start(){ $('login').style.display = 'none'; $('app').style.display = 'block'; go(tab); }
function go(t){
  tab = t; store.set('ads_tab', t); history.replaceState(null, '', '#' + t);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ({ overview, campaigns, terms, products, changes, settings, guide })[t]();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.t));
const loading = () => { $('out').innerHTML = '<div class="empty">Loading…</div>'; };
const fail = x => { $('out').innerHTML = `<div class="card bad">${esc(x.message)}</div>`; };
const rangeSeg = () => `<div class="seg" id="rng">${[7, 30, 90].map(d => `<button data-d="${d}" class="${d === days ? 'on' : ''}">${d} days</button>`).join('')}</div>`;
const wireRange = fn => document.querySelectorAll('#rng button').forEach(b => b.onclick = () => { days = Number(b.dataset.d); store.set('ads_days', days); fn(); });
function lockBanner(s){
  return s && s.paused === false
    ? `<div class="banner live"><span class="pill r">LIVE</span><span>Kill switch is <b>off</b>: approved changes are made in Google Ads on the script's next run.</span></div>`
    : `<div class="banner lock"><span class="pill g">READ-ONLY</span><span>Kill switch is <b>on</b>: Bob watches and suggests, nothing in Google Ads changes. Approved changes wait here.</span></div>`;
}
const trustAds = () => OV && (OV.health || []).find(h => h.key === 'value')?.state === 'good';
const trustGa = () => OV && (OV.health || []).find(h => h.key === 'ga4')?.state === 'good';

// ---------------------------------------------------------------- overview
async function overview(){
  loading();
  try { OV = await api('?view=overview&days=' + days); } catch(x){ return fail(x); }
  const o = OV, w = o.window, m = o.month, cap = N(o.cap);
  const yday = (o.series || []).at(-1) || {};
  const cpc = w.clicks ? w.cost / w.clicks : 0;
  const gp = o.ga && !o.ga.error ? o.ga : null;
  const pend = N((o.changes || {}).proposed);
  const pctCap = cap ? Math.min(100, 100 * m.cost / cap) : 0, pctDay = 100 * m.days_done / m.days_in;
  $('out').innerHTML = `
    ${lockBanner(o.settings)}
    ${o.learning ? `<div class="banner learn"><span class="pill y">RELEARNING</span><span>Tracking was fixed on ${dshort(o.learning.fixed_on)}. Google needs about 3 weeks to relearn: hold bidding and budget changes until <b>${dshort(o.learning.until)}</b> (day ${o.learning.day} of 21).</span></div>` : ''}
    ${pend ? `<div class="banner learn"><b>${pend} change${pend === 1 ? '' : 's'}</b> waiting for a decision. <button class="btn sm y" id="toChg">Review</button></div>` : ''}
    <div class="card"><div class="rhead"><h2>Can we trust the numbers?</h2><span class="sub">Last 7 complete days · checked every time this page opens</span></div>
      ${(o.health || []).map(h => `<div class="hrow"><div class="dot ${h.state}"></div><div><div class="nm">${esc(h.name)}</div><div class="nw">${esc(h.now)}</div>${h.state !== 'good' ? `<div class="fx">${esc(h.fix)}</div>` : ''}</div></div>`).join('')}
    </div>
    <div class="bar"><b>Last</b> ${rangeSeg()}<span class="sub">${dshort(o.from)} to ${dshort(o.to)} · complete days only</span></div>
    <div class="tiles">
      <div class="tile"><div class="k">Spent this month</div><div class="n">${gbp(m.cost)}</div><div class="s">of the ${gbp(cap)} cap · heading for ${gbp(o.projected)}</div>
        <div class="prog"><i style="width:${pctCap}%;${o.projected > cap ? 'background:var(--bad)' : ''}"></i><b style="left:${pctDay}%"></b></div><div class="s" style="margin-top:4px">Line = how far through the month we are</div></div>
      <div class="tile"><div class="k">Yesterday</div><div class="n">${gbp(yday.cost)}</div><div class="s">${int(yday.clicks)} clicks · daily budgets total ${gbp(o.daily_budget_total, 2)}</div></div>
      <div class="tile"><div class="k">Spend, last ${days} days</div><div class="n">${gbp(w.cost)}</div><div class="s">${int(w.clicks)} clicks at ${gbp(cpc, 2)} each</div></div>
      <div class="tile"><div class="k">Real web orders (Bob)</div><div class="n">${int(o.web.orders)}</div><div class="s">${gbp(o.web.rev)} ex VAT · ${gbp(o.web.gp)} gross profit · all channels</div></div>
      <div class="tile"><div class="k">Sales from ads (GA4)</div><div class="n">${gp ? int(gp.paid_purchases) : '–'}</div><div class="s">${gp ? gbp(gp.paid_revenue) + ' inc VAT, last click' : esc(o.ga_error || 'GA4 unavailable')}${gp && !trustGa() ? ' <span class="flag">· GA4 double counts, real figure lower</span>' : ''}</div></div>
      <div class="tile"><div class="k">Conversions Google sees</div><div class="n">${N(w.conv).toFixed(0)}</div><div class="s">worth ${gbp(w.val)} to Google${!trustAds() ? ' <span class="flag">· values wrong until Matt\'s fix</span>' : ''}</div></div>
    </div>
    <div class="card"><div class="rhead"><h2>Daily spend vs web orders</h2><span class="sub">Last 90 days · bars = ad spend, line = all web orders in Bob</span></div>${chart(o.series || [])}</div>
    <div class="cols">
      <div class="card"><h2>Where web visitors come from</h2><div class="sub">GA4, last ${days} days${!trustGa() ? ' · purchases double counted for now, compare between rows not with Bob' : ''}</div>
        ${gp ? `<div class="scroll"><table><tr><th>Channel</th><th>Visits</th><th>Purchases</th><th>Revenue</th><th class="hm">Share of revenue</th></tr>
        ${(gp.channels || []).map(c => `<tr><td>${esc(c.sessionDefaultChannelGroup)}${['Paid Search','Paid Shopping','Cross-network'].includes(c.sessionDefaultChannelGroup) ? ' <span class="pill y">ads</span>' : ''}</td><td>${int(c.sessions)}</td><td>${int(c.ecommercePurchases)}</td><td>${gbp(c.purchaseRevenue)}</td><td class="hm">${gp.revenue ? Math.round(100 * c.purchaseRevenue / gp.revenue) : 0}%</td></tr>`).join('')}</table></div>` : `<div class="empty">${esc(o.ga_error || 'GA4 unavailable')}</div>`}
      </div>
      <div class="card"><h2>What Google gets for the money</h2><div class="sub">Last ${days} days</div>
        <table>
          <tr><td class="l">Ad spend</td><td>${gbp(w.cost)}</td></tr>
          <tr><td class="l">Revenue from ads (GA4, last click)</td><td>${gp ? gbp(gp.paid_revenue) : '–'}</td></tr>
          <tr><td class="l">Return on ad spend (GA4)</td><td>${gp && w.cost ? (gp.paid_revenue / w.cost).toFixed(1) + '×' : '–'}${!trustGa() ? ' <span class="flag">overstated</span>' : ''}</td></tr>
          <tr><td class="l">Return Google thinks it gets</td><td>${w.cost ? (w.val / w.cost).toFixed(1) + '×' : '–'}${!trustAds() ? ' <span class="flag">understated</span>' : ''}</td></tr>
        </table>
        <div class="sub" style="margin-top:8px">Once both checks above are green, the two "return" lines should meet in the middle. That's the number to manage to.</div>
      </div>
    </div>
    <div class="sub">Daily figures loaded ${dt(o.last_daily_load)} · full snapshot ${dt(o.last_snapshot)}</div>`;
  wireRange(overview);
  if ($('toChg')) $('toChg').onclick = () => go('changes');
}
function chart(s){
  if (!s.length) return '<div class="empty">No data yet</div>';
  const W = 1000, H = 230, L = 46, R = 46, T = 14, B = 26, iw = W - L - R, ih = H - T - B;
  const maxC = Math.max(10, ...s.map(r => N(r.cost))), maxO = Math.max(5, ...s.map(r => N(r.orders)));
  const bw = iw / s.length, x = i => L + i * bw, yc = v => T + ih - ih * v / maxC, yo = v => T + ih - ih * v / maxO;
  const line = s.map((r, i) => `${i ? 'L' : 'M'}${(x(i) + bw / 2).toFixed(1)} ${yo(N(r.orders)).toFixed(1)}`).join('');
  const ticks = [0, .5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${T + ih - ih * f}" y2="${T + ih - ih * f}" stroke="#474949"/><text x="${L - 6}" y="${T + ih - ih * f + 4}" fill="#B9BCBC" font-size="11" text-anchor="end">£${Math.round(maxC * f)}</text><text x="${W - R + 6}" y="${T + ih - ih * f + 4}" fill="#B9BCBC" font-size="11">${Math.round(maxO * f)}</text>`).join('');
  const months = s.map((r, i) => r.date.slice(8) === '01' ? `<text x="${x(i)}" y="${H - 6}" fill="#B9BCBC" font-size="11">${dshort(r.date)}</text><line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${T + ih}" stroke="#474949" stroke-dasharray="3 3"/>` : '').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily ad spend and web orders">${ticks}${months}
    ${s.map((r, i) => `<rect x="${(x(i) + 1).toFixed(1)}" y="${yc(N(r.cost)).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${(T + ih - yc(N(r.cost))).toFixed(1)}" fill="#EED107" opacity=".85"><title>${dshort(r.date)}: ${gbp(r.cost, 2)} spend, ${r.orders} web orders</title></rect>`).join('')}
    <path d="${line}" fill="none" stroke="#7DDB98" stroke-width="2"/>
    <text x="${L}" y="11" fill="#EED107" font-size="11">Ad spend (£, left)</text><text x="${W - R}" y="11" fill="#7DDB98" font-size="11" text-anchor="end">Web orders (right)</text></svg>`;
}

// ---------------------------------------------------------------- campaigns
async function campaigns(){
  loading();
  let d; try { d = await api('?view=campaigns&days=' + days); } catch(x){ return fail(x); }
  const rows = d.rows || [], total = rows.reduce((t, r) => t + N(r.cost), 0);
  const big = rows.filter(r => N(r.cost) >= 10 || r.channel !== 'SHOPPING'), small = rows.filter(r => !big.includes(r));
  const smallCost = small.reduce((t, r) => t + N(r.cost), 0);
  const tr = r => {
    const trend = N(r.cost_prev7) ? (N(r.cost7) - N(r.cost_prev7)) / N(r.cost_prev7) : 0;
    const troas = r.bid && r.bid.troas ? Math.round(r.bid.troas * 100) + '%' : '';
    return `<tr><td class="l"><b>${esc(r.name)}</b><br><span class="pill">${esc(CH[r.channel] || r.channel || '')}</span> ${r.status === 'ENABLED' ? '' : `<span class="pill r">${esc((r.status || '').toLowerCase())}</span>`} ${r.primary_status && r.primary_status !== 'ELIGIBLE' ? `<span class="pill">${esc(String(r.primary_status).toLowerCase().replace(/_/g, ' '))}</span>` : ''}</td>
      <td>${r.budget != null ? gbp(r.budget, 2) : '–'}</td><td><b>${gbp(r.cost)}</b><br><span class="muted">${total ? Math.round(100 * r.cost / total) : 0}%</span></td>
      <td class="hm">${gbp(r.cost7)}<br><span class="${trend > .15 ? 'warn' : trend < -.15 ? 'muted' : 'muted'}">${N(r.cost_prev7) ? (trend >= 0 ? '+' : '') + Math.round(trend * 100) + '%' : ''}</span></td>
      <td>${int(r.clicks)}<br><span class="muted">${r.clicks ? gbp(r.cost / r.clicks, 2) : ''}</span></td>
      <td>${N(r.conv).toFixed(1)}<br><span class="muted">${r.conv ? gbp(r.cost / r.conv, 2) + ' each' : ''}</span></td>

// ---------------------------------------------------------------- search terms
let TERMS = null;
async function terms(){
  loading();
  try { TERMS = await api('?view=terms'); } catch(x){ return fail(x); }
  drawTerms();
}
function drawTerms(){
  const d = TERMS, f = tf.terms;
  const neg = new Set((d.negatives || []).map(n => n.campaign + '|' + n.text));
  const pend = new Map((d.pending || []).map(p => [p.params.campaign + '|' + String(p.params.text).toLowerCase(), p.status]));
  let rows = d.rows || [];
  if (f.q) rows = rows.filter(r => (r.term + ' ' + r.campaign).toLowerCase().includes(f.q.toLowerCase()));
  if (f.noconv) rows = rows.filter(r => !N(r.conv));
  if (f.chip === 'merchant') rows = rows.filter(r => MERCHANTS.test(r.term));
  if (f.chip === 'brand') rows = rows.filter(r => BRAND.test(r.term));
  const shown = rows.slice(0, 300);
  $('out').innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="k">Spend on searches we can see</div><div class="n">${gbp(d.totals.cost)}</div><div class="s">${int(d.totals.terms)} different searches · ${esc((d.period || '').toLowerCase().replace(/_/g, ' '))}</div></div>
      <div class="tile"><div class="k">Of which no conversion</div><div class="n">${gbp(d.totals.no_conv_cost)}</div><div class="s">Mostly one-off clicks, look for repeats</div></div>
    </div>
    <div class="sub">Performance Max doesn't tell us its searches, so this covers Search and Shopping only. "Block" adds an exact-match negative keyword so we stop paying for that search.</div>
    <div class="bar"><input id="tq" placeholder="Search terms…" value="${esc(f.q)}" style="flex:1;min-width:200px">
      <div class="chips"><button class="chip ${f.noconv ? 'on' : ''}" id="cNo">No conversions</button><button class="chip ${f.chip === 'merchant' ? 'on' : ''}" data-chip="merchant">Other merchants / trade accounts</button><button class="chip ${f.chip === 'brand' ? 'on' : ''}" data-chip="brand">Our own name</button></div></div>
    <div class="card"><div class="scroll"><table><tr><th>Search</th><th class="l hm">Campaign</th><th>Spend</th><th>Clicks</th><th>Conv.</th><th></th></tr>
      ${shown.map(r => { const k = r.campaign + '|' + r.term.toLowerCase(), st = neg.has(k) ? 'blocked' : pend.get(k);
        return `<tr><td class="l">${esc(r.term)}</td><td class="l hm muted">${esc(r.campaign)}</td><td>${gbp(r.cost, 2)}</td><td>${int(r.clicks)}</td><td>${N(r.conv) ? N(r.conv).toFixed(1) : '<span class="muted">0</span>'}</td>
        <td>${st ? `<span class="pill ${st === 'blocked' || st === 'applied' ? 'g' : 'y'}">${esc(st)}</span>` : `<button class="btn sm" data-blk="${esc(k)}">Block</button>`}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">Nothing matches</td></tr>'}
    </table></div>${rows.length > shown.length ? `<div class="sub">Showing the top 300 of ${rows.length}. Search to narrow it down.</div>` : ''}</div>`;
  $('tq').oninput = e => { f.q = e.target.value; clearTimeout(drawTerms.t); drawTerms.t = setTimeout(() => { drawTerms(); const i = $('tq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
  $('cNo').onclick = () => { f.noconv = !f.noconv; drawTerms(); };
  document.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { f.chip = f.chip === b.dataset.chip ? '' : b.dataset.chip; drawTerms(); });
  document.querySelectorAll('[data-blk]').forEach(b => b.onclick = () => { const [campaign, ...t] = b.dataset.blk.split('|'); blockTerm(campaign, t.join('|')); });
}
function blockTerm(campaign, text){
  modal(`<h2 style="font-family:var(--num);font-weight:400;margin:0">Block this search</h2><div class="sub">"${esc(text)}" in ${esc(campaign)}</div>
    <div class="frow"><label>How<span class="h">Exact = only this search. Phrase = any search containing these words.</span></label><select id="mMatch"><option value="EXACT">Exact</option><option value="PHRASE">Phrase</option></select></div>
    <div style="margin-top:10px"><label class="sub">Why</label><textarea id="mWhy" rows="2" style="width:100%">${MERCHANTS.test(text) ? 'Looking for another merchant or their trade account, not us' : ''}</textarea></div>
    <div class="bar"><button class="btn y" id="mGo">Add to the list</button><button class="btn" id="mX">Cancel</button><span class="bad" id="mErr"></span></div>`);
  $('mGo').onclick = async () => {
    try { await api('', { action: 'propose', type: 'add_negative', params: { campaign, text, match: $('mMatch').value }, reason: $('mWhy').value }); closeModal(); toast('Added to Changes'); TERMS.pending.push({ params: { campaign, text }, status: 'proposed' }); drawTerms(); }
    catch(x){ $('mErr').textContent = x.message; }
  };
}

    if (x.type === 'add_negative') return `Block <b>"${esc(p.text)}"</b> (${esc((p.match || 'EXACT').toLowerCase())}) in ${esc(p.campaign)}`;
    if (x.type === 'set_budget') return `Budget for <b>${esc(p.campaign)}</b>: ${p.from != null ? gbp(p.from, 2) + ' → ' : ''}<b>${gbp(p.amount, 2)}</b> a day`;
    return `${esc(TYPE_TEXT[x.type] || x.type)}: <b>${esc(p.campaign)}</b>${p.adgroup ? ' › ' + esc(p.adgroup) : ''}${p.text ? ' › ' + esc(p.text) : ''}`; };
  const group = (title, st, acts, note) => { const list = c.filter(x => st.includes(x.status)); if (!list.length) return '';
    return `<div class="card"><div class="rhead"><h2>${title} <span class="pill">${list.length}</span></h2>${note ? `<span class="sub">${note}</span>` : ''}</div>
      ${list.map(x => `<div class="chg"><div class="what"><b>${desc(x)}</b>${x.reason ? `<div class="sub">${esc(x.reason)}</div>` : ''}
        <div class="meta">#${x.id} · suggested by ${esc(x.created_by)} ${dt(x.created_at)}${x.decided_by ? ` · ${esc(x.status)} by ${esc(x.decided_by)} ${dt(x.decided_at)}` : ''}${x.applied_at ? ` · done ${dt(x.applied_at)}` : ''}${x.result && x.result.error ? ` · <span class="bad">${esc(x.result.error)}</span>` : ''}</div></div>

    ${group('Approved', ['approved'], x => `<button class="btn sm" data-dec="proposed" data-id="${x.id}">Take back</button>`, paused ? 'Kill switch is on, so these wait until it\'s turned off' : 'Made on the script\'s next run')}
    ${group('On hold', ['held'], x => `<button class="btn sm g" data-dec="approved" data-id="${x.id}">Approve</button><button class="btn sm r" data-dec="rejected" data-id="${x.id}">Reject</button>`)}
    ${group('Done', ['applied'], x => `<button class="btn sm" data-undo="${x.id}">Undo</button>`)}

    ${group('Rejected', ['rejected', 'undone'], x => `<button class="btn sm" data-dec="proposed" data-id="${x.id}">Reconsider</button>`)}
    ${!c.length ? '<div class="card empty">No changes yet. Suggest them from Campaigns or Search terms.</div>' : ''}
    <div class="card"><h2>Script runs</h2><div class="scroll"><table><tr><th>When</th><th class="l">What</th><th class="l">Detail</th></tr>
      ${(CHG.runs || []).map(r => `<tr><td>${dt(r.at)}</td><td class="l">${esc(r.action)}${r.preview ? ' <span class="pill">preview</span>' : ''}</td><td class="l muted">${esc(JSON.stringify(r.detail || {}).slice(0, 140))}</td></tr>`).join('')}</table></div></div>`;
  document.querySelectorAll('[data-dec]').forEach(b => b.onclick = async () => { try { await api('', { action: 'decide', id: Number(b.dataset.id), decision: b.dataset.dec }); changes(); } catch(x){ toast(x.message); } });
  document.querySelectorAll('[data-undo]').forEach(b => b.onclick = async () => { try { await api('', { action: 'undo', id: Number(b.dataset.undo) }); toast('Undo added to the list'); changes(); } catch(x){ toast(x.message); } });

async function settings(){
  loading();
  if (!CHG) { try { CHG = await api('?view=changes'); } catch(x){ return fail(x); } }
  if (!OV) { try { OV = await api('?view=overview&days=' + days); } catch(x){ return fail(x); } }
  const s = OV.settings, meta = OV.settings_meta || {}, admin = OV.admin, dis = admin ? '' : 'disabled';
  const by = k => meta[k] && meta[k].by ? `<span class="h">Set by ${esc(meta[k].by)} ${dt(meta[k].at)}</span>` : '';
  $('out').innerHTML = `${lockBanner(s)}
    <div class="card"><h2>Kill switch</h2>
      <div class="frow"><label>Let Bob make approved changes in Google Ads<span class="h">Off = read-only. Turn on only once tracking is green and you've approved changes you're happy with.</span>${by('paused')}</label>
        <button class="btn ${s.paused === false ? 'r' : 'g'}" id="ks" ${dis}>${s.paused === false ? 'Switch to read-only' : 'Allow changes'}</button></div></div>
    <div class="card"><h2>Guardrails</h2><div class="sub">The script checks these too, so a mistake here can't blow the budget.</div>
      <div class="frow"><label>Monthly cap (£)<span class="h">Etienne's limit. Shown on Overview, warns if the month is heading over.</span>${by('monthly_cap')}</label><input id="sCap" type="number" value="${N(s.monthly_cap)}" ${dis}></div>
      <div class="frow"><label>Most total daily budget (£)<span class="h">The script refuses any change that takes all daily budgets over this</span>${by('max_daily_total')}</label><input id="sDay" type="number" value="${N(s.max_daily_total)}" ${dis}></div>
      <div class="frow"><label>Biggest single budget change (%)<span class="h">Google relearns after big jumps. 20% a week is a safe pace</span>${by('max_budget_step')}</label><input id="sStep" type="number" value="${Math.round(N(s.max_budget_step) * 100)}" ${dis}></div>
      <div class="frow"><label>Most changes per run<span class="h">Up to 25</span>${by('max_changes_per_run')}</label><input id="sMax" type="number" value="${N(s.max_changes_per_run)}" ${dis}></div>
      <div class="frow"><label>Tracking fixed on<span class="h">Set the day Matt's fix goes live. Starts the 3-week "hold bidding changes" countdown on Overview</span>${by('tracking_fixed_on')}</label><input id="sFix" type="date" value="${s.tracking_fixed_on || ''}" ${dis}></div>
      ${admin ? '<div class="bar"><button class="btn y" id="sSave">Save guardrails</button></div>' : '<div class="sub">Only an admin can change these.</div>'}</div>`;
  if (!admin) return;
  $('ks').onclick = async () => {
    const turningOn = s.paused !== false;
    const ok = await confirmBox(turningOn ? 'Allow Bob to make changes?' : 'Back to read-only?', turningOn
      ? `Approved changes (${(CHG.changes || []).filter(x => x.status === 'approved').length} right now) will be made in Google Ads on the script's next run. ${!trustAds() ? '<br><br><b class="bad">Tracking isn\'t green yet.</b> Changes to bids or budgets now are guesswork.' : ''}`
      : 'Nothing will change in Google Ads until it\'s switched back on. Approved changes stay in the list.');
    if (!ok) return;
    try { await api('', { action: 'settings', value: { paused: !turningOn } }); OV = null; toast(turningOn ? 'Changes allowed' : 'Read-only'); settings(); } catch(x){ toast(x.message); }
  };
  $('sSave').onclick = async () => {
    try { await api('', { action: 'settings', value: { monthly_cap: N($('sCap').value), max_daily_total: N($('sDay').value), max_budget_step: N($('sStep').value) / 100, max_changes_per_run: N($('sMax').value), tracking_fixed_on: $('sFix').value || null } });
      OV = null; toast('Saved'); settings(); } catch(x){ toast(x.message); }
  };
}

// ---------------------------------------------------------------- guide
function guide(){
  $('out').innerHTML = `<div class="card guide">
    <h2>How to use the Ads manager</h2>
    <p>Google Ads spends about £60 a day, up to £1,800 a month. This screen shows whether that money is working, and lets us change things carefully, with a second pair of eyes and a record of everything.</p>
    <h3>The weekly routine (20 minutes, Monday morning)</h3>
    <div class="step"><div class="n">1</div><div><b>Overview: check the four lights.</b> All green means the numbers can be trusted. Anything red: read the line under it before changing anything.</div></div>
    <div class="step"><div class="n">2</div><div><b>Overview: check the month.</b> Is spend heading over the cap? Did web orders dip when spend dropped (or not)?</div></div>
    <div class="step"><div class="n">3</div><div><b>Search terms: tick "No conversions".</b> Block searches that are clearly not us (other merchants, jobs, DIY "how to", things we don't sell). Don't block one-off searches that just happened not to buy.</div></div>
    <div class="step"><div class="n">4</div><div><b>Campaigns: look at the big four.</b> Is any campaign spending much more or less than last week? Suggest at most one budget change a week, never more than 20%.</div></div>
    <div class="step"><div class="n">5</div><div><b>Changes: approve or reject.</b> Read the reason. If you're not sure, Hold it and ask.</div></div>
    <h3>Rules of thumb</h3>
    <ul>
      <li><b>Patience beats fiddling.</b> Google's bidding needs 2–3 weeks to settle after any big change. Changing things every few days means it never learns.</li>
      <li><b>One change at a time</b> per campaign, so you can tell what worked.</li>
      <li><b>Judge on real orders</b>, not clicks. Lots of clicks with no sales is worse than few clicks with sales.</li>
      <li><b>Small numbers lie.</b> A product with 3 clicks and no sale tells you nothing yet. Wait for 20–30 clicks.</li>
      <li><b>Never above the cap.</b> If the month is heading over, trim the biggest budget slightly rather than pausing things.</li>
    </ul>
    <h3>Words you'll see</h3>
    <dl>
      <dt>Impression / click / CPC</dt><dd>An ad shown / someone clicking it / what we paid for that click.</dd>
      <dt>Conversion</dt><dd>Something we told Google counts as a win: mainly a web purchase, also a trade account sign-up.</dd>
      <dt>ROAS (return on ad spend)</dt><dd>Revenue ÷ ad spend. 10× means £10 of sales for every £1 spent.</dd>
      <dt>Target ROAS</dt><dd>The return we tell Google to aim for. Set it too high and Google barely spends; too low and it spends freely on poor sales.</dd>
      <dt>Performance Max (PMax)</dt><dd>Google's all-in-one campaign: Search, Shopping, YouTube, Gmail. Powerful, but it doesn't show which searches it bought.</dd>
      <dt>Shopping</dt><dd>The product listings with a photo and price. Driven by our product feed from the website.</dd>
      <dt>Negative keyword ("Block")</dt><dd>A search we never want to pay for. Exact blocks only that search; phrase blocks anything containing the words.</dd>
      <dt>Smart bidding / learning period</dt><dd>Google setting bids automatically from the conversion data it gets. After a big change it "relearns" for a couple of weeks.</dd>
      <dt>GA4</dt><dd>Google Analytics: what visitors do on the website and where they came from. A second opinion to Google Ads' own figures.</dd>
      <dt>Kill switch</dt><dd>When on, Bob only watches. Approved changes wait until an admin turns it off.</dd>
    </dl>
    <h3>Where the numbers come from</h3>
    <p class="muted">Spend, clicks and conversions: two scripts in Google Ads that send Bob the figures every day. Real web orders: Cin7, via Bob. GA4: read directly. Search terms and products cover the last 30 days and refresh daily.</p>
  </div>`;
}

.title{font-family:var(--num);font-size:34px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.card{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{width:100%;background:var(--accent);color:#262727;border:0;border-radius:10px;padding:14px;font-weight:800;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.hit{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.hit b{font-family:var(--num);font-size:22px;letter-spacing:1px;font-weight:400}
.hit small{display:block;color:var(--muted)}
.lv{display:flex;gap:16px;margin:8px 0;flex-wrap:wrap} .lv div{background:var(--bg);border-radius:8px;padding:6px 12px} .lv b{font-family:var(--num);font-size:26px;font-weight:400;display:block;line-height:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px;font-weight:700}
.seg button.on{background:var(--accent);color:#262727;border-color:var(--accent)}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-weight:600}
.msg.ok{background:rgba(125,219,152,.15);color:var(--good)} .msg.bad{background:rgba(255,122,107,.15);color:var(--bad)}
.tr{padding:10px 0;border-bottom:1px solid var(--line)} .tr:last-child{border-bottom:0}
.m{color:var(--muted);font-size:13px}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:120px}
.big{font-family:var(--num);font-size:30px;letter-spacing:1px;font-weight:400}
.pill{display:inline-block;background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted);margin:2px 4px 0 0}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><div class="m">Loading…</div></div>
<script src="auth.js?v=20261104151558"></script>
<script src="activity.js?v=20261104151558"></script>
<script src="html5-qrcode.min.js?v=20261104151558"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/barcodes';
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
let token = store.get('tsd_me_token'), D = null, msg = null, busy = false, scanner = null, view = 'home', code = null, found = null, hits = [], qseq = 0, timer, lastCode = '', lastAt = 0, keep = true;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => (+v || 0).toLocaleString('en-GB');
function showLogin(m){ stopScan(); document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = m || ''; }
async function api(body, q){
  const r = await fetch(API + (q || ''), body ? {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 409) return j;
  if (body && !j.ok) throw new Error(j.error || "Couldn't do that");
  if (j.error) throw new Error(j.error);
  return j;
}
// 8/12/13/14 digits with a good check digit, so a half-read barcode never gets saved
function validCode(s){ if (!/^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(s)) return false; const d = s.split('').map(Number), c = d.pop(); const t = d.reverse().reduce((a, v, i) => a + v * (i % 2 ? 1 : 3), 0); return (10 - t % 10) % 10 === c; }
async function refresh(){
  try { D = await api(); render(); }
  catch(x){ if (x.message !== 'login') document.getElementById('app').innerHTML = `<div class="msg bad">${esc(x.message)}</div>`; }
}
function banner(){ return msg ? `<div class="msg ${msg.ok ? 'ok' : 'bad'}">${esc(msg.t)}</div>` : ''; }
function recent(){ return (D.recent || []).length ? `<div class="card"><div class="k">Recently added by hand</div>${D.recent.map(r => `<div class="tr m"><b style="color:var(--ink)">${esc(r.sku)}</b> · ${esc(r.barcode)}<br>${esc(r.by_name || '')} · ${new Date(r.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`).join('')}</div>` : ''; }
function homeView(){
  const s = D.stats, pc = s.products ? Math.min(100, Math.round(100 * s.barcodes / s.products)) : 0;
  return banner() + `<div class="card"><div class="k">Barcodes saved in Bob</div><div class="big">${num(s.barcodes)} <span class="m" style="font-family:var(--body);font-size:15px">of ${num(s.products)} products</span></div>
    <div class="bar"><i style="width:${pc}%"></i></div><div class="m">${pc}% covered · you've added ${num(s.mine_today)} today</div></div>
    <button class="btn" onclick="startScan()">📷 Scan a barcode</button>
    <div class="card" style="margin-top:12px"><div class="k">Or type / use a handheld scanner</div>
      <form onsubmit="event.preventDefault();manual()"><input id="mc" inputmode="numeric" placeholder="Barcode number" autocomplete="off"><button class="btn alt" type="submit">Look it up</button></form></div>
    ${recent()}` + (D.me.admin ? adminCard() : '');
}
function adminCard(){
  return `<div class="card"><div class="k">Admin: load barcodes from a spreadsheet</div>
    <div class="m" style="margin-bottom:8px">CSV with three columns: sku, barcode, source. Barcodes Bob already has are left alone.</div>
    <input type="file" id="csvf" accept=".csv,text/csv"><button class="btn alt" ${busy ? 'disabled' : ''} onclick="doImport()">Load it</button></div>`;
}
function scanView(){
  return banner() + `<div class="card"><div class="k">Point the camera at the barcode</div><div id="reader"></div><div id="scanmsg" class="m" style="margin-top:8px">Starting the camera…</div>
    <button class="btn alt" onclick="stopScan();view='home';msg=null;render()">Stop scanning</button></div>`;
}
function pickView(){
  const known = found && found.found;
  const top = `<div class="card"><div class="k">Barcode</div><div class="big">${esc(code)}</div>` + (known
    ? `<div class="msg ok" style="margin:10px 0 0">Already saved: <b>${esc(found.product.sku)}</b><br>${esc(found.product.name || '')}</div><div class="m" style="margin-top:6px">${esc(found.barcode.source || '')}${found.barcode.by_name ? ' · ' + esc(found.barcode.by_name) : ''}</div>`
    : `<div class="m" style="margin-top:4px">${found && found.valid === false ? 'Heads up: the check digit looks wrong, so this may be a bad read. ' : ''}Not saved against any product yet.</div>`) + `</div>`;
  const search = `<div class="card"><div class="k">${known ? 'Wrong product? Save it against a different one' : 'Which product is this?'}</div><input id="q" type="search" placeholder="SKU or name" autocomplete="off" oninput="search(this.value)">
    <div id="hits"></div></div>`;
  return banner() + top + search + `<button class="btn" onclick="startScan()">📷 Scan next</button><button class="btn alt" onclick="view='home';msg=null;refresh()">Done</button>`;
}
function paintHits(){
  const h = document.getElementById('hits'); if (!h) return;
  h.innerHTML = hits.map((p, i) => `<button class="hit" onclick="save(${i})"><b>${esc(p.sku)}</b><small>${esc(p.name)}</small>${p.barcodes.length ? `<span class="pill">already has ${p.barcodes.length} barcode${p.barcodes.length > 1 ? 's' : ''}</span>` : ''}</button>`).join('') || '<div class="m" style="margin-top:8px">Nothing found</div>';
}
function search(v){ clearTimeout(timer); timer = setTimeout(async () => { const my = ++qseq; if (v.trim().length < 2) { hits = []; const h = document.getElementById('hits'); if (h) h.innerHTML = ''; return; }
  try { const j = await api(null, '?q=' + encodeURIComponent(v.trim())); if (my === qseq) { hits = j.results; paintHits(); } } catch(e){} }, 250); }
async function save(i, force){
  const p = hits[i]; if (!p || busy) return;
  if (!force && p.barcodes.length && !confirm(`${p.sku} already has ${p.barcodes.join(', ')}. Add this one as well (e.g. a carton barcode)?`)) return;
  busy = true;
  try {
    const j = await api({action:'add', barcode: code, sku: p.sku, force: !!force});
    if (j.conflict) {
      busy = false;
      if (D.me.admin && confirm(`${code} is already saved against ${j.conflict.sku} (${j.conflict.name}). Move it to ${p.sku}?`)) return save(i, true);
      msg = {ok:false, t:j.error}; return render();
    }
    msg = {ok:true, t:j.already ? `${code} was already on ${p.sku}.` : `Saved ${code} against ${p.sku}.`}; hits = []; busy = false;
    if (keep) startScan(); else { view = 'home'; refresh(); }
  } catch(x){ busy = false; if (x.message === 'login') return; msg = {ok:false, t:x.message}; render(); }
}
async function gotCode(c){
  c = String(c || '').replace(/\D/g, '');
  if (!c) return;
  stopScan(); code = c; found = null; hits = [];
  try { found = await api(null, '?code=' + c); } catch(x){ if (x.message === 'login') return; msg = {ok:false, t:x.message}; }
  if (found && found.found) msg = null;
  view = 'pick'; render();
}
function manual(){ const c = (document.getElementById('mc').value || '').replace(/\D/g, ''); if (!c) return; if (!validCode(c)) { msg = {ok:false, t:`${c} isn't a valid barcode number (8, 12, 13 or 14 digits). Check it and try again.`}; return render(); } msg = null; gotCode(c); }
function startScan(){
  view = 'scan'; found = null; render();
  if (!window.Html5Qrcode) { document.getElementById('scanmsg').textContent = "The scanner didn't load. Refresh the page, or type the number instead."; return; }
  const F = Html5QrcodeSupportedFormats;
  scanner = new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.ITF], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => ({ width: Math.floor(w * 0.9), height: Math.floor(Math.min(h, w) * 0.5) }) },
    txt => { const c = String(txt).replace(/\D/g, ''); if (!validCode(c)) return; const now = Date.now(); if (c === lastCode && now - lastAt < 1500) return; lastCode = c; lastAt = now; if (navigator.vibrate) navigator.vibrate(60); gotCode(c); },
    () => {}
  ).then(() => { const m = document.getElementById('scanmsg'); if (m) m.textContent = 'Hold it steady, about 15-20cm away. Good light helps.'; })
   .catch(e => { const m = document.getElementById('scanmsg'); if (m) m.innerHTML = `<span style="color:var(--bad)">Couldn't start the camera.</span> Allow camera access for this site in your browser settings, then try again. (${esc(String(e).slice(0, 80))})`; scanner = null; });
}
function stopScan(){ const s = scanner; scanner = null; if (s) { try { s.stop().then(() => s.clear()).catch(() => {}); } catch(e){} } }
function parseCsv(t){
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); f = ''; if (r.length > 1 || r[0] !== '') rows.push(r); r = []; } else f += c; }
  if (f !== '' || r.length) { r.push(f); rows.push(r); }
  return rows;
}
async function doImport(){
  const f = document.getElementById('csvf').files[0]; if (!f) return alert('Choose the CSV file first');
  const rows = parseCsv((await f.text()).replace(/^\uFEFF/, ''));
  const h = rows.shift().map(x => x.trim().toLowerCase()), si = h.indexOf('sku'), bi = h.indexOf('barcode'), oi = h.indexOf('source');
  if (si < 0 || bi < 0) return alert('The file needs sku and barcode columns');
  const list = rows.map(r => ({ sku: r[si], barcode: r[bi], source: oi >= 0 ? r[oi] : 'Imported' }));
  if (!confirm(`Load ${list.length.toLocaleString('en-GB')} barcodes from ${f.name}?`)) return;
  busy = true; render();
  const tot = { added: 0, already_had: 0, bad_barcode: 0, sku_not_found: 0, repeated_in_file: 0 };
  try {
    for (let i = 0; i < list.length; i += 3000) { const j = await api({action:'import', rows: list.slice(i, i + 3000)}); for (const k in tot) tot[k] += j[k] || 0; }
    msg = {ok:true, t:`Loaded ${num(tot.added)} new barcodes. Already had ${num(tot.already_had)}; skipped ${num(tot.bad_barcode)} bad barcodes, ${num(tot.sku_not_found)} SKUs Bob doesn't know, ${num(tot.repeated_in_file)} repeats.`};
  } catch(x){ if (x.message === 'login') return; msg = {ok:false, t:x.message}; }
  busy = false; refresh();
}
function render(){
  const a = document.getElementById('app'); a.style.display = 'block';
  if (!D) return;
  const keepQ = document.activeElement && document.activeElement.id === 'q' ? document.getElementById('q').value : null;
  a.innerHTML = `<div class="title">Scan barcodes</div><div class="sub">Scan a product's barcode, pick the product, and Bob remembers it. Everything is logged with your name.</div>` +
    (view === 'scan' ? scanView() : view === 'pick' ? pickView() : homeView());
  if (keepQ !== null) { const q = document.getElementById('q'); q.value = keepQ; q.focus(); }
}
if (token) refresh(); else showLogin();
TSDAuth.mount(t => { document.getElementById('login').style.display = 'none'; token = t; refresh(); });
</script>
<script>
(function(){ const BUILD = '20261104151558'; let newer = false;
  setInterval(async () => { try { if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); }
    if (newer && !busy && view === 'home' && !document.activeElement?.matches('input,textarea,select')) location.reload(); } catch(e){} }, 120000);
})();
</script>
</body>
</html>

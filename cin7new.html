.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
.back{color:var(--blue);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin-bottom:8px}
.card{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.k:first-child{margin-top:0}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--accent);color:#262727;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}
.btn.full{width:100%;margin-top:12px}
.btn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.hit{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.hit b{font-family:var(--num);font-size:22px;letter-spacing:1px;font-weight:400}
.hit small{display:block;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{color:var(--muted);font-size:13px}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-weight:600}
.msg.ok{background:rgba(125,219,152,.15);color:var(--good)} .msg.bad{background:rgba(255,122,107,.15);color:var(--bad)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.t-q{background:rgba(142,197,255,.18);color:var(--blue)} .t-ok{background:rgba(125,219,152,.18);color:var(--good)} .t-bad{background:rgba(255,122,107,.18);color:var(--bad)} .t-w{background:rgba(238,209,7,.2);color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:86px;height:86px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.thumb i{position:absolute;left:3px;bottom:3px;background:var(--accent);color:#262727;font-style:normal;font-size:10px;font-weight:800;padding:0 5px;border-radius:4px}
.file{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px}
.file span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{padding:10px 0;border-bottom:1px solid var(--line)} .tr:last-child{border-bottom:0}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
@media(max-width:520px){.row{grid-template-columns:1fr}}

.wrap{max-width:1100px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}.seg button.on{background:var(--accent);color:#262727;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px}td{padding:4px;vertical-align:top;border-top:1px solid var(--line)}
td input,td select{padding:7px;font-size:14px;min-width:70px}td input.w-s{width:90px}td input.w-m{width:150px}td input.w-l{width:260px}
tr.bad td{background:rgba(255,122,107,.08)} .iss{color:var(--bad);font-size:12px;font-weight:700}
.tbl{overflow-x:auto}.chk{width:20px;height:20px}
.def{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;font-size:13px;color:var(--muted)}.def b{color:var(--ink)}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><div class="m">Loading…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="auth.js?v=20261104125039"></script>
<script src="activity.js?v=20261104125039"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/cin7new';
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
let token = store.get('tsd_me_token'), O = null, DEF = null, recent = [], mode = 'one', busy = false, msg = null;
let sup = '', brand = '', cat = '', skuInfo = null, useSupSku = true;
let docs = [], extra = '', revAcc = '';
let rows = [];          // preview rows: {sku,name,category,brand,cost,price,supplier_code,barcode,weight,note,on,issues:[]}
let raw = null, map = {}, rule = {kind:'markup', pct:'', round:'none'};   // bulk: parsed sheet + column mapping
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gbp = v => v == null || v === '' || isNaN(v) ? '–' : '£' + (+v).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
function showLogin(m){ document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = m || ''; }
async function api(body, q){
  const r = await fetch(API + (q || ''), body ? {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (j.error || (body && j.ok === false)) throw new Error(j.error || "Couldn't do that");
  return j;
}
async function boot(){ try { const j = await api(); O = j.options; DEF = j.defaults; recent = j.recent; render(); } catch(x){ if (x.message !== 'login') document.getElementById('app').innerHTML = `<div class="msg bad">${esc(x.message)}</div>`; } }

/* ---------- SKU suggestion ---------- */
let seqNext = null;
function pickPrefix(i){ const a = skuInfo.alts[i]; skuInfo = {...skuInfo, prefix:a.prefix, next:a.next, width:a.width, example:a.example}; seqNext = a.next; if (document.getElementById('o_name')) oneKeep(); render(); }
async function loadSku(){ skuInfo = null; seqNext = null; if (!sup) return render(); try { skuInfo = await api(null, '?suggest=' + sup); seqNext = skuInfo.next; } catch(e){} render(); }
function nextSku(){ if (!skuInfo) return ''; const s = skuInfo.prefix + String(seqNext).padStart(skuInfo.width, '0'); seqNext++; return s; }

/* ---------- documents + extra info (shared by both tabs) ---------- */
function keepExtra(){ const e = document.getElementById('x_extra'); if (e) extra = e.value; }
function addDocs(list){ keepExtra(); if (document.getElementById('o_name')) oneKeep(); for (const f of list) { if (f.size > 20 * 1024 * 1024) { alert(f.name + ' is over 20MB'); continue; } docs.push(f); } render(); }
function rmDoc(i){ keepExtra(); if (document.getElementById('o_name')) oneKeep(); docs.splice(i, 1); render(); }
function docsHtml(){ return `<div class="card"><div class="k">Datasheets, supplier info sheets, price lists or other documents (optional)</div>
  <input type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.jpg,.jpeg,.png" onchange="addDocs(this.files)">
  ${docs.length ? `<div style="margin-top:6px">${docs.map((f, i) => `<div class="m" style="padding:2px 0">📄 ${esc(f.name)} <a href="#" onclick="rmDoc(${i});return false" style="color:var(--bad)">remove</a></div>`).join('')}</div>` : ''}
  <div class="k">Anything else Claude should know (optional)</div>
  <textarea id="x_extra" rows="3" placeholder="e.g. pack sizes, what it replaces, dimensions, barcodes, anything not on the sheets" onchange="keepExtra()">${esc(extra)}</textarea>
  <div class="m" style="margin-top:4px">Saved with the new products. Claude reads these and the notes to check weights, dimensions, barcodes and names, so nothing gets missed. The notes also go on each product's internal note in Cin7.</div></div>`; }
async function uploadDocs(){
  if (!docs.length) return [];
  const s = await api({action:'sign', files: docs.map(f => ({name: f.name}))}); const out = [];
  for (let i = 0; i < docs.length; i++) {
    const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', docs[i]);
    const r = await fetch(s.files[i].signed_url, {method:'PUT', body: fd}); if (!r.ok) throw new Error('Upload failed for ' + docs[i].name);
    out.push({name: docs[i].name, url: s.files[i].url});
  }
  return out;
}
const accOpts = (v) => (O.accounts || []).map(a => `<option value="${esc(a.code)}" ${a.code === (v || DEF.RevenueAccount) ? 'selected' : ''}>${esc(a.code)} · ${esc(a.name.replace(/^Sales\s*-\s*/, ''))}</option>`).join('');

/* ---------- common ---------- */
const supOpts = () => `<option value="">Choose supplier…</option>` + O.suppliers.map(s => `<option value="${s.id}" ${s.id === sup ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
const catOpts = (v) => `<option value="">Category…</option>` + O.categories.map(c => `<option ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('');
const brandOpts = (v) => `<option value="">No brand</option>` + O.brands.map(c => `<option ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('');
const supName = () => (O.suppliers.find(s => s.id === sup) || {}).name || '';
function defaultsHtml(){ return `<div class="card"><div class="k">Every new product gets (copied from your existing products)</div><div class="def">
  <div>Type: <b>${esc(DEF.Type)}</b></div><div>Costing: <b>${esc(DEF.CostingMethod)}</b></div><div>Default site: <b>${esc(DEF.DefaultLocation)}</b></div><div>Unit: <b>${esc(DEF.UOM)}</b></div>
  <div>Sale VAT: <b>${esc(DEF.SaleTaxRule)}</b></div><div>Purchase VAT: <b>${esc(DEF.PurchaseTaxRule)}</b></div><div>Revenue account: <b>choose below</b> (default ${esc(DEF.RevenueAccount)})</div><div>Prices: <b>Tier 1 only</b></div></div></div>`; }
async function check(){ try { const j = await api({action:'check', rows: rows.map(r => ({sku:r.sku, name:r.name}))}); rows.forEach((r, i) => r.issues = j.issues[i] || []); } catch(e){} }
function money(v){ const x = parseFloat(String(v).replace(/[£,\s]/g, '')); return isFinite(x) ? x : null; }
function priceFrom(cost){ const c = money(cost); if (c == null || rule.kind === 'column') return null; const p = parseFloat(rule.pct); if (!(p >= 0)) return null;
  let v = rule.kind === 'markup' ? c * (1 + p / 100) : (p < 100 ? c / (1 - p / 100) : null); if (v == null) return null;
  if (rule.round === '.99') v = Math.ceil(v) - 0.01; else if (rule.round === '.50') v = Math.ceil(v * 2) / 2; else if (rule.round === '1') v = Math.ceil(v); return +v.toFixed(2); }
function marginTxt(r){ const c = money(r.cost), p = money(r.price); return c != null && p > 0 ? ((p - c) / p * 100).toFixed(1) + '%' : '–'; }

/* ---------- preview table + confirm ---------- */
function previewHtml(){
  if (!rows.length) return '';
  const on = rows.filter(r => r.on);
  const bad = on.filter(r => (r.issues || []).length || !r.category || money(r.cost) == null || money(r.price) == null || !r.name.trim() || !r.sku.trim());
  return `<div class="card"><div class="k">Preview: nothing is created until you confirm</div>
    <div class="tbl"><table><thead><tr><th></th><th>SKU</th><th>Name</th><th>Category</th><th>Brand</th><th>Revenue acct</th><th>Supplier code</th><th>Cost</th><th>Price (tier 1, ex VAT)</th><th>Margin</th><th>Barcode</th><th>Weight kg</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr class="${(r.issues || []).length ? 'bad' : ''}"><td><input type="checkbox" class="chk" ${r.on ? 'checked' : ''} onchange="rows[${i}].on=this.checked;render()"></td>
      <td><input class="w-s" value="${esc(r.sku)}" onchange="edit(${i},'sku',this.value)"></td>
      <td><input class="w-l" value="${esc(r.name)}" onchange="edit(${i},'name',this.value)">${(r.issues || []).map(x => `<div class="iss">⚠ ${esc(x)}</div>`).join('')}</td>
      <td><select onchange="edit(${i},'category',this.value)">${catOpts(r.category)}</select></td>
      <td><select onchange="edit(${i},'brand',this.value)">${brandOpts(r.brand)}</select></td>
      <td><select onchange="edit(${i},'revenue_account',this.value)">${accOpts(r.revenue_account)}</select></td>
      <td><input class="w-s" value="${esc(r.supplier_code)}" onchange="edit(${i},'supplier_code',this.value)"></td>
      <td><input class="w-s" value="${esc(r.cost)}" onchange="edit(${i},'cost',this.value)"></td>
      <td><input class="w-s" value="${esc(r.price)}" onchange="edit(${i},'price',this.value)"></td>
      <td>${marginTxt(r)}</td>
      <td><input class="w-m" value="${esc(r.barcode)}" onchange="edit(${i},'barcode',this.value)"></td>
      <td><input class="w-s" value="${esc(r.weight)}" onchange="edit(${i},'weight',this.value)"></td></tr>`).join('')}
    </tbody></table></div>
    ${bad.length ? `<div class="msg bad" style="margin-top:10px">${bad.length} selected row${bad.length === 1 ? ' needs' : 's need'} fixing (red rows, or a missing category, cost or price) before you can confirm.</div>` : ''}
    <button class="btn full" ${busy || !on.length || bad.length ? 'disabled' : ''} onclick="confirmCreate()">${busy ? 'Creating in Cin7…' : `Confirm: create ${on.length} product${on.length === 1 ? '' : 's'} in Cin7`}</button></div>`;
}
async function edit(i, k, v){ rows[i][k] = v; if (k === 'sku' || k === 'name') { await check(); } render(); }
async function confirmCreate(){
  const on = rows.map((r, i) => [r, i]).filter(([r]) => r.on);
  if (!confirm(`Create ${on.length} product${on.length === 1 ? '' : 's'} in Cin7 (${supName()})? This can't be undone from here.`)) return;
  busy = true; msg = null; render();
  let ok = 0, fail = [];
  try {
    keepExtra(); const up = await uploadDocs();
    for (let s = 0; s < on.length; s += 10) {
      const chunk = on.slice(s, s + 10);
      const j = await api({action:'create', rows: chunk.map(([r]) => ({...r, supplier_id: sup})), docs: up, notes: extra});
      j.results.forEach((res, k) => { const r = chunk[k][0]; if (res.ok) { ok++; r.done = true; r.on = false; } else { r.issues = [res.error]; fail.push(res.sku); } });
      render();
    }
  } catch(x){ if (x.message === 'login') return; msg = {ok:false, t:x.message}; }
  rows = rows.filter(r => !r.done); busy = false; if (!rows.length) { docs = []; extra = ''; }
  msg = fail.length ? {ok:false, t:`Created ${ok}. ${fail.length} failed (still in the table with the reason): ${fail.join(', ')}`} : {ok:true, t:`Created ${ok} product${ok === 1 ? '' : 's'} in Cin7. They'll show in Bob after the next stock sync (about 15 minutes).`};
  try { const j = await api(); recent = j.recent; } catch(e){}
  render();
}

/* ---------- one product ---------- */
let one = {name:'', sku:'', category:'', brand:'', revenue_account:'', supplier_code:'', cost:'', price:'', barcode:'', weight:''};
function oneKeep(){ for (const k of Object.keys(one)) { const e = document.getElementById('o_' + k); if (e) one[k] = e.value; } }
function suggestSkuOne(){ oneKeep(); if (useSupSku && one.supplier_code.trim()) one.sku = one.supplier_code.trim().toUpperCase(); else if (skuInfo) { seqNext = skuInfo.next; one.sku = nextSku(); } render(); }
function oneHtml(){
  const pr = money(one.cost); const hint = pr != null && !one.price ? '' : '';
  return `<div class="card"><div class="k">1 · Supplier</div><select id="o_sup" onchange="sup=this.value;oneKeep();loadSku()">${supOpts()}</select>
    ${skuInfo ? `<div class="m" style="margin-top:6px">${esc(supName())}'s SKUs usually look like <b>${esc(skuInfo.example || skuInfo.prefix)}</b>. Next free: <b>${esc(skuInfo.prefix + String(skuInfo.next).padStart(skuInfo.width, '0'))}</b></div>` : ''}
    ${skuInfo && skuInfo.alts && skuInfo.alts.length > 1 ? `<div class="m" style="margin-top:4px">Other prefixes this supplier uses: ${skuInfo.alts.map((a, i) => `<a href="#" onclick="pickPrefix(${i});return false" style="color:var(--accent)">${esc(a.prefix)}</a>`).join(' · ')}</div>` : ''}</div>
  <div class="card"><div class="k">2 · Product</div>
    <div class="k">Name</div><input id="o_name" value="${esc(one.name)}" placeholder="e.g. Ardex X32 Natural Stone Adhesive 20kg">
    <div class="row"><div><div class="k">Supplier's own code (optional)</div><input id="o_supplier_code" value="${esc(one.supplier_code)}" onchange="oneKeep();if(useSupSku)suggestSkuOne()"></div>
      <div><div class="k">Our SKU</div><div style="display:flex;gap:6px"><input id="o_sku" value="${esc(one.sku)}"><button class="btn alt sm" onclick="suggestSkuOne()">Suggest</button></div>
      <label class="m" style="display:block;margin-top:4px"><input type="checkbox" style="width:auto" ${useSupSku ? 'checked' : ''} onchange="useSupSku=this.checked"> Use the supplier's code as our SKU when there is one</label></div></div>
    <div class="row"><div><div class="k">Category</div><select id="o_category">${catOpts(one.category)}</select></div><div><div class="k">Brand</div><select id="o_brand">${brandOpts(one.brand)}</select></div></div>
    <div class="k">Revenue account</div><select id="o_revenue_account">${accOpts(one.revenue_account)}</select>
    <div class="row"><div><div class="k">Cost (£, ex VAT)</div><input id="o_cost" type="number" step="0.01" value="${esc(one.cost)}" oninput="oneKeep();document.getElementById('o_mg').textContent=oneMg()"></div>
      <div><div class="k">Price, tier 1 (£, ex VAT)</div><input id="o_price" type="number" step="0.01" value="${esc(one.price)}" oninput="oneKeep();document.getElementById('o_mg').textContent=oneMg()"><div class="m" id="o_mg" style="margin-top:4px">${oneMg()}</div></div></div>
    <div class="row"><div><div class="k">Barcode (optional)</div><input id="o_barcode" value="${esc(one.barcode)}"></div><div><div class="k">Weight kg (optional)</div><input id="o_weight" type="number" step="0.01" value="${esc(one.weight)}"></div></div>
    </div>${docsHtml()}
    <button class="btn full" onclick="oneToPreview()">Check and preview →</button>`;
}
function oneMg(){ const c = money(one.cost), p = money(one.price); return c != null && p > 0 ? `Margin ${((p - c) / p * 100).toFixed(1)}%` : ''; }
async function oneToPreview(){
  oneKeep(); if (!sup) return alert('Choose the supplier');
  rows = [{...one, sku: one.sku.trim().toUpperCase(), note:'', on:true, issues:[]}]; await check(); msg = null; render();
}

/* ---------- bulk ---------- */
const GUESS = { supplier_code:/^(sku|code|item|part|product code|supplier code|article|ref|stock code|item code|catalogue)/i, name:/(desc|name|title|product$)/i, cost:/(cost|net|trade|nett|your price|buy)/i, retail:/(rrp|retail|list|price)/i, barcode:/(ean|gtin|barcode|upc)/i, weight:/(weight|kg)/i };
async function loadFile(f){
  if (!f) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array'}); const ws = wb.Sheets[wb.SheetNames[0]];
    const a = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
    let h = a.findIndex(r => r.filter(x => String(x).trim()).length >= 3); if (h < 0) return alert("Couldn't find a table in that file");
    const head = a[h].map((x, i) => String(x).trim() || 'Column ' + (i + 1));
    raw = {name: f.name, head, data: a.slice(h + 1).filter(r => r.some(x => String(x).trim()))};
    map = {}; for (const k of ['supplier_code','name','cost','retail','barcode','weight']) { const i = head.findIndex((x, ix) => GUESS[k].test(x) && !Object.values(map).includes(ix)); if (i >= 0) map[k] = i; }
    rows = []; msg = null; render();
  } catch(e){ alert("Couldn't read that file. Excel (.xlsx/.xls) and CSV work; for a PDF price list, send it to Claude in chat."); }
}
function bulkKeep(){ for (const k of ['supplier_code','name','cost','retail','barcode','weight']) { const e = document.getElementById('m_' + k); if (e) map[k] = e.value === '' ? undefined : +e.value; }
  const p = document.getElementById('r_pct'); if (p) rule.pct = p.value; const kd = document.getElementById('r_kind'); if (kd) rule.kind = kd.value; const rd = document.getElementById('r_round'); if (rd) rule.round = rd.value;
  const rv = document.getElementById('b_rev'); if (rv) revAcc = rv.value; const c = document.getElementById('b_cat'); if (c) cat = c.value; const b = document.getElementById('b_brand'); if (b) brand = b.value; }
async function buildRows(){
  bulkKeep(); if (!sup) return alert('Choose the supplier'); if (map.name == null) return alert('Tell me which column is the product name'); if (map.cost == null) return alert('Tell me which column is your cost');
  if (rule.kind !== 'column' && !(parseFloat(rule.pct) >= 0)) return alert('Enter your markup or margin %'); if (rule.kind === 'column' && map.retail == null) return alert('Pick the price column');
  if (!skuInfo) { try { skuInfo = await api(null, '?suggest=' + sup); } catch(e){} } seqNext = skuInfo ? skuInfo.next : 1;
  const g = (r, k) => map[k] == null ? '' : String(r[map[k]] ?? '').trim();
  rows = raw.data.map(r => { const code = g(r, 'supplier_code'); const cost = money(g(r, 'cost'));
    const o = {sku: useSupSku && code ? code.toUpperCase() : nextSku(), name: g(r, 'name'), category: cat, brand, revenue_account: revAcc || DEF.RevenueAccount, supplier_code: code, cost: cost == null ? '' : cost, price: '', barcode: g(r, 'barcode'), weight: g(r, 'weight'), note:'', on: true, issues: []};
    o.price = rule.kind === 'column' ? (money(g(r, 'retail')) ?? '') : (priceFrom(o.cost) ?? ''); o.on = !!o.name && o.cost !== ''; return o; });
  await check(); render();
}
function bulkHtml(){
  const opt = (k) => `<select id="m_${k}" onchange="bulkKeep()"><option value="">(none)</option>${raw.head.map((h, i) => `<option value="${i}" ${map[k] === i ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select>`;
  return `<div class="card"><div class="k">1 · Supplier and defaults</div><select onchange="sup=this.value;bulkKeep();loadSku()">${supOpts()}</select>
    ${skuInfo ? `<div class="m" style="margin-top:6px">${esc(supName())}: next free SKU would be <b>${esc(skuInfo.prefix + String(skuInfo.next).padStart(skuInfo.width, '0'))}</b></div>` : ''}
    <div class="k">Revenue account for all (change per row later)</div><select id="b_rev" onchange="bulkKeep()">${accOpts(revAcc)}</select>
    <div class="row"><div><div class="k">Category for all (change per row later)</div><select id="b_cat" onchange="bulkKeep()">${catOpts(cat)}</select></div><div><div class="k">Brand for all</div><select id="b_brand" onchange="bulkKeep()">${brandOpts(brand)}</select></div></div>
    <label class="m" style="display:block;margin-top:8px"><input type="checkbox" style="width:auto" ${useSupSku ? 'checked' : ''} onchange="useSupSku=this.checked"> Use the supplier's codes as our SKUs (untick to give new SKUs in our own pattern)</label></div>
  <div class="card"><div class="k">2 · Price list: ${esc(raw.name)} (${raw.data.length} lines)</div><div class="row">
    <div><div class="m">Product name column</div>${opt('name')}</div><div><div class="m">Supplier code column</div>${opt('supplier_code')}</div>
    <div><div class="m">Your cost column</div>${opt('cost')}</div><div><div class="m">Retail / price column (if using it)</div>${opt('retail')}</div>
    <div><div class="m">Barcode column</div>${opt('barcode')}</div><div><div class="m">Weight column</div>${opt('weight')}</div></div>
    <div class="k">Price tier 1 comes from</div><div class="row"><select id="r_kind" onchange="bulkKeep();render()"><option value="markup" ${rule.kind === 'markup' ? 'selected' : ''}>Cost + markup %</option><option value="margin" ${rule.kind === 'margin' ? 'selected' : ''}>Target margin %</option><option value="column" ${rule.kind === 'column' ? 'selected' : ''}>The price column</option></select>
      ${rule.kind === 'column' ? '<div></div>' : `<input id="r_pct" type="number" step="0.1" placeholder="%" value="${esc(rule.pct)}">`}</div>
    ${rule.kind === 'column' ? '' : `<div class="k">Round up to</div><select id="r_round" onchange="bulkKeep()"><option value="none">Nearest penny</option><option value=".99" ${rule.round === '.99' ? 'selected' : ''}>x.99</option><option value=".50" ${rule.round === '.50' ? 'selected' : ''}>nearest 50p</option><option value="1" ${rule.round === '1' ? 'selected' : ''}>whole pound</option></select>`}
    </div>${docsHtml()}
    <button class="btn full" onclick="buildRows()">Build preview →</button>`;
}

/* ---------- page ---------- */
function render(){
  const a = document.getElementById('app'); a.style.display = 'block';
  if (document.getElementById('o_name')) oneKeep();
  keepExtra();
  a.innerHTML = `<a class="back" href="purchasing.html">← Purchasing</a><div class="title">New Cin7 product</div>
    <div class="sub">Add one product, or upload a supplier price list. You always get a preview table to check and confirm before anything is created.</div>
    ${msg ? `<div class="msg ${msg.ok ? 'ok' : 'bad'}">${esc(msg.t)}</div>` : ''}
    <div class="seg"><button class="${mode === 'one' ? 'on' : ''}" onclick="mode='one';rows=[];render()">One product</button><button class="${mode === 'bulk' ? 'on' : ''}" onclick="mode='bulk';rows=[];render()">Supplier price list</button></div>
    ${defaultsHtml()}
    ${mode === 'one' ? (rows.length ? '' : oneHtml()) : (raw ? (rows.length ? '' : bulkHtml()) : `<div class="card"><div class="k">Upload the supplier's price list</div><input type="file" accept=".xlsx,.xls,.csv" onchange="loadFile(this.files[0])"><div class="m" style="margin-top:6px">Excel or CSV. For a PDF price list, send it to Claude in chat and it'll turn it into one of these for you.</div></div>`)}
    ${previewHtml()}
    ${rows.length ? `<button class="btn alt sm" onclick="rows=[];render()">← Back and change things</button>` : ''}
    ${recent.length ? `<div class="card" style="margin-top:12px"><div class="k">Recently created</div>${recent.map(r => `<div class="m" style="padding:3px 0">${new Date(r.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${esc(r.by_name || '')} · <b style="color:var(--ink)">${esc(r.sku)}</b> ${esc(r.name || '')} ${r.ok ? '' : '<span style="color:var(--bad)">FAILED: ' + esc(r.error) + '</span>'}</div>`).join('')}</div>` : ''}`;
}
if (token) boot(); else showLogin();
TSDAuth.mount(t => { document.getElementById('login').style.display = 'none'; token = t; boot(); });
</script>
<script>
(function(){ const BUILD = '20261104125039'; let newer = false;
  setInterval(async () => { try { if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); }
    if (newer && !busy && !rows.length && !raw && !document.activeElement?.matches('input,textarea,select')) location.reload(); } catch(e){} }, 120000);
})();
</script>
</body>
</html>

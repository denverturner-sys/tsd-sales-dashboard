<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tasks & Projects · Tiling Supplies Direct</title>
<style>
/* 25 Nov 2026: Department boards, Scorecard, Rocks & issues, Weekly meeting. One page, ?view=boards|scorecard|rocks|meeting. */
:root{--bg:#F4F3EF;--panel:#FFFFFF;--panel2:#F6F5F1;--line:#E3E1DB;--ink:#151617;--muted:#6C6F73;--accent:#EBCB2D;--on-accent:#1A1600;--bad:#C2352B;--tint-bad:#FBEDEB;--body:Inter,'Segoe UI',Arial,sans-serif;--num:'Inter Tight',Inter,'Segoe UI',Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:22px 22px 70px}
h1{font:700 29px/1.1 var(--num);letter-spacing:-.5px;margin:0}
h2{font:600 16px var(--num);margin:0}
.sub{color:var(--muted);font-size:13.5px;margin:5px 0 0;max-width:80ch}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .08s,border-color .15s}
.btn:hover{border-color:var(--muted);transform:translateY(-1px)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--panel2);transform:none}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 17px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph .m{font-size:12.5px;color:var(--muted)}
.empty{padding:16px 17px;color:var(--muted);font-size:13.5px}
.k{font-size:11px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill.bad{background:var(--tint-bad);border-color:transparent;color:var(--bad)}
.pill.quiet{background:transparent;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.off i{background:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:9px 17px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .g{flex:1;min-width:0}
.row .s{font-size:12.5px;color:var(--muted)}
input.in,select.in,textarea.in{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13.5px;min-width:0}
textarea.in{width:100%;min-height:90px;resize:vertical;line-height:1.5}
.err{color:var(--bad);font-size:13px;min-height:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1250px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.grid4{grid-template-columns:1fr}.wrap{padding:16px 14px 70px}h1{font-size:24px}}
.dcol .panel{margin-bottom:0;height:100%}
.sec{padding:10px 17px 4px}
.sec + .row{border-top:0}
.ppl{display:flex;flex-wrap:wrap;gap:6px;padding:4px 17px 12px}
.ppl span{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.ppl span b{font-weight:600}
.ppl span.od{border-color:var(--bad);color:var(--bad)}
table.sc{width:100%;border-collapse:collapse;font-size:13.5px}
table.sc th{text-align:right;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
table.sc th:first-child,table.sc td:first-child{text-align:left}
table.sc td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.sc tr:last-child td{border-bottom:0}
table.sc td.t{white-space:normal;min-width:200px}
table.sc td.t b{font-weight:600}
table.sc td.t .s{font-size:12px;color:var(--muted)}
table.sc td.miss{color:var(--bad);font-weight:600}
table.sc td.now{background:var(--panel2)}
table.sc td.cell{cursor:pointer}
table.sc td.cell:hover{outline:1px solid var(--muted);outline-offset:-3px;border-radius:6px}
table.sc td.cell.blank{color:var(--muted)}
.scroll{overflow-x:auto}
.rock{padding:13px 17px;border-bottom:1px solid var(--line)}
.rock:last-child{border-bottom:0}
.rock .h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.rock .t{font-weight:600;font-size:14.5px}
.rock .s{font-size:12.5px;color:var(--muted)}
.ms{list-style:none;margin:8px 0 0;padding:0}
.ms li{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0}
.ms input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);outline:1px solid var(--line)}
.seg button.on.off{color:var(--bad)}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.g2{grid-template-columns:1fr}}
form.add{display:flex;gap:8px;flex-wrap:wrap;padding:12px 17px;border-top:1px solid var(--line);background:var(--panel2)}
form.add .in{flex:1;min-width:140px}
.mt{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.mt{grid-template-columns:1fr}}
.agenda button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 15px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:500}
.agenda button:last-child{border-bottom:0}
.agenda button.on{background:var(--ink);color:var(--bg)}
.agenda button .m{font-size:12px;color:inherit;opacity:.7;font-family:var(--mono)}
.clock{font:700 28px var(--mono);letter-spacing:-1px;padding:14px 15px 4px}
.clock.over{color:var(--bad)}
.mbody{padding:16px 18px}
.issue{padding:12px 17px;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue .h{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.solve{display:grid;gap:8px;margin-top:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.solve .r{display:flex;gap:8px;flex-wrap:wrap}
.solve .r .in{flex:1;min-width:140px}
.rate{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rate label{display:flex;gap:6px;align-items:center;font-size:13.5px}
.rate input{width:56px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:10px;font-weight:500;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.mdl{position:fixed;inset:0;background:rgba(10,10,10,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:40}
.mdl form{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:calc(94vh - 16px);overflow:auto}
.mdl label{display:grid;gap:4px;font-size:12.5px;font-weight:600}
.mdl .r{display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:-20px;background:var(--panel);margin:0 -20px -20px;padding:12px 20px 16px;border-top:1px solid var(--line)}   /* Save / Cancel always in view, however long the form */
.mdl .g2b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
#app{display:none}
</style>
<script src="theme.js?v=20261126a"></script>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div id="app" class="wrap"></div>
<script src="auth.js?v=20261125b"></script>
<script src="activity.js?v=20261125b"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/eos';
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEPT = { sales: 'Sales & Marketing', ops: 'Operations', acc: 'Accounts', mg: 'Management' };
const VIEW = (new URLSearchParams(location.search).get('view') || 'boards').toLowerCase();
let token = store.get('tsd_me_token'), D = null, timer;
const dmy = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
const wk = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmt = (v, u) => v == null ? '' : u === '£' ? '£' + Math.round(v).toLocaleString('en-GB') : u === '%' ? (+v).toFixed(v % 1 ? 1 : 0) + '%' : (+v).toLocaleString('en-GB');
const miss = (m, v) => v != null && m.goal != null && (m.goal_dir === '<=' ? v > m.goal : v < m.goal);

function showLogin(msg){ clearInterval(timer); document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = msg || ''; }
async function api(body, qs){
  const r = await fetch(API + (qs || ''), body ? { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(body) } : { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({})); if (body && !j.ok) throw new Error(j.error || "Couldn't save"); if (j.error) throw new Error(j.error); return j;
}
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
async function refresh(){ try { D = await api(); render(); } catch(x){ if (x.message !== 'login' && !D) document.getElementById('app').innerHTML = `<div class="empty">${esc(x.message)}</div>`; } }
function start(){ document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block'; refresh(); clearInterval(timer);
  timer = setInterval(() => { const a = document.activeElement; if (!(a && a.matches('input,textarea,select')) && !document.querySelector('.mdl') && VIEW !== 'meeting') refresh(); }, 120000); }
async function act(body, okMsg){ try { await api(body); if (okMsg) toast(okMsg); await refresh(); return true; } catch(x){ if (x.message !== 'login') toast(x.message); return false; } }
const peopleOpts = (sel, blank) => (blank ? `<option value="">${blank}</option>` : '') + D.people.map(p => `<option value="${esc(p.email)}"${p.email === sel ? ' selected' : ''}>${esc(p.name)}</option>`).join('');
const deptOpts = sel => Object.entries(DEPT).map(([k, l]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(l)}</option>`).join('');
const nameOf = e => (D.people.find(p => p.email === String(e || '').toLowerCase()) || {}).name || '';

function modal(title, fields, onSave, extra){
  const d = document.createElement('div'); d.className = 'mdl';
  d.innerHTML = `<form><h2>${esc(title)}</h2>${fields}<div class="err"></div><div class="r">${extra || ''}<button type="button" class="btn" data-x>Cancel</button><button class="btn dark" type="submit">Save</button></div></form>`;
  document.body.appendChild(d);
  const close = () => d.remove(); d.querySelector('[data-x]').onclick = close; d.onclick = e => { if (e.target === d) close(); };
  const f = d.querySelector('form'); setTimeout(() => { const i = f.querySelector('input,textarea'); if (i) i.focus(); }, 30);
  f.onsubmit = async e => { e.preventDefault(); const o = {}; new FormData(f).forEach((v, k) => o[k] = v); const b = f.querySelector('[type=submit]'); b.disabled = true;
    try { await onSave(o); close(); } catch(x){ f.querySelector('.err').textContent = x.message; b.disabled = false; } };
  return d;
}

/* ================= Department boards ================= */
function renderBoards(el){
  const admin = D.me.is_admin;
  const load = e => D.load.find(l => l.email === e) || { open: 0, overdue: 0 };
  const cols = Object.keys(DEPT).map(k => {
    const ppl = D.people.filter(p => p.depts.includes(k));
    const rocks = D.rocks.filter(r => r.department === k && r.status !== 'done');
    const projs = D.projects.filter(p => p.department === k);
    const iss = D.issues.filter(i => i.department === k && i.status === 'open');
    const lead = ppl.filter(p => p.leads.includes(k)).map(p => p.name);
    return `<div class="dcol"><section class="panel"><div class="ph"><h2>${esc(DEPT[k])}</h2><span class="m">${ppl.length} ${ppl.length === 1 ? 'person' : 'people'}</span></div>
      <div class="sec k">People${lead.length ? ' · lead ' + esc(lead.join(', ')) : ''}</div>
      <div class="ppl">${ppl.length ? ppl.map(p => { const l = load(p.email); return `<span class="${l.overdue ? 'od' : ''}" title="${l.open} open task${l.open === 1 ? '' : 's'}${l.overdue ? ', ' + l.overdue + ' overdue' : ''}"><b>${esc(p.name)}</b> · ${l.open}${l.overdue ? ' (' + l.overdue + ' late)' : ''}</span>`; }).join('') : '<span>Nobody yet</span>'}</div>
      <div class="sec k">Rocks this quarter</div>
      ${rocks.length ? rocks.map(r => `<div class="row"><div class="g"><div>${esc(r.title)}</div><div class="s">${esc(r.owner_name || 'No owner')}${r.due_date ? ' · due ' + dmy(r.due_date) : ''}</div></div><div class="bar ${r.status === 'off' ? 'off' : ''}" style="width:70px"><i style="width:${r.progress}%"></i></div></div>`).join('') : '<div class="empty">No rocks set.</div>'}
      <div class="sec k">Projects</div>
      ${projs.length ? projs.map(p => `<div class="row"><div class="g"><div>${esc(p.title)}</div><div class="s">${esc(p.owner_name || '')}${p.due_date ? ' · due ' + dmy(p.due_date) : ''}</div></div>${p.status === 'off_track' ? '<span class="pill bad">Off track</span>' : '<span class="pill quiet">On track</span>'}</div>`).join('') : '<div class="empty">No projects tagged to this department.</div>'}
      <div class="sec k">Open issues</div>
      ${iss.length ? iss.slice(0, 5).map(i => `<div class="row"><div class="g"><div>${esc(i.title)}</div><div class="s">${esc(i.owner_name || 'No owner yet')}</div></div>${i.on_agenda ? '<span class="pill solid">Monday</span>' : ''}</div>`).join('') + (iss.length > 5 ? `<div class="empty">+ ${iss.length - 5} more on Rocks & issues</div>` : '') : '<div class="empty">None.</div>'}
    </section></div>`;
  }).join('');
  const untagged = D.projects.filter(p => !p.department);
  el.innerHTML = `<div class="top"><div><h1>Department boards</h1><p class="sub">Each department at a glance: who's in it and how much is on their plate, this quarter's rocks, projects and open issues. Task counts only; what a task says stays with the person (managers see detail on Team tasks).</p></div>
      ${admin ? '<button class="btn" id="ppl">Who\'s in which department</button>' : ''}</div>
    <div class="grid4">${cols}</div>
    ${admin && untagged.length ? `<section class="panel" style="margin-top:16px"><div class="ph"><h2>Projects without a department</h2><span class="m">Pick one so they show on the right board</span></div>
      ${untagged.map(p => `<div class="row"><div class="g">${esc(p.title)}<div class="s">${esc(p.owner_name || '')}</div></div><select class="in" data-pd="${p.id}"><option value="">Choose…</option>${deptOpts('')}</select></div>`).join('')}</section>` : ''}`;
  el.querySelectorAll('[data-pd]').forEach(s => s.onchange = () => s.value && act({ action: 'project_dept', id: +s.dataset.pd, department: s.value }, 'Project moved'));
  const b = document.getElementById('ppl'); if (b) b.onclick = peopleModal;
}
function peopleModal(){
  const d = document.createElement('div'); d.className = 'mdl';
  const draw = () => { const st0 = (d.querySelector('form') || {}).scrollTop || 0; d.innerHTML = `<form style="max-width:720px"><h2>Who's in which department</h2><p class="sub" style="margin:0">Tick the departments each person belongs to. "Lead" can add rocks and enter that department's scorecard numbers.</p>
    <div class="scroll"><table class="sc"><tr><th>Person</th>${Object.values(DEPT).map(l => `<th style="text-align:center">${esc(l)}</th>`).join('')}</tr>
    ${D.people.map(p => `<tr><td class="t"><b>${esc(p.name)}</b></td>${Object.keys(DEPT).map(k => `<td style="text-align:center"><label style="display:inline-flex;gap:4px;align-items:center"><input type="checkbox" data-e="${esc(p.email)}" data-d="${k}" ${p.depts.includes(k) ? 'checked' : ''}></label>
      ${p.depts.includes(k) ? `<label style="display:inline-flex;gap:4px;align-items:center;font-size:11.5px;margin-left:6px"><input type="checkbox" data-l="${esc(p.email)}" data-d="${k}" ${p.leads.includes(k) ? 'checked' : ''}> lead</label>` : ''}</td>`).join('')}</tr>`).join('')}</table></div>
    <div class="r"><button type="button" class="btn dark" data-x>Done</button></div></form>`;
    d.querySelector('[data-x]').onclick = () => { d.remove(); render(); };
    d.querySelector('form').scrollTop = st0;   // ticking a box doesn't jump the list back to the top
    d.querySelectorAll('[data-e]').forEach(c => c.onchange = async () => { await act({ action: 'dept_set', email: c.dataset.e, dept: c.dataset.d, on: c.checked }); draw(); });
    d.querySelectorAll('[data-l]').forEach(c => c.onchange = async () => { await act({ action: 'dept_set', email: c.dataset.l, dept: c.dataset.d, on: true, lead: c.checked }); draw(); });
  };
  document.body.appendChild(d); draw();
}

/* ================= Scorecard ================= */
function renderScorecard(el){
  const admin = D.me.is_admin;
  const tables = Object.keys(DEPT).map(k => {
    const ms = D.measures.filter(m => m.department === k); if (!ms.length && !admin) return '';
    return `<section class="panel"><div class="ph"><h2>${esc(DEPT[k])}</h2>${admin ? `<button class="btn sm" data-add="${k}">Add a measure</button>` : ''}</div>
      ${ms.length ? `<div class="scroll"><table class="sc"><tr><th>Measure</th><th>Goal</th>${D.weeks.map((w, i) => `<th>${i === D.weeks.length - 1 ? 'This week' : wk(w)}</th>`).join('')}${admin ? '<th></th>' : ''}</tr>
      ${ms.map(m => `<tr><td class="t"><b>${esc(m.title)}</b><div class="s">${esc(m.owner_name || 'No owner')}${m.auto ? ' · fills itself in' : ''}</div></td>
        <td>${m.goal == null ? '<span class="pill quiet">Not set</span>' : (m.goal_dir === '<=' ? '≤ ' : '≥ ') + fmt(m.goal, m.unit)}</td>
        ${m.weeks.map((c, i) => `<td class="${miss(m, c.v) ? 'miss' : ''} ${i === m.weeks.length - 1 ? 'now' : ''} ${m.can_enter ? 'cell' : ''} ${c.v == null ? 'blank' : ''}" ${m.can_enter ? `data-m="${m.id}" data-w="${c.w}"` : ''} title="${esc(c.note || '')}${c.by ? ' (' + esc(c.by) + ')' : ''}">${c.v == null ? (m.can_enter ? 'Add' : '–') : fmt(c.v, m.unit)}</td>`).join('')}
        ${admin ? `<td><button class="btn sm ghost" data-edit="${m.id}">Edit</button></td>` : ''}</tr>`).join('')}</table></div>` : '<div class="empty">No measures yet.</div>'}</section>`;
  }).join('');
  el.innerHTML = `<div class="top"><div><h1>Scorecard</h1><p class="sub">A handful of weekly numbers per department. Red means it missed its goal. "This week" is live until Sunday night. Owners type their numbers in; the ones marked "fills itself in" come straight from the system.</p></div></div>${tables}`;
  el.querySelectorAll('[data-m]').forEach(td => td.onclick = () => {
    const m = D.measures.find(x => x.id === +td.dataset.m), c = m.weeks.find(x => x.w === td.dataset.w);
    modal(`${m.title} · week of ${wk(td.dataset.w)}`, `<label>Number${m.unit ? ' (' + m.unit + ')' : ''}<input class="in" name="value" inputmode="decimal" value="${c.v ?? ''}" placeholder="Leave empty to clear"></label><label>Note (optional)<input class="in" name="note" maxlength="300" value="${esc(c.note || '')}"></label>`,
      async o => { await api({ action: 'entry_save', measure_id: m.id, week_start: td.dataset.w, value: o.value.trim(), note: o.note }); await refresh(); });
  });

          <div style="display:flex;gap:6px;flex-wrap:wrap">${admin ? `<button class="btn sm ${i.on_agenda ? 'dark' : ''}" data-ag="${i.id}" data-on="${i.on_agenda ? 0 : 1}">${i.on_agenda ? 'On Monday\'s list' : 'Add to Monday'}</button>` : (i.on_agenda ? '<span class="pill solid">Monday</span>' : '')}

/* ================= Weekly meeting ================= */
const STEPS = [['good', 'Good news', 5], ['scorecard', 'Scorecard', 5], ['rocks', 'Rocks', 5], ['headlines', 'Headlines', 5], ['todos', 'Last week\'s to-dos', 5], ['issues', 'Issues', 60], ['wrap', 'Wrap up', 5]];
let MT = { step: 'good', t0: Date.now(), spent: {} }, clockT;

    el.innerHTML = `<div class="top"><div><h1>Weekly meeting</h1><p class="sub">Same running order every week: good news, scorecard, rocks, headlines, last week's to-dos, then most of the time on issues, and a quick wrap up with a score out of 10. Everything links to the live scorecard, rocks and issues.</p></div><button class="btn pri" id="go">Start this week's meeting</button></div>
      ${m ? `<section class="panel"><div class="ph"><h2>Last meeting</h2><span class="m">${esc(dmy(m.held_on))}</span></div><div class="mbody">${m.good_news ? `<div class="k">Good news</div><p>${esc(m.good_news)}</p>` : ''}${m.headlines ? `<div class="k">Headlines</div><p>${esc(m.headlines)}</p>` : ''}

    document.getElementById('go').onclick = async () => { try { const j = await api({ action: 'meeting_start' }); MT = { step: 'good', t0: Date.now(), spent: {} }; await refresh(); } catch(x){ toast(x.message); } };
    return;
  }
  const cur = STEPS.find(s => s[0] === MT.step) || STEPS[0];
  el.innerHTML = `<div class="top"><div><h1>Weekly meeting</h1><p class="sub">Started ${esc(new Date(m.started_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }))} · ${esc(dmy(m.held_on))}</p></div></div>
    <div class="mt"><aside class="panel"><div class="clock" id="clk">0:00</div><div class="sub" style="padding:0 15px 10px">${esc(cur[1])} · ${cur[2]} min</div>
      <div class="agenda">${STEPS.map(s => `<button data-st="${s[0]}" class="${s[0] === MT.step ? 'on' : ''}"><span>${esc(s[1])}</span><span class="m">${s[2]}m</span></button>`).join('')}</div></aside>
    <section class="panel"><div class="ph"><h2>${esc(cur[1])}</h2><div style="display:flex;gap:8px">${MT.step !== 'wrap' ? '<button class="btn" id="next">Next</button>' : ''}</div></div><div class="mbody" id="mb"></div></section></div>`;

  clearInterval(clockT); const tick = () => { const c = document.getElementById('clk'); if (!c) return clearInterval(clockT); const ms = (MT.spent[MT.step] || 0) + Date.now() - MT.t0, s = Math.floor(ms / 1000);

  }
  mb.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => act({ action: 'issue_add', title: b.dataset.drop, department: b.dataset.dd, on_agenda: true }, 'Added to issues'));
}

function render(){
  const el = document.getElementById('app'); if (!D) return;
  if (VIEW === 'scorecard') return renderScorecard(el);
  if (VIEW === 'rocks' || VIEW === 'issues') return renderRocks(el);
  if (VIEW === 'meeting') return renderMeeting(el);
  return renderBoards(el);
}
if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });
</script>
<script>
(function(){
  const BUILD = '20261126001';
  const busy = () => { const a = document.activeElement; return (a && a.matches && a.matches('input,textarea,select')) || document.querySelector('.mdl') || document.getElementById('clk'); };
  let newer = false;
  async function check(){ try { if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\w+)'/); newer = !!(m && m[1] !== BUILD); } if (newer && !busy()) location.reload(); } catch(e){} }
  setInterval(check, 120000);
})();

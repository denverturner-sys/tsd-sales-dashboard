html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
button{font-family:inherit;font-size:15px}
.wrap{padding:16px 20px 28px;max-width:1500px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
header .l{display:flex;align-items:center;gap:16px}
header img{height:44px}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:13px}
nav#tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
nav#tabs button{background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;cursor:pointer}
nav#tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--panel);border-radius:12px;padding:14px 16px}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.v{font-family:var(--num);font-size:44px;line-height:1;margin-top:6px}
.s{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.s b{color:var(--ink)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:1000px){.row2{grid-template-columns:1fr}}
h3{margin:0 0 8px;font-size:15px;letter-spacing:.3px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
td:first-child,th:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
tr.tot td{font-weight:700}
.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-clear{background:rgba(255,122,107,.18);color:var(--bad)} .p-move{background:rgba(125,219,152,.18);color:var(--good)}
.p-over{background:rgba(238,209,7,.18);color:var(--accent)} .p-back{background:rgba(142,197,255,.18);color:var(--blue)}
.est{font-size:11px;font-weight:700;color:#262727;background:var(--accent);border-radius:4px;padding:1px 5px;margin-left:6px}
.note{font-size:12px;color:var(--muted);line-height:1.4}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.filters button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.filters button.on{background:var(--accent);color:#262727;border-color:var(--accent)}
svg text{font-family:var(--body);fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.callout{background:rgba(238,209,7,.10);border:1px solid rgba(238,209,7,.5);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;margin-bottom:12px}
#msg{padding:40px;text-align:center;color:var(--muted);font-size:18px}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
@media (max-width:600px){.wrap{padding:12px}.v{font-size:36px}.title{font-size:28px}}
</style>

const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
let token = store.get('tsd_me_token'), D = null, timer;
let tab = store.get('tsd_fin_tab') || 'company', deadFilter = 'all';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = v => Number(v) || 0;
const gbp = v => v == null ? '–' : (v < 0 ? '−£' : '£') + Math.abs(Math.round(N(v))).toLocaleString('en-GB');
const gbpk = v => (v < 0 ? '−£' : '£') + (Math.abs(v) >= 1000 ? (Math.abs(v)/1000).toFixed(Math.abs(v) >= 100000 ? 0 : 1) + 'k' : Math.round(Math.abs(v)));
const pct = (v, dp=1) => v == null || !isFinite(v) ? '–' : (v*100).toFixed(dp) + '%';
const sgn = v => v == null || !isFinite(v) ? '–' : `<span class="${v >= 0 ? 'good' : 'bad'}">${v >= 0 ? '+' : ''}${(v*100).toFixed(0)}%</span>`;
const mon = (s, y) => new Date(s + 'T12:00:00').toLocaleDateString('en-GB', y ? {month:'short', year:'2-digit'} : {month:'short'});
const monLong = s => new Date(s + 'T12:00:00').toLocaleDateString('en-GB', {month:'long', year:'numeric'});

function showLogin(msg){ clearInterval(timer); document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = msg || ''; }
function start(){ document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block'; refresh(); clearInterval(timer); timer = setInterval(refresh, 600000); }
async function refresh(){
  try {
    const r = await fetch(API, {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
    if (r.status === 401) { token = null; store.del('tsd_me_token'); return showLogin('Please log in again.'); }
    const j = await r.json(); if (j.error) throw new Error(j.error);
    D = j.data; render();
  } catch(x){ if (!D) document.getElementById('app').innerHTML = `<div id="msg">${esc(x.message)}</div>`; }
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
  <header><div class="l"><img src="${LOGO}" alt="TSD"><div><div class="title">Finance</div>
    <div class="sub">Denver, Rosena and Etienne only · Xero P&amp;L updated ${D.pl_synced ? new Date(D.pl_synced).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '–'} · Cin7 live</div></div></div></header>
  <nav id="tabs">${[['company','Company P&amp;L'],['wb','Wootton Bassett'],['dead','WB stock not selling']].map(([id,n]) => `<button data-t="${id}" class="${tab===id?'on':''}">${n}</button>`).join('')}</nav>
  <div id="pane"></div>`;
  app.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; store.set('tsd_fin_tab', tab); render(); });
  document.getElementById('pane').innerHTML = tab === 'wb' ? wbPane() : tab === 'dead' ? deadPane() : companyPane();
  if (tab === 'dead') wireDead();
}

// ---------------- Company ----------------
function companyPane(){
  const C = D.company, ms = C.months.filter(m => m.m < D.month), a = C.avg3;
  const last = ms.at(-1) || {}, gpPct = N(a.gp_pct);
  const be = gpPct > 0 ? N(a.opex) / gpPct : null;
  const lastGp = N(last.income) ? N(last.gp) / N(last.income) : null;
  const hasLy = m => N(m.income_ly) >= 100000;      // Xero only has full trading figures from Jun 2025 (Sage before that)
  const yoy = hasLy(last) ? N(last.income) / N(last.income_ly) - 1 : null;
  const l12 = ms.slice(-12);
  const sum = (arr, k) => arr.reduce((t, m) => t + N(m[k]), 0);
  const both = ms.filter(hasLy);                      // months with a real last-year month to compare against
  const gBoth = both.length ? sum(both, 'income') / sum(both, 'income_ly') - 1 : null;
  const susp = ms.filter(m => Math.abs(N(m.suspense)) >= 10000);
  const mtd = N(C.cin7_mtd), daysIn = new Date(new Date(D.month + 'T12:00:00').getFullYear(), new Date(D.month + 'T12:00:00').getMonth() + 1, 0).getDate();
  return `
  <div class="tiles">
    <div class="card"><div class="k">${monLong(last.m)} sales (Xero)</div><div class="v">${gbp(last.income)}</div>
      <div class="s">${sgn(yoy)} vs ${mon(last.m)} last year (${gbp(last.income_ly)})</div></div>
    <div class="card"><div class="k">${mon(last.m)} net profit</div><div class="v ${N(last.np) >= 0 ? 'good' : 'bad'}">${gbp(last.np)}</div>
      <div class="s">gross margin <b>${pct(lastGp)}</b> · overheads <b>${gbp(last.opex)}</b></div></div>
    <div class="card"><div class="k">Break-even sales a month</div><div class="v">${gbp(be)}</div>
      <div class="s">overheads ${gbp(a.opex)}/mo ÷ gross margin ${pct(gpPct)} · average of ${mon(a.from)}–${mon(a.to)}</div></div>
    <div class="card"><div class="k">Average month, last 3</div><div class="v">${gbp(a.np)}</div>
      <div class="s">net profit on <b>${gbp(a.income)}</b> sales · ${be ? `<b>${gbp(N(a.income) - be)}</b> a month above break-even` : ''}</div></div>
    <div class="card"><div class="k">${both.length ? `${mon(both[0].m)}–${mon(both.at(-1).m)} vs same months last year` : 'Growth vs last year'}</div><div class="v">${gBoth == null ? '–' : sgn(gBoth)}</div>
      <div class="s">sales <b>${gbp(sum(both,'income'))}</b> vs <b>${gbp(sum(both,'income_ly'))}</b> · Xero only has full figures from Jun 2025, so earlier months can't be compared</div></div>
  </div>
  ${susp.length ? `<div class="callout" style="border-color:var(--bad);background:rgba(255,122,107,.10)">⚠ <b>Suspense account:</b> ${susp.map(m => `${gbp(m.suspense)} in ${monLong(m.m)}`).join(', ')}. That's money Xero hasn't been told where it belongs, and it's booked as an overhead, so ${susp.map(m => mon(m.m)).join(' and ')} show${susp.length > 1 ? '' : 's'} a loss that probably wasn't really made. Worth Rosena clearing it. The net profit chart leaves it out; the table doesn't.</div>` : ''}
  <div class="callout"><b>${monLong(D.month)} so far:</b> ${gbp(mtd)} of sales in Cin7 · target ${gbp(C.target)} · break-even ${gbp(be)}.
    Break-even uses Xero's own overheads, including notional salaries, depreciation and anything else posted there, so it moves when they do.</div>
  <div class="row2">
    <div class="card"><h3>Sales by month vs last year</h3>${barsVsLy(ms.slice(-12))}
      <div class="legend"><span><i style="background:#EED107"></i>This year</span><span><i style="background:#5b5d5d"></i>Same month last year</span></div></div>
    <div class="card"><h3>Net profit by month${susp.length ? ' (leaving out Suspense)' : ''}</h3>${npBars(ms.slice(-12))}
      <div class="legend"><span><i style="background:#7DDB98"></i>Profit</span><span><i style="background:#FF7A6B"></i>Loss</span></div></div>
  </div>
  <div class="row2">
    <div class="card scroll"><h3>Month by month (Xero)</h3>
      <table><tr><th>Month</th><th>Sales</th><th>vs LY</th><th>Gross profit</th><th>GM%</th><th>Overheads</th><th>Net profit</th></tr>
      ${ms.slice(-12).reverse().map(m => `<tr><td>${mon(m.m, true)}</td><td>${gbp(m.income)}</td><td>${hasLy(m) ? sgn(N(m.income)/N(m.income_ly)-1) : '–'}</td>
        <td>${gbp(m.gp)}</td><td>${N(m.income) ? pct(N(m.gp)/N(m.income)) : '–'}</td><td>${gbp(m.opex)}</td>
        <td class="${N(m.np) >= 0 ? 'good' : 'bad'}">${gbp(m.np)}${Math.abs(N(m.one_off)) >= 500 ? ` <span class="note" title="Includes one-off income such as asset sales">*</span>` : ''}${Math.abs(N(m.suspense)) >= 1000 ? ` <span class="bad" title="${gbp(m.suspense)} in Suspense">⚠</span>` : ''}</td></tr>`).join('')}
      </table><div class="note" style="margin-top:6px">Sales and gross profit leave out one-offs (asset sales, bank interest). Net profit is Xero's figure, so it includes them (*) and anything in Suspense (⚠). Accruals basis. "vs LY" only where last year's month was a full trading month in Xero.</div></div>
    <div class="card scroll"><h3>Biggest overheads (average a month, ${mon(a.from)}–${mon(a.to)})</h3>
      <table>${C.top_costs.map(c => `<tr><td class="l">${esc(c.account)}</td><td>${gbp(c.avg)}</td><td class="note">${pct(N(c.avg)/N(a.opex),0)}</td></tr>`).join('')}
      <tr class="tot"><td>All overheads</td><td>${gbp(a.opex)}</td><td></td></tr></table></div>
  </div>`;
}

// ---------------- Wootton Bassett ----------------
function wbPane(){
  const W = D.wb, ms = W.months, full = ms.filter(m => !m.partial), last = full.at(-1) || {};
  const cm = N(W.cm), be = N(W.break_even), t = N(W.target);
  const atTarget = t * cm - N(W.fixed);
  const cum = ms.reduce((s, m) => s + N(m.contribution), 0);
  const launch = W.one_offs.filter(o => o.counted).reduce((s, o) => s + N(o.amount), 0);
  const maybe = W.one_offs.filter(o => !o.counted).reduce((s, o) => s + N(o.amount), 0);
  const stockCost = N(W.stock_value) * N(W.stock_money_rate) / 12;
  const estTotal = W.costs.filter(c => c.estimate).reduce((s, c) => s + N(c.monthly), 0);
  return `
  <div class="tiles">
    <div class="card"><div class="k">Break-even sales a month</div><div class="v">${gbp(be)}</div>
      <div class="s">costs ${gbp(W.fixed)}/mo ÷ ${pct(cm)} kept from each £1 of sales (margin ${pct(W.gm)} less card fees)</div></div>
    <div class="card"><div class="k">${monLong(last.m)}</div><div class="v ${N(last.contribution) >= 0 ? 'good' : 'bad'}">${gbp(last.contribution)}</div>
      <div class="s">on <b>${gbp(last.sales)}</b> sales · <b>${pct(N(last.sales)/be,0)}</b> of break-even · ${gbp(be - N(last.sales))} short</div></div>
    <div class="card"><div class="k">At the ${gbp(t)} target</div><div class="v ${atTarget >= 0 ? 'good' : 'bad'}">${gbp(atTarget)}</div>
      <div class="s">a month after WB's own costs · ${gbp(atTarget - stockCost)} after the cost of the stock money</div></div>
    <div class="card"><div class="k">Since opening (${new Date(W.opened+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})})</div><div class="v bad">${gbp(cum - launch)}</div>
      <div class="s">${gbp(cum)} from trading, ${gbp(-launch)} launch costs${maybe ? ` · up to ${gbp(maybe)} more if the trade-day items count` : ''}</div></div>
    <div class="card"><div class="k">Stock sitting at WB</div><div class="v warn">${gbp(W.stock_value)}</div>
      <div class="s">at cost · costs about <b>${gbp(stockCost)}</b>/mo in tied-up cash at ${pct(W.stock_money_rate,0)} a year · <a href="#" id="godead" style="color:var(--accent)">see what isn't selling</a></div></div>
  </div>
  <div class="callout">Each extra <b>£1,000</b> of WB sales a month adds about <b>${gbp(1000*cm)}</b>. At ${gbp(t)} WB only clears about <b>${gbp(atTarget)}</b> a month, so ${gbp(t)} is the floor for it to pay its way, not the finish line.
    ${estTotal ? `<b>${gbp(estTotal)}</b>/mo of the costs are still estimates (marked <span class="est">EST</span>): real bills could move break-even.` : ''}</div>
  <div class="row2">
    <div class="card"><h3>Sales vs break-even, month by month</h3>${wbBars(ms, be, t)}
      <div class="legend"><span><i style="background:#EED107"></i>Sales</span><span><i style="background:#FF7A6B;height:3px;vertical-align:3px"></i>Break-even</span><span><i style="background:#fff;height:3px;vertical-align:3px"></i>Target</span></div></div>
    <div class="card scroll"><h3>WB profit and loss</h3>
      <table><tr><th>Month</th><th>Sales</th><th>Gross profit</th><th>Card fees</th><th>Costs</th><th>Result</th></tr>
      ${ms.map(m => `<tr><td>${mon(m.m)}${m.partial ? ' (so far)' : N(m.frac) < 1 ? ' (part)' : ''}</td><td>${gbp(m.sales)}</td><td>${gbp(m.gp)}</td><td>${gbp(-N(m.card_fees))}</td><td>${gbp(-N(m.fixed))}</td>
        <td class="${N(m.contribution) >= 0 ? 'good' : 'bad'}">${gbp(m.contribution)}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td>${gbp(ms.reduce((s,m)=>s+N(m.sales),0))}</td><td>${gbp(ms.reduce((s,m)=>s+N(m.gp),0))}</td><td>${gbp(-ms.reduce((s,m)=>s+N(m.card_fees),0))}</td><td>${gbp(-ms.reduce((s,m)=>s+N(m.fixed),0))}</td><td class="${cum>=0?'good':'bad'}">${gbp(cum)}</td></tr></table>
      <div class="note" style="margin-top:6px">Sales and gross profit from Cin7, after credit notes (credits taken off at WB's average margin). Costs are spread by day, so the opening month only carries the days WB was open. "Result" is what WB adds to or takes from TSD's bottom line: central costs (admin, systems, management) aren't charged to it because they'd exist without it.</div></div>
  </div>
  <div class="row2">
    <div class="card scroll"><h3>WB's monthly costs</h3>
      <table>${W.costs.map(c => `<tr><td class="l">${esc(c.item)}${c.estimate ? '<span class="est">EST</span>' : ''}<div class="note">${esc(c.note || '')}</div></td><td>${gbp(c.monthly)}</td></tr>`).join('')}
      <tr class="tot"><td>Total a month</td><td>${gbp(W.fixed)}</td></tr>
      <tr><td class="l">Card fees<div class="note">${pct(W.card_rate)} on counter takings; ${pct(W.cash_share,0)} of WB sales go through the counter.</div></td><td>${pct(N(W.card_rate)*N(W.cash_share),2)} of sales</td></tr></table></div>
    <div class="card scroll"><h3>One-off launch costs</h3>
      <table>${W.one_offs.map(o => `<tr><td class="l">${esc(o.item)}${o.counted ? '' : ' <span class="pill p-over">not counted yet</span>'}<div class="note">${esc([o.supplier, o.note].filter(Boolean).join(' · '))}</div></td><td>${N(o.amount) ? gbp(o.amount) : '–'}</td></tr>`).join('')}
      <tr class="tot"><td>Counted</td><td>${gbp(launch)}</td></tr></table>
      <div class="note" style="margin-top:6px">From the RWB break-even workbook (Oct 26). Not costed: staff time at the trade day and set-up labour.</div></div>
  </div>`;
}

// ---------------- Dead stock ----------------
const ADV = [
  ['Not sold anywhere in 90 days: clear it', 'p-clear', 'Clear it', "Hasn't sold anywhere in the business in 90 days. Return to supplier, sell it off, or write it down."],
  ['Bromham is short: move it back', 'p-move', 'Move back now', 'Sells at Bromham and Bromham has less than 90 days of it. Sending it back may save buying more.'],
  ['Overstocked overall: stop buying, run it down', 'p-over', 'Stop buying', 'Sells, but between both sites there\'s more than a year of it. Don\'t reorder until it\'s down.'],
  ['Sells at Bromham: could go back', 'p-back', 'Could go back', 'Sells at Bromham, which has enough for now. Move it if WB needs the space or the cash.'],
];
const advMeta = a => ADV.find(x => x[0] === a) || [a, 'p-back', a, ''];
function deadPane(){
  const X = D.dead;
  const items = X.items.filter(i => deadFilter === 'all' || i.advice === deadFilter);
  return `
  <div class="callout"><b>${gbp(X.value)}</b> of the <b>${gbp(X.all_value)}</b> stock at Wootton Bassett (${X.lines} of ${X.all_lines} product lines, at cost) hasn't sold a single unit there since it opened on 10 Aug.
    Every £10k sat on WB's shelves is about £40 a month in tied-up cash, and it's also £10k that isn't available to buy what does sell.</div>
  <div class="tiles">${ADV.map(([a, cls, short, why]) => { const g = X.advice.find(x => x.advice === a) || {lines:0, value:0};
    return `<div class="card"><div class="k"><span class="pill ${cls}">${short}</span></div><div class="v">${gbp(g.value)}</div><div class="s"><b>${g.lines}</b> lines · ${why}</div></div>`; }).join('')}</div>
  <div class="row2">
    <div class="card scroll"><h3>By category</h3>
      <table><tr><th>Category</th><th>Lines</th><th>Value</th><th>Could go to Bromham</th><th>Clear</th></tr>
      ${X.categories.slice(0, 25).map(c => `<tr><td class="l">${esc(c.category)}</td><td>${c.lines}</td><td>${gbp(c.value)}</td><td>${c.move_back ? gbp(c.move_back) : '–'}</td><td>${c.clear ? gbp(c.clear) : '–'}</td></tr>`).join('')}
      </table>${X.categories.length > 25 ? `<div class="note" style="margin-top:6px">Top 25 of ${X.categories.length} categories by value.</div>` : ''}</div>
    <div class="card"><h3>How to read this</h3><div class="note" style="font-size:14px;line-height:1.55">
      <p><b>Not selling at WB</b> means no WB order since 10 Aug included it. Stock is today's on-hand in Cin7 at average cost.</p>
      <p><b>Sold in 90 days</b> counts every order in the business, and Bromham's own orders separately, so you can see whether it sells somewhere.</p>
      <p>Some of this will be range WB needs to carry, like grout colours or trims a counter has to have even if they sell slowly. The aim is to decide line by line, not to empty the shelves.</p>
      <p>Cin7's "Other" category is the biggest by value and mostly hasn't sold anywhere. It's worth a look first.</p></div></div>
  </div>
  <div class="card scroll"><h3>Lines (${items.length} of the top ${X.items.length} by value)</h3>
    <div class="filters"><button data-f="all" class="${deadFilter==='all'?'on':''}">All</button>${ADV.map(([a,,short]) => `<button data-f="${esc(a)}" class="${deadFilter===a?'on':''}">${short}</button>`).join('')}</div>
    <table><tr><th>SKU</th><th class="l">Product</th><th class="l">Category</th><th>Qty at WB</th><th>Value</th><th>Sold 90d (all)</th><th>Sold 90d (Bromham)</th><th>Bromham has</th><th class="l">What to do</th></tr>
    ${items.map(i => { const [, cls, short] = advMeta(i.advice); return `<tr><td>${esc(i.sku)}</td><td class="l">${esc(i.name)}<div class="note">${esc(i.supplier || '')}</div></td><td class="l note">${esc(i.category)}</td>
      <td>${Number(i.qty).toLocaleString('en-GB')}</td><td>${gbp(i.value)}</td><td>${Number(i.qty90_all).toLocaleString('en-GB')}</td><td>${Number(i.qty90_brom).toLocaleString('en-GB')}</td><td>${Number(i.brom_on_hand).toLocaleString('en-GB')}</td>
      <td class="l"><span class="pill ${cls}">${short}</span></td></tr>`; }).join('')}
    </table></div>`;
}
function wireDead(){ document.querySelectorAll('.filters button').forEach(b => b.onclick = () => { deadFilter = b.dataset.f; render(); }); }
document.addEventListener('click', e => { if (e.target && e.target.id === 'godead') { e.preventDefault(); tab = 'dead'; store.set('tsd_fin_tab', tab); render(); } });

// ---------------- charts (SVG, no libraries) ----------------
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, x)))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function frame(min, max, W, H, P){
  const step = niceStep((max - min) / 4), lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const y = v => H - P.b - ((v - lo) / (hi - lo || 1)) * (H - P.t - P.b);
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? '#8a8c8c' : '#474949'}" stroke-width="1"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${gbpk(v)}</text>`;
  return { y, g };
}
function barsVsLy(ms){
  const W = 640, H = 240, P = {l:50, r:8, t:10, b:24};
  const max = Math.max(...ms.map(m => Math.max(N(m.income), N(m.income_ly) >= 100000 ? N(m.income_ly) : 0)), 1);
  const { y, g } = frame(0, max, W, H, P), bw = (W - P.l - P.r) / Math.max(1, ms.length);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}${ms.map((m, i) => { const x = P.l + i * bw;
    return `${N(m.income_ly) >= 100000 ? `<rect x="${x + bw*.12}" y="${y(N(m.income_ly))}" width="${bw*.36}" height="${y(0) - y(N(m.income_ly))}" fill="#5b5d5d" rx="2"><title>${mon(m.m)} last year: ${gbp(m.income_ly)}</title></rect>` : ''}
      <rect x="${x + bw*.5}" y="${y(N(m.income))}" width="${bw*.36}" height="${y(0) - y(N(m.income))}" fill="#EED107" rx="2"><title>${mon(m.m, true)}: ${gbp(m.income)}</title></rect>
      <text x="${x + bw/2}" y="${H - 7}" text-anchor="middle">${mon(m.m)}</text>`; }).join('')}</svg>`;
}
function npBars(ms){
  const W = 640, H = 240, P = {l:50, r:8, t:10, b:24};
  const npx = m => N(m.np) + N(m.suspense), vals = ms.map(npx), { y, g } = frame(Math.min(0, ...vals), Math.max(0, ...vals, 1), W, H, P), bw = (W - P.l - P.r) / Math.max(1, ms.length);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}${ms.map((m, i) => { const v = npx(m), x = P.l + i * bw + bw*.2;
    return `<rect x="${x}" y="${Math.min(y(v), y(0))}" width="${bw*.6}" height="${Math.abs(y(v) - y(0))}" fill="${v >= 0 ? '#7DDB98' : '#FF7A6B'}" rx="2"><title>${mon(m.m, true)}: ${gbp(v)}</title></rect>
      <text x="${x + bw*.3}" y="${H - 7}" text-anchor="middle">${mon(m.m)}</text>`; }).join('')}</svg>`;
}
function wbBars(ms, be, t){
  const W = 640, H = 240, P = {l:50, r:8, t:14, b:24};
  const { y, g } = frame(0, Math.max(be, t, ...ms.map(m => N(m.sales))), W, H, P), bw = (W - P.l - P.r) / Math.max(1, ms.length);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}${ms.map((m, i) => { const x = P.l + i * bw + bw*.22, v = N(m.sales);
    return `<rect x="${x}" y="${y(v)}" width="${bw*.56}" height="${y(0) - y(v)}" fill="${m.partial ? '#5b5d5d' : '#EED107'}" rx="3"><title>${mon(m.m)}: ${gbp(v)}</title></rect>
      <text x="${x + bw*.28}" y="${y(v) - 5}" text-anchor="middle" style="fill:#fff;font-weight:700">${gbpk(v)}</text>
      <text x="${x + bw*.28}" y="${H - 7}" text-anchor="middle">${mon(m.m)}${m.partial ? ' (so far)' : N(m.frac) < 1 ? ' (part)' : ''}</text>`; }).join('')}
    <line x1="${P.l}" x2="${W - P.r}" y1="${y(be)}" y2="${y(be)}" stroke="#FF7A6B" stroke-width="2" stroke-dasharray="6 4"/><text x="${W - P.r - 4}" y="${y(be) - 5}" text-anchor="end" style="fill:#FF7A6B">break-even ${gbpk(be)}</text>
    ${t ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" stroke="#fff" stroke-width="2"/><text x="${P.l + 4}" y="${y(t) - 5}" style="fill:#fff">target ${gbpk(t)}</text>` : ''}</svg>`;
}

if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });
</script>

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#262727">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Goods In">
<title>Goods In · TSD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#262727; --panel:#323333; --panel2:#3B3C3C; --line:#474949; --ink:#FFFFFF; --muted:#B9BCBC;
  --accent:#EED107; --good:#7DDB98; --bad:#FF7A6B;
  --num:'Bebas Neue','DIN Condensed','Arial Narrow',Arial,sans-serif;
  --body:Barlow,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
button,input,textarea{font-family:inherit}
#tabs{max-width:1900px;margin:0 auto;padding:12px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
#tabs a{color:var(--muted);text-decoration:none;font-weight:700;font-size:15px;padding:9px 16px;border:1px solid var(--line);border-radius:999px}
#tabs a.on{background:var(--accent);color:#262727;border-color:var(--accent)}
.wrap{max-width:1900px;margin:0 auto;padding:12px 16px 120px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header .l{display:flex;align-items:center;gap:12px}
header img{height:44px}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer}
.pill.y{background:var(--accent);color:#262727;border-color:var(--accent)}
#q{width:100%;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:18px;margin-bottom:12px}
#q:focus{outline:none;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1000px){ .grid{grid-template-columns:440px minmax(0,1fr)} #list{max-height:calc(100vh - 190px);overflow:auto;position:sticky;top:12px} }
.sec{margin-bottom:14px}
.sec h2{margin:4px 2px 8px;font-family:var(--num);font-weight:400;font-size:26px;letter-spacing:1px;display:flex;gap:10px;align-items:baseline}
.sec h2 .n{background:var(--accent);color:#262727;border-radius:6px;padding:0 8px;font-size:20px}
.sec h2 .h{font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:0}
details.sec summary{list-style:none;cursor:pointer}
.po{width:100%;text-align:left;background:var(--panel);border:2px solid transparent;border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.po.on{border-color:var(--accent)}
.po .sup{font-weight:700;font-size:18px;line-height:1.2}
.po .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.po .no{font-family:var(--num);font-size:22px;letter-spacing:1px;color:var(--ink)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;padding:3px 7px;border-radius:4px;text-transform:uppercase}
.b-over{background:var(--bad);color:#262727} .b-today{background:var(--accent);color:#262727} .b-clear{border:1px solid var(--good);color:var(--good)}
.b-part{border:1px solid var(--muted);color:var(--ink)}
.empty{color:var(--muted);padding:10px 4px}
#detail{background:var(--panel);border-radius:14px;padding:14px;min-height:200px}
#detail .ph{color:var(--muted);text-align:center;padding:60px 10px;font-size:18px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dh .sup{font-family:var(--num);font-size:34px;letter-spacing:1px;line-height:1}
.back{display:none}
@media (max-width:999px){ body.open #list, body.open #qwrap, body.open header .hbtns .noopen{display:none} body:not(.open) #detail{display:none} body.open .back{display:inline-block} }
.allbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.ln{background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:10px;border-left:6px solid var(--line)}
.ln.full{border-left-color:var(--good)} .ln.part{border-left-color:var(--accent)} .ln.none{border-left-color:var(--line)} .ln.prob{border-left-color:var(--bad)}
.ln .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ln .sku{font-weight:700;font-size:16px}
.ln .nm{font-size:15px;line-height:1.3;margin:2px 0 6px}
.ln .os{font-size:13px;color:var(--muted)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px}
.step button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:26px;font-weight:700;cursor:pointer}
.step input{width:84px;height:52px;text-align:center;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;font-size:24px;font-weight:700}
.step input:focus{outline:none;border-color:var(--accent)}
.qb{height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
.qb.ok{border-color:var(--good);color:var(--good)} .qb.ok.sel{background:var(--good);color:#262727}
.qb.no.sel{background:var(--muted);color:#262727}
.qb.pr{border-color:var(--bad);color:var(--bad)} .qb.pr.sel{background:var(--bad);color:#262727}
.short{margin-top:10px;font-size:14px;display:flex;gap:8px;flex-wrap:wrap}
.short label{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.short input{width:20px;height:20px;accent-color:#EED107}
.prob{margin-top:10px;background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px}
.prob .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.prob .r .k{font-weight:700;min-width:150px}
.prob .step button{width:44px;height:44px;font-size:22px} .prob .step input{width:64px;height:44px;font-size:20px}
.prob textarea{width:100%;min-height:60px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px}
.photos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.photos label{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--muted);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}
.photos input{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;background:#1d1e1e;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;z-index:5}
#bar .in{max-width:1900px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#bar .sum{font-size:15px;color:var(--muted)} #bar .sum b{color:var(--ink)}
#book{background:var(--good);color:#262727;border:0;border-radius:12px;padding:16px 26px;font-size:19px;font-weight:700;cursor:pointer;min-width:220px}
#book:disabled{opacity:.5}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:10}
@media (min-width:700px){ #modal{align-items:center;padding:16px} }
#modal .box{background:var(--panel);border-radius:16px 16px 0 0;padding:18px;width:100%;max-width:620px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){ #modal .box{border-radius:16px} }
#modal h3{margin:0;font-family:var(--num);font-weight:400;font-size:30px;letter-spacing:1px}
#modal ul{margin:0;padding-left:18px;font-size:15px;line-height:1.5}
#modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#modal .big{flex:1;min-width:150px;height:54px;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
#modal .big.go{background:var(--good);color:#262727;border:0}
#modal input[type=text],#modal textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
.clears{background:rgba(125,219,152,.1);border:1px solid var(--good);border-radius:10px;padding:10px 12px}
.claimbox{background:rgba(255,122,107,.1);border:1px solid var(--bad);border-radius:10px;padding:10px 12px}
.err{color:var(--bad);font-size:14px;min-height:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#262727;border-radius:12px;padding:14px 18px;font-weight:700;display:none;z-index:20;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#msg{color:var(--muted);padding:40px;text-align:center;font-size:18px}
footer{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>

<script>
(function(){ // tabs between the warehouse screens; add &nav=0 to a link to hide them
  const q = new URLSearchParams(location.search); if (q.get('nav') === '0') return;
  const k = encodeURIComponent(q.get('k') || '');
  const t = [['pick','Pick &amp; Dispatch','warehouse.html?k=' + k], ['van','Van Team','van.html?k=' + k], ['coll','Collections','warehouse.html?k=' + k + '&tab=collections'], ['gi','Goods In','goodsin.html?k=' + k], ['stock','Stock','stock.html?k=' + k]];
  const n = document.createElement('nav'); n.id = 'tabs';
  n.innerHTML = t.map(([id, label, url]) => `<a href="${url}" class="${id === 'gi' ? 'on' : ''}">${label}</a>`).join('');
  document.body.prepend(n);
})();
</script>

<div id="toast"></div>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/goods-in';
const qs = new URLSearchParams(location.search);
const key = qs.get('k') || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (+n || 0).toLocaleString('en-GB', {maximumFractionDigits: 2});
const dshort = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}) : '';
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
let site = store.get('gi_site') || 'Bromham';
let me = store.get('gi_me') || '';
let data = null, cur = null, form = {}, query = '', toastT;

function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 7000); }
function closeModal(){ document.getElementById('modal').style.display = 'none'; }
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

async function load(){
  if (!key) { document.getElementById('list').innerHTML = '<div id="msg">This screen needs its access link.</div>'; return; }
  try {
    const r = await fetch(API + '?loc=' + encodeURIComponent(site) + '&k=' + encodeURIComponent(key), {cache:'no-store'});
    if (r.status === 403) { document.getElementById('list').innerHTML = '<div id="msg">Access link not recognised.</div>'; return; }
    const j = await r.json(); if (j.error) throw new Error(j.error);
    data = j; renderList();
  } catch(e) { if (!data) document.getElementById('list').innerHTML = '<div id="msg">Can\'t reach the server. Retrying…</div>'; }
}

// which waiting backorders a set of received quantities would clear (oldest order gets stock first)
function clearsFor(recv){
  if (!data) return [];
  return data.waiting.filter(o => o.lines.some(l => recv[l.pid] > 0)
    && o.lines.every(l => l.cum <= l.free + (recv[l.pid] || 0))
    && !o.lines.every(l => l.cum <= l.free));
}
const SCREEN = {dispatch:'Pick & Dispatch', van:'Van Team', collections:'Collections · ring the customer'};

function poCard(p){
  const recv = {}; (p.lines || []).forEach(l => recv[l.pid] = l.outstanding);
  const cl = clearsFor(recv).length;
  const part = (p.lines || []).some(l => l.received > 0);
  return `<button class="po ${cur && cur.po_id === p.po_id ? 'on' : ''}" data-id="${p.po_id}">
    <div class="row"><span class="no">${esc(p.po_number)}</span><span>${p.expected ? (p.due === 'today' ? '<span class="badge b-today">Due today</span>' : p.due === 'overdue' ? `<span class="badge b-over">Due ${dshort(p.expected)}</span>` : 'Due ' + dshort(p.expected)) : 'No date'}</span></div>
    <div class="sup">${esc(p.supplier)}</div>
    <div class="row"><span>${((n) => n + ' line' + (n === 1 ? '' : 's'))((p.lines || []).filter(l => l.outstanding > 0).length)} · ${fmt(p.outstanding)} items to come</span><span>${part ? '<span class="badge b-part">Part received</span> ' : ''}${cl ? `<span class="badge b-clear">Clears ${cl} order${cl === 1 ? '' : 's'}</span>` : ''}</span></div>
  </button>`;
}
function matches(p){
  if (!query) return true;
  const hay = [p.po_number, p.supplier, ...(p.lines || []).flatMap(l => [l.sku, l.name, l.supplier_sku])].join('|').toLowerCase().replace(/[\s\-]/g, '');
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w.replace(/[\s\-]/g, '')));
}
function renderList(){
  document.getElementById('ttl').textContent = 'Goods In · ' + site;
  document.getElementById('site').textContent = '📍 ' + site;
  document.getElementById('who').textContent = '👤 ' + (me || 'Who are you?');
  const pos = data.pos.filter(matches);
  const old = p => p.due === 'overdue' && p.expected && (new Date(data.today) - new Date(p.expected)) / 864e5 > 30;
  const groups = [
    ['Due today &amp; overdue', 'Most likely on the lorry', pos.filter(p => (p.due === 'today' || p.due === 'overdue') && !old(p)), true],
    ['Due this week', '', pos.filter(p => p.due === 'week'), true],
    ['Later', '', pos.filter(p => p.due === 'later'), true],
    ['No expected date', 'Office hasn’t put a date on these', pos.filter(p => p.due === 'nodate'), !!query || pos.filter(p => p.due !== 'nodate').length < 3],
    ['Old', 'Over a month overdue. Probably need closing in Cin7', pos.filter(old), !!query],
  ];
  const bt = data.booked_today || [];
  document.getElementById('list').innerHTML =
    (bt.length && !query ? `<div class="sec"><h2>Booked in today <span class="n">${bt.length}</span></h2>${bt.map(b => `<div class="sub">✓ ${new Date(b.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${esc(b.po)} ${esc(b.supplier)} · ${fmt(b.lines)} items${b.by ? ' · ' + esc(b.by) : ''}${b.ok === false ? ' · <b style="color:var(--bad)">problem</b>' : ''}</div>`).join('')}</div>` : '') +
    groups.map(([t, h, list, open]) => list.length ? `<details class="sec" ${open ? 'open' : ''}><summary><h2>${t} <span class="n">${list.length}</span> <span class="h">${h}</span></h2></summary>${list.map(poCard).join('')}</details>` : '').join('') +
    (pos.length ? '' : `<div class="empty">${query ? 'No open PO matches that. If it’s definitely ours, use “Delivery with no PO”.' : 'Nothing due in.'}</div>`);
  document.querySelectorAll('.po').forEach(b => b.onclick = () => openPo(b.dataset.id));
  document.getElementById('foot').textContent = `${data.pos.length} open POs at ${site} · refreshed ${new Date(data.generated_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;
}

async function openPo(id){
  const p = data.pos.find(x => x.po_id === id); if (!p) return;
  cur = {...p, live: false}; form = {};
  p.lines.forEach(l => form[l.pid] = {qty: l.outstanding, short: false, damaged: 0, wrong: 0, over: 0, note: '', photos: [], prob: false});
  document.body.classList.add('open'); renderList(); renderDetail(); window.scrollTo(0, 0);
  // refresh from Cin7 so we're booking against what's really outstanding right now
  try {
    const r = await fetch(API + '?po=' + id + '&k=' + encodeURIComponent(key), {cache:'no-store'});
    const j = await r.json(); if (j.error || !cur || cur.po_id !== id) return;
    const changed = j.lines.some(l => { const o = p.lines.find(x => x.pid === l.pid); return !o || o.outstanding !== l.outstanding; });
    cur = {...p, lines: j.lines, live: true};
    j.lines.forEach(l => { if (!form[l.pid] || changed) form[l.pid] = {qty: l.outstanding, short: false, damaged: 0, wrong: 0, over: 0, note: '', photos: [], prob: false}; });
    renderDetail();
  } catch(e){}
}
function closePo(){ cur = null; form = {}; document.body.classList.remove('open'); document.getElementById('bar').style.display = 'none'; document.getElementById('detail').innerHTML = '<div class="ph">Tap a delivery to book it in.</div>'; renderList(); }
document.getElementById('backbtn').onclick = closePo;

function lineState(l){
  const f = form[l.pid];
  if (f.damaged || f.wrong || f.over || (f.short && f.qty < l.outstanding)) return 'prob';
  return f.qty >= l.outstanding ? 'full' : f.qty > 0 ? 'part' : 'none';
}
function renderDetail(){
  if (!cur) return;
  const lines = cur.lines.filter(l => l.outstanding > 0);
  const done = cur.lines.filter(l => l.outstanding <= 0);
  document.getElementById('detail').innerHTML = `
    <div class="dh"><div><div class="sup">${esc(cur.supplier)}</div><div class="sub">${esc(cur.po_number)}${cur.expected ? ' · due ' + dshort(cur.expected) : ''}${cur.live ? ' · <span style="color:var(--good)">checked with Cin7 just now</span>' : ' · checking Cin7…'}</div></div></div>
    <div class="allbar"><button class="pill y" id="allin">✓ Everything's here</button><button class="pill" id="nonein">Nothing ticked</button></div>
    ${lines.map(l => lineHtml(l)).join('')}
    ${done.length ? `<div class="sub" style="margin-top:6px">Already fully received: ${done.map(l => esc(l.sku)).join(', ')}</div>` : ''}`;
  document.getElementById('allin').onclick = () => { lines.forEach(l => Object.assign(form[l.pid], {qty: l.outstanding, short: false})); renderDetail(); };
  document.getElementById('nonein').onclick = () => { lines.forEach(l => Object.assign(form[l.pid], {qty: 0, short: false})); renderDetail(); };
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.pid, b.dataset.act, b.dataset.f));
  document.querySelectorAll('input[data-q]').forEach(i => i.onchange = () => { const l = cur.lines.find(x => x.pid === i.dataset.pid); setN(i.dataset.pid, i.dataset.q, i.value, i.dataset.q === 'qty' ? l.outstanding : 9999); });
  document.querySelectorAll('input[data-short]').forEach(i => i.onchange = () => { form[i.dataset.pid].short = i.value === 'short'; renderDetail(); });
  document.querySelectorAll('textarea[data-note]').forEach(t => t.oninput = () => { form[t.dataset.pid].note = t.value; });
  document.querySelectorAll('input[data-photo]').forEach(i => i.onchange = () => addPhotos(i.dataset.pid, i.files));
  updateBar();
}
function stepper(pid, f, v){
  return `<span class="step"><button data-act="dec" data-pid="${pid}" data-f="${f}">−</button><input data-q="${f}" data-pid="${pid}" type="number" inputmode="numeric" min="0" value="${v}"><button data-act="inc" data-pid="${pid}" data-f="${f}">+</button></span>`;
}
function lineHtml(l){
  const f = form[l.pid], st = lineState(l);
  const recvBefore = l.received > 0 ? ` · ${fmt(l.received)} already in` : '';
  return `<div class="ln ${st}">
    <div class="t"><span class="sku">${esc(l.sku)}</span><span class="os">ordered ${fmt(l.ordered)}${recvBefore}</span></div>
    <div class="nm">${esc(l.name)}${l.supplier_sku && l.supplier_sku !== l.sku ? ` <span class="os">(supplier code ${esc(l.supplier_sku)})</span>` : ''}</div>
    <div class="os" style="margin-bottom:8px">Expecting <b style="color:var(--ink)">${fmt(l.outstanding)}</b></div>
    <div class="ctrl">
      ${stepper(l.pid, 'qty', f.qty)}
      <button class="qb ok ${f.qty === l.outstanding && !f.prob ? 'sel' : ''}" data-act="all" data-pid="${l.pid}">✓ All here</button>
      <button class="qb no ${f.qty === 0 ? 'sel' : ''}" data-act="none" data-pid="${l.pid}">Not here</button>
      <button class="qb pr ${f.prob ? 'sel' : ''}" data-act="prob" data-pid="${l.pid}">⚠ Problem</button>
    </div>
    ${f.qty < l.outstanding ? `<div class="short">
      <label><input type="radio" name="s_${l.pid}" data-short data-pid="${l.pid}" value="tocome" ${!f.short ? 'checked' : ''}> Rest still to come</label>
      <label><input type="radio" name="s_${l.pid}" data-short data-pid="${l.pid}" value="short" ${f.short ? 'checked' : ''}> Delivery note says it was sent: claim ${fmt(l.outstanding - f.qty)} short</label></div>` : ''}
    ${f.prob ? `<div class="prob">
      <div class="r"><span class="k">Damaged (not booked in)</span>${stepper(l.pid, 'damaged', f.damaged)}</div>
      <div class="r"><span class="k">Wrong item sent</span>${stepper(l.pid, 'wrong', f.wrong)}</div>
      <div class="r"><span class="k">Extra sent (more than ordered)</span>${stepper(l.pid, 'over', f.over)}</div>
      <textarea data-note data-pid="${l.pid}" placeholder="What's wrong? e.g. 2 bags split, pallet crushed">${esc(f.note)}</textarea>
      <div class="photos">${f.photos.map(p => `<img src="${p}" alt="photo">`).join('')}<label>📷 Add photo<input type="file" accept="image/*" capture="environment" multiple data-photo data-pid="${l.pid}"></label></div>
    </div>` : ''}
  </div>`;
}
function setN(pid, f, v, max){ form[pid][f] = Math.max(0, Math.min(max, Math.round(+v || 0))); renderDetail(); }
function act(pid, a, f){
  const l = cur.lines.find(x => x.pid === pid), F = form[pid];
  if (a === 'inc') setN(pid, f, F[f] + 1, f === 'qty' ? l.outstanding : 9999);
  else if (a === 'dec') setN(pid, f, F[f] - 1, 9999);
  else if (a === 'all') { Object.assign(F, {qty: l.outstanding, short: false}); renderDetail(); }
  else if (a === 'none') { Object.assign(F, {qty: 0}); renderDetail(); }
  else if (a === 'prob') { F.prob = !F.prob; if (!F.prob) Object.assign(F, {damaged: 0, wrong: 0, over: 0}); renderDetail(); }
}
async function addPhotos(pid, files){
  for (const file of [...files].slice(0, 4 - form[pid].photos.length)) {
    try { form[pid].photos.push(await shrink(file)); } catch(e){}
  }
  renderDetail();
}
function shrink(file){ // phones take huge photos: resize to 1280px JPEG before sending
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); };
    img.onerror = rej; img.src = url;
  });
}
function plan(){
  const lines = cur.lines.filter(l => l.outstanding > 0);
  const recv = {}, book = [], claims = [];
  for (const l of lines) {
    const f = form[l.pid];
    recv[l.pid] = f.qty;
    if (f.qty > 0) book.push({l, qty: f.qty});
    const short = f.short ? Math.max(0, l.outstanding - f.qty - f.damaged - f.wrong) : 0;
    if (f.damaged) claims.push({l, kind:'Damaged', q: f.damaged});
    if (f.wrong) claims.push({l, kind:'Wrong item', q: f.wrong});
    if (short) claims.push({l, kind:'Short', q: short});
    if (f.over) claims.push({l, kind:'Extra sent', q: f.over});
  }
  return {recv, book, claims, items: book.reduce((s, b) => s + b.qty, 0)};
}
function updateBar(){
  if (!cur) return;
  const p = plan(), cl = clearsFor(p.recv);
  document.getElementById('bar').style.display = 'block';
  document.getElementById('sum').innerHTML = `<b>${fmt(p.items)}</b> item${p.items === 1 ? '' : 's'} on <b>${p.book.length}</b> line${p.book.length === 1 ? '' : 's'}${p.claims.length ? ` · <b style="color:var(--bad)">${p.claims.length} problem${p.claims.length === 1 ? '' : 's'}</b>` : ''}${cl.length ? ` · <b style="color:var(--good)">clears ${cl.length} order${cl.length === 1 ? '' : 's'}</b>` : ''}`;
  const b = document.getElementById('book'); b.disabled = !p.book.length && !p.claims.length;
  b.textContent = p.book.length ? `Book in ${fmt(p.items)} item${p.items === 1 ? '' : 's'}` : 'Report problems';
}
document.getElementById('book').onclick = confirmBook;

function askName(then){
  document.getElementById('mbox').innerHTML = `<h3>Who's booking in?</h3>
    <div class="sub">So the office knows who to ask. This phone remembers it.</div>
    <input type="text" id="nm" value="${esc(me)}" placeholder="Your first name" autocomplete="given-name">
    <div class="row"><button class="big" id="nc">Cancel</button><button class="big go" id="nok">Save</button></div>`;
  document.getElementById('modal').style.display = 'flex';
  const i = document.getElementById('nm'); setTimeout(() => i.focus(), 50);
  document.getElementById('nc').onclick = closeModal;
  const save = () => { const v = i.value.trim(); if (!v) return; me = v; store.set('gi_me', v); closeModal(); if (cur) updateBar(); if (data) renderList(); if (then) then(); };
  document.getElementById('nok').onclick = save; i.onkeydown = e => { if (e.key === 'Enter') save(); };
}
document.getElementById('who').onclick = () => askName();
document.getElementById('site').onclick = () => {
  document.getElementById('mbox').innerHTML = `<h3>Which site?</h3><div class="row">${['Bromham','Wootton Bassett'].map(s => `<button class="big ${s === site ? 'go' : ''}" data-s="${s}">${s}</button>`).join('')}</div>`;
  document.getElementById('modal').style.display = 'flex';
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { site = b.dataset.s; store.set('gi_site', site); closeModal(); closePo(); data = null; document.getElementById('list').innerHTML = '<div id="msg">Loading…</div>'; load(); });
};

function confirmBook(){
  if (!me) return askName(confirmBook);
  const p = plan(), cl = clearsFor(p.recv);
  const notTicked = cur.lines.filter(l => l.outstanding > 0 && form[l.pid].qty < l.outstanding && !form[l.pid].short);
  document.getElementById('mbox').innerHTML = `
    <h3>Book in · ${esc(cur.po_number)}</h3>
    <div class="sub">${esc(cur.supplier)} · into ${esc(site)} stock in Cin7</div>
    ${p.book.length ? `<div><b>Booking in</b><ul>${p.book.map(b => `<li><b>${fmt(b.qty)}×</b> ${esc(b.l.sku)} · ${esc(b.l.name)}</li>`).join('')}</ul></div>` : '<div class="sub">Nothing is being booked into stock. Only the problems below get reported.</div>'}
    ${notTicked.length ? `<div class="sub">Still to come on this PO: ${notTicked.map(l => `${fmt(l.outstanding - form[l.pid].qty)}× ${esc(l.sku)}`).join(', ')}</div>` : ''}
    ${p.claims.length ? `<div class="claimbox"><b>Problems sent to the office to claim from ${esc(cur.supplier)}</b><ul>${p.claims.map(c => `<li>${c.kind}: <b>${fmt(c.q)}×</b> ${esc(c.l.sku)}</li>`).join('')}</ul></div>` : ''}
    ${cl.length ? `<div class="clears"><b>This clears ${cl.length} waiting order${cl.length === 1 ? '' : 's'}</b><ul>${cl.map(o => `<li><b>${esc(o.no)}</b> ${esc(o.customer)} → ${SCREEN[o.screen]}</li>`).join('')}</ul></div>` : ''}
    <div class="err" id="cerr"></div>
    <div class="row"><button class="big" id="cno">Back</button><button class="big go" id="cyes">${p.book.length ? 'Yes, book into Cin7' : 'Yes, report it'}</button></div>`;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('cno').onclick = closeModal;
  document.getElementById('cyes').onclick = async () => {
    const y = document.getElementById('cyes'), n = document.getElementById('cno');
    y.disabled = n.disabled = true; y.textContent = 'Booking into Cin7…';
    const lines = cur.lines.filter(l => l.outstanding > 0).map(l => { const f = form[l.pid];
      return {pid: l.pid, qty: f.qty, damaged: f.damaged, wrong: f.wrong, over: f.over,
        short: f.short ? Math.max(0, l.outstanding - f.qty - f.damaged - f.wrong) : 0, note: f.note, photos: (f.damaged || f.wrong || f.over || f.short) ? f.photos : []}; });
    let j = {ok:false, error:'No response. Check the connection.'};
    try { const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({k:key, action:'receive', po_id: cur.po_id, loc: site, by: me, lines})}); j = await r.json(); } catch(e){}
    if (j.ok) {
      closeModal(); const po = cur.po_number; closePo();
      toast(`${po} booked in ✓ ${j.booked ? fmt(j.booked) + ' items into stock' : ''}${j.claims ? ` · ${j.claims} problem${j.claims === 1 ? '' : 's'} sent to the office` : ''}${cl.length ? ` · ${cl.length} order${cl.length === 1 ? '' : 's'} now ready` : ''}`);
      load(); return;
    }
    document.getElementById('cerr').innerHTML = `${esc(j.error || 'Something went wrong')}${(j.problems || []).length ? '<br>' + j.problems.map(esc).join('<br>') : ''}`;
    y.disabled = n.disabled = false; y.textContent = 'Try again'; n.textContent = 'Close';
  };
}

document.getElementById('nopo').onclick = () => {
  if (!me) return askName(() => document.getElementById('nopo').click());
  const photos = [];
  document.getElementById('mbox').innerHTML = `<h3>Delivery with no PO</h3>
    <div class="sub">Can't match it to anything on the list? Tell the office. Don't book it in yet.</div>
    <input type="text" id="np_s" placeholder="Supplier / who delivered it">
    <textarea id="np_n" placeholder="What is it? How many? Anything on the delivery note?"></textarea>
    <div class="photos" id="np_ph"><label>📷 Photo of the delivery note / goods<input type="file" accept="image/*" capture="environment" multiple id="np_f"></label></div>
    <div class="err" id="np_e"></div>
    <div class="row"><button class="big" id="np_c">Cancel</button><button class="big go" id="np_ok">Send to office</button></div>`;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('np_c').onclick = closeModal;
  document.getElementById('np_f').onchange = async e => { for (const f of [...e.target.files].slice(0, 4 - photos.length)) { try { photos.push(await shrink(f)); } catch(_){} }
    document.getElementById('np_ph').insertAdjacentHTML('afterbegin', photos.map(p => `<img src="${p}">`).join('')); };
  document.getElementById('np_ok').onclick = async () => {
    const s = document.getElementById('np_s').value.trim(), n = document.getElementById('np_n').value.trim();
    if (!s && !n && !photos.length) { document.getElementById('np_e').textContent = 'Add the supplier, a note or a photo.'; return; }
    document.getElementById('np_ok').disabled = true;
    try { const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({k:key, action:'no_po', loc: site, by: me, supplier: s, note: n, photos})}); const j = await r.json(); if (!j.ok) throw 0;
      closeModal(); toast('Sent to the office. Leave it to one side until they reply.'); }
    catch(e){ document.getElementById('np_e').textContent = "Couldn't send. Check the connection."; document.getElementById('np_ok').disabled = false; }
  };
};

const qEl = document.getElementById('q'); let qT;
qEl.addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { query = qEl.value.trim(); if (data) renderList(); }, 150); });
load();
setInterval(() => { if (!cur && document.getElementById('modal').style.display !== 'flex' && document.activeElement !== qEl) load(); }, 60000);
</script>
<script>
// Self-update: every 2 minutes, check GitHub for a newer copy of this page. If there is one, reload into it
// (waits while a delivery is open, a pop-up is showing, or someone is typing).
(function(){
  const BUILD = '20261026215051';
  const busy = () => { const m = document.getElementById('modal'); const a = document.activeElement;
    return document.body.classList.contains('open') || (m && getComputedStyle(m).display !== 'none') || (a && a.matches && a.matches('input,textarea,select')); };
  let newer = false;
  async function check(){
    try {
      if (!newer) {
        const t = await (await fetch(location.href, {cache:'reload'})).text();
        const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD);
      }
      if (newer && !busy()) location.reload();
    } catch(e){}
  }
  setInterval(check, 120000);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TSD Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#262727; --panel:#323333; --line:#474949; --ink:#FFFFFF; --muted:#B9BCBC;
  --accent:#EED107; --good:#7DDB98; --bad:#FF9B7A;
  --num:'Bebas Neue','DIN Condensed','Arial Narrow',Arial,sans-serif;
  --body:Barlow,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body)}
.label{font-size:20px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--num);font-weight:400;letter-spacing:1px;line-height:.9}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--accent)} .muted{color:var(--muted)}

/* ---------- TV: fixed 1920x1080 stage, scaled to fit the screen ---------- */
#tv{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;padding:36px 56px;display:flex;flex-direction:column;gap:26px}
.tv-head{display:flex;justify-content:space-between;align-items:center}
.tv-head .left{display:flex;align-items:center;gap:30px}
.tv-head img{height:72px}
.tv-title{font-family:var(--num);font-size:56px;line-height:1;letter-spacing:1.5px}
.tv-sub{font-size:22px;color:var(--muted)}
.status{font-size:20px;color:var(--muted);text-align:right}
.row1{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.card{background:var(--panel);border-radius:14px;padding:26px 32px;display:flex;flex-direction:column;gap:10px;min-width:0}
.big{font-size:118px}
.mid{font-size:72px}
.line{font-size:23px}
.span2{grid-column:span 2}
.bar{position:relative;height:30px;background:var(--line);border-radius:999px}
.bar .fill{height:100%;background:var(--accent);border-radius:999px;max-width:100%}
.bar .pace{position:absolute;top:-9px;width:5px;height:48px;background:var(--ink);border-radius:3px}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:24px;flex:1;min-height:0}
.chart{position:relative;flex:1;display:flex;align-items:flex-end;gap:12px;padding-bottom:40px;border-bottom:2px solid var(--line)}
.chart .tline{position:absolute;left:0;right:0;border-top:3px dashed var(--muted)}
.chart .tlabel{position:absolute;right:0;font-size:17px;color:var(--muted);transform:translateY(-120%)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;gap:6px}
.col .v{font-size:16px;font-weight:600;color:var(--muted);white-space:nowrap}
.col .b{width:100%;border-radius:6px 6px 0 0;background:var(--accent)}
.col .b.today{background:var(--ink)}
.col .b.future{border:2px dashed var(--line);background:transparent}
.col .d{position:absolute;bottom:-34px;font-size:17px;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:24px;min-height:0}
.loc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:baseline;font-size:26px}
.foot{display:flex;justify-content:space-between;font-size:22px;color:var(--muted);border-top:2px solid var(--line);padding-top:16px}

/* ---------- Phone ---------- */
#phone{display:none;padding:20px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left));flex-direction:column;gap:12px}
#phone .card{padding:16px 18px;border-radius:12px;gap:6px}
#phone .label{font-size:12px;letter-spacing:1.2px}
#phone .p-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
#phone .p-head img{height:40px}
#phone .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#phone .bar{height:14px} #phone .bar .pace{top:-5px;height:24px;width:3px}
@media (max-width: 900px){ #tv{display:none} #phone{display:flex} }

#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:22px;color:var(--muted)}
</style>
</head>

const gbp = (v, dp=0) => v == null ? '–' : '£' + Number(v).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const gbpk = v => v == null ? '' : '£' + (v/1000).toFixed(1) + 'k';
const pct = v => v == null ? '–' : (v*100).toFixed(1) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day = s => new Date(s + 'T12:00:00');
const wd = s => day(s).toLocaleDateString('en-GB',{weekday:'long'});
const time = s => new Date(s).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

function fit(){
  const tv = document.getElementById('tv');
  const s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  tv.style.transform = `scale(${s})`;
  tv.style.left = ((window.innerWidth - 1920*s)/2) + 'px';
  tv.style.top = ((window.innerHeight - 1080*s)/2) + 'px';
}
window.addEventListener('resize', fit);

function view(d){
  const month = day(d.month).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const todayLong = day(d.today).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  const target = d.target, mtd = d.mtd_sales, pace = d.pace_target;
  const ahead = (pace != null) ? mtd - pace : null;
  const pctDone = target ? Math.min(100, mtd/target*100) : 0;
  const pacePos = target ? Math.min(100, pace/target*100) : 0;
  const lw = d.lastweek_sales, td = d.today_sales;
  const lwPct = lw > 0 ? (td/lw - 1) : null;
  const lwText = d.lastweek_basis === 'same_time' ? `same time last ${wd(d.today)}` : `last ${wd(d.today)} (whole day)`;
  const stale = d.last_synced && (Date.now() - new Date(d.last_synced).getTime()) > 15*60*1000;
  const loading = d.backfill_remaining > 0;
  let status = stale ? `<span class="bad">Not updated since ${time(d.last_synced)} – check the sync</span>`
             : `Updated ${d.last_synced ? time(d.last_synced) : '–'} · refreshes every 2 min`;
  if (loading) status += `<br><span class="warn">Still loading history: ${d.backfill_remaining} orders to go</span>`;
  const q = d.quotes || {count:0,value:0,stale:0};
  return {month, todayLong, target, mtd, pace, ahead, pctDone, pacePos, lw, td, lwPct, lwText, status, q};
}

function lwLine(v, cls){
  if (v.lwPct == null) return `<span class="${cls} muted">No sales ${v.lwText}</span>`;
  const up = v.lwPct >= 0;
  return `<span class="${cls} ${up?'good':'bad'}">${up?'▲':'▼'} ${Math.abs(v.lwPct*100).toFixed(0)}% vs ${v.lwText}</span>`;
}

function renderTV(d, v){
  const days = d.days || [];
  const maxV = Math.max(d.daily_target*1.35 || 1, ...days.map(x => x.sales || 0));
  const H = 330; const sc = H / maxV;
  const tY = Math.round((d.daily_target||0) * sc);
  const cols = days.map(x => {
    const dn = day(x.d).getDate();
    if (x.sales == null) return `<div class="col"><div class="b future" style="height:${tY}px"></div><span class="d">${dn}</span></div>`;
    const isToday = x.d === d.today;
    const h = Math.max(4, Math.round(Math.max(0,x.sales) * sc));
    return `<div class="col"><span class="v">${gbpk(x.sales)}</span><div class="b ${isToday?'today':''}" style="height:${h}px"></div><span class="d">${dn}</span></div>`;
  }).join('');
  const locs = (d.locations||[]).map(l => `<span>${esc(l.name)}</span><span class="num" style="font-size:44px">${gbp(l.sales)}</span>`).join('') || '<span class="muted">No sales yet this month</span>';
  return `
  <div class="tv-head">
    <div class="left"><img src="${LOGO}" alt="Tiling Supplies Direct">
      <div><div class="tv-title">Sales · ${v.month}</div><div class="tv-sub">${v.todayLong} · day ${d.wd_elapsed} of ${d.wd_total} working days</div></div>
    </div>
    <div class="status">${v.status}</div>
  </div>
  <div class="row1">
    <div class="card"><span class="label">Today so far</span><span class="num big">${gbp(v.td)}</span>${lwLine(v,'line')}<span class="line muted">Daily target ${gbp(d.daily_target)} · ${d.today_orders} orders</span></div>
    <div class="card span2">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="label">Month to date</span><span class="line muted">Target <strong style="color:var(--ink)">${gbp(v.target)}</strong></span></div>
      <div style="display:flex;align-items:baseline;gap:26px"><span class="num big">${gbp(v.mtd)}</span><span class="num mid muted">${v.pctDone.toFixed(0)}%</span></div>
      <div class="bar"><div class="fill" style="width:${v.pctDone}%"></div><div class="pace" style="left:calc(${v.pacePos}% - 2px)"></div></div>
      <div style="display:flex;justify-content:space-between" class="line">
        ${v.ahead==null?'<span></span>':`<span class="${v.ahead>=0?'good':'bad'}" style="font-weight:600">${v.ahead>=0?'▲':'▼'} ${gbp(Math.abs(v.ahead))} ${v.ahead>=0?'ahead of':'behind'} pace</span>`}
        <span class="muted">White line = where we should be today · ${gbp(Math.max(0,(v.target||0)-v.mtd))} to go</span>
      </div>
    </div>
    <div class="card"><span class="label">Product margin</span><span class="num big">${pct(d.mtd_margin)}</span><span class="line">Month to date${d.margin_target?` · target ${pct(d.margin_target)}`:''}</span><span class="line muted">Today ${pct(d.today_margin)}</span></div>
  </div>
  <div class="row2">
    <div class="card"><div style="display:flex;justify-content:space-between"><span class="label">Sales by day</span><span class="line muted" style="font-size:19px">Dashed line = daily target</span></div>
      <div class="chart"><div class="tline" style="bottom:${tY+40}px"></div>${cols}</div></div>
    <div class="side">
      <div class="card"><span class="label">Open quotes</span>
        <div style="display:flex;align-items:baseline;gap:22px"><span class="num mid">${v.q.count}</span><span class="num muted" style="font-size:48px">${gbp(v.q.value)}</span></div>
        <span class="line ${v.q.stale?'warn':'muted'}" style="font-weight:600">${v.q.stale} older than 10 days${v.q.stale?' – chase today':''}</span></div>
      <div class="card" style="flex:1"><span class="label">Month to date by site</span><div class="loc">${locs}</div></div>
    </div>
  </div>`;
}

function renderPhone(d, v){
  const locs = (d.locations||[]).map(l => `<div style="display:flex;justify-content:space-between;font-size:16px"><span>${esc(l.name)}</span><strong>${gbp(l.sales)}</strong></div>`).join('');
  return `
  <div class="p-head"><img src="${LOGO}" alt="Tiling Supplies Direct"><div style="text-align:right"><div class="num" style="font-size:30px">Sales · ${v.month}</div><div class="muted" style="font-size:13px">${v.status}</div></div></div>
  <div class="card"><span class="label">Month to date</span>
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="num" style="font-size:52px">${gbp(v.mtd)}</span><span class="muted" style="font-size:14px">of ${gbp(v.target)}</span></div>
    <div class="bar"><div class="fill" style="width:${v.pctDone}%"></div><div class="pace" style="left:calc(${v.pacePos}% - 1px)"></div></div>
    ${v.ahead==null?'':`<span class="${v.ahead>=0?'good':'bad'}" style="font-size:15px;font-weight:600">${v.ahead>=0?'▲':'▼'} ${gbp(Math.abs(v.ahead))} ${v.ahead>=0?'ahead of':'behind'} pace</span>`}
  </div>
  <div class="grid2">
    <div class="card"><span class="label">Today</span><span class="num" style="font-size:38px">${gbp(v.td)}</span>${lwLine(v,'')}</div>
    <div class="card"><span class="label">Margin</span><span class="num" style="font-size:38px">${pct(d.mtd_margin)}</span><span class="muted" style="font-size:13px">Today ${pct(d.today_margin)}</span></div>
    <div class="card"><span class="label">Orders today</span><span class="num" style="font-size:38px">${d.today_orders}</span><span class="muted" style="font-size:13px">Target ${gbp(d.daily_target)}/day</span></div>
    <div class="card"><span class="label">Open quotes</span><span class="num" style="font-size:38px">${v.q.count}</span><span class="${v.q.stale?'warn':'muted'}" style="font-size:13px;font-weight:600">${v.q.stale} need chasing</span></div>
  </div>
  <div class="card"><span class="label">By site</span>${locs || '<span class="muted">No sales yet</span>'}</div>`;
}

async function load(){
  const msg = document.getElementById('msg');
  if (!key){ msg.style.display='flex'; msg.textContent='Open this page using the full dashboard link.'; return; }
  try{
    const r = await fetch(API + '?k=' + encodeURIComponent(key), {cache:'no-store'});
    const d = await r.json();
    if (!r.ok){ msg.style.display='flex'; msg.textContent = d.error || 'Could not load the figures.'; return; }
    msg.style.display='none';
    const v = view(d);
    document.getElementById('tv').innerHTML = renderTV(d, v);
    document.getElementById('phone').innerHTML = renderPhone(d, v);
    fit();
  }catch(e){
    const st = document.querySelector('.status');
    if (st) st.innerHTML = '<span class="bad">Connection lost – retrying</span>';
    else { msg.style.display='flex'; msg.textContent='Could not reach the dashboard – retrying…'; }
  }
}
fit(); load();
setInterval(load, 60*1000);
setTimeout(() => location.reload(), 6*60*60*1000); // pick up page updates a few times a day
</script>
</body>
</html>

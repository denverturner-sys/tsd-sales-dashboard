html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:15px}
.wrap{padding:16px 20px 28px;max-width:1600px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--panel);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{color:var(--muted);font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;vertical-align:bottom}
th.grp{border-bottom:2px solid var(--line);color:var(--ink);letter-spacing:1px}
td.l,th.l{text-align:left}
td.name{font-weight:700}
.seen{font-size:12px;color:var(--muted)}
.seen.old{color:var(--bad)}
input[type=checkbox]{width:20px;height:20px;accent-color:#EED107;cursor:pointer}
.adm{color:var(--accent);font-size:13px;font-weight:700}
input,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px}
textarea{width:100%;min-height:60px;resize:vertical}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer}
.btn.y{background:var(--accent);color:#262727;border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.del{color:var(--bad);border-color:rgba(255,122,107,.5)}
.add{display:grid;grid-template-columns:170px 1fr 150px 120px auto;gap:8px}
@media (max-width:900px){.add{grid-template-columns:1fr 1fr}.add .full{grid-column:1/-1}}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
@media (max-width:600px){.people{grid-template-columns:1fr}}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.ph b{font-size:18px}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.tick{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:transparent;cursor:pointer;flex:none;color:#262727;font-weight:900;line-height:1}
.tick.on{background:var(--good);border-color:var(--good)}
.tb{flex:1;min-width:0} .tt{font-weight:600;word-wrap:break-word} .done .tt{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.meta .late{color:var(--bad);font-weight:700} .meta .today{color:var(--accent);font-weight:700}
.pri{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:1px 5px;margin-right:5px;vertical-align:2px}
.pri.p2{background:var(--bad);color:#262727} .pri.p1{background:var(--accent);color:#262727}
.by{color:var(--blue)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.log{font-size:13px;color:var(--muted);line-height:1.7}
.log b{color:var(--ink)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#mbox{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
#mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:60}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
#msg{padding:40px;text-align:center;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{min-width:220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:#262727;border-color:var(--accent)}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--panel2)} tr.sel td{background:rgba(238,209,7,.12)}
td.n{font-family:var(--num);font-size:20px;letter-spacing:.5px}
td.z{color:#6b6e6e}
.feed td{white-space:normal;vertical-align:top;text-align:left}
.feed td.t{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.kind{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:1px 6px;letter-spacing:.5px}
.kind.change{background:var(--accent);color:#262727} .kind.click{border:1px solid var(--line);color:var(--muted)}
.kind.view{border:1px solid var(--blue);color:var(--blue)} .kind.login{background:var(--blue);color:#262727}
.res.ok{color:var(--good);font-weight:700} .res.bad{color:var(--bad);font-weight:700}
.dt{font-size:12px;color:var(--muted);margin-top:2px}
.ref{font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><div id="msg">Loading…</div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script src="auth.js?v=20261105160435"></script>
<script src="activity.js?v=20261105160435"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/manage';
const TAB = ({ tasks: 'tasks', activity: 'activity', emails: 'emails' })[new URLSearchParams(location.search).get('tab')] || 'users';
const ACT_API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/activity';
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
let token = store.get('tsd_me_token'), D = null, timer, who = store.get('tsd_tt_who') || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy = s => s ? new Date(String(s).slice(0,10) + 'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) : '';
const ago = s => { if (!s) return 'never'; const m = Math.round((Date.now() - new Date(s).getTime()) / 60000); if (m < 2) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return h + ' h ago'; const d = Math.round(h / 24); return d === 1 ? 'yesterday' : d + ' days ago'; };
const when = s => s ? new Date(s).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
const onList = s => { const d = Math.floor((Date.now() - new Date(s).getTime()) / 864e5); return d <= 0 ? 'added today' : `on list ${d} day${d === 1 ? '' : 's'}`; };
function toast(t){ const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 3000); }
function modal(h){ document.getElementById('mbox').innerHTML = h; document.getElementById('modal').style.display = 'flex'; }
function closeModal(){ document.getElementById('modal').style.display = 'none'; }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function showLogin(msg){ clearInterval(timer); document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = msg || ''; }
function start(){ document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block'; refresh(); clearInterval(timer);
  timer = setInterval(() => { if (TAB === 'activity' && AF.day !== londonToday()) return; if (document.getElementById('modal').style.display !== 'flex' && !document.activeElement?.matches('input,textarea,select')) refresh(); }, TAB === 'activity' ? 60000 : 120000); }
async function api(body){
  const r = await fetch(API + (body ? '' : '?view=' + TAB), body ? {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (body && !j.ok) throw new Error(j.error || "Couldn't save");
  if (j.error) throw new Error(j.error);
  return j;
}
async function refresh(){ if (TAB === 'activity') return loadActivity(); try { D = await api(); TAB === 'tasks' ? renderTasks() : TAB === 'emails' ? renderEmails() : renderUsers(); } catch(x){ if (x.message !== 'login') document.getElementById('app').innerHTML = `<div id="msg">${esc(x.message)}</div>`; } }
const poke = () => { try { window.top.postMessage({ tsd: 'tasks' }, location.origin); } catch(e){} };

// ---------------- Users & access ----------------
const GROUPS = [['Sales', ['wbsales']], ['Customer Service', ['backorders','tracking']], ['Warehouse', ['collections','wbcoll','pick','van','barcodes','transfer','stockadj']],
  ['Operations', ['goodsin','stock','purchasing','website']], ['Finance', ['accounts']]];
function renderUsers(){
  const S = new Map(D.screens.map(s => [s.id, s]));
  const groups = GROUPS.map(([g, ids]) => [g, ids.filter(i => S.has(i))]).filter(([, ids]) => ids.length);
  const cols = groups.flatMap(([, ids]) => ids);
  const stale = s => !s || Date.now() - new Date(s).getTime() > 7 * 864e5;
  document.getElementById('app').innerHTML = `
  <header><div><div class="title">Users &amp; access</div>
    <div class="sub">Tick what each person can see. Everyone always gets My Sales, My Tasks, Company and Quotes. Finance and Management are for admins only and can't be ticked. A change shows next time they open or refresh the system.</div></div></header>
  <div class="card scroll"><table>
    <tr><th class="l" rowspan="2">Person</th><th class="l" rowspan="2">Last login</th><th class="l" rowspan="2">Last active</th>${groups.map(([g, ids]) => `<th class="grp" colspan="${ids.length}">${g}</th>`).join('')}</tr>
    <tr>${cols.map(id => `<th title="${esc(S.get(id).note || '')}">${esc(S.get(id).name)}</th>`).join('')}</tr>
    ${D.people.map(p => `<tr><td class="l name">${esc(p.name)}${p.locked ? ' <span class="seen old">locked out</span>' : ''}</td>
      <td class="l"><span class="seen ${stale(p.last_login) ? 'old' : ''}" title="${esc(when(p.last_login))}">${ago(p.last_login)}</span></td>
      <td class="l"><span class="seen" title="${esc(when(p.last_seen))}">${p.last_seen ? ago(p.last_seen) : '–'}</span></td>
      ${p.is_admin ? `<td colspan="${cols.length}" class="adm">Admin: sees every screen, including Finance and Management</td>`
        : cols.map(id => `<td><input type="checkbox" data-e="${esc(p.email)}" data-s="${id}" ${p.screens.includes(id) ? 'checked' : ''} aria-label="${esc(p.name)}: ${esc(S.get(id).name)}"></td>`).join('')}</tr>`).join('')}
  </table>
  <div class="sub" style="margin-top:8px">Pick &amp; Dispatch, Van Team and Collections share one warehouse login behind the scenes, and so do Goods In and Stock: ticking one of a pair hides or shows the tab, but doesn't fence off the other completely.</div></div>
  <div class="card"><div class="k" style="margin-bottom:6px">Recent changes</div>
    <div class="log">${D.log.length ? D.log.map(l => `${esc(when(l.at))}: <b>${esc(l.by)}</b> ${l.granted ? 'gave' : 'took'} <b>${esc(l.who)}</b> ${l.granted ? '' : 'off '}${esc(S.get(l.screen)?.name || l.screen)}`).join('<br>') : 'No changes yet.'}</div></div>`;
  document.querySelectorAll('input[type=checkbox][data-e]').forEach(c => c.onchange = () => {
    const on = c.checked; c.checked = !on;                      // only changes once confirmed
    const p = D.people.find(x => x.email === c.dataset.e), s = S.get(c.dataset.s);
    modal(`<div class="title" style="font-size:26px">${on ? 'Give access?' : 'Remove access?'}</div>
      <div>${on ? 'Give' : 'Take'} <b>${esc(p.name)}</b> ${on ? 'access to' : 'off'} <b>${esc(s.name)}</b>?</div>
      ${s.note ? `<div class="sub">${esc(s.note)}</div>` : ''}
      <div class="sub">They'll see the change next time they open or refresh the system.</div>
      <div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn y" id="ok">Yes, ${on ? 'give access' : 'remove it'}</button></div>`);
    document.getElementById('ok').onclick = async () => {
      try { await api({ action: 'access', email: p.email, screen: s.id, on }); closeModal(); toast(`${p.name}: ${s.name} ${on ? 'on' : 'off'}`); refresh(); }
      catch(x){ toast(x.message); }
    };
  });
}

// ---------------- Emails (5 Nov) ----------------
function renderEmails(){
  const E = D.emails, kname = new Map([...E.map(e => [e.id, e.name]), ['added', 'an extra address']]);
  const all = [...D.people, ...(D.extras || [])];
  document.getElementById('app').innerHTML = `
  <header><div><div class="title">Emails</div>
    <div class="sub">Tick who gets which email. It takes effect from the next one that goes out. Task emails (new task, due today, overdue) always go to whoever has the task and can't be turned off.${D.quote_chase_live ? '' : ' <b style="color:var(--accent)">Quote follow-ups aren\'t switched on yet: ticks are saved ready for when it is.</b>'}</div></div></header>
  <div class="card scroll"><table>
    <tr><th class="l">Person</th>${E.map(e => `<th title="${esc(e.note)}">${esc(e.name)}<div style="font-weight:400;text-transform:none;letter-spacing:0;margin-top:2px">${esc(e.when)}</div></th>`).join('')}</tr>
    ${D.people.map(p => `<tr><td class="l name">${esc(p.name)}${p.is_admin ? ' <span class="adm">admin</span>' : ''}</td>
      ${E.map(e => e.admin && !p.is_admin ? `<td class="z" title="Admins only">–</td>`
        : `<td><input type="checkbox" data-e="${esc(p.email)}" data-k="${e.id}" ${p.on[e.id] ? 'checked' : ''} aria-label="${esc(p.name)}: ${esc(e.name)}"></td>`).join('')}</tr>`).join('')}
    ${(D.extras || []).length ? `<tr><th class="l" colspan="${E.length + 1}" style="padding-top:16px">Other addresses (shared inboxes etc.)</th></tr>` : ''}
    ${(D.extras || []).map(p => `<tr><td class="l name">${esc(p.name)}${p.name !== p.email ? `<div class="seen">${esc(p.email)}</div>` : ''}<button class="btn sm del" data-rm="${esc(p.email)}" style="margin-top:4px">Remove</button></td>
      ${E.map(e => e.admin || e.personal ? `<td class="z" title="Only goes to people with a login">–</td>`
        : `<td><input type="checkbox" data-e="${esc(p.email)}" data-k="${e.id}" ${p.on[e.id] ? 'checked' : ''} aria-label="${esc(p.name)}: ${esc(e.name)}"></td>`).join('')}</tr>`).join('')}
  </table>
  <form id="xf" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px"><span class="k">Add another address</span>
    <input id="xe" type="email" placeholder="e.g. sales@tilingsuppliesdirect.co.uk" required style="min-width:260px"><input id="xl" placeholder="Name (optional), e.g. Sales inbox" maxlength="60" style="min-width:200px">
    <button class="btn y" type="submit">Add</button><span class="sub">Then tick which emails it should get.</span></form>
  <div class="sub" style="margin-top:8px">${E.map(e => `<b>${esc(e.name)}</b>: ${esc(e.note)}.`).join(' ')}</div></div>
  <div class="card"><div class="k" style="margin-bottom:6px">Recent changes</div>
    <div class="log">${D.log.length ? D.log.map(l => `${esc(when(l.at))}: <b>${esc(l.by)}</b> ${l.kind === 'added' ? `${l.granted ? 'added' : 'removed'} <b>${esc(l.who)}</b>` : `turned ${l.granted ? 'on' : 'off'} <b>${esc(kname.get(l.kind) || l.kind)}</b> for <b>${esc(l.who)}</b>`}`).join('<br>') : 'No changes yet.'}</div></div>`;
  document.querySelectorAll('input[type=checkbox][data-k]').forEach(c => c.onchange = async () => {
    const on = c.checked, p = all.find(x => x.email === c.dataset.e), name = kname.get(c.dataset.k);
    c.disabled = true;
    try { await api({ action: 'notify', email: p.email, kind: c.dataset.k, on }); p.on[c.dataset.k] = on; toast(`${p.name}: ${name} ${on ? 'on' : 'off'}`); refresh(); }
    catch(x){ c.checked = !on; toast(x.message); } finally { c.disabled = false; }
  });
  document.getElementById('xf').onsubmit = async ev => {
    ev.preventDefault(); const b = ev.target.querySelector('button'); b.disabled = true;
    try { await api({ action: 'extra_add', email: document.getElementById('xe').value, label: document.getElementById('xl').value }); toast('Added. Now tick what it should get.'); refresh(); }
    catch(x){ toast(x.message); b.disabled = false; }
  };
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    const p = all.find(x => x.email === b.dataset.rm);
    modal(`<div class="title" style="font-size:26px">Remove ${esc(p.name)}?</div><div>It'll stop getting all system emails straight away.</div>
      <div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn y" id="ok">Yes, remove it</button></div>`);
    document.getElementById('ok').onclick = async () => { try { await api({ action: 'extra_remove', email: p.email }); closeModal(); toast('Removed'); refresh(); } catch(x){ toast(x.message); } };
  });
}

// ---------------- Team tasks ----------------
function dueTxt(t){
  if (!t.due) return '';
  if (t.status === 'done') return `<span>due ${dmy(t.due)}</span>`;
  return t.due < D.today ? `<span class="late">overdue · ${dmy(t.due)}</span>` : t.due === D.today ? `<span class="today">due today</span>` : `<span>due ${dmy(t.due)}</span>`;
}
function renderTasks(){
  const people = D.people.filter(p => !who || p.email === who);
  const open = e => D.tasks.filter(t => t.owner === e && t.status === 'open');
  document.getElementById('app').innerHTML = `
  <header><div><div class="title">Team tasks</div>
    <div class="sub">Everyone's lists. Tasks you add show on their list as "Added for you": they never see who added them, and can tick them off but not delete them. Change priority or deadline to re-order someone's day.</div></div>
    <select id="who"><option value="">Everyone</option>${D.people.map(p => `<option value="${esc(p.email)}" ${p.email === who ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></header>
  <div class="card"><div class="k" style="margin-bottom:8px">Give someone a task</div>
    <form class="add" id="af"><select id="aw" required><option value="">Who?</option>${D.people.map(p => `<option value="${esc(p.email)}" ${p.email === who ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
      <input class="full" id="at" placeholder="What needs doing?" maxlength="200" required><input type="date" id="ad" title="Deadline (optional)">
      <select id="ap"><option value="0">Normal</option><option value="1">High</option><option value="2">Urgent</option></select><button class="btn y" type="submit">Add</button>
      <textarea class="full" id="an" placeholder="Notes for them (optional)" maxlength="2000" style="grid-column:1/-1;min-height:44px"></textarea></form></div>
  <div class="people">${people.map(p => { const o = open(p.email), late = o.filter(t => t.due && t.due < D.today).length, done = D.tasks.filter(t => t.owner === p.email && t.status === 'done');
    return `<div class="card"><div class="ph"><b>${esc(p.name)}</b><span class="sub">${o.length} open${late ? ` · <b style="color:var(--bad)">${late} overdue</b>` : ''}${done.length ? ` · ${done.length} done in 2 weeks` : ''}</span></div>
      ${o.length ? o.map(row).join('') : '<div class="empty">Nothing open.</div>'}
      ${done.length ? `<details style="margin-top:6px"><summary class="sub" style="cursor:pointer">Done recently</summary>${done.map(row).join('')}</details>` : ''}</div>`; }).join('')}</div>`;
  document.getElementById('who').onchange = e => { who = e.target.value; store.set('tsd_tt_who', who); renderTasks(); };
  document.getElementById('af').onsubmit = async e => {
    e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true;
    try { await api({ action: 'task_add', email: document.getElementById('aw').value, title: document.getElementById('at').value, due: document.getElementById('ad').value, priority: document.getElementById('ap').value, notes: document.getElementById('an').value });
      toast('Added to their list'); poke(); refresh(); } catch(x){ toast(x.message); b.disabled = false; }
  };
  document.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => { try { await api({ action: 'task_done', id: +b.dataset.done, on: b.dataset.on === '1' }); poke(); refresh(); } catch(x){ toast(x.message); } });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(D.tasks.find(t => t.id === +b.dataset.edit)));
}
function row(t){
  const done = t.status === 'done';
  return `<div class="task ${done ? 'done' : ''}"><button class="tick ${done ? 'on' : ''}" data-done="${t.id}" data-on="${done ? 0 : 1}">${done ? '✓' : ''}</button>
    <div class="tb"><div class="tt">${t.priority ? `<span class="pri p${t.priority}">${t.priority === 2 ? 'URGENT' : 'HIGH'}</span>` : ''}${esc(t.title)}</div>
      <div class="meta">${dueTxt(t)}<span>${done ? 'done ' + dmy(t.done_at) : onList(t.created_at)}</span><span class="by">${t.added_by ? 'added by ' + esc(t.added_by) : 'their own'}</span></div></div>
    <button class="btn sm" data-edit="${t.id}">Edit</button></div>`;
}
function edit(t){
  modal(`<div class="title" style="font-size:26px">${esc(t.owner_name)}'s task</div>
    <input id="et" value="${esc(t.title)}" maxlength="200">
    <div style="display:flex;gap:8px"><input type="date" id="ed" value="${esc(t.due || '')}" style="flex:1"><select id="ep" style="flex:1">${['Normal','High','Urgent'].map((n, i) => `<option value="${i}" ${t.priority === i ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <textarea id="en" placeholder="Notes" maxlength="2000">${esc(t.notes || '')}</textarea>
    <div class="sub">${t.added_by ? 'Added by ' + esc(t.added_by) : esc(t.owner_name) + ' added this themselves'} · ${esc(when(t.created_at))}</div>
    <div class="row"><button class="btn del" id="edel" style="margin-right:auto">Delete</button><button class="btn" onclick="closeModal()">Cancel</button><button class="btn y" id="esave">Save</button></div>`);
  document.getElementById('esave').onclick = async () => {
    try { await api({ action: 'task_edit', id: t.id, title: document.getElementById('et').value, due: document.getElementById('ed').value, priority: document.getElementById('ep').value, notes: document.getElementById('en').value }); closeModal(); poke(); refresh(); }
    catch(x){ toast(x.message); }
  };
  document.getElementById('edel').onclick = async () => {
    if (!confirm(`Delete this task from ${t.owner_name}'s list?`)) return;
    try { await api({ action: 'task_delete', id: t.id }); closeModal(); poke(); refresh(); } catch(x){ toast(x.message); }
  };
}
// ---------------- Activity log ----------------
// Who opened what, clicked what, and every change sent to Bob (with whether it worked). Logins are recorded by the server.
const londonToday = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/London' });
const AF = { day: londonToday(), who: store.get('tsd_al_who') || '', kind: store.get('tsd_al_kind') || '', q: '' };
let A = null, shown = 300, qTimer;
const KINDS = [['', 'Everything'], ['change', 'Changes'], ['failed', 'Failed'], ['click', 'Clicks'], ['view', 'Screens opened'], ['login', 'Logins']];
const ON = d => d.on === true || d.on === 'true';
const WHAT = {
  'warehouse:fulfil': d => d.van ? 'Fulfilled order (van)' : (d.part === true || d.part === 'true') ? 'Sent part of an order' : 'Fulfilled order' + (d.label ? ' and booked a label' : ''),
  'warehouse:stock': () => "Reported can't find stock", 'warehouse:stock_found': () => 'Found the missing stock',
  'warehouse:priority': d => ON(d) ? 'Flagged as priority' : 'Took off priority', 'warehouse:van_add': () => 'Added an order to the van',
  'warehouse:tp_push': () => 'Sent to Track-POD',
  'goods-in:receive': () => 'Booked in a PO', 'goods-in:no_po': () => 'Booked in goods with no PO',
  'purchasing:bo_contact': () => 'Logged contact with a backorder customer', 'purchasing:claim_update': () => 'Updated a supplier claim',
  'purchasing:draft_po': () => 'Drafted a PO', 'purchasing:follow_up': () => 'Logged a supplier follow-up',
  'purchasing:issue_close': () => "Closed a can't-find issue", 'purchasing:po_expected': () => 'Set a PO expected date',
  'quotes:follow': () => 'Logged a quote follow-up',
  'accounts:add_payment': () => 'Added a payment', 'accounts:chase': () => 'Logged a credit-control chase', 'accounts:done': () => 'Marked done',
  'accounts:undone': () => 'Marked not done', 'accounts:invoice': () => 'Invoiced an order',
  'web:suggest_dismiss': () => 'Dismissed a product suggestion', 'web:todo_add': () => 'Added a website to-do', 'web:todo_status': () => 'Changed a website to-do',
  'web:todo_move': () => 'Moved a website to-do', 'web:todo_remove': () => 'Removed a website to-do', 'web:todo_bump': () => 'Bumped a website to-do', 'web:todo_unbump': () => 'Un-bumped a website to-do',
  'tasks:add': () => 'Added a task', 'tasks:edit': () => 'Edited a task', 'tasks:done': d => ON(d) ? 'Ticked off a task' : 'Reopened a task', 'tasks:delete': () => 'Deleted a task',
  'manage:access': d => `${ON(d) ? 'Gave' : 'Took'} ${d.person || d.email || 'someone'} ${ON(d) ? 'access to' : 'off'} ${SCREEN_NAMES[d.screen] || d.screen || 'a screen'}`,
  'manage:task_add': d => `Gave ${d.person || d.email || 'someone'} a task`, 'manage:task_edit': () => "Edited someone's task",
  'manage:task_done': d => ON(d) ? "Ticked off someone's task" : "Reopened someone's task", 'manage:task_delete': () => "Deleted someone's task",
  'me:logout': () => 'Logged out', 'me:set_pin': () => 'Changed their PIN', 'me:add': () => 'Added a task',
  'me:admin_pin': d => `${d.what === 'reset' ? 'Reset' : 'Unlocked'} ${d.name || 'someone'}'s PIN`,
};
const SCREEN_NAMES = { wbsales: 'WB Sales', backorders: 'Backorders', tracking: 'Tracking', collections: 'Collections', wbcoll: 'WB Collections', pick: 'Pick & Dispatch',
  van: 'Van Team', transfer: 'Transfers', stockadj: 'Adjustments', barcodes: 'Scan barcodes', goodsin: 'Goods In', stock: 'Stock', purchasing: 'Purchasing', website: 'Website', accounts: 'Accounts' };
const HIDE = new Set(['id', 'sale_id', 'po_id', 'email', 'on', 'person', 'loc', 'by', 'v', 'pick', 'fulfil', 'van', 'part', 'what', 'name', 'screen']);
function what(r){
  const d = r.detail || {};
  if (r.kind === 'click') return `Clicked <b>${esc(r.action)}</b>`;
  if (r.kind !== 'change') return esc(r.action);
  const f = WHAT[r.fn + ':' + r.action] || (r.fn === 'note' ? () => 'Added a note' : null);
  return f ? esc(f(d)) : `${esc(r.fn)}: ${esc(r.action)}`;
}
function extra(r){
  const d = r.detail || {};
  if (r.kind !== 'change') return '';
  const bits = [d.customer, d.supplier].filter(Boolean).map(esc);
  for (const [k, v] of Object.entries(d)) if (!HIDE.has(k) && k !== 'customer' && k !== 'supplier' && v !== true && v !== false) bits.push(`${esc(k.replace(/_/g, ' '))}: ${esc(v)}`);
  return bits.length ? `<div class="dt">${bits.slice(0, 5).join(' · ')}</div>` : '';
}
async function loadActivity(){
  const u = new URLSearchParams({ day: AF.day }); if (AF.who) u.set('who', AF.who); if (AF.kind) u.set('kind', AF.kind); if (AF.q) u.set('q', AF.q);
  try {
    const r = await fetch(ACT_API + '?' + u, { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
    if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); return; }
    const j = await r.json().catch(() => ({}));
    if (j.error) throw new Error(j.error);
    A = j; renderActivity();
  } catch(x){ document.getElementById('app').innerHTML = `<div id="msg">${esc(x.message)}</div>`; }
}
function shiftDay(n){ const d = new Date(AF.day + 'T12:00:00'); d.setDate(d.getDate() + n); AF.day = d.toISOString().slice(0, 10); shown = 300; loadActivity(); }
function renderActivity(){
  const hasFocus = document.activeElement && document.activeElement.id === 'aq';
  const isToday = AF.day === A.today;
  const people = [...new Set([...(A.people || []), ...A.summary.map(s => s.who)])].sort();
  const num = v => `<td class="n ${v ? '' : 'z'}">${v || 0}</td>`;
  const span = s => { const t = x => new Date(x).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); return `${t(s.first)}–${t(s.last)}`; };
  const rows = A.rows.slice(0, shown);
  document.getElementById('app').innerHTML = `
  <header><div><div class="title">Activity log</div>
    <div class="sub">Who logged in, which screens they opened, what they clicked, and every change they made in the system, with whether it worked. The shared warehouse password login can't say which person it is, so it shows as "Shared warehouse login" with a tag for each PC. Kept for 6 months.</div></div>
    <div class="filters"><button class="btn sm" id="dprev" title="Day before">‹</button><input type="date" id="aday" value="${esc(AF.day)}" max="${esc(A.today)}"><button class="btn sm" id="dnext" ${isToday ? 'disabled' : ''} title="Day after">›</button>
      ${isToday ? '' : '<button class="btn sm" id="dtoday">Today</button>'}</div></header>
  <div class="card scroll"><div class="k" style="margin-bottom:6px">${isToday ? 'Today' : esc(dmy(AF.day))} by person <span style="text-transform:none;letter-spacing:0;font-weight:400">· tap a row to see just them</span></div>
    ${A.summary.length ? `<table><tr><th class="l">Person</th><th class="l">Active</th><th>Logins</th><th>Changes made</th><th>Failed</th><th>Orders fulfilled</th><th>POs booked in</th><th>Clicks</th><th>Screens opened</th></tr>
      ${A.summary.map(s => `<tr class="pick ${s.who === AF.who ? 'sel' : ''}" data-who="${esc(s.who)}"><td class="l name">${esc(s.who)}${s.devices > 1 ? ` <span class="seen">${s.devices} PCs</span>` : ''}</td><td class="l seen">${span(s)}</td>
        ${num(s.logins)}${num(s.changes)}<td class="n ${s.failed ? '' : 'z'}" style="${s.failed ? 'color:var(--bad)' : ''}">${s.failed || 0}</td>${num(s.fulfilled)}${num(s.booked_in)}${num(s.clicks)}${num(s.views)}</tr>`).join('')}</table>`
      : `<div class="empty">Nothing recorded ${isToday ? 'yet today' : 'that day'}.</div>`}</div>
  <div class="card">
    <div class="filters" style="justify-content:space-between;margin-bottom:10px">
      <div class="chips">${KINDS.map(([k, n]) => `<button class="chip ${AF.kind === k ? 'on' : ''}" data-k="${k}">${n}</button>`).join('')}</div>
      <div class="filters"><select id="awho"><option value="">Everyone</option>${people.map(p => `<option ${p === AF.who ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>
        <input type="search" id="aq" placeholder="Search: order no., customer, button…" value="${esc(AF.q)}"></div></div>
    ${rows.length ? `<div class="scroll"><table class="feed"><tr><th class="l">Time</th><th class="l">Who</th><th class="l">Screen</th><th class="l">What</th><th class="l">Order / PO</th><th class="l">Result</th></tr>
      ${rows.map(r => `<tr><td class="t">${new Date(r.at).toLocaleTimeString('en-GB')}</td>
        <td><b>${esc(r.who)}</b>${r.device ? `<div class="dt">${esc(r.device)}</div>` : ''}</td>
        <td>${esc(r.screen || '')}</td>
        <td><span class="kind ${r.kind}">${({ change: 'CHANGE', click: 'CLICK', view: 'SCREEN', login: 'LOGIN' })[r.kind]}</span> ${what(r)}${extra(r)}</td>
        <td class="ref">${esc(r.ref || '')}</td>
        <td>${r.kind === 'change' ? (r.ok ? '<span class="res ok">✓ worked</span>' : `<span class="res bad">✗ failed</span><div class="dt">${esc(r.err || '')}</div>`) : ''}</td></tr>`).join('')}</table></div>
      ${A.rows.length > shown ? `<button class="btn" id="amore" style="margin-top:10px">Show more (${A.rows.length - shown} more)</button>` : ''}
      ${A.total > A.rows.length ? `<div class="sub" style="margin-top:8px">Showing the latest ${A.rows.length} of ${A.total}. Pick a person or a type to narrow it down.</div>` : ''}`
      : '<div class="empty">Nothing matches.</div>'}</div>`;
  document.getElementById('aday').onchange = e => { if (e.target.value) { AF.day = e.target.value; shown = 300; loadActivity(); } };
  document.getElementById('dprev').onclick = () => shiftDay(-1);
  document.getElementById('dnext').onclick = () => shiftDay(1);
  const dt = document.getElementById('dtoday'); if (dt) dt.onclick = () => { AF.day = londonToday(); shown = 300; loadActivity(); };
  document.querySelectorAll('tr.pick').forEach(tr => tr.onclick = () => { AF.who = AF.who === tr.dataset.who ? '' : tr.dataset.who; store.set('tsd_al_who', AF.who); shown = 300; loadActivity(); });
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { AF.kind = b.dataset.k; store.set('tsd_al_kind', AF.kind); shown = 300; loadActivity(); });
  document.getElementById('awho').onchange = e => { AF.who = e.target.value; store.set('tsd_al_who', AF.who); shown = 300; loadActivity(); };
  const q = document.getElementById('aq');
  q.oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => { AF.q = q.value.trim(); shown = 300; loadActivity(); }, 400); };
  if (hasFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  const more = document.getElementById('amore'); if (more) more.onclick = () => { shown += 300; renderActivity(); };
}
if (TAB === 'activity') window.TSD_SCREEN = 'Activity log';

if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });
</script>
<script>
(function(){
  const BUILD = '20261105160435';
  const busy = () => { const m = document.getElementById('modal'); const a = document.activeElement; return (m && getComputedStyle(m).display !== 'none') || (a && a.matches && a.matches('input,textarea,select')); };
  let newer = false;
  async function check(){ try { if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); } if (newer && !busy()) location.reload(); } catch(e){} }
  setInterval(check, 120000);
})();
</script>

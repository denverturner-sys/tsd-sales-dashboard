<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#262727">
<title>My Sales · TSD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#262727; --panel:#323333; --panel2:#3B3C3C; --line:#474949; --ink:#FFFFFF; --muted:#B9BCBC;
  --accent:#EED107; --good:#7DDB98; --bad:#FF9B7A;
  --num:'Bebas Neue','DIN Condensed','Arial Narrow',Arial,sans-serif;
  --body:Barlow,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
button,input,select{font-family:inherit;font-size:16px}
.num{font-family:var(--num);letter-spacing:1px;line-height:.95;font-weight:400}
.label{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
header .l{display:flex;align-items:center;gap:18px}
header img{height:46px}
.title{font-family:var(--num);font-size:34px;letter-spacing:1px;line-height:1}
.sub{font-size:14px;color:var(--muted)}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
select,.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn:hover,select:hover{border-color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.card{background:var(--panel);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:960px){ .c3,.c4{grid-column:span 6} .c5,.c6,.c7,.c8{grid-column:span 12} }
@media (max-width:600px){ .c3,.c4{grid-column:span 12} }
.big{font-size:64px}.mid{font-size:44px}.sm{font-size:28px}
.bar{position:relative;height:14px;background:var(--line);border-radius:999px;margin-top:6px}
.bar .fill{height:100%;background:var(--accent);border-radius:999px;max-width:100%}
.bar .mark{position:absolute;top:-6px;width:3px;height:26px;background:var(--ink);border-radius:2px}
.chart{position:relative;height:190px;display:flex;align-items:flex-end;gap:6px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-top:8px}
.chart .tline{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);z-index:1}
.chart .tlab{position:absolute;right:0;font-size:12px;color:var(--muted);transform:translateY(-120%)}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.col .b{width:100%;border-radius:4px 4px 0 0;background:var(--accent)}
.col .b.today{background:var(--ink)} .col .b.future{border:1px dashed var(--line);background:transparent}
.col .d{position:absolute;bottom:-20px;font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:4px;white-space:nowrap}
.p2{background:var(--accent);color:#262727}.p5{background:var(--ink);color:#262727}.p10{background:var(--bad);color:#262727}
.callout{background:var(--panel2);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.5}
.callout b{color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.funnel{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 6px}
.funnel>div:not(.arrow){display:flex;flex-direction:column;gap:2px;min-width:110px}
.funnel .muted{font-size:13px}
.funnel .arrow{color:var(--muted);font-size:22px}
@media (max-width:600px){.funnel .arrow{display:none}.funnel>div:not(.arrow){min-width:40%}}
footer{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.6}
/* login */
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
#login form{background:var(--panel);border-radius:14px;padding:28px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
#login img{height:54px;align-self:flex-start}
#login input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px}
#login input:focus{outline:2px solid var(--accent);border-color:transparent}
#login button{background:var(--accent);color:#262727;border:0;border-radius:8px;padding:12px;font-weight:700;cursor:pointer}
#err{color:var(--bad);font-size:14px;min-height:18px}
#app{display:none}
#tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0;max-width:1900px;margin:0 auto;border-bottom:1px solid var(--line)}
#tabs button{background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer}
#tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
#tabs button:hover{color:var(--ink)}
.framepane{display:none} .framepane iframe{display:block;width:100%;height:calc(100vh - 52px);border:0;background:var(--bg)}
#app.tabbed{max-width:none;padding:0} #app.tabbed #salesPane{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
</style>
</head>

const pct = v => v == null ? '–' : (v*100).toFixed(1) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy = s => { const d = new Date(s + 'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };

function showLogin(msg){
  clearInterval(timer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('err').textContent = msg || '';
}
document.getElementById('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = 'Checking…';
  try {
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'login', email: document.getElementById('em').value, pin: document.getElementById('pin').value})});
    const j = await r.json();
    if (!j.ok) { err.textContent = j.error || 'Login failed'; return; }
    token = j.token; store.set('tsd_me_token', token);
    document.getElementById('pin').value = '';
    load(); timer = setInterval(load, 120000);
  } catch(x) { err.textContent = "Can't reach the server. Check your connection."; }
});

async function logout(){
  try { await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'logout', token})}); } catch(e){}
  token = null; store.del('tsd_me_token'); const a = document.getElementById('app'); a.innerHTML = ''; a.classList.remove('tabbed'); showLogin();
}

async function load(){
  if (!token) return showLogin();
  try {
    const r = await fetch(API + (viewAs ? '?as=' + encodeURIComponent(viewAs) : ''), {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
    if (r.status === 401) { token = null; store.del('tsd_me_token'); return showLogin('Please log in again.'); }
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    render(j);
  } catch(x) {
    const app = document.getElementById('app');
    if (!app.innerHTML) { app.style.display='block'; app.innerHTML = '<p class="muted">Couldn\'t load your figures. Retrying shortly.</p>'; }
  }
}

let activeTab = (() => { try { return localStorage.getItem('tsd_me_tab') || 'sales'; } catch(e){ return 'sales'; } })();
function ensureShell(j){
  const app = document.getElementById('app');
  if (document.getElementById('salesPane')) return;
  const screens = j.screens || [];
  if (!screens.length) { app.innerHTML = '<div id="salesPane"></div>'; return; }
  app.classList.add('tabbed');
  app.innerHTML = `<nav id="tabs"><button data-t="sales">My sales</button>${screens.map(sc => `<button data-t="${esc(sc.id)}">${esc(sc.name)}</button>`).join('')}</nav>
    <div id="salesPane"></div>${screens.map(sc => `<div class="framepane" id="pane-${esc(sc.id)}" data-src="${esc(sc.url)}"></div>`).join('')}`;
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => showTab(b.dataset.t));
  if (!screens.some(sc => sc.id === activeTab)) activeTab = 'sales';
  showTab(activeTab);
}
function showTab(t){
  activeTab = t; try { localStorage.setItem('tsd_me_tab', t); } catch(e){}
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const sp = document.getElementById('salesPane'); if (sp) sp.style.display = t === 'sales' ? '' : 'none';
  document.querySelectorAll('.framepane').forEach(p => {
    const on = p.id === 'pane-' + t;
    if (on && !p.firstChild) p.innerHTML = `<iframe src="${p.dataset.src}" title="${t}"></iframe>`;
    p.style.display = on ? 'block' : 'none';
  });
}

function render(j){
  const d = j.data;
  document.getElementById('login').style.display = 'none';
  const app = document.getElementById('app'); app.style.display = 'block';
  const month = new Date(d.month + 'T00:00:00').toLocaleDateString('en-GB',{month:'long', year:'numeric'});
  const today = new Date(d.today + 'T00:00:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
  const hasT = d.target != null;
  const diff = hasT ? d.mtd_sales - d.pace_target : null;
  const togo = hasT ? Math.max(d.target - d.mtd_sales, 0) : null;
  const wdLeft = Math.max(d.wd_total - d.wd_elapsed + (d.days.find(x=>x.d===d.today && x.sales===0) ? 1 : 0), 0);
  const fillPct = hasT && d.target > 0 ? Math.min(d.mtd_sales / d.target * 100, 100) : 0;
  const pacePct = hasT && d.wd_total ? d.wd_elapsed / d.wd_total * 100 : 0;
  const aov = d.mtd_orders ? d.mtd_sales / d.mtd_orders : null;
  const mGap = d.mtd_margin != null ? d.mtd_margin - d.margin_target : null;
  const repOnePct = d.rep_annual_sales ? Math.round(d.rep_annual_sales * 0.01) : null;
  const conv = d.conversion || {};
  const ob = d.outbound;
  const convRate = conv.quoted ? conv.won / conv.quoted : null;

  // daily chart
  const vals = d.days.map(x => x.sales || 0);
  const maxV = Math.max(...vals, d.daily_target || 0, 1) * 1.1;
  const bars = d.days.map(x => {
    const fut = x.sales == null, isT = x.d === d.today;
    const h = fut ? (d.daily_target ? d.daily_target / maxV * 100 : 0) : Math.max((x.sales||0) / maxV * 100, x.sales ? 1 : 0);
    const day = new Date(x.d + 'T00:00:00').getDate();
    return `<div class="col" title="${dmy(x.d)}: ${fut ? 'to come' : gbp(x.sales)}"><div class="b ${fut?'future':''} ${isT?'today':''}" style="height:${h}%"></div><span class="d">${day}</span></div>`;
  }).join('');
  const tline = d.daily_target ? `<div class="tline" style="bottom:${22 + (d.daily_target/maxV)*168}px"></div>` : '';

  const people = j.people ? `<select id="as" aria-label="View dashboard for">${j.people.map(p => `<option value="${esc(p.rep)}" ${p.name===j.viewing?'selected':''}>${esc(p.name)}</option>`).join('')}</select>` : '';

  const chase = (d.chase||[]).map(q => {
    const cls = q.stage==='Day 2'?'p2':q.stage==='Day 5'?'p5':'p10';
    const act = q.stage==='Day 2'?'Call':q.stage==='Day 5'?'Email + call':'Final chase';
    return `<tr><td><span class="pill ${cls}">${q.stage.toUpperCase()}</span></td><td><b>${esc(q.customer)}</b><br><span class="muted" style="font-size:12px">${esc(q.quote)} · ${act}</span></td><td class="r"><b>${gbp(q.value)}</b></td><td style="font-size:13px">${esc([q.contact,q.phone].filter(Boolean).join(' · ') || '–')}</td></tr>`;
  }).join('');
  const tops = (d.top_customers||[]).map((c,i) => `<tr><td class="muted">${i+1}</td><td><b>${esc(c.customer)}</b></td><td class="r muted">${c.orders} order${c.orders===1?'':'s'}</td><td class="r"><b>${gbp(c.sales)}</b></td></tr>`).join('');
  const quiet = (d.quiet||[]).map(c => `<tr><td><b>${esc(c.customer)}</b></td><td>${dmy(c.last_order)}<br><span class="bad" style="font-size:12px;font-weight:700">${c.days_since} days ago</span></td><td class="muted">every ~${c.usual_gap} days</td><td class="r"><b>${gbp(c.spend)}</b></td></tr>`).join('');

  ensureShell(j);
  document.getElementById('salesPane').innerHTML = `
  <header>
    <div class="l"><img src="${LOGO}" alt="TSD"><div><div class="title">${esc(j.viewing)} · ${esc(month)}</div><div class="sub">${esc(today)} · day ${d.wd_elapsed} of ${d.wd_total}</div></div></div>
    <div class="hright">${people}<button class="btn" id="lo">Log out</button></div>
  </header>
  <div class="grid">
    <div class="card c5">
      <span class="label">My month so far</span>
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <span class="num big">${gbp(d.mtd_sales)}</span>
        <span class="muted">${hasT ? 'of ' + gbp(d.target) + (d.month==='2026-10-01' ? ' · trial month' : '') : 'No target'}</span>
      </div>
      ${hasT ? `<div class="bar"><div class="fill" style="width:${fillPct}%"></div><div class="mark" style="left:${pacePct}%"></div></div>
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px">
        <span class="${diff>=0?'good':'bad'}" style="font-weight:700">${diff>=0?'▲':'▼'} ${gbp(Math.abs(diff))} ${diff>=0?'ahead of':'behind'} pace</span>
        <span class="muted">${gbp(togo)} to go${wdLeft ? ' · ' + gbp(togo / wdLeft) + '/day' : ''}</span>
      </div>` : ''}
    </div>
    <div class="card c3">
      <span class="label">Today</span>
      <span class="num mid">${gbp(d.today_sales)}</span>
      <span class="muted" style="font-size:14px">${d.today_orders} order${d.today_orders===1?'':'s'} · last week ${gbp(d.lastweek_sales)}</span>
      ${d.daily_target ? `<span class="muted" style="font-size:14px">Daily target ${gbp(d.daily_target)}</span>` : ''}
    </div>
    <div class="card c4">
      <span class="label">Orders this month</span>
      <span class="num mid">${d.mtd_orders}</span>
      <span class="muted" style="font-size:14px">Average order ${gbp(aov)}</span>
    </div>

    <div class="card c7">
      <span class="label">My sales by day</span>
      <div class="chart">${tline}${d.daily_target?`<span class="tlab" style="bottom:${22 + (d.daily_target/maxV)*168}px">daily target ${gbp(d.daily_target)}</span>`:''}${bars}</div>
    </div>
    <div class="card c5">
      <span class="label">My margin this month</span>
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
        <span class="num big ${mGap==null?'':mGap>=0?'good':'warn'}">${pct(d.mtd_margin)}</span>
        <span class="muted">target ${pct(d.margin_target)}${d.today_margin!=null ? ' · today ' + pct(d.today_margin) : ''}</span>
      </div>
      <div class="callout">Every <b>1% of margin</b> across a year on our <b>£5.2m</b> turnover is <b>${gbp(d.company_one_pct)}</b> straight to the bottom line.${repOnePct ? ` On your own sales it's about <b>${gbp(repOnePct)}</b> a year.` : ''} Think twice before discounting just because someone asked.</div>
    </div>

    <div class="card c7">
      <span class="label">My quotes to chase today</span>
      ${chase ? `<div style="overflow-x:auto"><table><thead><tr><th>Stage</th><th>Customer</th><th class="r">Value</th><th>Contact</th></tr></thead><tbody>${chase}</tbody></table></div>` : '<div class="empty">Nothing due a chase today. Nice.</div>'}
    </div>
    <div class="card c5">
      <span class="label">My quotes</span>
      <div style="display:flex;gap:26px;flex-wrap:wrap">
        <div><span class="num mid">${d.quotes.count}</span><div class="muted" style="font-size:13px">live (last 30 days)<br>${gbp(d.quotes.value)}</div></div>
        <div><span class="num mid">${convRate==null?'–':Math.round(convRate*100)+'%'}</span><div class="muted" style="font-size:13px">converted<br>${conv.quoted ? `${conv.won} of ${conv.quoted} quotes, 1–8 weeks old` : 'no quotes in that window'}</div></div>
      </div>
    </div>

    <div class="card c6">
      <span class="label">My top customers this month</span>
      ${tops ? `<table><tbody>${tops}</tbody></table>` : '<div class="empty">No orders yet this month.</div>'}
    </div>
    <div class="card c6">
      <span class="label">My regulars who've gone quiet</span>
      ${quiet ? `<table><thead><tr><th>Customer</th><th>Last order</th><th>Usually</th><th class="r">Since July</th></tr></thead><tbody>${quiet}</tbody></table>` : '<div class="empty">None of your regulars are overdue. Good.</div>'}
    </div>

    ${ob ? `<div class="card c12">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
        <span class="label">My outbound calls this month</span>
        <span class="muted" style="font-size:13px">${ob.calls_week} logged this week</span>
      </div>
      <div class="funnel">
        <div><span class="num mid">${ob.calls_month}</span><span class="muted">calls logged</span></div>
        <div class="arrow">→</div>
        <div><span class="num mid">${ob.quotes_month}</span><span class="muted">quotes · ${gbp(ob.quotes_value)}</span></div>
        <div class="arrow">→</div>
        <div><span class="num mid">${ob.orders_month}</span><span class="muted">orders · ${gbp(ob.sales_month)}</span></div>
        <div class="arrow">→</div>
        <div><span class="num mid warn">${ob.new_accounts_month}</span><span class="muted">brand new accounts</span></div>
        <div><span class="num mid">${ob.won_back_month ?? 0}</span><span class="muted">won back</span></div>
      </div>
      <div class="callout">${ob.calls_month ? `Calls only count when they turn into something. These are quotes and orders from customers who were brand new, or hadn't ordered in 60+ days (checked against Sage too), after you called them${ob.own_share != null ? `. <b>${pct(ob.own_share)}</b> of your own sales this month came from them` : ''}.` : `No outbound calls logged in HubSpot this month. Log them and the quotes, orders and new accounts they bring in will show up here.`}</div>
    </div>` : ''}
  </div>
  <footer>Your sales are orders you raised in Cin7 (authorised, ex VAT, less credit notes). Margin is product margin on those orders. Outbound uses calls logged in HubSpot, matched to Cin7 customers. Updates every 2 minutes.${d.backfill_remaining > 200 ? ' Still loading older history, so some figures may be incomplete for a little while.' : ''}</footer>`;

  document.getElementById('lo').onclick = logout;
  const sel = document.getElementById('as');
  if (sel) sel.onchange = () => { viewAs = sel.value; load(); };
}

if (token) { load(); timer = setInterval(load, 120000); } else showLogin();
</script>
</body>
</html>

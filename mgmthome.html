.wrap{padding:18px 20px 30px;max-width:1300px;margin:0 auto}
h1{font-family:var(--num);font-size:42px;letter-spacing:1px;margin:0;line-height:1}
.sub{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tile .k{color:var(--muted);font-size:15px;font-weight:600}
.tile .n{font-family:var(--num);font-size:72px;line-height:1;margin:4px 0}
.tile .s{color:var(--muted);font-size:14px}
.tile.bad{border-color:var(--bad)}.tile.bad .n{color:var(--bad)}.tile.good .n{color:var(--good)}.tile.y .n{color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h2{font-family:var(--num);font-size:26px;letter-spacing:.5px;margin:0 0 8px;font-weight:400}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}.bar .l{flex:0 0 38%;font-size:15px}.bar .b{flex:1;background:var(--panel2);border-radius:6px;height:22px;overflow:hidden;position:relative}.bar .b i{display:block;height:100%;background:var(--accent)}.bar .v{flex:0 0 64px;text-align:right;font-weight:700;font-size:15px}
.pace{position:absolute;top:0;bottom:0;width:2px;background:#fff}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.row:first-of-type{border-top:0}
.row b{font-weight:700}.bad{color:var(--bad);font-weight:700}.good{color:var(--good);font-weight:700}.m{color:var(--muted)}
.empty{color:var(--muted);padding:6px 0}.note{color:var(--muted);font-size:13px;margin-top:14px}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;background:var(--panel2);font-size:12px;color:var(--muted);margin-left:6px}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><h1>MANAGEMENT TODAY</h1><div class="sub" id="upd">Loading…</div><div id="out"></div></div>
<script src="auth.js?v=20261110155715"></script>
<script src="activity.js?v=20261110155715"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/mgmt-home';
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
let token = store.get('tsd_me_token'), timer;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = v => Number(v) || 0;
const gbp = v => (v < 0 ? '−£' : '£') + Math.abs(Math.round(N(v))).toLocaleString('en-GB');
const gbpk = v => (v < 0 ? '−£' : '£') + (Math.abs(v) >= 1000 ? (Math.abs(v)/1000).toFixed(Math.abs(v) >= 100000 ? 0 : 1).replace(/\.0$/,'') + 'k' : Math.round(Math.abs(v)));
const dshort = s => new Date(s + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
const ago = s => { const d = Math.floor((Date.now() - new Date(s)) / 86400000); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };

function showLogin(msg){ clearInterval(timer); document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e && msg) e.textContent = msg; }
function start(){ document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block'; refresh(); clearInterval(timer); timer = setInterval(refresh, 300000); }
async function refresh(){
  try {
    const r = await fetch(API, {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
    if (r.status === 401) { token = null; store.del('tsd_me_token'); return showLogin('Please log in again.'); }
    const j = await r.json(); if (j.error) throw new Error(j.error);
    draw(j);
  } catch(x){ document.getElementById('upd').textContent = x.message; }
}
function draw(d){
  const mo = d.month || {}, wk = d.week || {}, a = d.attention || {}, b = d.bromham || {}, T = d.tasks || {open:0, overdue:0, people:[]};
  const tgt = N(mo.target), mtd = N(mo.mtd), wdT = N(mo.wd_total) || 1, wdD = N(mo.wd_done);
  const expect = tgt * wdD / wdT, pctT = tgt ? Math.round(100 * mtd / tgt) : 0, diff = mtd - expect;
  const proj = wdD ? mtd / wdD * wdT : 0;
  const wGross = N(wk.week && wk.week.gross), pGross = N(wk.prev && wk.prev.gross);
  const wDiff = pGross ? Math.round(100 * (wGross - pGross) / pGross) : null;
  const locs = wk.locations || [], lmax = Math.max(1, ...locs.map(l => N(l.sales)));
  const off = d.off || [];
  const offNow = off.filter(o => o.now), offSoon = off.filter(o => !o.now);
  const offTxt = o => `<div class="row"><span><b>${esc(o.who || 'Note')}</b> <span class="m">${esc(o.kind)}${o.detail ? ' · ' + esc(o.detail) : ''}</span></span><span class="m">${o.start_date === o.end_date ? dshort(o.start_date) : dshort(o.start_date) + ' – ' + dshort(o.end_date)}</span></div>`;
  const at = (n, label, extra) => n ? `<div class="row"><span>${label}</span><b>${extra || n}</b></div>` : '';
  document.getElementById('upd').textContent = new Date(d.today + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'}) + ' · updated ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('out').innerHTML = `
  <div class="tiles">
    <div class="tile ${diff >= 0 ? 'good' : 'y'}"><div class="k">This month so far</div><div class="n">${gbpk(mtd)}</div><div class="s">${pctT}% of ${gbpk(tgt)} target · ${diff >= 0 ? gbpk(diff) + ' ahead' : gbpk(-diff) + ' behind'} pace</div></div>
    <div class="tile y"><div class="k">This week so far</div><div class="n">${gbpk(wGross)}</div><div class="s">Last week ${gbpk(pGross)}${wDiff == null ? '' : ' · ' + (wDiff >= 0 ? '+' : '') + wDiff + '%'} (week isn't finished)</div></div>
    <div class="tile ${b.overdue_now ? 'bad' : 'good'}"><div class="k">Orders to go today · Bromham</div><div class="n">${N(b.to_send)}</div><div class="s">${N(b.sent_today)} sent so far · ${b.overdue_now ? b.overdue_now + ' overdue' : 'nothing overdue'}</div></div>
    <div class="tile ${T.overdue ? 'bad' : 'good'}"><div class="k">Open team tasks</div><div class="n">${T.open}</div><div class="s">${T.overdue ? T.overdue + ' overdue' : 'None overdue'}</div></div>
  </div>
  <div class="cols">
    <div class="card"><h2>Month to date</h2>
      <div class="bar"><div class="l">${gbpk(mtd)} of ${gbpk(tgt)}</div><div class="b"><i style="width:${Math.min(100, pctT)}%"></i><span class="pace" style="left:${Math.min(100, 100 * wdD / wdT)}%"></span></div><div class="v">${pctT}%</div></div>
      <div class="row"><span class="m">Working days done</span><b>${wdD} of ${wdT}</b></div>
      <div class="row"><span class="m">Where it lands at this pace</span><b class="${proj >= tgt ? 'good' : ''}">${gbpk(proj)}</b></div>
      <div class="row"><span class="m">New customers (this week)</span><b>${N(wk.new_customers) || '–'}</b></div>
      <div class="note">White line = where you'd be if every working day were equal.</div></div>
    <div class="card"><h2>Sales by site (this week)</h2>
      ${locs.length ? locs.map(l => `<div class="bar"><div class="l">${esc(l.name)}</div><div class="b"><i style="width:${100 * N(l.sales) / lmax}%"></i></div><div class="v">${gbpk(l.sales)}</div></div>`).join('') : '<div class="empty">No sales yet this week.</div>'}
      ${wk.dispatch ? `<div class="row"><span class="m">Went out late (week)</span><b class="${N(wk.dispatch.late) ? 'bad' : 'good'}">${N(wk.dispatch.late)} of ${N(wk.dispatch.measured)}</b></div>` : ''}</div>
    <div class="card"><h2>Bromham orders</h2>
      <div class="row"><span class="m">Sent today</span><b>${N(b.sent_today)}</b></div>
      <div class="row"><span class="m">Still to send</span><b>${N(b.to_send)}</b></div>
      <div class="row"><span class="m">Picked, waiting to go</span><b>${N(b.picked_waiting)}</b></div>
      <div class="row"><span class="m">Overdue right now</span><b class="${b.overdue_now ? 'bad' : 'good'}">${N(b.overdue_now)}</b></div>
      <div class="row"><span class="m">Went out late (7 days)</span><b class="${b.week_late ? 'bad' : 'good'}">${N(b.week_late)} of ${N(b.week_sent)}</b></div></div>
  </div>
  <div class="cols">
    <div class="card"><h2>Needs attention</h2>
      ${at(a.pos_overdue && a.pos_overdue.n, 'Purchase orders overdue', a.pos_overdue && a.pos_overdue.n + ' · ' + gbpk(a.pos_overdue.value))}
      ${at(a.backorders && a.backorders.n, 'Backorders', a.backorders && a.backorders.n + ' · ' + gbpk(a.backorders.value))}
      ${at(a.bills && a.bills.overdue, 'Supplier bills overdue', a.bills && gbpk(a.bills.overdue))}
      ${at(a.bills && a.bills.this_week, 'Bills due this week', a.bills && gbpk(a.bills.this_week))}
      ${at(a.claims && a.claims.n, 'Open claims', a.claims && a.claims.n + ' · ' + gbpk(a.claims.value))}
      ${at(a.credits && a.credits.n, 'Credit notes (week)', a.credits && a.credits.n + ' · ' + gbpk(a.credits.value))}
      ${at(a.quotes_new && a.quotes_new.n, 'New quotes (week)', a.quotes_new && a.quotes_new.n + ' · ' + gbpk(a.quotes_new.value))}
      ${at(a.stock && (a.stock.out || a.stock.low), 'Stock out / low', a.stock && N(a.stock.out) + ' out · ' + N(a.stock.low) + ' low')}
      ${(a.gone_quiet || []).length ? `<div class="note">Gone quiet: ${a.gone_quiet.map(g => esc(g.customer) + ' (' + gbpk(g.spend6m) + ')').join(', ')}</div>` : ''}</div>
    <div class="card"><h2>Team tasks</h2>
      ${T.people.length ? T.people.map(p => `<div class="row"><span>${esc(p.name)}</span><span><b>${p.open}</b> open${p.overdue ? ` · <span class="bad">${p.overdue} overdue</span>` : ''}</span></div>`).join('') : '<div class="empty">No open tasks.</div>'}
      <div class="note">Full detail is under Tasks &amp; Projects &gt; Team.</div></div>
    <div class="card"><h2>Projects &amp; issues</h2>
      ${(d.projects || []).length ? d.projects.map(p => `<div class="row"><span>${esc(p.title)}${p.owner ? ` <span class="pill">${esc(p.owner)}</span>` : ''}</span>${p.due ? `<span class="${p.late ? 'bad' : 'm'}">${dshort(p.due)}</span>` : ''}</div>`).join('') : '<div class="empty">No open projects.</div>'}
      ${(d.issues || []).length ? `<div class="note">Open issues</div>` + d.issues.map(p => `<div class="row"><span>${esc(p.title)}${p.owner ? ` <span class="pill">${esc(p.owner)}</span>` : ''}</span></div>`).join('') : ''}</div>
  </div>
  <div class="cols">
    <div class="card"><h2>Who's off</h2>
      ${offNow.length ? offNow.map(offTxt).join('') : '<div class="empty">Nobody off today.</div>'}
      ${offSoon.length ? `<div class="note">Coming up</div>` + offSoon.map(offTxt).join('') : ''}</div>
    <div class="card"><h2>Help requests</h2>
      ${(d.requests || []).length ? d.requests.map(r => `<div class="row"><span>${esc(r.title)} <span class="pill">${esc(r.by_name || '')}</span></span><span class="${r.status === 'new' ? 'bad' : 'm'}">${esc(r.status)} · ${ago(r.created_at)}</span></div>`).join('') : '<div class="empty">Nothing waiting.</div>'}</div>
  </div>`;
}
if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });
</script>
<script>
(function(){
  const BUILD = '20261110155715';
  let newer = false;
  async function check(){
    try {
      if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); }
      if (newer) location.reload();
    } catch(e){}
  }
  setInterval(check, 120000);
})();
</script>
</body>
</html>

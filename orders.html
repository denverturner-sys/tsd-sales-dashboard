<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><div id="msg">Loading…</div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script src="auth.js?v=20261111132912"></script>
<script src="activity.js?v=20261111132912"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/orders';
const WH_API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/warehouse';
const VIEW_API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/orderview';
const OPEN = new URLSearchParams(location.search).get('open');
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
const PR = { dispatch: 'Dispatch printer', counter: 'Trade counter printer', office: 'Office printer' };
const lastPr = () => { try { return localStorage.getItem('tsd_print_pr'); } catch(e){ return null; } };
let token = store.get('tsd_me_token'), D = null, timer, q = (OPEN && OPEN.startsWith('q:') ? OPEN.slice(2) : ''), loc = '', status = (OPEN && OPEN.startsWith('q:') ? 'all' : 'open'), qt;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy = s => s ? new Date(String(s).slice(0,10) + 'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
const when = s => { const d = new Date(s), t = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); return d.toDateString() === new Date().toDateString() ? 'Today ' + t : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + t; };
const PN = { dispatch: 'Dispatch printer', office: 'Office printer', counter: 'Trade counter printer', browser: 'This computer' }, DN = { pick: 'Pick sheet', order: 'Sales order', invoice: 'VAT invoice' };
const gbp = n => n == null ? '' : '£' + Number(n).toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
// 11 Nov: tracking links for dispatched orders (same courier rules as the Tracking screen)
function trackUrl(courier, n, postcode){
  const t = encodeURIComponent(String(n).trim()), u = String(n).trim().toUpperCase(); let c = String(courier || '').toLowerCase();
  if (!c) c = /^\d{14}$/.test(u) ? 'dpd' : /^[A-Z]{2}\d{9}GB$/.test(u) ? 'royal mail' : /^\d{12}$/.test(u) ? 'fedex' : '';
  if (c.includes('dpd')) return `https://track.dpd.co.uk/search?reference=${t}${postcode ? '&postcode=' + encodeURIComponent(postcode) : ''}`;
  if (c.includes('royal mail')) return `https://www.royalmail.com/track-your-item#/tracking-results/${t}`;
  if (c.includes('parcelforce')) return `https://www.parcelforce.com/track-trace?trackNumber=${t}`;
  if (c.includes('fedex')) return `https://www.fedex.com/fedextrack/?trknbr=${t}`;
  return `https://www.google.com/search?q=${encodeURIComponent((courier || '') + ' tracking ' + n)}`;
}
const trackLinks = (ps, pc, long) => (ps || []).map(p => `<a class="trk" title="${esc((p.courier || '') + ' ' + p.n)}" href="${esc(trackUrl(p.courier, p.n, pc))}" target="_blank" rel="noopener">${long ? esc((p.courier || 'Track') + ' ' + p.n) : 'Track'} ↗</a>`).join(' ');
function toast(t){ const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 3500); }
function modal(h){ document.getElementById('mbox').innerHTML = h; document.getElementById('mbox').style.maxWidth = '860px'; document.getElementById('mbox').style.maxHeight = ''; document.getElementById('mbox').style.overflow = ''; document.getElementById('modal').style.display = 'flex'; }
function closeModal(){ document.getElementById('modal').style.display = 'none'; }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function showLogin(msg){ clearInterval(timer); document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = msg || ''; }
function start(){ document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block'; shell(); load(); if (OPEN && !OPEN.startsWith('q:') && !start.done) { start.done = true; openOrder(/^[0-9a-f-]{36}$/i.test(OPEN) ? { id: OPEN } : { no: OPEN }); } clearInterval(timer); timer = setInterval(() => { if (document.getElementById('modal').style.display !== 'flex' && !document.activeElement?.matches('input')) load(); }, 60000); }
async function api(qs, body){
  const r = await fetch(API + (qs || ''), body ? {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({})); if (j.error || (body && j.ok === false)) throw new Error(j.error || "Couldn't do that"); return j;
}
function shell(){
  document.getElementById('app').innerHTML = `<header><div><div class="title">Sales orders</div><div class="sub">Find any order and print its pick sheet, sales order or VAT invoice. <span id="stn"></span></div></div></header>
  <div class="bar"><input id="sq" placeholder="Search order number, website order number, customer or postcode" value="${esc(q)}"><select id="sl"><option value="">Both sites</option><option>Bromham</option><option>Wootton Bassett</option></select>
  <select id="ss"><option value="open">Open orders</option><option value="done">Completed</option><option value="all">All</option></select></div>
  <div class="card" id="list"><div class="empty">Loading…</div></div><div id="adm"></div>`;
  document.getElementById('sl').value = loc; document.getElementById('ss').value = status;
  document.getElementById('sq').oninput = e => { q = e.target.value; clearTimeout(qt); qt = setTimeout(load, 350); };
  document.getElementById('sl').onchange = e => { loc = e.target.value; load(); }; document.getElementById('ss').onchange = e => { status = e.target.value; load(); };
}
async function load(){
  try { D = await api('?q=' + encodeURIComponent(q) + '&loc=' + encodeURIComponent(loc) + '&status=' + status); draw(); }
  catch(x){ if (x.message !== 'login') { const l = document.getElementById('list'); if (l) l.innerHTML = `<div class="empty">${esc(x.message)}</div>`; } }
}
function draw(){
  const stn = document.getElementById('stn'); if (stn) stn.innerHTML = ['dispatch', 'office'].map(p => D.online[p] ? `<b class="on">● ${PR[p]} connected</b>` : `<b class="off">● ${PR[p]} not connected</b>`).join(' &nbsp; ') + ' <span class="sub">(you can still print from this screen)</span>';
  document.getElementById('list').innerHTML = D.orders.length ? `<table class="ol"><tr><th>Order</th><th>Date</th><th>Customer</th><th class="hm">Site</th><th>Status</th><th>Tracking</th>${D.can_price ? '<th class="r hm">Ex VAT</th>' : ''}<th></th></tr>` +
    D.orders.map(o => `<tr class="clk" data-row="${o.id}"><td><b>${esc(o.no)}</b>${o.ref ? `<div class="sub">Web #${esc(o.ref)}</div>` : ''}${o.prints ? `<div class="sub" title="Last printed ${esc(when(o.prints.at))} by ${esc(o.prints.by)} (${esc(PN[o.prints.printer] || o.prints.printer)})">🖨 printed${o.prints.n > 1 ? ' ×' + o.prints.n : ''} · ${esc(o.prints.by)}</div>` : ''}</td><td>${dmy(o.date)}</td><td>${esc(o.customer)}</td><td class="hm">${esc(o.location)}</td><td><span class="st ${esc(o.status)}">${esc(o.status)}</span></td><td>${trackLinks(o.parcels, o.postcode, false)}</td>${D.can_price ? `<td class="r hm">${gbp(o.total)}</td>` : ''}<td class="r"><button class="pbtn" data-o="${o.id}">Print…</button></td></tr>`).join('') + '</table>' + (D.orders.length >= 100 ? '<div class="sub" style="margin-top:8px">Showing the latest 100. Search to narrow it down.</div>' : '') : '<div class="empty">No orders match.</div>';
  document.querySelectorAll('a.trk').forEach(a => a.onclick = e => e.stopPropagation());
  document.querySelectorAll('[data-o]').forEach(b => b.onclick = e => { e.stopPropagation(); printDlg(D.orders.find(o => o.id === b.dataset.o)); });
  document.querySelectorAll('tr[data-row]').forEach(r => r.onclick = () => openOrder({ id: r.dataset.row }));
  const a = document.getElementById('adm'); if (D.is_admin && !a.innerHTML) a.innerHTML = '<div class="card"><div class="k">Print stations</div><div class="sub" style="margin:6px 0">Set up once on the PC next to each printer (dispatch and office).</div><button class="pbtn" id="stset">Show set-up steps</button></div>', document.getElementById('stset').onclick = stationSetup;
}
async function vApi(qs){
  const r = await fetch(VIEW_API + qs, { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({})); if (j.error) throw new Error(j.error); return j;
}
// 10 Nov: click an order for the full details, big. Also opened from an SO- link in a Teams chat (?open=SO-12345).
const WH_NAME = (w, wb) => ({ dispatch: 'Pick & Dispatch', van: 'Van Team', collection: wb ? 'WB Collections' : 'Collections' })[w];
const WH_SCREEN = (w, wb) => ({ dispatch: 'pick', van: 'van', collection: wb ? 'wbcoll' : 'collections' })[w];
const WH_URL = { pick: 'warehouse.html', van: 'van.html', collections: 'warehouse.html?tab=collections', wbcoll: 'warehouse.html?tab=collections&loc=wb' };
function whBlock(j){
  const w = j.where, wb = j.wb, o = j.order;
  if (w === 'done') return `<div class="dn" style="background:var(--panel2);border-color:var(--line)"><div class="k">Warehouse</div>This order is complete, so it's not on any warehouse list.</div>`;
  const others = wb ? [] : ['dispatch', 'van', 'collection'].filter(x => x !== w);
  return `<div class="dn" style="background:var(--panel2);border-color:var(--line)"><div class="k">Where it is in the warehouse</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:16px">${WH_NAME(w, wb)}</b><button class="pbtn" id="whgo" style="border-color:var(--accent)">Open it in ${WH_NAME(w, wb)} →</button></div>
    ${others.length ? `<div class="k" style="margin-top:10px">In the wrong place? Move it to</div><div style="display:flex;gap:8px;flex-wrap:wrap">${others.map(x => `<button class="pbtn" data-mv="${x}">${WH_NAME(x, wb)}</button>`).join('')}</div>
    ${w === 'van' ? '<label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px" class="sub"><input type="checkbox" id="whtp" checked style="width:auto"> Also remove its Track-POD job if it has one</label>' : ''}<div id="whmsg" class="sub" style="margin-top:6px"></div>` : ''}</div>`;
}
function printBlock(j){
  const ph = j.prints || [], ok = ph.filter(x => x.status !== 'failed').length;
  return `<div class="dn" style="background:var(--panel2);border-color:var(--line)"><div class="k">Printed from Bob</div>${ph.length ? `<div style="font-weight:700">${ok ? 'Printed ' + ok + ' time' + (ok > 1 ? 's' : '') : 'Print failed'}</div>` + ph.map(x => `<div class="sub" style="color:var(--ink)">${esc(when(x.requested_at))} · ${esc(DN[x.doc] || x.doc)}${x.copies > 1 ? ' ×' + x.copies : ''} · ${esc(PN[x.printer] || x.printer)} · by ${esc(x.requested_by)}${x.status === 'failed' ? ' · <span class="off">failed</span>' : x.status === 'queued' || x.status === 'printing' ? ' · <span class="sub">waiting to print</span>' : ''}</div>`).join('') : '<span class="sub">Not printed from Bob yet. (Prints done straight from Cin7 are not recorded here.)</span>'}</div>`;
}
function gotoWh(screen, no){
  try { if (window.parent !== window) { window.parent.postMessage({ tsdGoto: { screen, open: no } }, location.origin); return; } } catch(e){}
  location.href = WH_URL[screen] + (WH_URL[screen].includes('?') ? '&' : '?') + 'open=' + encodeURIComponent(no);
}
function wireWh(j){
  const o = j.order, g = document.getElementById('whgo'); if (g) g.onclick = () => { closeModal(); gotoWh(WH_SCREEN(j.where, j.wb), o.no); };
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = async () => {
    const to = b.dataset.mv, from = j.where, tp = !!(document.getElementById('whtp') || {}).checked, msg = document.getElementById('whmsg');
    if (!confirm(`Move ${o.no} to ${WH_NAME(to, j.wb)}?`)) return;
    let body;
    if (to === 'van') body = { action: 'van', id: o.id, on: true };
    else if (to === 'collection') body = from === 'van' ? { action: 'to_collection', id: o.id, delete_tp: tp } : { action: 'collection', id: o.id, on: true };
    else body = from === 'van' ? { action: 'to_courier', id: o.id, delete_tp: tp } : { action: 'collection', id: o.id, on: false };
    document.querySelectorAll('[data-mv]').forEach(x => x.disabled = true); if (msg) msg.textContent = 'Moving…';
    try {
      const r = await fetch(WH_API, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(body) });
      const x = await r.json().catch(() => ({}));
      if (!r.ok || x.ok === false || x.error) throw new Error(x.error || "Couldn't move it");
      toast(`${o.no} moved to ${WH_NAME(to, j.wb)}`); openOrder({ id: o.id });
    } catch(e){ if (msg) msg.textContent = e.message; document.querySelectorAll('[data-mv]').forEach(x => x.disabled = false); }
  });
}
async function openOrder(ref){
  const mb = document.getElementById('mbox'); modal('<div class="sub">Loading…</div>'); mb.style.maxWidth = '1000px'; mb.style.maxHeight = '92vh'; mb.style.overflow = 'auto';
  try {
    const j = await vApi(ref.id ? '?id=' + encodeURIComponent(ref.id) : '?no=' + encodeURIComponent(ref.no)), o = j.order, P = j.can_price;
    const li = j.lines.map(l => `<tr><td><b>${esc(l.sku)}</b></td><td>${esc(l.name)}${+l.bo ? `<div class="off" style="font-weight:700;font-size:12px">${l.bo} on backorder</div>` : ''}</td><td class="r">${l.qty}</td>${P ? `<td class="r">${gbp(l.price)}</td><td class="r">${gbp(l.total)}</td>` : ''}</tr>`).join('');
    const net = Number(o.total_ex_vat) || 0, prod = Number(o.product_total) || 0, other = Math.round((net - prod) * 100) / 100;
    modal(`<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><div class="title" style="font-size:30px">${esc(o.no)}</div><div style="font-size:18px;font-weight:700">${esc(o.customer)}</div></div><span class="st ${esc(o.status)}">${esc(o.status)}</span></div>
      <div class="dv"><div><div class="k">Customer</div>${esc(o.contact && o.contact !== o.customer ? o.contact : '')}${o.phone ? '<br>' + esc(o.phone) : ''}${o.email ? '<br>' + esc(o.email) : ''}</div>
      <div><div class="k">Deliver to</div>${esc(o.address || '').replace(/, /g, '<br>')}</div>
      <div><div class="k">Order</div>${dmy(o.date)} · ${esc(o.location || '')}${o.ship_by ? '<br>Needed by ' + dmy(o.ship_by) : ''}${o.carrier ? '<br>Delivery: ' + esc(o.carrier) : ''}${o.rep ? '<br>Rep: ' + esc(o.rep) : ''}<br><span class="sub">Pick: ${esc(o.pick || 'n/a')} · Pack: ${esc(o.pack || 'n/a')} · Ship: ${esc(o.ship || 'n/a')}</span>${o.ref ? '<br>Website order #' + esc(o.ref) : ''}${(o.parcels || []).length ? '<br>Tracking: ' + trackLinks(o.parcels, o.postcode, true) : (o.tracking ? '<br>Tracking: ' + esc(o.tracking) : '')}</div></div>
      ${o.notes ? `<div class="dn"><div class="k">Delivery notes</div>${esc(o.notes).replace(/\n/g, '<br>')}</div>` : ''}
      <table class="ol"><tr><th>SKU</th><th>Description</th><th class="r">Qty</th>${P ? '<th class="r">Unit price</th><th class="r">Total ex VAT</th>' : ''}</tr>${li}</table>
      ${P ? `<div class="tot"><div><span>Products</span><span>${gbp(prod)}</span></div>${Math.abs(other) > 0.004 ? `<div><span>Delivery / other</span><span>${gbp(other)}</span></div>` : ''}<div><span>Total ex VAT</span><span>${gbp(net)}</span></div><div><span>VAT (20%)</span><span>${gbp(net * 0.2)}</span></div><div class="g"><span>Total inc VAT</span><span>${gbp(net * 1.2)}</span></div></div>` : ''}
      ${printBlock(j)}
      ${whBlock(j)}
      <div class="sub">${o.qty != null ? o.qty + ' items' : ''}${o.weight ? ' · approx ' + Math.round(+o.weight) + ' kg' : ''}</div>
      <div class="row"><button class="pbtn" id="vpr">Print…</button><button class="btn" onclick="closeModal()">Close</button></div>`);
    document.getElementById('mbox').style.maxWidth = '1000px'; document.getElementById('mbox').style.maxHeight = '92vh'; document.getElementById('mbox').style.overflow = 'auto';
    wireWh(j);
    document.getElementById('vpr').onclick = () => { if (!D) return toast('Print from the order list'); printDlg({ id: o.id, no: o.no, customer: o.customer }); };
  } catch(x){ if (x.message === 'login') return; modal(`<div class="sub">${esc(x.message)}</div><div class="row"><button class="btn" onclick="closeModal()">Close</button></div>`); }
}
function printDlg(o){
  const docs = [['pick', 'Pick sheet', 'no prices'], ...(D.can_price ? [['order', 'Sales order', 'with prices'], ['invoice', 'VAT invoice', 'from Cin7']] : [])];
  const full = (D.orders || []).find(x => x.id === o.id), pr = o.prints || (full && full.prints);
  const st = ['dispatch', 'office'].map(p => D.online[p] ? `<span class="on">● ${PR[p]} connected</span>` : `<span class="off">● ${PR[p]} not connected</span>`).join(' &nbsp; ');
  modal(`<h3 style="margin:0">${esc(o.no)} · ${esc(o.customer)}</h3><div class="sub">${st}</div>
    ${pr ? `<div class="sub" style="color:var(--ink);margin-top:6px">🖨 Already printed ${pr.n > 1 ? pr.n + ' times' : 'once'}. Last: ${esc(when(pr.at))} by ${esc(pr.by)}.</div>` : ''}
    ${docs.map(([d, n, h]) => `<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap"><div style="flex:1;min-width:130px"><b>${n}</b> <span class="sub">${h}</span></div>
      <button class="pbtn" data-pv="${d}">View / print here</button><button class="pbtn" data-q="${d}" data-p="dispatch" style="border-color:var(--accent)">🖨 Dispatch</button><button class="pbtn" data-q="${d}" data-p="office" style="border-color:var(--accent)">🖨 Office</button></div>`).join('')}
    <div id="perr" class="sub"></div><div class="row"><button class="btn" onclick="closeModal()">Close</button></div>`);
  document.querySelectorAll('[data-pv]').forEach(b => b.onclick = async () => { b.disabled = true; b.textContent = 'Loading…'; try { const j = await api('?doc=' + b.dataset.pv + '&id=' + o.id); preview(o, j, b.dataset.pv); } catch(x){ document.getElementById('perr').textContent = x.message; b.disabled = false; b.textContent = 'View / print here'; } });
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = async () => { b.disabled = true; try { const pr = b.dataset.p;
    const j = await api('', { action: 'print', id: o.id, doc: b.dataset.q, printer: pr }); closeModal(); toast(j.online[pr] ? 'Sent to the ' + PR[pr].toLowerCase() : 'Queued. The ' + PR[pr].toLowerCase() + ' is not connected, it will print when it is back.'); load(); } catch(x){ document.getElementById('perr').textContent = x.message; b.disabled = false; } });
}
function preview(o, j, doc){
  modal(`<h3 style="margin:0">${esc(j.title)}</h3><iframe id="pv"></iframe><div class="row"><button class="btn" id="pb">Back</button><button class="btn y" id="pp">Print this</button></div>`);
  const f = document.getElementById('pv'); f.srcdoc = j.html;
  document.getElementById('pb').onclick = () => printDlg(o); document.getElementById('pp').onclick = () => { try { f.contentWindow.focus(); f.contentWindow.print(); if (doc) api('', { action: 'logprint', id: o.id, doc }).then(load).catch(() => {}); } catch(e){ toast("Couldn't open the print box"); } };
}
async function stationSetup(){
  try {
    const j = await api('?view=station'), base = location.origin + location.pathname.replace(/[^/]*$/, '') + 'printstation.html?k=' + encodeURIComponent(j.key);
    const box = (p, nm) => `<div style="margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:8px"><b>${nm}</b> ${j.online[p] ? '<b class="on">● connected now</b>' : '<b class="off">● not connected yet</b>'}<br><input readonly value="${esc(base + '&p=' + p)}" style="width:100%;margin:6px 0" onclick="this.select()"></div>`;
    modal(`<h3 style="margin:0">Print stations</h3><div class="sub" style="color:var(--ink);line-height:1.6">
      One PC per printer, switched on and left logged in, next to or on the same network as that printer. Do this once on each PC. No login needed, the link is the key, so <b>keep both links private.</b><br>
      1. Copy the Chrome shortcut. Right-click the copy, Properties, and add <code>--kiosk-printing</code> to the very end of the Target line (after a space). That stops Chrome asking before it prints.<br>
      2. Set that PC's Windows default printer to the printer it should print to.<br>
      3. Open the shortcut and paste that printer's link (below). Press Ctrl+P once, choose the printer and close the box.<br>
      4. Leave the window open (minimised is fine). Put the shortcut in the Startup folder (Windows key + R, type <code>shell:startup</code>) so it comes back after a restart.<br>
      The page title tells you which printer that window is for.</div>
      ${box('dispatch', 'Dispatch printer')}${box('office', 'Office printer')}<div class="row"><button class="btn" onclick="closeModal()">Close</button></div>`);
  } catch(x){ toast(x.message); }
}
if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });

<script>
(function(){
  const BUILD = '20261111132912';
  const busy = () => { const m = document.getElementById('modal'); const a = document.activeElement; return (m && getComputedStyle(m).display !== 'none') || (a && a.matches && a.matches('input,textarea,select')); };
  let newer = false;
  async function check(){ try { if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); } if (newer && !busy()) location.reload(); } catch(e){} }
  setInterval(check, 120000);
})();

button,input,select,textarea{font-family:inherit;font-size:16px}
.wrap{padding:12px 16px 90px;max-width:1500px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.title{font-family:var(--num);font-size:34px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.pill select{background:transparent;border:0;color:var(--ink);font-weight:700;padding:0;width:auto}
.card{background:var(--panel);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;min-height:46px}
.btn:hover{border-color:var(--accent)}.btn.y{background:var(--accent);color:#262727;border-color:var(--accent)}.btn.g{background:var(--good);color:#262727;border-color:var(--good)}
.btn:disabled{opacity:.45;cursor:default}.btn.sm{padding:6px 11px;font-size:14px;min-height:34px}.btn.big{font-size:20px;padding:16px 22px;min-height:62px}
.tabs{display:flex;gap:6px}.tabs button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}.tabs button.on{background:var(--accent);color:#262727;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:14px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.custsel{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel2);border-radius:10px;padding:10px 12px}
.res{border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:280px;overflow:auto}
.res .it{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.res .it:last-child{border:0}.res .it:hover{background:var(--panel2)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.pc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;color:var(--ink);padding:0}
.pc:hover{border-color:var(--accent)}.pc .im{height:110px;background:#fff center/contain no-repeat}.pc .im.no{background:#3a3b3b;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.pc .tx{padding:8px 9px;display:flex;flex-direction:column;gap:3px;flex:1}.pc .nm{font-weight:600;font-size:14px;line-height:1.2}.pc .sk{color:var(--muted);font-size:12px}
.pc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px;font-size:13px}
.lv{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--line)}.lv.ok{background:var(--good);color:#262727}.lv.lo{background:var(--amber);color:#262727}.lv.no{background:var(--bad);color:#262727}
.ln{border-bottom:1px solid var(--line);padding:10px 0}.ln:last-child{border:0}
.ln .top{display:flex;justify-content:space-between;gap:8px}.ln .nm{font-weight:600;line-height:1.25}.ln .sk{color:var(--muted);font-size:12px}
.ln .ctl{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:40px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:20px;font-weight:700;cursor:pointer}.qty input{width:64px;text-align:center;padding:9px 4px}
.ln .lt{font-weight:800;font-size:17px;text-align:right;min-width:84px}
.x{background:transparent;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.warn{background:rgba(255,179,71,.13);border:1px solid var(--amber);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:14px}
.warn .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bad{background:rgba(255,122,107,.14);border:1px solid var(--bad);border-radius:8px;padding:8px 10px;margin:8px 0}
.okmsg{color:var(--good);font-size:13px;margin-top:6px;font-weight:600}
.tot div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}.tot .gt{color:var(--ink);font-weight:800;font-size:24px;border-top:2px solid var(--line);margin-top:6px;padding-top:8px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;max-width:900px;margin:20px auto}
.names button{min-height:86px;font-size:22px;font-weight:700;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--ink);cursor:pointer}.names button:hover{border-color:var(--accent)}
.ov{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:16px}
.charge{text-align:center;max-width:1000px;margin:0 auto}
.charge .amt{font-family:var(--num);font-size:clamp(54px,16vw,240px);line-height:.9;color:var(--accent);letter-spacing:2px;margin:6px 0}
.charge .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.charge .row .btn{flex:1 1 200px;max-width:300px}
.chosen{outline:3px solid var(--good)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal .box{background:var(--panel);border-radius:14px;padding:18px;max-width:520px;width:100%}
.modal h3{margin:0 0 8px;font-size:21px}.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
table.lt{width:100%;border-collapse:collapse}table.lt th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.lt td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}table.lt tr.cl{cursor:pointer}table.lt tr.cl:hover td{background:var(--panel2)}
.r{text-align:right}.st{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--line);white-space:nowrap}.st.g{background:var(--good);color:#262727}.st.a{background:var(--amber);color:#262727}.st.b{background:var(--blue);color:#262727}
#bar{display:none}
@media(max-width:560px){.ln .ctl{grid-template-columns:1fr 1fr}.ln .ctl>div:first-child{grid-column:1/-1}.ln .lt{grid-column:1/-1}}
@media(max-width:900px){#bar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));gap:10px;align-items:center;justify-content:space-between;z-index:40}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:120;max-width:90vw}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
#msg{padding:40px;text-align:center;color:var(--muted)}.er{color:var(--bad);font-weight:600}
#reader{width:100%;max-width:420px;margin:0 auto}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><div id="msg">Loading…</div></div>
<div id="toast"></div>
<script src="auth.js?v=20261113104745"></script>
<script src="html5-qrcode.min.js?v=20261113104745"></script>
<script>
// Trade counter POS (13 Nov). Counter PCs keep a paired key (tsd_pos_dev); everyone else uses their own Bob login.
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/pos';
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){ mem[k] = v; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
let DEV = store.get('tsd_pos_dev'), token = store.get('tsd_me_token'), BOOT = null, SERVED = null, TAB = 'sale', S = null, DONE = null, idleT = null, searchT = null, custT = null, FEAT = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gbp = n => '£' + Number(n || 0).toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const r2 = n => Math.round(n * 100) / 100;
const qf = n => String(Math.round(Number(n || 0) * 100) / 100);
const $ = id => document.getElementById(id);
const dmy = s => new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const tm = s => new Date(s).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
function toast(t){ const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 4000); }
function showLogin(msg){ $('app').style.display = 'none'; $('login').style.display = 'flex'; const e = $('lerr'); if (e) e.textContent = msg || ''; }
const hdrs = () => DEV ? { 'x-pos-device': DEV } : { Authorization: 'Bearer ' + token };
async function api(qs, body){
  const r = await fetch(API + (qs || ''), body ? { method: 'POST', headers: { 'Content-Type': 'application/json', ...hdrs() }, body: JSON.stringify(body) } : { headers: hdrs(), cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { if (DEV) offline(j.error); else { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); } throw new Error('login'); }
  if (r.status === 409 && j.short) { const e = new Error(j.error); e.short = j.short; throw e; }
  if (j.error || (body && j.ok === false)) throw new Error(j.error || "Couldn't do that");
  return j;
}
function modal(title, html, buttons){
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box"><h3>${title}</h3><div>${html}</div><div class="acts">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.t}</button>`).join('')}</div></div>`;
    document.body.appendChild(m);
    m.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { m.remove(); res(buttons[+b.dataset.i].v); });
  });
}
function offline(msg){
  $('login').style.display = 'none'; $('app').style.display = 'block';
  $('app').innerHTML = `<div class="card" style="max-width:560px;margin:60px auto;text-align:center"><div class="title" style="margin-bottom:10px">Trade counter</div>
    <div style="font-size:18px">${esc(msg || 'This counter login is switched off.')}</div><div class="sub" style="margin-top:8px">Counter PCs work from 05:00 to 18:00. Outside that, use your own Bob login.</div>
    <button class="btn" style="margin-top:16px" onclick="location.reload()">Try again</button></div>`;
}

// ---------- start ----------
async function start(){
  $('login').style.display = 'none'; $('app').style.display = 'block';
  try { BOOT = await api('?boot=1'); } catch(x){ if (x.message !== 'login') $('app').innerHTML = `<div class="card er">${esc(x.message)}</div>`; return; }
  S = fresh();
  if (BOOT.mode === 'counter') { askName(); armIdle(); } else { SERVED = BOOT.me; shell(); }
}
const fresh = () => ({ loc: BOOT.location, cust: null, cash: { name: '', phone: '' }, ref: '', lines: [], warn: {}, hold: false, printer: BOOT.device ? BOOT.device.printer : (BOOT.location === 'Wootton Bassett' ? 'wbcounter' : 'counter'), busy: false });
function armIdle(){
  const reset = () => { clearTimeout(idleT); idleT = setTimeout(() => { if (BOOT.mode === 'counter' && !DONE && SERVED) { SERVED = null; askName(); } }, 180000); };
  ['click', 'keydown', 'touchstart'].forEach(e => document.addEventListener(e, reset, { passive: true })); reset();
}
function askName(){
  DONE = null;
  $('app').innerHTML = `<header><div><div class="title">Who's serving?</div><div class="sub">${esc(BOOT.device.name)} · tap your name</div></div></header>
    <div class="names">${BOOT.staff.map(s => `<button data-e="${esc(s.email)}">${esc(s.name)}</button>`).join('') || '<div class="sub">No one is available to pick.</div>'}</div>`;
  document.querySelectorAll('.names [data-e]').forEach(b => b.onclick = () => { SERVED = BOOT.staff.find(s => s.email === b.dataset.e); shell(); });
}

// ---------- page shell ----------
function shell(){
  const counter = BOOT.mode === 'counter';
  $('app').innerHTML = `<header><div><div class="title">Trade counter</div><div class="sub">${counter ? esc(BOOT.device.name) : 'Your login'} · stock checked live in Cin7</div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="pill">Serving: ${esc(SERVED.name)}${counter ? ' <a href="#" id="chg" style="color:var(--accent)">change</a>' : ''}</span>
      <span class="pill">Stock from <select id="loc">${BOOT.locations.map(l => `<option ${l === S.loc ? 'selected' : ''}>${l}</option>`).join('')}</select></span>
      <div class="tabs"><button id="t1" class="${TAB === 'sale' ? 'on' : ''}">New sale</button><button id="t2" class="${TAB === 'list' ? 'on' : ''}">Counter sales</button></div>
      ${!counter && BOOT.me && BOOT.me.admin ? '<button class="pill" id="setup">⚙ Counter PCs</button>' : ''}
    </div></header><div id="body"></div><div id="bar"></div>`;
  if (counter) $('chg').onclick = e => { e.preventDefault(); SERVED = null; askName(); };
  $('loc').onchange = e => { S.loc = e.target.value; if (!counter) S.printer = S.loc === 'Wootton Bassett' ? 'wbcounter' : 'counter'; S.lines.forEach(l => l.stock && (l.avail = l.stock[S.loc].available)); drawBasket(); };
  $('t1').onclick = () => { TAB = 'sale'; shell(); }; $('t2').onclick = () => { TAB = 'list'; shell(); };
  if ($('setup')) $('setup').onclick = setup;
  if (TAB === 'sale') saleScreen(); else listScreen();
}

// ---------- sale screen ----------
function saleScreen(){
  $('body').innerHTML = `<div class="grid"><div>
      <div class="card"><div class="k">Customer</div><div id="cust"></div></div>
      <div class="card"><div class="k">Products</div>
        <div style="display:flex;gap:8px"><input id="ps" placeholder="Search name or code, or scan a barcode" autocomplete="off" inputmode="search"><button class="btn" id="cam" title="Scan with the camera">📷</button></div>
        <div id="scan" style="display:none;margin-top:10px"><div id="reader"></div><div class="sub" id="scanmsg" style="text-align:center;margin-top:6px">Point the camera at the barcode</div></div>
        <div id="plist"></div></div>
    </div><div><div class="card" id="bk"></div></div></div>`;
  drawCust(); drawBasket();
  const ps = $('ps');
  ps.oninput = () => { clearTimeout(searchT); searchT = setTimeout(() => findProducts(ps.value.trim()), 250); };
  ps.onkeydown = async e => { if (e.key !== 'Enter') return; e.preventDefault(); const v = ps.value.trim(); if (!v) return; if (/^\d{8,14}$/.test(v)) { ps.value = ''; await scanned(v); } else findProducts(v, true); };
  $('cam').onclick = camera;
  if (window.matchMedia('(min-width:900px)').matches) ps.focus();
  findProducts('');
}
async function findProducts(q, enterAdds){
  const el = $('plist'); if (!el) return;
  try {
    let rs;
    if (q.length < 2) { FEAT = FEAT || (await api('?featured=1')).results; rs = FEAT; }
    else rs = (await api('?products=' + encodeURIComponent(q))).results;
    if (enterAdds && rs.length === 1) { addLine(rs[0]); $('ps').value = ''; return findProducts(''); }
    el.innerHTML = (q.length < 2 ? '<div class="sub" style="margin-top:10px">Best sellers</div>' : '') + (rs.length ? `<div class="prods">${rs.map((p, i) => {
      const n = S.loc === 'Wootton Bassett' ? p.wb : p.bromham;
      return `<button class="pc" data-i="${i}">${p.image ? `<div class="im" style="background-image:url('${esc(p.image)}')"></div>` : '<div class="im no">No photo</div>'}
        <div class="tx"><div class="nm">${esc(p.name)}</div><div class="sk">${esc(p.sku)}</div>
        <div class="ft"><b>${p.web != null ? gbp(p.web) : ''}</b><span class="lv ${n > 5 ? 'ok' : n > 0 ? 'lo' : 'no'}">${qf(n)} here</span></div></div></button>`; }).join('')}</div>` : '<div class="sub" style="margin-top:10px">Nothing found.</div>');
    el.querySelectorAll('.pc').forEach(b => b.onclick = () => addLine(rs[+b.dataset.i]));
  } catch(x){ if (x.message !== 'login') el.innerHTML = `<div class="bad">${esc(x.message)}</div>`; }
}
async function scanned(code){
  try { const j = await api('?barcode=' + encodeURIComponent(code)); if (j.sku) return addLine({ sku: j.sku, name: j.name || j.sku }); toast(`No product has barcode ${code} yet`); }
  catch(x){ if (x.message !== 'login') toast(x.message); }
}
let scanner = null;
async function camera(){
  const box = $('scan');
  if (scanner) { try { await scanner.stop(); } catch(e){} scanner = null; box.style.display = 'none'; return; }
  if (!window.Html5Qrcode) return toast("The camera scanner didn't load");
  box.style.display = 'block';
  const F = Html5QrcodeSupportedFormats;
  scanner = new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.ITF, F.CODE_128], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  try { await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 120 } }, async code => { try { await scanner.stop(); } catch(e){} scanner = null; box.style.display = 'none'; await scanned(code); }); }
  catch(e){ scanner = null; box.style.display = 'none'; toast("Couldn't open the camera"); }
}

// ---------- customer ----------
function drawCust(){
  const el = $('cust'); if (!el) return;
  if (S.cust) {
    const c = S.cust;
    el.innerHTML = `<div class="custsel"><div><b style="font-size:18px">${esc(c.name)}</b><div class="sub">${esc(c.tier || '')}${c.terms ? ' · ' + esc(c.terms) : ''}</div></div><button class="btn sm" id="cx">Change</button></div>
      ${c.on_hold ? '<div class="bad"><b>On credit hold in Cin7.</b> You can still go ahead; it gets noted on the order.</div>' : ''}
      <div class="g2" style="margin-top:10px"><div><div class="k">Their reference / PO</div><input id="rf" value="${esc(S.ref)}" placeholder="Job name or PO number"></div>
      <div><div class="k">Contact</div><input id="ctn" value="${esc(c.contact || '')}"></div></div>`;
    $('cx').onclick = () => { S.cust = null; S.hold = false; S.acct = true; delete S.warn._hold; repriceAll(); drawCust(); };
    $('rf').oninput = e => S.ref = e.target.value; $('ctn').oninput = e => S.cust.contact = e.target.value;
    return;
  }
  // 13 Nov (Denver): make it obvious how to switch between a cash sale and an account customer
  el.innerHTML = `<div class="tabs" style="margin-bottom:10px"><button id="mc" class="${S.acct ? '' : 'on'}">Cash sale</button><button id="ma" class="${S.acct ? 'on' : ''}">Account customer</button></div>
    ${S.acct ? `<input id="cs" placeholder="Type the account customer's name" autocomplete="off"><div id="cres"></div>`
    : `<div class="sub">Name and phone are optional, but help find the sale later if something comes back.</div>
    <div class="g2" style="margin-top:8px"><div><div class="k">Name</div><input id="cn" value="${esc(S.cash.name)}"></div><div><div class="k">Phone</div><input id="cp" value="${esc(S.cash.phone)}" inputmode="tel"></div></div>`}`;
  $('mc').onclick = () => { S.acct = false; drawCust(); };
  $('ma').onclick = () => { S.acct = true; drawCust(); setTimeout(() => $('cs') && $('cs').focus(), 0); };
  if (!S.acct) { $('cn').oninput = e => S.cash.name = e.target.value; $('cp').oninput = e => S.cash.phone = e.target.value; return; }
  $('cs').oninput = e => { clearTimeout(custT); const q = e.target.value.trim(); custT = setTimeout(async () => {
    const box = $('cres'); if (q.length < 2) { box.innerHTML = ''; return; }
    try { const j = await api('?customers=' + encodeURIComponent(q)); box.innerHTML = j.customers.length ? `<div class="res">${j.customers.map(c => `<div class="it" data-id="${c.customer_id}">${esc(c.name)}</div>`).join('')}</div>` : '<div class="sub" style="margin-top:6px">No account customers match</div>';
      box.querySelectorAll('[data-id]').forEach(d => d.onclick = () => pickCust(d.dataset.id)); } catch(x){}
  }, 250); };
}
async function pickCust(id){
  try {
    const c = (await api('?customer=' + id)).customer;
    if (c.on_hold) { const go = await modal('Credit hold', `<b>${esc(c.name)}</b> is on credit hold in Cin7. You can still sell to them; it gets noted on the order.`, [{ t: 'Pick someone else', v: false }, { t: 'Carry on', v: true, cls: 'y' }]); if (!go) return; S.warn._hold = `Customer ${c.name} was on credit hold`; }
    S.cust = c; drawCust(); repriceAll();
  } catch(x){ if (x.message !== 'login') toast(x.message); }
}

// ---------- basket ----------
async function addLine(p){
  const ex = S.lines.find(l => l.sku === p.sku);
  if (ex) { ex.qty += 1; checkStock(ex); return drawBasket(); }
  const l = { sku: p.sku, name: p.name, image: p.image, qty: 1, price: null, list: null, discount: 0, cost: null, stock: null, avail: null, ack: false, loading: true };
  S.lines.push(l); drawBasket();
  await refresh(l);
}
async function refresh(l){
  try {
    const j = await api(`?line=${encodeURIComponent(l.sku)}&customer=${S.cust ? S.cust.id : ''}&loc=${encodeURIComponent(S.loc)}`);
    Object.assign(l, { product_id: j.product_id, name: j.name, uom: j.uom, cost: j.cost, stock: j.stock, avail: j.stock[S.loc].available, special: j.special, loading: false });
    if (l.list == null || !l.edited) { l.list = j.price; l.price = j.price; l.discount = j.discount || 0; }
    checkStock(l);
  } catch(x){ l.loading = false; l.err = x.message; }
  drawBasket();
}
function repriceAll(){ S.lines.forEach(l => { l.edited = false; refresh(l); }); }
function checkStock(l){ if (l.avail != null && l.qty > l.avail) { if (!l.ackQty || l.qty > l.ackQty) l.ack = false; } else l.ack = false; }
const lineNet = l => r2((l.qty || 0) * (l.price || 0) * (1 - (l.discount || 0) / 100));
function drawBasket(){
  const el = $('bk'); if (!el) return;
  const net = r2(S.lines.reduce((t, l) => t + lineNet(l), 0)), vat = r2(net * 0.2), tot = r2(net + vat);
  const blocked = S.lines.some(l => l.loading || l.err || !l.product_id || (l.avail != null && l.qty > l.avail && !l.ack));
  const other = S.loc === 'Bromham' ? 'Wootton Bassett' : 'Bromham';
  el.innerHTML = `<div class="k" style="display:flex;justify-content:space-between"><span>Basket</span>${S.lines.length ? '<a href="#" id="clr" style="color:var(--muted)">Clear</a>' : ''}</div>
    ${S.lines.length ? S.lines.map((l, i) => {
      const short = l.avail != null && l.qty > l.avail;
      const st = l.stock ? l.stock[other] : null, nx = l.stock ? l.stock[S.loc].next : null;
      return `<div class="ln"><div class="top"><div><div class="nm">${esc(l.name)}</div><div class="sk">${esc(l.sku)}${l.special ? ' · special price' : ''}${l.avail != null ? ` · <span class="lv ${short ? 'no' : l.avail - l.qty < 3 ? 'lo' : 'ok'}">${qf(l.avail)} available here</span>` : ''}</div></div><button class="x" data-rm="${i}" title="Remove">×</button></div>
        ${l.err ? `<div class="bad">${esc(l.err)}</div>` : l.loading ? '<div class="sub">Checking Cin7…</div>' : `<div class="ctl">
          <div><div class="k">Qty${l.uom ? ' (' + esc(l.uom) + ')' : ''}</div><div class="qty"><button data-dn="${i}">−</button><input data-q="${i}" value="${qf(l.qty)}" inputmode="decimal"><button data-up="${i}">+</button></div></div>
          <div><div class="k">Price ex VAT</div><input data-p="${i}" value="${(l.price ?? 0).toFixed(2)}" inputmode="decimal"></div>
          <div><div class="k">Discount %</div><input data-d="${i}" value="${qf(l.discount)}" inputmode="decimal"></div>
          <div class="lt">${gbp(lineNet(l))}</div></div>
          ${short ? (l.ack ? `<div class="okmsg">Selling ${qf(l.qty)} with ${qf(l.avail)} here: the rest goes on backorder.</div>` : `<div class="warn"><b>Only ${qf(Math.max(0, l.avail))} available at ${esc(S.loc)}.</b> ${st ? `${qf(st.available)} at ${esc(other)}.` : ''} ${nx ? 'Next delivery ' + dmy(nx) + '.' : ''}
            <div class="acts">${l.avail > 0 ? `<button class="btn sm" data-red="${i}">Reduce to ${qf(l.avail)}</button>` : ''}<button class="btn sm" data-ack="${i}">Sell anyway (backorder)</button><button class="btn sm" data-rm="${i}">Remove</button></div></div>`) : ''}`}</div>`; }).join('')
    : '<div class="sub" style="padding:14px 0">Tap a product or scan a barcode to add it.</div>'}
    <div class="tot" style="margin-top:8px"><div><span>Total ex VAT</span><span>${gbp(net)}</span></div><div><span>VAT</span><span>${gbp(vat)}</span></div><div class="gt"><span>To pay</span><span>${gbp(tot)}</span></div></div>
    ${BOOT.mode !== 'counter' ? `<div style="margin-top:10px"><div class="k">Print the sales order on</div><select id="prn">${BOOT.printers.map(p => `<option value="${p.id}" ${p.id === S.printer ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>` : ''}
    <div id="aerr"></div>
    <button class="btn y big" id="auth" style="width:100%;margin-top:12px" ${!S.lines.length || blocked || S.busy ? 'disabled' : ''}>${S.busy ? 'Authorising…' : 'Authorise ' + gbp(tot)}</button>
    ${blocked && S.lines.length && !S.busy ? '<div class="sub" style="margin-top:6px;text-align:center">Sort the stock warnings above first</div>' : ''}`;
  const bar = $('bar'); if (bar) { bar.innerHTML = S.lines.length ? `<div><b>${S.lines.length} item${S.lines.length === 1 ? '' : 's'}</b> · ${gbp(tot)}</div><button class="btn y" id="bar2" ${blocked ? 'disabled' : ''}>Basket & authorise</button>` : ''; if ($('bar2')) $('bar2').onclick = () => $('bk').scrollIntoView({ behavior: 'smooth' }); }
  if ($('clr')) $('clr').onclick = e => { e.preventDefault(); S.lines = []; S.warn = S.warn._hold ? { _hold: S.warn._hold } : {}; drawBasket(); };
  if ($('prn')) $('prn').onchange = e => S.printer = e.target.value;
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const l = S.lines.splice(+b.dataset.rm, 1)[0]; delete S.warn[l.sku]; drawBasket(); });
  el.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const l = S.lines[+b.dataset.up]; l.qty = r2(l.qty + 1); checkStock(l); drawBasket(); });
  el.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { const l = S.lines[+b.dataset.dn]; if (l.qty > 1) { l.qty = r2(l.qty - 1); checkStock(l); drawBasket(); } });
  el.querySelectorAll('[data-q]').forEach(b => b.onchange = () => { const l = S.lines[+b.dataset.q]; const v = Number(b.value); if (v > 0) l.qty = v; checkStock(l); drawBasket(); });
  el.querySelectorAll('[data-red]').forEach(b => b.onclick = () => { const l = S.lines[+b.dataset.red]; l.qty = l.avail; drawBasket(); });
  el.querySelectorAll('[data-ack]').forEach(b => b.onclick = () => { const l = S.lines[+b.dataset.ack]; l.ack = true; l.ackQty = l.qty; drawBasket(); });
  el.querySelectorAll('[data-p]').forEach(b => b.onchange = () => { const l = S.lines[+b.dataset.p]; const v = Number(b.value); if (v >= 0) { l.price = r2(v); l.edited = true; } priceCheck(l); });
  el.querySelectorAll('[data-d]').forEach(b => b.onchange = () => { const l = S.lines[+b.dataset.d]; const v = Number(b.value); if (v >= 0 && v <= 100) { l.discount = v; l.edited = true; } priceCheck(l); });
  if ($('auth')) $('auth').onclick = authorise;
}
// 13 Nov (Denver): warn if the discount is over 15% or the margin falls below 25% (against Cin7 cost, ex VAT)
async function priceCheck(l){
  const unit = (l.price || 0) * (1 - (l.discount || 0) / 100);
  const disc = l.list > 0 ? (1 - unit / l.list) * 100 : 0;
  const margin = unit > 0 && l.cost != null ? (unit - l.cost) / unit * 100 : null;
  const bits = [];
  if (disc > 15.0001) bits.push(`${Math.round(disc)}% off the normal price`);
  if (margin != null && margin < 25) bits.push(`a ${Math.round(margin)}% margin`);
  const key = l.price + '|' + l.discount;
  if (l._asking || (bits.length && l._ok === key)) return drawBasket();   // one pop-up at a time, and not again for a price already agreed
  if (bits.length) {
    l._asking = true;
    const go = await modal('Check this price', `<b>${esc(l.name)}</b> is going out at ${gbp(unit)} each: ${bits.join(' and ')}.<br><br>Carry on? Your name goes on the order with this warning.`, [{ t: 'Put it back', v: false }, { t: 'Carry on', v: true, cls: 'y' }]);
    l._asking = false;
    if (!go) { l.price = l.list; l.discount = 0; delete S.warn[l.sku]; }
    else { l._ok = key; S.warn[l.sku] = `${l.sku} at ${gbp(unit)} each (${bits.join(', ')})`; }
  } else delete S.warn[l.sku];
  drawBasket();
}
async function authorise(again){
  if (S.busy) return;
  S.busy = true; drawBasket();
  const body = { action: 'create', served: SERVED.email, location: S.loc, customer_id: S.cust ? S.cust.id : null, cash_name: S.cash.name, cash_phone: S.cash.phone,
    reference: S.ref, contact: S.cust ? S.cust.contact : '', phone: S.cust ? S.cust.phone : '', email: S.cust ? S.cust.email : '', printer: S.printer,
    accept_short: S.lines.every(l => l.avail == null || l.qty <= l.avail || l.ack),
    warnings: Object.values(S.warn), lines: S.lines.map(l => ({ product_id: l.product_id, sku: l.sku, name: l.name, qty: l.qty, price: l.price, discount: l.discount })) };
  try {
    const j = await api('', body);
    DONE = { ...j, lines: j.lines, cust: S.cust ? S.cust.name : (S.cash.name || 'Cash sale'), account: !!S.cust, paid: null, finished: null };
    S = fresh(); chargeScreen();
  } catch(x){
    S.busy = false;
    if (x.short) { x.short.forEach(s => { const l = S.lines.find(z => z.product_id === s.product_id); if (l) { l.avail = s.available; l.ack = false; } }); drawBasket(); $('aerr').innerHTML = '<div class="bad"><b>Stock has changed since you added it.</b> Sort the lines marked above, then authorise again.</div>'; return; }
    drawBasket(); if (x.message !== 'login') $('aerr').innerHTML = `<div class="bad">${esc(x.message)}</div>`;
  }
}

// ---------- charge + finish ----------
function chargeScreen(){
  const d = DONE, ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov'; document.body.appendChild(ov);
  const pn = (BOOT.printers.find(p => p.id === d.printed_to) || {}).name;
  const draw = () => {
    ov.innerHTML = `<div class="charge"><div class="sub" style="font-size:16px">${esc(d.number)} · ${esc(d.cust)} · ${pn ? 'Sales order printing on the ' + esc(pn) + ' printer' : 'Not printed'}</div>
      <div class="amt">${gbp(d.total_inc)}</div><div style="font-size:20px;font-weight:700;letter-spacing:2px;color:var(--muted)">TO CHARGE · INC VAT</div>
      <div class="k" style="margin-top:26px">How did they pay?</div>
      <div class="row">${[['card', 'Paid by card'], ['cash', 'Paid by cash'], ['account', 'On account']].map(([v, t]) => `<button class="btn big ${d.paid === v ? 'g chosen' : ''}" data-pay="${v}" ${d.paid ? 'disabled' : ''}>${d.paid === v ? '✓ ' : ''}${t}</button>`).join('')}</div>
      <div class="k" style="margin-top:20px">Finish</div>
      <div class="row">${[['all', 'Everything collected'], ['part', 'Part collected'], ['none', 'Not collected']].map(([v, t]) => `<button class="btn big ${d.finished === v ? 'g chosen' : ''}" data-fin="${v}" ${d.finished || !d.paid ? 'disabled' : ''}>${d.finished === v ? '✓ ' : ''}${t}</button>`).join('')}</div>
      <div id="part"></div><div id="ferr"></div>
      <div class="row" style="margin-top:22px"><button class="btn" id="docs">Print other documents</button><button class="btn y big" id="next" ${d.paid && d.finished ? '' : 'disabled'}>New sale</button></div>
      <div id="docbox"></div></div>`;
    ov.querySelectorAll('[data-pay]').forEach(b => b.onclick = async () => { b.disabled = true; try { await api('', { action: 'paid', id: d.id, method: b.dataset.pay, served: SERVED.email }); d.paid = b.dataset.pay; draw(); } catch(x){ b.disabled = false; toast(x.message); } });
    ov.querySelectorAll('[data-fin]').forEach(b => b.onclick = () => finish(b.dataset.fin));
    $('docs').onclick = docMenu;
    $('next').onclick = nextSale;
  };
  const finish = async mode => {
    if (mode === 'part') {
      $('part').innerHTML = `<div class="card" style="text-align:left;max-width:640px;margin:10px auto"><div class="k">What has gone?</div>${d.lines.map((l, i) => `<div style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><input type="checkbox" data-pk="${i}" style="width:26px;height:26px"><div style="flex:1">${esc(l.name)}<div class="sub">${esc(l.sku)} · ${qf(l.qty)} ordered</div></div><input data-pq="${i}" value="${qf(l.qty)}" inputmode="decimal" style="width:80px"></div>`).join('')}
        <button class="btn y" id="pgo" style="margin-top:10px;width:100%">Confirm what's gone</button></div>`;
      $('pgo').onclick = async () => {
        const pick = d.lines.map((l, i) => ({ pid: l.pid, on: ov.querySelector(`[data-pk="${i}"]`).checked, qty: Number(ov.querySelector(`[data-pq="${i}"]`).value) || 0 })).filter(x => x.on && x.qty > 0).map(x => ({ pid: x.pid, qty: x.qty }));
        if (!pick.length) return toast("Tick what's gone"); await collect('part', pick); };
      return;
    }
    await collect(mode, []);
  };
  const collect = async (mode, pick) => {
    $('ferr').innerHTML = '<div class="sub" style="margin-top:8px">Updating Cin7…</div>';
    try { await api('', { action: 'collect', id: d.id, mode, pick, served: SERVED.email }); d.finished = mode; draw(); }
    catch(x){ $('ferr').innerHTML = `<div class="bad" style="max-width:640px;margin:10px auto">${esc(x.message)}<br>You can try again, or choose "Not collected" and sort it on the Collections screen.</div>`; }
  };
  const docMenu = () => {
    const box = $('docbox');
    box.innerHTML = `<div class="card" style="max-width:640px;margin:10px auto;text-align:left"><div class="g2"><div><div class="k">Document</div><select id="dd"><option value="order">Sales order</option><option value="pick">Pick sheet</option><option value="packslip">Delivery note</option><option value="proforma">Pro forma</option><option value="invoice">VAT invoice</option></select></div>
      <div><div class="k">Printer</div><select id="dp">${BOOT.printers.filter(p => p.id !== 'none').map(p => `<option value="${p.id}" ${p.id === (d.printed_to || 'counter') ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div></div>
      <button class="btn" id="dgo" style="margin-top:10px">Print</button></div>`;
    $('dgo').onclick = async () => { try { await api('', { action: 'print', id: d.id, doc: $('dd').value, printer: $('dp').value, served: SERVED.email }); toast('Sent to the printer'); } catch(x){ toast(x.message); } };
  };
  draw();
}
async function nextSale(){
  const ov = $('ov'); if (ov) ov.remove(); DONE = null; FEAT = null;
  if (BOOT.mode === 'counter') {
    const still = await modal(`Still ${esc(SERVED.name)}?`, 'Is the same person serving the next customer?', [{ t: 'Not me', v: false }, { t: 'Yes, still me', v: true, cls: 'y' }]);
    if (!still) { SERVED = null; return askName(); }
  }
  TAB = 'sale'; shell();
}

// ---------- counter sales list ----------
function listScreen(){
  const t = new Date().toLocaleDateString('en-CA');
  $('body').innerHTML = `<div class="card"><div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end" id="flt">
      <div><div class="k">Search</div><input id="lq" placeholder="Name, phone, order no., reference, who served, or an amount (45 or 40-50)"></div>
      <div><div class="k">From</div><input id="lf" type="date" value="${t}"></div><div><div class="k">To</div><input id="lt" type="date" value="${t}"></div>
      <div><div class="k">Branch</div><select id="ll"><option value="${esc(S.loc)}">${esc(S.loc)}</option><option value="">Both</option></select></div>
      <button class="btn" id="lgo">Search</button></div></div><div class="card" id="lres"><div class="sub">Loading…</div></div>`;
  if (window.matchMedia('(max-width:900px)').matches) $('flt').style.gridTemplateColumns = '1fr 1fr';
  const go = async () => {
    const qs = new URLSearchParams({ sales: '1', q: $('lq').value.trim(), from: $('lf').value, to: $('lt').value, loc: $('ll').value });
    try {
      const j = await api('?' + qs.toString()), rows = j.sales;

      $('lres').innerHTML = rows.length ? `<div class="sub" style="margin-bottom:6px">${rows.length} sale${rows.length === 1 ? '' : 's'} · ${gbp(sum)} inc VAT</div><div style="overflow:auto"><table class="lt"><tr><th>When</th><th>Order</th><th>Customer</th><th class="r">Total</th><th>Paid</th><th>Collected</th><th>Served by</th></tr>
        ${rows.map((r, i) => `<tr class="cl" data-i="${i}"><td>${dmy(r.created_at)} ${tm(r.created_at)}</td><td><b>${esc(r.order_number)}</b></td><td>${esc(r.cash_name ? r.cash_name + ' (cash)' : r.customer)}${r.reference ? `<div class="sub">${esc(r.reference)}</div>` : ''}</td>
          <td class="r"><b>${gbp(r.total_inc)}</b></td><td>${r.paid_by ? `<span class="st g">${{ card: 'Card', cash: 'Cash', account: 'Account' }[r.paid_by]}</span>` : '<span class="st a">Not set</span>'}</td>
          <td>${r.collection === 'all' ? '<span class="st g">Collected</span>' : r.collection === 'part' ? '<span class="st a">Part</span>' : '<span class="st b">Open</span>'}</td><td>${esc(r.served_name)}</td></tr>`).join('')}</table></div>` : '<div class="sub">No counter sales match.</div>';
      $('lres').querySelectorAll('[data-i]').forEach(tr => tr.onclick = () => openSale(rows[+tr.dataset.i]));
    } catch(x){ if (x.message !== 'login') $('lres').innerHTML = `<div class="bad">${esc(x.message)}</div>`; }
  };
  $('lgo').onclick = go; $('lq').onkeydown = e => { if (e.key === 'Enter') go(); };
  go();
}
function openSale(r){
  DONE = { id: r.id, number: r.order_number, total_inc: r.total_inc, cust: r.cash_name || r.customer, printed_to: null, paid: r.paid_by, finished: r.collection === 'open' ? null : r.collection,
    lines: (r.lines || []).map(l => ({ pid: l.pid, sku: l.sku, name: l.name, qty: l.qty })) };
  chargeScreen();
  const ov = $('ov'); const close = document.createElement('button'); close.className = 'btn'; close.textContent = '← Back to the list'; close.style.marginBottom = '10px';
  close.onclick = () => { ov.remove(); DONE = null; TAB = 'list'; shell(); }; ov.prepend(close);
}

// ---------- admin: pair this PC as a counter ----------
async function setup(){
  let devs = [];
  try { devs = (await api('?devices=1')).devices; } catch(x){ return toast(x.message); }
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><h3>Counter PCs</h3><div class="sub">Set this PC up as a counter: it then opens straight to "Who's serving?", works 05:00 to 18:00, and can only use this screen.</div>
    <div class="g2" style="margin-top:10px"><div><div class="k">Branch</div><select id="pl"><option>Bromham</option><option>Wootton Bassett</option></select></div><div><div class="k">Name</div><input id="pn" placeholder="e.g. Bromham counter 1"></div></div>
    <button class="btn y" id="pgo" style="margin-top:10px;width:100%">Make this PC a counter</button>
    ${devs.length ? `<div class="k" style="margin-top:16px">Paired</div>${devs.map(d => `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><div>${esc(d.name)}<div class="sub">${esc(d.location)} · ${d.active ? (d.last_seen_at ? 'last used ' + dmy(d.last_seen_at) + ' ' + tm(d.last_seen_at) : 'not used yet') : 'switched off'}</div></div>${d.active ? `<button class="btn sm" data-off="${d.id}">Switch off</button>` : ''}</div>`).join('')}` : ''}
    <div class="acts"><button class="btn" id="pcl">Close</button></div></div>`;
  document.body.appendChild(m);
  $('pcl').onclick = () => m.remove();
  m.querySelectorAll('[data-off]').forEach(b => b.onclick = async () => { if (!(await modal('Switch off?', 'That PC will stop working as a counter straight away.', [{ t: 'Cancel', v: false }, { t: 'Switch off', v: true, cls: 'y' }]))) return; await api('', { action: 'unpair', id: +b.dataset.off }); m.remove(); setup(); });
  $('pgo').onclick = async () => {
    try { const j = await api('', { action: 'pair', location: $('pl').value, name: $('pn').value }); store.set('tsd_pos_dev', j.token); try { await TSDAuth.logout(); } catch(e){} location.reload(); }
    catch(x){ toast(x.message); }
  };
}

if (DEV) start();
else { if (token) start(); else showLogin(); TSDAuth.mount(t => { token = t; start(); }); }
</script>
<script>
(function(){   // pick up a new version by itself, but never in the middle of a sale
  const BUILD = '20261113104745';
  const busy = () => { const a = document.activeElement; return (a && a.matches && a.matches('input,textarea,select')) || DONE || (S && (S.lines.length || S.cust)); };
  let newer = false;
  async function check(){ try { if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); } if (newer && !busy()) location.reload(); } catch(e){} }
  setInterval(check, 120000);
})();
</script>

<style>
:root{
  --bg:#262727; --panel:#323333; --panel2:#3B3C3C; --line:#474949; --ink:#FFFFFF; --muted:#B9BCBC;
  --accent:#EED107; --good:#7DDB98; --bad:#FF7A6B; --blue:#8EC5FF;
  --num:'Bebas Neue','DIN Condensed','Arial Narrow',Arial,sans-serif;
  --body:Barlow,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
button,input,select{font-family:inherit;font-size:15px}
.wrap{padding:16px 20px 28px;max-width:1200px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--panel);border-radius:12px;padding:14px 16px;margin-bottom:12px}
input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.y{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pbtn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:13px}
.pbtn:hover{border-color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{flex:1;min-width:200px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.toolbar .cnt{font-size:13px;color:var(--muted)}
.toolbar .cnt b{color:var(--ink)}
.spacer{flex:1}
.warnline{font-size:12.5px;color:var(--accent-text);margin:-4px 0 10px 2px}
table.ol{width:100%;border-collapse:collapse}
table.ol th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.ol td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ol tr.clk{cursor:pointer}
table.ol tr.clk:hover td{background:var(--panel2)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.st{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--line);white-space:nowrap}
.st.BACKORDERED{background:var(--accent);color:var(--on-accent)}
.pr-pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pr-not{background:var(--line);color:var(--muted)}
.pr-yes{background:var(--panel2);color:var(--blue);border:1px solid var(--blue)}
.empty{color:var(--muted);padding:16px 0}
.on{color:var(--good)} .off{color:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#mbox{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto}
#mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:60}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
#msg{padding:40px;text-align:center;color:var(--muted)}
.loglist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.logrow{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:none}
.logrow .who{color:var(--muted);text-align:right}
.logrow.failed .who{color:var(--bad)}
.docrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.docrow:last-child{border-bottom:none}
#pv{width:100%;height:62vh;border:0;background:#fff;border-radius:8px}
@media(max-width:700px){table.ol .hm{display:none}}
</style>

<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><div id="msg">Loading…</div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script src="auth.js?v=20261113143211"></script>
<script src="activity.js?v=20261113143211"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/orders';
const OPEN = new URLSearchParams(location.search).get('open');
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
const PR = { dispatch: 'Dispatch printer', counter: 'Bromham counter printer', wbcounter: 'Wootton Bassett counter printer', office: 'Office printer' };
const lastPr = () => { try { return localStorage.getItem('tsd_print_pr') || 'dispatch'; } catch(e){ return 'dispatch'; } };
const setPr = p => { try { localStorage.setItem('tsd_print_pr', p); } catch(e){} };
let token = store.get('tsd_me_token'), D = null, timer;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy = s => s ? new Date(String(s).slice(0,10) + 'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
const when = s => { const d = new Date(s), t = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); return d.toDateString() === new Date().toDateString() ? 'Today ' + t : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + t; };
const PN = { dispatch: 'Dispatch printer', office: 'Office printer', counter: 'Bromham counter printer', wbcounter: 'Wootton Bassett counter printer', browser: 'This computer' };
const DN = { pick: 'Pick sheet', picklist: 'Pick list', packslip: 'Packing list', order: 'Sales order', quote: 'Quote', proforma: 'Proforma invoice', invoice: 'VAT invoice' };
const SELECTED = new Set();
const isBO = o => String(o.status || '').toUpperCase() === 'BACKORDERED';
const isPrinted = o => !!o.prints;

function toast(t){ const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 3500); }
function modal(h){ document.getElementById('mbox').innerHTML = h; document.getElementById('modal').style.display = 'flex'; }
function closeModal(){ document.getElementById('modal').style.display = 'none'; }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function showLogin(msg){ clearInterval(timer); document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = msg || ''; }
function start(){ document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block'; shell(); load(); clearInterval(timer); timer = setInterval(() => { if (document.getElementById('modal').style.display !== 'flex') load(); }, 45000); }
async function api(qs, body){
  const r = await fetch(API + (qs || ''), body ? {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({})); if (j.error || (body && j.ok === false)) throw new Error(j.error || "Couldn't do that"); return j;
}

function shell(){
  document.getElementById('app').innerHTML = `<header><div><div class="title">Print Orders</div><div class="sub">Pick sheets and packing lists, printed and logged here — not from Cin7. <span id="stn"></span></div></div></header>
  <div class="bar"><input id="sq" placeholder="Search order number, customer or postcode"><select id="sl"><option value="">Both sites</option><option>Bromham</option><option>Wootton Bassett</option></select></div>
  <div class="toolbar">
    <span class="cnt" id="cnt">Loading…</span>
    <div class="spacer"></div>
    <select id="prsel" title="Printer">${Object.entries(PR).filter(([p]) => p === 'dispatch' || p === 'office').map(([p, n]) => `<option value="${p}">${n}</option>`).join('')}</select>
    <button class="btn" id="btnSel" disabled>Print selected (0)</button>
    <button class="btn y" id="btnAll" disabled>Print all unprinted (0)</button>
  </div>
  <div class="warnline" id="bowarn" style="display:none"></div>
  <div class="card" id="list"><div class="empty">Loading…</div></div>`;
  document.getElementById('prsel').value = lastPr();
  document.getElementById('prsel').onchange = e => setPr(e.target.value);
  let qt; document.getElementById('sq').oninput = e => { clearTimeout(qt); qt = setTimeout(load, 350); };
  document.getElementById('sl').onchange = load;
  document.getElementById('btnSel').onclick = () => printIds([...SELECTED]);
  document.getElementById('btnAll').onclick = () => printIds((D.orders || []).filter(o => !isPrinted(o) && !isBO(o)).map(o => o.id));
}

async function load(){
  const q = document.getElementById('sq').value.trim(), loc = document.getElementById('sl').value;
  try { D = await api('?q=' + encodeURIComponent(q) + '&loc=' + encodeURIComponent(loc) + '&status=open'); draw(); }
  catch(x){ if (x.message !== 'login') { const l = document.getElementById('list'); if (l) l.innerHTML = `<div class="empty">${esc(x.message)}</div>`; } }
}

function draw(){
  const stn = document.getElementById('stn');
  if (stn) stn.innerHTML = ['dispatch', 'office'].map(p => D.online[p] ? `<b class="on">● ${PR[p]} connected</b>` : `<b class="off">● ${PR[p]} not connected</b>`).join(' &nbsp; ');
  // drop selections for orders no longer on screen
  const ids = new Set((D.orders || []).map(o => o.id)); [...SELECTED].forEach(id => { if (!ids.has(id)) SELECTED.delete(id); });
  const boCount = (D.orders || []).filter(isBO).length, allCount = (D.orders || []).filter(o => !isPrinted(o) && !isBO(o)).length;
  document.getElementById('cnt').innerHTML = `<b>${D.orders.length}</b> open order${D.orders.length === 1 ? '' : 's'}${boCount ? ` · <b>${boCount}</b> backordered` : ''}`;
  const bw = document.getElementById('bowarn');
  if (boCount) { bw.style.display = 'block'; bw.textContent = `${boCount} backordered order${boCount === 1 ? ' is' : 's are'} left out of "Print all unprinted" — check stock first, then print it from the order itself if you're happy to go.`; }
  else bw.style.display = 'none';
  document.getElementById('btnAll').textContent = `Print all unprinted (${allCount})`; document.getElementById('btnAll').disabled = !allCount;
  document.getElementById('btnSel').textContent = `Print selected (${SELECTED.size})`; document.getElementById('btnSel').disabled = !SELECTED.size;
  document.getElementById('list').innerHTML = D.orders.length ? `<table class="ol"><tr><th style="width:30px"><input type="checkbox" id="selall"></th><th>Order</th><th>Customer</th><th class="hm">Site</th><th>Status</th><th>Printed</th><th class="r hm">Lines</th></tr>` +
    D.orders.map(o => `<tr class="clk" data-row="${o.id}"><td onclick="event.stopPropagation()"><input type="checkbox" data-sel="${o.id}" ${SELECTED.has(o.id) ? 'checked' : ''}></td>
      <td><b>${esc(o.no)}</b>${o.ref ? `<div class="sub">Web #${esc(o.ref)}</div>` : ''}</td>
      <td>${esc(o.customer)}</td><td class="hm">${esc(o.location)}</td>
      <td><span class="st ${esc(o.status)}">${esc(o.status)}</span></td>
      <td>${o.prints ? `<span class="pr-pill pr-yes" title="${esc(when(o.prints.at))} by ${esc(o.prints.by)}">Printed${o.prints.n > 1 ? ' ×' + o.prints.n : ''} · ${esc(o.prints.by)}</span>` : '<span class="pr-pill pr-not">Not printed</span>'}</td>
      <td class="r hm">${o.lines ?? ''}</td></tr>`).join('') + '</table>' + (D.orders.length >= 100 ? '<div class="sub" style="margin-top:8px">Showing the latest 100. Search to narrow it down.</div>' : '') : '<div class="empty">No open orders match.</div>';
  const selAll = document.getElementById('selall');
  if (selAll) { const sel = (D.orders || []).filter(o => !isBO(o)); selAll.checked = sel.length > 0 && sel.every(o => SELECTED.has(o.id));
    selAll.onchange = () => { sel.forEach(o => selAll.checked ? SELECTED.add(o.id) : SELECTED.delete(o.id)); draw(); }; }
  document.querySelectorAll('[data-sel]').forEach(c => c.onchange = () => { c.checked ? SELECTED.add(c.dataset.sel) : SELECTED.delete(c.dataset.sel); draw(); });
  document.querySelectorAll('tr[data-row]').forEach(r => r.onclick = () => openDlg(D.orders.find(o => o.id === r.dataset.row)));
}

// queues a Pick sheet + Packing list for each order id, to whichever printer is selected
async function printIds(ids){
  if (!ids.length) return;
  const bo = ids.filter(id => isBO((D.orders || []).find(o => o.id === id) || {}));
  if (bo.length && !confirm(`${bo.length} of these ${bo.length === 1 ? 'is' : 'are'} backordered. Check stock before printing. Print them anyway?`)) return;
  const pr = document.getElementById('prsel').value || 'dispatch';
  document.getElementById('btnSel').disabled = true; document.getElementById('btnAll').disabled = true;
  let ok = 0, fail = 0;
  for (let i = 0; i < ids.length; i += 4) {
    await Promise.all(ids.slice(i, i + 4).map(async id => {
      try { await api('', { action: 'print', id, doc: 'pick', printer: pr }); await api('', { action: 'print', id, doc: 'packslip', printer: pr }); ok++; }
      catch(e){ fail++; }
    }));
  }
  SELECTED.clear();
  toast(`${ok} order${ok === 1 ? '' : 's'} sent to the ${(PR[pr] || pr).toLowerCase()}${fail ? ` · ${fail} failed` : ''}${D.online[pr] ? '' : ' (not connected — will print when it is back)'}`);
  load();
}

async function printOne(id, doc, pr){
  await api('', { action: 'print', id, doc, printer: pr });
}

function gotoPick(no){
  try { if (window.parent !== window) { window.parent.postMessage({ tsdGoto: { screen: 'pick', open: no } }, location.origin); return; } } catch(e){}
  location.href = 'warehouse.html?open=' + encodeURIComponent(no);
}

async function openDlg(o){
  if (!o) return;
  modal('<div class="sub">Loading…</div>');
  const docs = [['pick', 'Pick sheet', 'no prices'], ['packslip', 'Packing list', 'with a qty-sent box'], ['picklist', 'Pick list', 'with bin locations'], ...(D.can_price ? [['order', 'Sales order', 'with prices'], ['quote', 'Quote', 'with prices'], ['proforma', 'Proforma invoice', 'with bank details'], ['invoice', 'VAT invoice', 'from Cin7']] : [])];
  let log = [];
  try { log = (await api('', { action: 'printlog', id: o.id })).log || []; } catch(e){}
  const st = ['dispatch', 'office'].map(p => D.online[p] ? `<span class="on">● ${PR[p]} connected</span>` : `<span class="off">● ${PR[p]} not connected</span>`).join(' &nbsp; ');
  modal(`<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><h3 style="margin:0">${esc(o.no)} · ${esc(o.customer)}</h3>${isBO(o) ? '<span class="st BACKORDERED">BACKORDERED</span>' : ''}</div>
    <div class="sub">${st}</div>
    <div class="sub" style="color:var(--ink)">Print again as</div>
    ${docs.map(([d, n, h]) => `<div class="docrow"><div style="flex:1;min-width:120px"><b>${n}</b> <span class="sub">${h}</span></div>
      <button class="pbtn" data-pv="${d}">View / print here</button><button class="pbtn" data-q="${d}" data-p="dispatch" style="border-color:var(--accent)">Dispatch</button><button class="pbtn" data-q="${d}" data-p="office" style="border-color:var(--accent)">Office</button></div>`).join('')}
    <div id="perr" class="sub"></div>
    <div class="sub" style="color:var(--ink);margin-top:4px">Print log</div>
    <div class="loglist">${log.length ? log.map(x => `<div class="logrow${x.status === 'failed' ? ' failed' : ''}"><span>${esc(when(x.requested_at))} · ${esc(DN[x.doc] || x.doc)}${x.copies > 1 ? ' ×' + x.copies : ''}</span><span class="who">${esc(PN[x.printer] || x.printer)} · ${esc(x.requested_by)}${x.status === 'failed' ? ' · failed' : x.status === 'queued' || x.status === 'printing' ? ' · waiting' : ''}</span></div>`).join('') : '<div class="logrow"><span class="sub">Never printed from here.</span></div>'}</div>
    <div class="row"><button class="pbtn" id="togo">Open in Pick &amp; dispatch →</button><button class="btn" onclick="closeModal()">Close</button></div>`);
  document.getElementById('togo').onclick = () => { closeModal(); gotoPick(o.no); };
  document.querySelectorAll('[data-pv]').forEach(b => b.onclick = async () => { b.disabled = true; b.textContent = 'Loading…'; try { const j = await api('?doc=' + b.dataset.pv + '&id=' + o.id); preview(o, j, b.dataset.pv); } catch(x){ document.getElementById('perr').textContent = x.message; b.disabled = false; b.textContent = 'View / print here'; } });
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = async () => {
    if (isBO(o) && !confirm('This order is backordered. Check stock before printing. Print it anyway?')) return;
    b.disabled = true; const pr = b.dataset.p;
    try { const j = await api('', { action: 'print', id: o.id, doc: b.dataset.q, printer: pr }); closeModal(); toast(j.online[pr] ? 'Sent to the ' + PR[pr].toLowerCase() : 'Queued. The ' + PR[pr].toLowerCase() + ' is not connected, it will print when it is back.'); load(); }
    catch(x){ document.getElementById('perr').textContent = x.message; b.disabled = false; }
  });
}
function preview(o, j, doc){
  modal(`<h3 style="margin:0">${esc(j.title)}</h3><iframe id="pv"></iframe><div class="row"><button class="btn" id="pb">Back</button><button class="btn y" id="pp">Print this</button></div>`);
  const f = document.getElementById('pv'); f.srcdoc = j.html;
  document.getElementById('pb').onclick = () => openDlg(o);
  document.getElementById('pp').onclick = () => { try { f.contentWindow.focus(); f.contentWindow.print(); if (doc) api('', { action: 'logprint', id: o.id, doc }).then(load).catch(() => {}); } catch(e){ toast("Couldn't open the print box"); } };
}

if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });
</script>
<script>
(function(){
  const BUILD = '20261127001';
  const busy = () => { const m = document.getElementById('modal'); const a = document.activeElement; return (m && getComputedStyle(m).display !== 'none') || (a && a.matches && a.matches('input,textarea,select')); };
  let newer = false;
  async function check(){ try { if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); } if (newer && !busy()) location.reload(); } catch(e){} }
  setInterval(check, 120000);
})();
</script>
</body>

<style>body{background:#262727;color:#fff;font-family:Arial,sans-serif;margin:0;padding:24px}h1{margin:0 0 4px}.sub{color:#B9BCBC}.ok{color:#7DDB98}.bad{color:#FF7A6B}
table{border-collapse:collapse;margin-top:16px;width:100%;max-width:700px}td{padding:6px 8px;border-bottom:1px solid #474949}iframe{position:absolute;left:-9999px;width:800px;height:1100px;border:0}</style></head>
<body><h1>Print station</h1><div class="sub">Leave this window open on the work PC. It prints anything sent from Bob to the default printer.</div>
<p id="s">Starting…</p><table id="log"></table><iframe id="f"></iframe>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/orders';
let key = new URLSearchParams(location.search).get('k'); try { if (key) localStorage.setItem('tsd_ps_key', key); else key = localStorage.getItem('tsd_ps_key'); } catch(e){}
if (key) history.replaceState(null, '', location.pathname);
const logEl = document.getElementById('log'), st = document.getElementById('s'); let busy = false;
const hdr = () => ({ 'Content-Type': 'application/json', 'x-station-key': key });
const add = (t, ok) => { const r = logEl.insertRow(0); r.innerHTML = `<td>${new Date().toLocaleTimeString('en-GB')}</td><td class="${ok ? 'ok' : 'bad'}">${t}</td>`; while (logEl.rows.length > 25) logEl.deleteRow(-1); };
const printHtml = (html, copies) => new Promise((res, rej) => { const f = document.getElementById('f'); f.onload = () => { setTimeout(() => { try { for (let i = 0; i < copies; i++) f.contentWindow.print(); res(); } catch(e){ rej(e); } }, 400); }; f.srcdoc = html; });
async function tick(){
  if (!key) { st.innerHTML = '<span class="bad">No key. Open this page from the link in Bob (Sales orders > Office print station).</span>'; return; }
  if (busy) return; busy = true;
  try {
    const r = await fetch(API, { method: 'POST', headers: hdr(), body: JSON.stringify({ action: 'poll' }) });
    if (r.status === 401) { st.innerHTML = '<span class="bad">That key isn\'t valid. Get a fresh link from Bob.</span>'; busy = false; return; }
    const j = await r.json(); st.innerHTML = '<span class="ok">● Connected</span> · checked ' + new Date().toLocaleTimeString('en-GB');
    for (const job of j.jobs || []) {
      try { await printHtml(job.html, job.copies || 1); await fetch(API, { method: 'POST', headers: hdr(), body: JSON.stringify({ action: 'done', id: job.id, ok: true }) }); add('Printed ' + job.title, true); }
      catch(e){ await fetch(API, { method: 'POST', headers: hdr(), body: JSON.stringify({ action: 'done', id: job.id, ok: false, error: String(e).slice(0, 150) }) }); add('Failed: ' + job.title, false); }
    }
  } catch(e){ st.innerHTML = '<span class="bad">● Can\'t reach Bob. Retrying…</span>'; }
  busy = false;
}
tick(); setInterval(tick, 5000);
</script></body></html>

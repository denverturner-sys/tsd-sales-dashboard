html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:15px}
.wrap{padding:16px 20px 28px;max-width:1000px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--panel);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.add{display:grid;grid-template-columns:1fr 150px 130px auto;gap:8px;align-items:center}
@media (max-width:700px){.add{grid-template-columns:1fr 1fr}.add .full{grid-column:1/-1}}
input,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{width:100%;min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.y{background:var(--accent);color:#262727;border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.del{color:var(--bad);border-color:rgba(255,122,107,.5)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.tick{width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);background:transparent;cursor:pointer;flex:none;margin-top:1px;color:#262727;font-weight:900;font-size:16px;line-height:1}
.tick.on{background:var(--good);border-color:var(--good)}
.tb{flex:1;min-width:0}
.tt{font-size:16px;font-weight:600;line-height:1.3;word-wrap:break-word}
.done .tt{text-decoration:line-through;color:var(--muted)}
.meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.meta .late{color:var(--bad);font-weight:700} .meta .today{color:var(--accent);font-weight:700}
.notes{font-size:14px;color:#ddd;margin-top:6px;white-space:pre-wrap;line-height:1.4}
.pri{display:inline-block;font-size:11px;font-weight:800;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.pri.p2{background:var(--bad);color:#262727} .pri.p1{background:var(--accent);color:#262727}
.tag{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:1px 8px}
.acts{display:flex;gap:6px;flex:none}
.empty{color:var(--muted);padding:10px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#mbox{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
#mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:60}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
#msg{padding:40px;text-align:center;color:var(--muted)}

.wrap{max-width:1100px}
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tabs button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--accent);color:#262727;border-color:var(--accent)}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--panel);border-radius:10px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-family:var(--num);font-size:34px;font-weight:400;letter-spacing:1px;line-height:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
.chips button.on{color:var(--ink);border-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.pc{background:var(--panel);border-radius:12px;padding:14px 16px;cursor:pointer;border-left:4px solid var(--good);display:flex;flex-direction:column;gap:7px}
.pc:hover{background:var(--panel2)}
.pc.off{border-left-color:var(--bad)} .pc.done{border-left-color:var(--line);opacity:.75} .pc.lt{border-left-color:var(--bad)}
.pc h3{margin:0;font-size:17px;line-height:1.25}
.pill{display:inline-block;white-space:nowrap;font-size:11px;font-weight:800;border-radius:4px;padding:2px 7px;letter-spacing:.5px}
.pill.on_track{background:rgba(125,219,152,.18);color:var(--good)} .pill.off_track{background:var(--bad);color:#262727} .pill.done{background:var(--line);color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden} .bar i{display:block;height:100%;background:var(--good)} .pc.off .bar i,.pc.lt .bar i{background:var(--bad)}
.next{font-size:13px;color:var(--muted)} .next b{color:var(--ink);font-weight:600}
.late{color:var(--bad)} .soon{color:var(--accent)} .ok{color:var(--good)}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.step .tt{font-size:15px;font-weight:500;flex:1} .step .who{font-size:13px;color:var(--blue);white-space:nowrap}
.step .tick{width:22px;height:22px;margin:0}
.irow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
#mbox.wide{max-width:680px;max-height:92vh;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addstep{display:grid;grid-template-columns:1fr 140px 130px auto;gap:6px;margin-top:10px}
@media (max-width:700px){.addstep{grid-template-columns:1fr 1fr}.addstep input:first-child{grid-column:1/-1}}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><div id="msg">Loading…</div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script src="auth.js?v=20261110140615"></script>
<script src="activity.js?v=20261110140615"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/projects';
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
const TAPI = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/tasks';
let TD = null, TPEOPLE = [], asUser = '', ASV = null, canTeam = false;
let token = store.get('tsd_me_token'), D = null, timer, view = 'projects', filter = 'all', showDone = false, openId = null;
const qs = new URLSearchParams(location.search);
(() => { const o = qs.get('open'); if (o === 'issues') view = 'issues'; else if (o) openId = +o || null; })();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy = s => s ? new Date(String(s).slice(0,10) + 'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
const days = s => Math.max(0, Math.floor((Date.now() - new Date(s).getTime()) / 864e5));
function toast(t){ const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 3000); }
function modal(h, wide){ const b = document.getElementById('mbox'); b.className = wide ? 'wide' : ''; b.innerHTML = h; document.getElementById('modal').style.display = 'flex'; }
function closeModal(){ document.getElementById('modal').style.display = 'none'; openId = null; }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function showLogin(msg){ clearInterval(timer); document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = msg || ''; }
function start(){ document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block'; refresh(); clearInterval(timer);
  timer = setInterval(() => { if (document.getElementById('modal').style.display !== 'flex' && !document.activeElement?.matches('input,textarea,select')) refresh(); }, 120000); }
async function api(body){
  const r = await fetch(API, body ? {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (body && !j.ok) throw new Error(j.error || "Couldn't save");
  if (j.error) throw new Error(j.error);
  return j;
}
// tell the main page so My Tasks / the bell stay in step
const poke = () => { try { window.top.postMessage({ tsd: 'tasks' }, location.origin); } catch(e){} };
async function refresh(){
  try { D = await api(); if (!TD && !canTeam) loadTeamDash(); else if (view === 'team') loadTeamDash(); render(); if (openId) { const p = D.projects.find(x => x.id === openId); if (p) openProject(p.id); else openId = null; } }
  catch(x){ if (x.message !== 'login' && !D) document.getElementById('app').innerHTML = `<div id="msg">${esc(x.message)}</div>`; }
}
window.addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.tsd !== 'open') return; const o = e.data.ref; if (o === 'issues') { view = 'issues'; render(); } else if (+o) { view = 'projects'; openProject(+o); } });

const stats = p => { const n = p.steps.length, d = p.steps.filter(s => s.done).length; return { n, d, pct: n ? Math.round(d / n * 100) : 0 }; };
const isLate = p => p.status !== 'done' && p.due && p.due < D.today;
const opts = (sel, blank) => (blank ? `<option value="">${blank}</option>` : '') + D.people.map(x => `<option value="${esc(x.email)}" ${x.email === sel ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
const dueTag = (due, done) => !due ? '' : done ? `due ${dmy(due)}` : due < D.today ? `<span class="late"><b>overdue</b> · ${dmy(due)}</span>` : due === D.today ? `<span class="soon"><b>due today</b></span>` : `due ${dmy(due)}`;


// ---- Team (10 Nov): leads see their people's workload; managers can view as anyone ----
async function tapi(qs){
  const r = await fetch(TAPI + qs, { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'error'); return j;
}
const asq = () => asUser ? '&as=' + encodeURIComponent(asUser) : '';
async function loadTeamDash(){
  try {
    TD = await tapi('?view=dash' + asq()); canTeam = true;
    ASV = asUser ? await tapi('?x=1' + asq()) : null;
    if (D.me.is_admin && !TPEOPLE.length) TPEOPLE = (await tapi('?view=people')).people || [];
  } catch(x){ if (x.message === 'login') return; if (!asUser) { canTeam = false; TD = null; if (view === 'team') view = 'projects'; } else { TD = { members: [], ops: {}, viewing_as: null, today: D.today, err: true }; ASV = null; } }
  render();
}
const seenTxt = at => { if (!at) return '<span class="late">Not seen yet</span>'; const d = new Date(at), t = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' });
  return `<span class="ok">Seen ${d.toLocaleDateString('en-GB', { timeZone: 'Europe/London' }) === new Date().toLocaleDateString('en-GB', { timeZone: 'Europe/London' }) ? t : dmy(at) + ' ' + t}</span>`; };
function busy(m){ return m.overdue >= 2 || m.open >= 6 ? ['Busy', 'late'] : m.open >= 4 ? ['Fairly full', 'soon'] : ['Has capacity', 'ok']; }
function teamView(){
  if (!TD) return '<div class="empty">Loading…</div>';
  const o = TD.ops || {}, admin = D.me.is_admin;
  const sel = admin ? `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><span class="k">View as</span><select id="asel"><option value="">Everyone (manager view)</option>${TPEOPLE.map(x => `<option value="${esc(x.email)}" ${x.email === asUser ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>${asUser ? `<span class="sub">Read-only. This is what ${esc(TD.viewing_as || '')} sees: nothing you do here marks anything as seen.</span>` : ''}</div>` : '';
  const strip = `<div class="strip"><div class="stat"><span class="k">${esc(o.location || 'Bromham')} orders to send</span><b>${o.to_send ?? '–'}</b></div><div class="stat"><span class="k">Overdue now</span><b class="${o.overdue_now ? 'late' : ''}">${o.overdue_now ?? '–'}</b></div><div class="stat"><span class="k">Picked, waiting</span><b>${o.picked_waiting ?? '–'}</b></div><div class="stat"><span class="k">Sent today</span><b>${o.sent_today ?? '–'}</b></div></div>
    <div class="sub" style="margin:-4px 0 12px">Orders aren't given to individuals, so these are the whole team's numbers. "Busy" means 6+ open tasks or 2+ overdue.</div>`;
  const cards = TD.members.length ? TD.members.map(m => { const [bl, bc] = busy(m);
    return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b style="font-size:17px">${esc(m.name)}</b> <span class="${bc}" style="font-weight:700;margin-left:8px">${bl}</span></div>
      <div class="sub">${m.open} open · <span class="${m.overdue ? 'late' : ''}">${m.overdue} overdue</span> · ${m.urgent} high/urgent · ${m.done_7d} done this week</div></div>
      ${m.tasks.length ? m.tasks.map(t => `<div class="step"><div class="tt">${t.priority ? `<span class="pill ${t.priority === 2 ? 'off_track' : 'on_track'}" style="margin-right:6px">${t.priority === 2 ? 'URGENT' : 'HIGH'}</span>` : ''}${esc(t.title)}</div><div class="who" style="text-align:right">${t.due ? dueTag(t.due, false) + ' · ' : ''}${t.given ? seenTxt(t.seen_at) : 'their own'}</div></div>`).join('') : '<div class="empty">Nothing open that you can see.</div>'}
      ${m.hidden ? `<div class="sub" style="margin-top:6px">+ ${m.hidden} of their own tasks (private, so only counted)</div>` : ''}</div>`; }).join('') : `<div class="card"><div class="empty">${TD.err ? 'Nothing to show for this person.' : 'No team set up yet. Set who leads whom in Management > Users &amp; access.'}</div></div>`;
  const mine = ASV ? `<div class="card"><div class="k" style="margin-bottom:6px">${esc(TD.viewing_as || '')}'s own My Tasks</div>${ASV.tasks.filter(t => t.status === 'open').length ? ASV.tasks.filter(t => t.status === 'open').map(t => `<div class="step"><div class="tt">${esc(t.title)}${t.added_for_you ? ' <span class="tag">Added for you</span>' : ''}</div><div class="who">${t.due ? dueTag(t.due, false) : ''}</div></div>`).join('') : '<div class="empty">All clear.</div>'}</div>` : '';
  return sel + strip + cards + mine;
}

function render(){
  const act = D.projects.filter(p => p.status !== 'done'), fin = D.projects.filter(p => p.status === 'done');
  const off = act.filter(p => p.status === 'off_track').length, late = act.filter(isLate).length;
  const mineN = act.filter(p => p.owner === D.me.email).length, openIss = D.issues.filter(i => i.status === 'open').length;
  document.getElementById('app').innerHTML = `
  <header><div><div class="title">Tasks &amp; Projects</div><div class="sub">What the company is working on, and what's stuck. Your own to-do list is on <b>My Tasks</b>; steps assigned to you in a project show up there too.</div></div>
    <button class="btn y" id="newbtn">${view === 'issues' ? '+ Raise an issue' : '+ New project'}</button></header>
  <div class="tabs"><button data-v="projects" class="${view === 'projects' ? 'on' : ''}">Projects (${act.length})</button><button data-v="issues" class="${view === 'issues' ? 'on' : ''}">Issues (${openIss})</button>${canTeam || D.me.is_admin ? `<button data-v="team" class="${view === 'team' ? 'on' : ''}">Team</button>` : ''}</div>
  ${view === 'projects' ? projectsView(act, fin, off, late, mineN) : view === 'team' ? teamView() : issuesView()}`;
  document.querySelectorAll('.tabs [data-v]').forEach(b => b.onclick = () => { view = b.dataset.v; if (view === 'team') loadTeamDash(); else render(); });
  const as = document.getElementById('asel'); if (as) as.onchange = () => { asUser = as.value; TD = null; ASV = null; render(); loadTeamDash(); };
  document.getElementById('newbtn').style.display = view === 'team' ? 'none' : '';
  document.getElementById('newbtn').onclick = () => view === 'issues' ? newIssue() : newProject();
  document.querySelectorAll('[data-p]').forEach(c => c.onclick = () => openProject(+c.dataset.p));
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  const sd = document.getElementById('showdone'); if (sd) sd.onclick = () => { showDone = !showDone; render(); };
  document.querySelectorAll('[data-isolve]').forEach(b => b.onclick = () => solveIssue(+b.dataset.isolve));
  document.querySelectorAll('[data-iedit]').forEach(b => b.onclick = () => editIssue(+b.dataset.iedit));
  document.querySelectorAll('[data-ireopen]').forEach(b => b.onclick = async () => { try { await api({ action: 'issue_solve', id: +b.dataset.ireopen, on: false }); refresh(); } catch(x){ toast(x.message); } });
}
function projectsView(act, fin, off, late, mineN){
  const f = { all: act, mine: act.filter(p => p.owner === D.me.email), attn: act.filter(p => p.status === 'off_track' || isLate(p)) }[filter] || act;
  const sorted = [...f].sort((a, b) => (b.status === 'off_track') - (a.status === 'off_track') || (isLate(b) - isLate(a)) || String(a.due || '9999').localeCompare(String(b.due || '9999')));
  return `<div class="strip"><div class="stat"><span class="k">Active</span><b>${act.length}</b></div><div class="stat"><span class="k">Off track</span><b class="${off ? 'late' : ''}">${off}</b></div>
    <div class="stat"><span class="k">Past due date</span><b class="${late ? 'late' : ''}">${late}</b></div><div class="stat"><span class="k">Yours</span><b>${mineN}</b></div></div>
  <div class="chips">${[['all','Everything'],['mine','Mine'],['attn','Needs attention']].map(([k, n]) => `<button data-f="${k}" class="${filter === k ? 'on' : ''}">${n}</button>`).join('')}</div>
  ${sorted.length ? `<div class="pgrid">${sorted.map(card).join('')}</div>` : `<div class="card empty">${act.length ? 'Nothing here.' : 'No projects yet. Hit <b>+ New project</b>: a project is a goal with one owner, a due date and the steps to get there.'}</div>`}
  ${fin.length ? `<div style="margin-top:16px"><button class="btn sm" id="showdone">${showDone ? 'Hide' : 'Show'} finished (${fin.length})</button></div>${showDone ? `<div class="pgrid" style="margin-top:10px">${fin.map(card).join('')}</div>` : ''}` : ''}`;
}
function card(p){
  const s = stats(p), nxt = p.steps.find(x => !x.done);
  return `<div class="pc ${p.status === 'off_track' ? 'off' : p.status === 'done' ? 'done' : isLate(p) ? 'lt' : ''}" data-p="${p.id}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3>${esc(p.title)}</h3><span class="pill ${p.status}">${p.status === 'on_track' ? 'ON TRACK' : p.status === 'off_track' ? 'OFF TRACK' : 'DONE'}</span></div>
    <div class="sub">${esc(p.owner_name || '—')}${p.due ? ' · ' + dueTag(p.due, p.status === 'done') : ''}</div>
    <div class="bar"><i style="width:${p.status === 'done' ? 100 : s.pct}%"></i></div>
    <div class="next">${s.n ? `${s.d} of ${s.n} steps` : 'No steps yet'}${nxt && p.status !== 'done' ? ` · next: <b>${esc(nxt.title)}</b>${nxt.owner_name ? ' (' + esc(nxt.owner_name.split(' ')[0]) + ')' : ''}` : ''}</div></div>`;
}
function newProject(){
  modal(`<div class="title" style="font-size:26px">New project</div>
    <input id="pt" placeholder="What are we getting done?" maxlength="200">
    <div class="two"><select id="po" title="Owner">${opts(D.me.email)}</select><input type="date" id="pd" title="Due date"></div>
    <textarea id="pn" placeholder="Why it matters / what done looks like (optional)" maxlength="2000"></textarea>
    <div class="hint">One owner who answers for it. Add the steps after, and assign each to whoever's doing it. They'll land on that person's My Tasks.</div>
    <div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn y" id="psave">Create</button></div>`);
  document.getElementById('psave').onclick = async () => {
    try { const j = await api({ action: 'project_add', title: pt.value, owner: po.value, due: pd.value, notes: pn.value }); closeModal(); await refresh(); openProject(j.id); } catch(x){ toast(x.message); }
  };
}
function openProject(id){
  const p = D.projects.find(x => x.id === id); if (!p) return; openId = id;
  const ed = p.can_edit, s = stats(p);
  const stepRow = t => `<div class="step"><button class="tick ${t.done ? 'on' : ''}" data-sd="${t.id}" data-on="${t.done ? 0 : 1}">${t.done ? '✓' : ''}</button>
    <div class="tt" style="${t.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(t.title)}<div class="meta">${t.due ? dueTag(t.due, t.done) : ''}</div></div><span class="who">${esc(t.owner_name || '')}</span>
    ${ed ? `<button class="btn sm del" data-sx="${t.id}" title="Remove step">✕</button>` : ''}</div>`;
  modal(`<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div class="title" style="font-size:28px">${esc(p.title)}</div><span class="pill ${p.status}">${p.status === 'on_track' ? 'ON TRACK' : p.status === 'off_track' ? 'OFF TRACK' : 'DONE'}</span></div>
    <div class="bar"><i style="width:${p.status === 'done' ? 100 : s.pct}%"></i></div><div class="sub">${s.n ? `${s.d} of ${s.n} steps done` : 'No steps yet'}</div>
    ${ed ? `<div class="two"><select id="qs"><option value="on_track" ${p.status === 'on_track' ? 'selected' : ''}>On track</option><option value="off_track" ${p.status === 'off_track' ? 'selected' : ''}>Off track</option><option value="done" ${p.status === 'done' ? 'selected' : ''}>Done</option></select>
      <input type="date" id="qd" value="${esc(p.due || '')}"></div><div class="two"><select id="qo">${opts(p.owner)}</select><button class="btn" id="qsave">Save changes</button></div>
      <input id="qt" value="${esc(p.title)}" maxlength="200"><textarea id="qn" placeholder="Notes" maxlength="2000">${esc(p.notes || '')}</textarea>`
      : `<div class="sub">Owner: <b style="color:var(--ink)">${esc(p.owner_name || '—')}</b>${p.due ? ' · ' + dueTag(p.due, p.status === 'done') : ''}</div>${p.notes ? `<div class="notes">${esc(p.notes)}</div>` : ''}`}
    <div class="k" style="margin-top:6px">Steps</div>
    <div>${p.steps.length ? p.steps.map(stepRow).join('') : '<div class="empty">No steps yet.</div>'}</div>
    <form class="addstep" id="sf"><input id="st" placeholder="Add a step…" maxlength="200" required><select id="so">${opts(D.me.email)}</select><input type="date" id="sdue" title="Due (optional)"><button class="btn y" type="submit">Add</button></form>
    <div class="hint">Each step lands on its person's My Tasks. They tick it off there or here.</div>
    <div class="row">${ed ? '<button class="btn del" id="qdel" style="margin-right:auto">Delete project</button>' : ''}<button class="btn" onclick="closeModal()">Close</button></div>`, true);
  document.getElementById('sf').onsubmit = async e => { e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true;
    try { await api({ action: 'step_add', project: id, title: st.value, owner: so.value, due: sdue.value }); poke(); await refresh(); } catch(x){ toast(x.message); b.disabled = false; } };
  document.querySelectorAll('[data-sd]').forEach(b => b.onclick = async () => { b.disabled = true; try { await api({ action: 'step_done', id: +b.dataset.sd, on: b.dataset.on === '1' }); poke(); await refresh(); } catch(x){ toast(x.message); b.disabled = false; } });
  document.querySelectorAll('[data-sx]').forEach(b => b.onclick = async () => { if (!confirm('Remove this step?')) return; try { await api({ action: 'step_delete', id: +b.dataset.sx }); poke(); await refresh(); } catch(x){ toast(x.message); } });
  if (ed) {
    document.getElementById('qsave').onclick = async () => { try { await api({ action: 'project_edit', id, title: qt.value, notes: qn.value, due: qd.value, owner: qo.value, status: qs.value }); toast('Saved'); poke(); await refresh(); } catch(x){ toast(x.message); } };
    document.getElementById('qdel').onclick = async () => { if (!confirm('Delete this project? Its steps stay on people\'s My Tasks as ordinary tasks.')) return; try { await api({ action: 'project_delete', id }); closeModal(); poke(); refresh(); } catch(x){ toast(x.message); } };
  }
}
// ---- Issues: things that are stuck or need a decision, each with an owner. Solve them, don't let them pile up. ----
function issuesView(){
  const open = D.issues.filter(i => i.status === 'open'), solved = D.issues.filter(i => i.status === 'solved');
  const row = i => `<div class="irow"><div class="tb"><div class="tt">${esc(i.title)}</div>
    <div class="meta"><span>raised by ${esc(i.raised_by || '—')} · ${days(i.created_at) ? days(i.created_at) + ' days ago' : 'today'}</span><span>${i.owner_name ? 'owner: <b style="color:var(--ink)">' + esc(i.owner_name) + '</b>' : '<b class="soon">no owner yet</b>'}</span></div>
    ${i.notes ? `<div class="notes">${esc(i.notes)}</div>` : ''}${i.status === 'solved' && i.outcome ? `<div class="notes" style="color:var(--good)">Outcome: ${esc(i.outcome)}</div>` : ''}</div>
    <div class="acts">${i.can_edit ? (i.status === 'open' ? `<button class="btn sm" data-iedit="${i.id}">Edit</button><button class="btn sm y" data-isolve="${i.id}">Solved</button>` : `<button class="btn sm" data-ireopen="${i.id}">Reopen</button>`) : ''}</div></div>`;
  return `<div class="card"><div class="k">Open issues</div>${open.length ? open.map(row).join('') : '<div class="empty">Nothing stuck. Suspiciously quiet.</div>'}</div>
    ${solved.length ? `<div class="card"><div class="k">Solved in the last 6 weeks</div>${solved.map(row).join('')}</div>` : ''}
    <div class="hint">Issues are for company problems that need sorting or a decision (not "the system is broken"; use Help &amp; requests for that). Give each one an owner.</div>`;
}
function newIssue(){
  modal(`<div class="title" style="font-size:26px">Raise an issue</div><input id="it" placeholder="What's the problem or decision needed?" maxlength="200">
    <select id="io">${opts('', 'Owner: decide later')}</select><textarea id="in" placeholder="Detail (optional)" maxlength="2000"></textarea>
    <div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn y" id="isave">Raise it</button></div>`);
  document.getElementById('isave').onclick = async () => { try { await api({ action: 'issue_add', title: it.value, owner: io.value, notes: document.getElementById('in').value }); closeModal(); refresh(); } catch(x){ toast(x.message); } };
}
function editIssue(id){
  const i = D.issues.find(x => x.id === id);
  modal(`<div class="title" style="font-size:26px">Edit issue</div><input id="it" value="${esc(i.title)}" maxlength="200"><select id="io">${opts(i.owner, 'No owner')}</select>
    <textarea id="in" maxlength="2000">${esc(i.notes || '')}</textarea><div class="row"><button class="btn del" id="idel" style="margin-right:auto">Delete</button><button class="btn" onclick="closeModal()">Cancel</button><button class="btn y" id="isave">Save</button></div>`);
  document.getElementById('isave').onclick = async () => { try { await api({ action: 'issue_edit', id, title: it.value, owner: io.value, notes: document.getElementById('in').value }); closeModal(); refresh(); } catch(x){ toast(x.message); } };
  document.getElementById('idel').onclick = async () => { if (!confirm('Delete this issue?')) return; try { await api({ action: 'issue_delete', id }); closeModal(); refresh(); } catch(x){ toast(x.message); } };
}
function solveIssue(id){
  modal(`<div class="title" style="font-size:26px">Mark as solved</div><textarea id="ioc" placeholder="What was decided or done? (optional, but future-you will thank you)" maxlength="500"></textarea>
    <div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn y" id="ys">Solved</button></div>`);
  document.getElementById('ys').onclick = async () => { try { await api({ action: 'issue_solve', id, outcome: ioc.value }); closeModal(); refresh(); } catch(x){ toast(x.message); } };
}
if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });
</script>
<script>
(function(){
  const BUILD = '20261110140615';
  const busy = () => { const m = document.getElementById('modal'); const a = document.activeElement; return (m && getComputedStyle(m).display !== 'none') || (a && a.matches && a.matches('input,textarea,select')); };
  let newer = false;
  async function check(){ try { if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); } if (newer && !busy()) location.reload(); } catch(e){} }
  setInterval(check, 120000);
})();
</script>

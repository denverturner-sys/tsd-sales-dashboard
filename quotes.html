<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quotes · TSD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#262727; --panel:#323333; --panel2:#3B3C3C; --line:#474949; --ink:#FFFFFF; --muted:#B9BCBC;
  --accent:#EED107; --good:#7DDB98; --bad:#FF7A6B; --blue:#8EC5FF;
  --num:'Bebas Neue','DIN Condensed','Arial Narrow',Arial,sans-serif;
  --body:Barlow,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:15px}
.wrap{padding:16px 20px 28px;max-width:1700px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
header .l{display:flex;align-items:center;gap:16px}
header img{height:44px}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:13px}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
nav#tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
nav#tabs button{background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;cursor:pointer}
nav#tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav#tabs .n{background:var(--line);color:var(--ink);border-radius:999px;padding:1px 7px;font-size:12px;margin-left:6px}
nav#tabs .n.hot{background:var(--accent);color:#262727}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border-radius:12px;padding:14px 16px;cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;gap:4px}
.tile:hover{border-color:var(--line)}
.tile .k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--num);font-size:46px;line-height:1}
.tile .h{font-size:13px;color:var(--muted)}
.tile.hot{border-color:var(--accent)} .tile.hot .v{color:var(--accent)}
.tile.red .v{color:var(--bad)} .tile.green .v{color:var(--good)}
.sec{background:var(--panel);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.sec h2{margin:0 0 10px;font-family:var(--num);font-weight:400;font-size:26px;letter-spacing:1px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec h2 .h{font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(255,255,255,.03)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:4px;text-transform:uppercase;white-space:nowrap;margin:1px 3px 1px 0}
.t-in{background:var(--good);color:#262727} .t-nopo{background:var(--bad);color:#262727} .t-over{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.t-po{background:transparent;border:1px solid var(--blue);color:var(--blue)} .t-snz{background:transparent;border:1px solid var(--muted);color:var(--muted)}
.t-a{background:var(--accent);color:#262727} .t-b{background:var(--ink);color:#262727} .t-c{background:var(--line);color:var(--ink)} .t-d{background:transparent;border:1px solid var(--line);color:var(--muted)}
.muted{color:var(--muted)} .bad{color:var(--bad)} .good{color:var(--good)} .warn{color:var(--accent)}
.btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)} .btn.go{background:var(--accent);color:#262727;border-color:var(--accent)} .btn.sm{padding:4px 8px;font-size:12px}
.btn.on{background:var(--ink);color:#262727;border-color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input.txt,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input.txt:focus,textarea:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
input.qty{width:70px;text-align:right;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input[type=date]{color-scheme:dark}
.lines{font-size:13px;line-height:1.5}
.lines .ln{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lines .s{color:var(--muted);min-width:90px}
.detail td{background:var(--panel2)}
.fu{font-size:13px;line-height:1.4}
.note{font-size:12px;background:rgba(238,209,7,.12);border-radius:6px;padding:4px 7px;margin-top:4px;white-space:pre-wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sup{background:var(--panel2);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sup .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.sup .hd .nm{font-weight:700;font-size:16px}
.sup .bd{padding:0 14px 14px}
.sup .foot{display:flex;justify-content:flex-end;gap:12px;align-items:center;padding-top:10px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{background:var(--panel2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--accent)}
.no{font-family:var(--num);font-size:28px;letter-spacing:1px;line-height:1}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal .box{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
#modal h3{margin:0;font-family:var(--num);font-weight:400;font-size:30px;letter-spacing:1px}
#modal .row{display:flex;gap:10px;justify-content:flex-end}
#modal .err{color:var(--bad);font-size:13px;min-height:16px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#262727;border-radius:10px;padding:12px 16px;font-weight:600;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:20}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
#login form{background:var(--panel);border-radius:14px;padding:28px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
#login img{height:50px;align-self:flex-start}
#login input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px}
#login button{background:var(--accent);color:#262727;border:0;border-radius:8px;padding:12px;font-weight:700;cursor:pointer}
#lerr{color:var(--bad);font-size:14px;min-height:18px}
#msg{color:var(--muted);padding:40px;text-align:center;font-size:18px}
footer{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.6}

.qcard{background:var(--panel2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--line)}
.qcard.due{border-left-color:var(--accent)} .qcard.cold{border-left-color:var(--bad)} .qcard.later{border-left-color:var(--blue)} .qcard.booked{border-left-color:var(--line)} .qcard.won{border-left-color:var(--good)} .qcard.lost{border-left-color:var(--bad);opacity:.8}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qamt{font-family:var(--num);font-size:30px;letter-spacing:1px;line-height:1}
.qcust{font-weight:700;font-size:16px}
.qmeta{font-size:13px;color:var(--muted)}
.qlines{font-size:12px;color:var(--muted);line-height:1.45}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.qbtns .btn{padding:8px 11px;font-size:13px}
.qbtns .btn.no{border-color:var(--accent);color:var(--accent)}
.qbtns .btn.lost{border-color:var(--bad);color:var(--bad)}
.qbtns .btn.later{border-color:var(--blue);color:var(--blue)}
.qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
@media (max-width:600px){.qcards{grid-template-columns:minmax(0,1fr)}}
.lastfu{font-size:13px;background:rgba(255,255,255,.04);border-radius:6px;padding:5px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .btn.sel{background:var(--accent);color:#262727;border-color:var(--accent)}
details.sec>summary{list-style:none;cursor:pointer}
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gbp = v => v == null ? '–' : '£' + Math.round(Number(v)).toLocaleString('en-GB');
const dmy = s => s ? new Date(String(s).slice(0,10) + 'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) : '–';
const ago = s => { if (!s) return ''; const d = Math.round((Date.now() - new Date(s).getTime())/864e5); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };
const addDays = n => { const x = new Date(D.today + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0,10); };
function toast(t, ms=4000){ const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', ms); }
function modal(html){ document.getElementById('mbox').innerHTML = html; document.getElementById('modal').style.display = 'flex'; }
function closeModal(){ document.getElementById('modal').style.display = 'none'; }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// ---------- auth (same login as My Sales) ----------
function showLogin(msg){ clearInterval(timer); document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; document.getElementById('lerr').textContent = msg || ''; }
document.getElementById('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('lerr'); err.textContent = 'Checking…';
  try {
    const r = await fetch(ME_API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'login', email: document.getElementById('em').value, pin: document.getElementById('pin').value})});
    const j = await r.json(); if (!j.ok) { err.textContent = j.error || 'Login failed'; return; }
    token = j.token; store.set('tsd_me_token', token); document.getElementById('pin').value = ''; start();
  } catch(x) { err.textContent = "Can't reach the server. Check your connection."; }
});
async function api(path, body){
  const r = await fetch(API + path, body ? {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !('ok' in j)) throw new Error(j.error || ('Error ' + r.status));
  return j;
}
async function refresh(){
  try { const j = await api(view ? '?rep=' + encodeURIComponent(view) : ''); me = j.me; portal = j.portal || portal; D = j.data; render(); }
  catch(x){ if (x.message === 'login') return; if (!D) document.getElementById('app').innerHTML = `<div id="msg">${esc(x.message)}<br><span class="sub">Retrying shortly.</span></div>`; }
}
function start(){
  document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block';
  refresh(); clearInterval(timer);
  timer = setInterval(() => { if (document.getElementById('modal').style.display !== 'flex' && !document.activeElement?.matches('input,textarea,select')) refresh(); }, 120000);
}

// ---------- render ----------
const STAGE = {appointmentscheduled:'Contacted', qualifiedtobuy:'Quote sent', presentationscheduled:'Followed up', decisionmakerboughtin:'Followed up twice', '1469012232':'Going ahead later', closedwon:'Won', closedlost:'Lost', '1433181613':'Archived'};
const FU = {no_answer:'📞 No answer', spoke:'💬 Spoke', later:'📅 Going ahead later', lost:'✗ Lost', remind:'⏰ Reminder', note:'📝 Note'};
function matches(q){
  if (!query) return true;
  const hay = [q.no, q.customer, q.contact, q.phone, q.email, ...(q.lines || []).flatMap(l => [l.sku, l.name])].join('|').toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function card(q){
  const cls = q.bucket === 'due' && q.cold ? 'cold' : q.bucket;
  const lf = q.last_fu;
  const hsLink = q.deal_id ? `<a class="btn sm" href="https://app.hubspot.com/contacts/${portal}/record/0-3/${q.deal_id}" target="_blank" rel="noopener">HubSpot ↗</a>` : '';
  const lines = (q.lines || []).slice(0, 3).map(l => `${(+l.qty).toLocaleString('en-GB')}× ${esc(l.name || l.sku)}`).join(' · ') + ((q.line_count || 0) > 3 ? ` · +${q.line_count - 3} more` : '');
  const due = q.next ? (q.next < D.today ? `<b class="bad">chase was due ${dmy(q.next)}</b>` : q.next === D.today ? '<b class="warn">chase today</b>' : `next chase ${dmy(q.next)}`) : '';
  const live = q.bucket !== 'won' && q.bucket !== 'lost';
  return `<div class="qcard ${cls}">
    <div class="qtop"><span class="no">${esc(q.no)}</span><span class="qamt">${gbp(q.amount)}</span></div>
    <div class="qcust">${esc(q.customer)}${q.contact && q.contact !== q.customer ? ` <span class="qmeta">· ${esc(q.contact)}</span>` : ''}</div>
    <div class="qmeta">${q.phone ? `<a href="tel:${esc(q.phone.replace(/\s/g,''))}" style="color:var(--ink)">${esc(q.phone)}</a> · ` : ''}quoted ${dmy(q.date)} (${q.age} working day${q.age === 1 ? '' : 's'})${!view || view === me?.rep ? '' : ' · ' + esc(q.rep)}</div>
    <div><span class="tag ${q.bucket === 'later' ? 't-po' : q.bucket === 'won' ? 't-in' : q.bucket === 'lost' ? 't-nopo' : 't-d'}">${STAGE[q.stage] || (q.deal_id ? '' : 'Not in HubSpot yet')}</span>
      ${q.cold && live ? '<span class="tag t-over">Gone cold: 45+ days quiet</span>' : ''} ${q.close_date && q.bucket === 'later' ? `<span class="qmeta">expected ${dmy(q.close_date)}</span>` : ''} <span class="qmeta">${due}</span></div>
    ${lines ? `<div class="qlines">${lines}</div>` : ''}
    ${lf ? `<div class="lastfu">${FU[lf.kind] || esc(lf.kind)} · ${ago(lf.at)} by ${esc(lf.by)}${lf.reason ? ' · ' + esc(lf.reason) : ''}${lf.note ? `<br><span class="muted">“${esc(lf.note)}”</span>` : ''}</div>` : (live ? '<div class="qmeta">No follow-up logged yet.</div>' : '')}
    ${q.lost_reason && q.bucket === 'lost' ? `<div class="qmeta">Lost: ${esc(q.lost_reason)}</div>` : ''}
    ${q.error && !q.deal_id ? `<div class="qmeta bad">HubSpot: ${esc(q.error)}</div>` : ''}
    <div class="qbtns">${live ? `
      <button class="btn no" onclick="fu('${q.id}','no_answer')">📞 No answer</button>
      <button class="btn" onclick="fu('${q.id}','spoke')">💬 Spoke</button>
      <button class="btn later" onclick="fu('${q.id}','later')">📅 Going ahead later</button>
      <button class="btn lost" onclick="fu('${q.id}','lost')">✗ Lost</button>
      <button class="btn sm" onclick="fu('${q.id}','note')">📝 Note</button>` : ''}${hsLink}</div>
  </div>`;
}
function section(title, hint, list, open = true){
  return `<details class="sec" ${open ? 'open' : ''}><summary><h2>${title} <span class="h">${list.length ? list.length + ' · ' + gbp(list.reduce((s, q) => s + (+q.amount || 0), 0)) : ''}${hint ? ' · ' + hint : ''}</span></h2></summary>
    ${list.length ? `<div class="qcards">${list.map(card).join('')}</div>` : '<div class="empty">Nothing here.</div>'}</details>`;
}
function render(){
  if (!D) return;
  const all = D.quotes.filter(matches);
  const by = b => all.filter(q => q.bucket === b);
  const due = by('due').sort((a, b) => (b.cold ? 0 : 1) - (a.cold ? 0 : 1) || (+b.amount) - (+a.amount)), fresh = by('fresh'), later = by('later').sort((a, b) => String(a.close_date).localeCompare(String(b.close_date))), booked = by('booked'), closed = all.filter(q => q.bucket === 'won' || q.bucket === 'lost');
  const open = D.quotes.filter(q => q.bucket !== 'won' && q.bucket !== 'lost');
  const st = D.stats || {};
  const wr = st.v ? Math.round(100 * st.won_v / st.v) : null;
  const pick = me?.is_admin ? `<select onchange="setView(this.value)"><option value="">My quotes</option><option value="all" ${view==='all'?'selected':''}>Everyone</option>${(D.reps || []).filter(r => r !== me.rep).map(r => `<option ${view===r?'selected':''}>${esc(r)}</option>`).join('')}</select>` : '';
  const who = view === 'all' ? 'Everyone' : view || me?.name || '';
  const keep = window.scrollY;
  document.getElementById('app').innerHTML = `
    <header><div class="l"><img src="${LOGO}" alt="TSD"><div><div class="title">Quotes · ${esc(who)}</div>
      <div class="sub">Every Cin7 quote over £100 is in HubSpot's Quote Pipeline. Buttons here log the call/note and set the next chase as a HubSpot task. Won/lost happens by itself when Cin7 changes.</div></div></div>
      <div class="hr">${pick}<input class="txt" id="q" placeholder="Search customer, SO, product…" value="${esc(query)}" style="min-width:240px"><button class="btn" onclick="refresh()">Refresh</button></div></header>
    <div class="tiles">
      <div class="tile ${due.length ? 'hot' : ''}"><div class="k">Chase today</div><div class="v">${by('due').length}</div><div class="h">${gbp(by('due').reduce((s,q)=>s+(+q.amount||0),0))} · overdue or never chased</div></div>
      <div class="tile"><div class="k">Open quotes</div><div class="v">${open.length}</div><div class="h">${gbp(open.reduce((s,q)=>s+(+q.amount||0),0))} in total</div></div>
      <div class="tile"><div class="k">Going ahead later</div><div class="v">${by('later').length}</div><div class="h">${gbp(by('later').reduce((s,q)=>s+(+q.amount||0),0))} promised</div></div>
      <div class="tile"><div class="k">Win rate</div><div class="v">${wr == null ? '–' : wr + '%'}</div><div class="h">of quoted value turned into orders (quotes 1–4 months old)</div></div>
    </div>
    ${section('Chase today', 'oldest promised chase first; red = gone cold', due)}
    ${section('New this week', 'give them a couple of days', fresh)}
    ${section('Going ahead later', 'customer said yes, just not yet', later)}
    ${section('Chase booked', 'next chase is in the diary', booked, false)}
    ${section('Closed in the last 2 weeks', 'won when it became an order in Cin7', closed, false)}
    <footer>${D.synced ? 'HubSpot synced ' + ago(D.synced) + ' · ' : ''}Quotes appear here once raised in Cin7 and land in HubSpot within 5 minutes. Things logged straight into HubSpot (calls, emails, tasks) count too.</footer>`;
  window.scrollTo(0, keep);
  const qi = document.getElementById('q'); let t;
  qi.oninput = () => { clearTimeout(t); t = setTimeout(() => { query = qi.value.trim(); render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 200); };
}
function setView(v){ view = v; store.set('tsd_quotes_rep', v); D = null; document.getElementById('app').innerHTML = '<div id="msg">Loading…</div>'; refresh(); }

// ---------- follow-ups ----------
const REASONS = [['price','Price'],['elsewhere','Went elsewhere'],['job_off','Job cancelled or postponed'],['no_reply','No reply'],['other','Other']];
function fu(id, kind){
  const q = D.quotes.find(x => x.id === id); if (!q) return;
  const dayChips = (def, opts) => `<div class="chips" id="days">${opts.map(([n, l]) => `<button type="button" class="btn ${n === def ? 'sel' : ''}" data-d="${n}">${l}</button>`).join('')}</div>`;
  const head = `<h3>${FU[kind]} · ${esc(q.no)}</h3><div class="sub">${esc(q.customer)} · ${gbp(q.amount)}${q.phone ? ' · ' + esc(q.phone) : ''}</div>`;
  let mid = '', go = 'Save to HubSpot';
  if (kind === 'no_answer') mid = `<div class="sub" style="color:var(--ink)">Try again in</div>${dayChips(2, [[1,'Tomorrow'],[2,'2 days'],[3,'3 days'],[7,'A week']])}<textarea id="fnote" rows="2" placeholder="Optional: left a voicemail, emailed instead…"></textarea>`;
  if (kind === 'spoke') mid = `<textarea id="fnote" rows="3" placeholder="What did they say? e.g. comparing prices, waiting on their client"></textarea><div class="sub" style="color:var(--ink)">Chase again in</div>${dayChips(7, [[2,'2 days'],[7,'A week'],[14,'2 weeks'],[30,'A month']])}`;
  if (kind === 'later') mid = `<div class="sub" style="color:var(--ink)">When are they going ahead? You'll get a HubSpot task that day, and it stays on this screen until then.</div><input type="date" id="fdate" min="${D.today}" value="${addDays(21)}"><textarea id="fnote" rows="2" placeholder="e.g. Job starts mid Nov, waiting on planning"></textarea>`;
  if (kind === 'lost') { mid = `<select id="freason">${REASONS.map(([v,l]) => `<option value="${v}">${l}</option>`).join('')}</select><textarea id="fnote" rows="2" placeholder="Optional: who did they go with, what price beat us?"></textarea>`; go = 'Mark as lost'; }
  if (kind === 'note') mid = `<textarea id="fnote" rows="3" placeholder="Note for the deal in HubSpot"></textarea>`;
  modal(`${head}${mid}<div class="err" id="ferr"></div><div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn go" id="fok">${go}</button></div>`);
  let days = kind === 'no_answer' ? 2 : 7;
  document.querySelectorAll('#days [data-d]').forEach(b => b.onclick = () => { days = +b.dataset.d; document.querySelectorAll('#days .btn').forEach(x => x.classList.toggle('sel', x === b)); });
  setTimeout(() => document.getElementById('fnote')?.focus(), 50);
  document.getElementById('fok').onclick = async () => {
    const b = document.getElementById('fok'); b.disabled = true; b.textContent = 'Saving to HubSpot…';
    const body = {action:'follow', id, kind, note: document.getElementById('fnote')?.value || '', days, date: document.getElementById('fdate')?.value, reason: document.getElementById('freason')?.value};
    try { const j = await api('', body); if (!j.ok) throw new Error(j.error);
      closeModal(); toast(kind === 'lost' ? `${q.no} marked lost in HubSpot` : j.due ? `Logged in HubSpot · next chase ${dmy(j.due)}` : 'Logged in HubSpot'); refresh(); }
    catch(x){ document.getElementById('ferr').textContent = x.message || "Couldn't save"; b.disabled = false; b.textContent = 'Try again'; }
  };
}

if (token) start(); else showLogin();
</script>
<script>
// Self-update: every 2 minutes, check GitHub for a newer copy of this page and reload into it (waits while a pop-up is open or someone is typing).
(function(){
  const BUILD = '20261026214207';
  const busy = () => { const m = document.getElementById('modal'); const a = document.activeElement;
    return (m && getComputedStyle(m).display !== 'none') || (a && a.matches && a.matches('input,textarea,select')); };
  let newer = false;
  async function check(){
    try {
      if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); }
      if (newer && !busy()) location.reload();
    } catch(e){}
  }
  setInterval(check, 120000);
})();
</script>
</body>
</html>

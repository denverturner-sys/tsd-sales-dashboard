.wrap{padding:18px 20px 40px;max-width:1400px;margin:0 auto}
h1{font-family:var(--num);font-size:42px;letter-spacing:1px;margin:0;line-height:1}
h2{font-family:var(--num);font-size:28px;letter-spacing:.5px;margin:22px 0 8px;font-weight:400;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 .n{background:var(--panel2);border-radius:999px;padding:0 10px;font-size:20px}
h2 .h{font-family:var(--body);font-size:14px;color:var(--muted);letter-spacing:0}
.sub{color:var(--muted);font-size:14px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;transition:transform .08s ease,border-color .15s}
.btn:hover{border-color:var(--muted)}.btn:active{transform:scale(.97)}
.btn.y{background:var(--accent);color:#262727;border-color:var(--accent)}
.btn.g{background:#1f3b2a;border-color:#2E9E6A;color:var(--good)}
.btn.v{background:#1d2b45;border-color:#3d63a8;color:var(--blue)}
.btn.r{background:#3a2020;border-color:#7a3a33;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
input,select{background:#1c1d1d;border:1px solid var(--line);color:var(--ink);font:inherit;padding:8px 10px;border-radius:10px;color-scheme:dark}
.switch{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-radius:14px;padding:12px 16px;margin:14px 0;border:1px solid var(--line);background:var(--panel)}
.switch.on{border-color:#2E9E6A;background:#1b2e23}.switch.off{border-color:var(--accent);background:rgba(238,209,7,.07)}
.switch .t{flex:1;min-width:260px}.switch b{font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.tile .k{color:var(--muted);font-size:13px;font-weight:600}.tile .n{font-family:var(--num);font-size:38px;line-height:1.05}
.tile.warn .n{color:var(--accent)}.tile.bad .n{color:var(--bad)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.bar input[type=search]{flex:1;min-width:220px}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:start}
.row.back{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.row.am{box-shadow:inset 4px 0 0 #E5484D}.row.next{box-shadow:inset 4px 0 0 var(--accent)}
.row .chk{width:20px;height:20px;margin-top:4px;accent-color:var(--accent)}
.no{font-family:var(--num);font-size:24px;letter-spacing:.5px}
.cust{font-weight:700;font-size:17px}
.meta{color:var(--muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.tag.am{background:#4a1418;color:#FFC2C4}.tag.next{background:#4a3f0b;color:#FFE77A}.tag.bo{background:#3d2a10;color:#FFB48A}.tag.web{background:#1d2b45;color:var(--blue)}.tag.van{background:#1d2b45;color:var(--blue)}
.carrier{font-style:italic;color:#e6e6e6;font-size:14px}
.note{background:rgba(238,209,7,.08);border-left:3px solid var(--accent);padding:4px 8px;font-size:13px;margin-top:4px;border-radius:4px}
.backmsg{background:#3a2020;border:1px solid #7a3a33;color:#FFC2C4;border-radius:10px;padding:6px 10px;font-size:14px;margin:4px 0}
details.lines summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:4px}
details.lines ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:#ddd}
.sug{font-size:14px;margin-bottom:6px}.sug b{color:var(--accent)}.sug .why{color:var(--muted);font-size:12px;display:block}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl select{width:100%}
.ctl .btns{display:flex;gap:8px;flex-wrap:wrap}
.ctl .btns .btn{flex:1;min-width:92px}
.done{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.done .no{font-size:20px}.done .grow{flex:1;min-width:200px}
.empty{color:var(--muted);padding:14px 0}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:18px;align-items:start}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-height:520px;overflow:auto}
.log div b{color:var(--ink)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;z-index:50}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px}
#modal h3{margin:0;font-family:var(--num);font-size:28px;font-weight:400}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:#262727;font-weight:700;padding:10px 16px;border-radius:10px;display:none;z-index:60}
.ro{opacity:.85}
@media (max-width:900px){.cols{grid-template-columns:1fr}.row{grid-template-columns:24px minmax(0,1fr)}.row .ctl{grid-column:1/-1}}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none">
  <h1>RELEASE QUEUE</h1>
  <div class="sub">Every Bromham delivery order stops here first. Release it with the courier fixed, send it to the van, or hold it. The warehouse only sees what you release.</div>
  <div id="sw"></div>
  <div id="tiles" class="tiles"></div>
  <div class="cols">
    <div id="main"><div class="empty">Loading…</div></div>
    <div id="side"></div>
  </div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script src="auth.js?v=20261118221130"></script>
<script src="activity.js?v=20261118221130"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/dispatch';
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
let token = store.get('tsd_me_token');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = v => Number(v) || 0;
const gbp = v => '£' + Math.round(N(v)).toLocaleString('en-GB');
const hm = s => s ? new Date(s).toLocaleTimeString('en-GB', {timeZone:'Europe/London', hour:'2-digit', minute:'2-digit'}) : '';
const when = s => { if (!s) return ''; const d = new Date(s), t = new Date(); const same = d.toLocaleDateString('en-GB',{timeZone:'Europe/London'}) === t.toLocaleDateString('en-GB',{timeZone:'Europe/London'}); return same ? hm(s) : d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short', timeZone:'Europe/London'}) + ' ' + hm(s); };
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3200); };

let D = null, query = '', busy = false;
const pickSvc = {};    // id -> chosen service id (kept across refreshes)
const ticked = new Set();

async function api(body){
  const r = await fetch(API, body ? {method:'POST', headers:{Authorization:'Bearer ' + token, 'Content-Type':'application/json'}, body: JSON.stringify(body)}
    : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('Please log in again'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || 'Something went wrong');
  return j;
}
function showLogin(msg){ $('app').style.display = 'none'; $('login').style.display = 'flex'; if (msg) $('lerr').textContent = msg; }
function start(){ $('login').style.display = 'none'; $('app').style.display = 'block'; load(); }

async function load(){
  try { D = await api(); render(); }
  catch(e){ if (!D) $('main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
// refresh every 30s, but never while someone's mid-decision (a dropdown open, typing, or a pop-up)
setInterval(() => {
  const a = document.activeElement;
  if (busy || $('modal').style.display === 'flex' || (a && /SELECT|INPUT|TEXTAREA/.test(a.tagName) && a.type !== 'search')) return;
  if (token) load();
}, 30000);

const GRP = { am: ['AM / pre-12', 'am'], next: ['Next day', 'next'], standard: ['2–3 day', ''], check: ['No delivery method', 'bo'], van: ['Own van', 'van'] };
function svcName(id){ const s = (D.services || []).find(x => x.id === +id); return s ? `${s.courier} ${s.service}` : ''; }
function svcOptions(sel){
  const all = D.services || [], used = all.filter(s => s.uses > 0), rest = all.filter(s => !s.uses);
  const o = s => `<option value="${s.id}" ${+sel === s.id ? 'selected' : ''}>${esc(s.courier + ' · ' + s.service)}</option>`;
  return `<option value="">Choose courier service…</option><optgroup label="Used recently">${used.map(o).join('')}</optgroup><optgroup label="Everything else">${rest.map(o).join('')}</optgroup>`;
}
function matches(o){
  if (!query) return true;
  const q = query.toLowerCase().replace(/[\s\-]/g, ''), digits = query.replace(/\D/g, '');
  if (digits.length >= 3 && String(o.no || '').replace(/\D/g, '').replace(/^0+/, '').includes(digits.replace(/^0+/, ''))) return true;
  const hay = [o.no, o.customer, o.town, o.postcode, o.carrier, o.notes, o.rep, ...(o.lines || []).flatMap(l => [l.sku, l.name])].join('|').toLowerCase().replace(/[\s\-]/g, '');
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w.replace(/[\s\-]/g, '')));
}
function tagsOf(o){
  const t = [], g = GRP[o.grp];
  if (g) t.push(`<span class="tag ${g[1]}">${g[0]}</span>`);
  if (o.backorder) t.push(o.ready === 'all' ? '<span class="tag bo" style="background:#1f3b2a;color:var(--good)">Backorder · stock in now</span>' : o.ready === 'some' ? '<span class="tag bo">Backorder · partial stock</span>' : '<span class="tag bo">Backordered</span>');
  if (o.part_shipped) t.push('<span class="tag bo">Part sent already</span>');
  if (o.pick_started) t.push('<span class="tag">Pick started in Cin7</span>');
  if (o.web) t.push('<span class="tag web">Web</span>');
  if (o.on_van_list && o.state === 'queued') t.push('<span class="tag van">On the van list now</span>');
  return t.join('');
}
function info(o){
  const lines = o.lines || [];
  return `<div><span class="no">${esc(o.no)}</span> <span class="meta">· ${when(o.arrived)}${o.ship_by ? ' · needed by ' + new Date(o.ship_by + 'T12:00:00').toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'}) : ''}</span> <a data-detail="${o.id}" style="cursor:pointer;text-decoration:underline;color:var(--blue);font-size:13px">Details</a></div>
    <div class="cust">${esc(o.customer)}</div>
    <div class="tags">${tagsOf(o)}</div>
    ${o.sent_back ? `<div class="backmsg">↩ <b>Sent back by ${esc(o.sent_back.by || 'warehouse')}</b> ${hm(o.sent_back.at)}: ${esc(o.sent_back.reason || '')}${o.sent_back.note ? ' · “' + esc(o.sent_back.note) + '”' : ''}</div>` : ''}
    ${o.carrier ? `<div class="carrier">Cin7: “${esc(o.carrier)}”</div>` : '<div class="carrier">Cin7: no delivery method</div>'}
    <div class="meta">${esc([o.town, o.postcode].filter(Boolean).join(' · '))}${N(o.weight) ? ' · <b style="color:#fff">' + (Math.round(N(o.weight) * 10) / 10).toLocaleString('en-GB') + ' kg</b>' : ' · no weight'}${N(o.value) ? ' · ' + gbp(o.value) + ' ex VAT' : ''}${o.rep ? ' · ' + esc(o.rep === 'WooCommerce' ? 'Website' : o.rep) : ''}</div>
    ${o.notes ? `<div class="note">${esc(o.notes)}</div>` : ''}
    ${lines.length ? `<details class="lines"><summary>${lines.length} line${lines.length === 1 ? '' : 's'}</summary><ul>${lines.map(l => `<li>${N(l.qty).toLocaleString('en-GB')}× ${esc(l.sku)} · ${esc(l.name)}${N(l.bo) ? ' <span style="color:#FFB48A">(' + N(l.bo) + ' on backorder)</span>' : ''}</li>`).join('')}</ul></details>` : ''}`;
}
function decideRow(o){
  const s = o.suggest || {};
  if (pickSvc[o.id] === undefined) pickSvc[o.id] = s.service_id || '';
  const ro = !D.me.office;
  const sug = s.van ? `<b>🚐 Van</b>${s.courier ? ' <span class="meta">(or ' + esc(s.courier + ' ' + s.service) + ')</span>' : ''}` : s.courier ? `<b>${esc(s.courier + ' ' + s.service)}</b>` : '<span class="meta">No suggestion</span>';
  return `<div class="row ${o.sent_back ? 'back' : (GRP[o.grp] || [])[1] || ''}" data-id="${o.id}">
    ${ro ? '<span></span>' : `<input type="checkbox" class="chk" data-tick="${o.id}" ${ticked.has(o.id) ? 'checked' : ''} title="Tick to release several at once">`}
    <div>${info(o)}</div>
    <div class="ctl ${ro ? 'ro' : ''}">
      <div class="sug">Suggested: ${sug}${s.why ? `<span class="why">${esc(s.why)}</span>` : ''}</div>
      ${ro ? '' : `<select data-svc="${o.id}">${svcOptions(pickSvc[o.id])}</select>
      <div class="btns">
        <button class="btn ${s.van ? '' : 'g'}" data-a="release" data-id="${o.id}">✓ Release</button>
        <button class="btn ${s.van ? 'y' : 'v'}" data-a="van" data-id="${o.id}">🚐 Van</button>
        <button class="btn" data-a="hold" data-id="${o.id}">⏸ Hold</button>
      </div>`}
    </div>
  </div>`;
}
function doneRow(o, kind){
  const ro = !D.me.office;
  const what = kind === 'released' ? `🔒 <b>${esc([o.courier, o.service].filter(Boolean).join(' ') || 'Released')}</b>`
    : kind === 'van' ? '🚐 <b>Van</b>' : `⏸ <b>${esc(o.hold_reason || 'On hold')}</b>`;
  return `<div class="done">
    <span class="no">${esc(o.no)}</span> <a data-detail="${o.id}" style="cursor:pointer;text-decoration:underline;color:var(--blue);font-size:12px">Details</a>
    <div class="grow"><div><b>${esc(o.customer)}</b> <span class="meta">${esc([o.town, o.postcode].filter(Boolean).join(' · '))}${N(o.weight) ? ' · ' + Math.round(N(o.weight)) + ' kg' : ''}</span></div>
      <div class="meta">${what} · ${esc(o.by || '')} ${when(o.updated_at)}${o.note ? ' · “' + esc(o.note) + '”' : ''}</div></div>
    ${ro ? '' : kind === 'hold'
      ? `<button class="btn" data-a="queue" data-id="${o.id}">Back to queue</button>`
      : `<button class="btn" data-a="queue" data-id="${o.id}" title="${kind === 'van' ? 'Takes it off the van list and back to the queue' : 'Pulls it back from the warehouse'}">↶ Undo</button>`}
  </div>`;
}
function render(){
  if (!D) return;
  const all = D.orders || [];
  const shown = all.filter(matches);
  const decide = shown.filter(o => o.state === 'queued');
  const decideWaiting = decide.filter(o => o.backorder && o.ready !== 'all' && !o.sent_back);
  const decideReady = decide.filter(o => !decideWaiting.includes(o));
  const hold = shown.filter(o => o.state === 'hold');
  const van = shown.filter(o => o.state === 'van');
  const rel = shown.filter(o => o.state === 'released').sort((a, b) => String(b.updated_at || '').localeCompare(String(a.updated_at || '')));
  const back = all.filter(o => o.state === 'queued' && o.sent_back).length;

  $('sw').innerHTML = D.on
    ? `<div class="switch on"><div class="t"><b>✓ Dispatch control is ON</b><div class="sub">Since ${when(D.since)}${D.switched_by ? ' (' + esc(D.switched_by) + ')' : ''}. The warehouse only sees released orders and can't change the courier or add to the van.</div></div>${D.me.office ? '<button class="btn r" id="swbtn">Switch off</button>' : ''}</div>`
    : `<div class="switch off"><div class="t"><b>Dispatch control is OFF</b><div class="sub">The warehouse works exactly as before. You can make decisions here now; they only take effect once it's switched on.</div></div>${D.me.office ? '<button class="btn y" id="swbtn">Switch on…</button>' : ''}</div>`;
  const allQueued = all.filter(o => o.state === 'queued');
  const allWaiting = allQueued.filter(o => o.backorder && o.ready !== 'all' && !o.sent_back).length;
  $('tiles').innerHTML = [
    ['Ready to decide', allQueued.length - allWaiting, (allQueued.length - allWaiting) ? 'warn' : ''],
    ['Waiting on stock', allWaiting, ''],
    ['Sent back', back, back ? 'bad' : ''],
    ['On hold', all.filter(o => o.state === 'hold').length, ''],
    ['To the van', all.filter(o => o.state === 'van').length, ''],
    ['Released, not picked', all.filter(o => o.state === 'released').length, ''],
  ].map(([k, n, c]) => `<div class="tile ${c}"><div class="k">${k}</div><div class="n">${n}</div></div>`).join('');

  const canBulk = D.me.office && ticked.size;
  $('main').innerHTML = `
    <div class="bar"><input type="search" id="q" placeholder="🔍 Find: order number, customer, postcode, SKU…" value="${esc(query)}">
      ${D.me.office ? `<button class="btn y" id="bulk" ${canBulk ? '' : 'disabled'}>✓ Release ticked (${ticked.size})</button>` : '<span class="sub">View only</span>'}</div>
    <h2>Ready to decide <span class="n">${decideReady.length}</span> <span class="h">Oldest first. Anything sent back by the warehouse is at the top.</span></h2>
    <div class="list">${decideReady.length ? decideReady.map(decideRow).join('') : '<div class="empty">Nothing waiting. 👌</div>'}</div>
    <details ${decideWaiting.length ? '' : 'style="display:none"'}><summary style="cursor:pointer;color:var(--muted);margin:14px 0 8px">Waiting on stock (${decideWaiting.length}) — backordered, not all in yet</summary>
    <div class="list">${decideWaiting.map(decideRow).join('')}</div></details>
    <h2>On hold <span class="n">${hold.length}</span> <span class="h">Backorders, waiting on the customer, credit…</span></h2>
    <div class="list">${hold.length ? hold.map(o => doneRow(o, 'hold')).join('') : '<div class="empty">None.</div>'}</div>`;
  $('side').innerHTML = `
    <h2>To the van <span class="n">${van.length}</span> <span class="h">Booked on the Van Team screen</span></h2>
    <div class="list">${van.length ? van.map(o => doneRow(o, 'van')).join('') : '<div class="empty">None.</div>'}</div>
    <h2>Released <span class="n">${rel.length}</span> <span class="h">In the warehouse, not picked yet</span></h2>
    <div class="list">${rel.length ? rel.slice(0, 60).map(o => doneRow(o, 'released')).join('') + (rel.length > 60 ? `<div class="sub">+ ${rel.length - 60} more (search to find one)</div>` : '') : '<div class="empty">None.</div>'}</div>
    <h2>Activity</h2>
    <div class="log">${(D.log || []).map(l => `<div>${when(l.at)} · <b>${esc(l.by || '')}</b> ${esc(ACT[l.action] || l.action)} ${l.no ? '<b>' + esc(l.no) + '</b>' : ''}${l.detail ? ' · ' + esc(l.detail) : ''}</div>`).join('') || '<div>Nothing yet.</div>'}</div>`;
  wire();
}
const ACT = { released: 'released', van: 'sent to van', hold: 'held', queued: 'put back in the queue', sent_back: '↩ warehouse sent back', switch_on: 'switched dispatch control ON', switch_off: 'switched dispatch control OFF' };

function wire(){
  const q = $('q'); q.oninput = () => { query = q.value.trim(); const p = q.selectionStart; render(); const n = $('q'); n.focus(); try { n.setSelectionRange(p, p); } catch(e){} };
  document.querySelectorAll('[data-svc]').forEach(s => s.onchange = () => { pickSvc[s.dataset.svc] = s.value; });
  document.querySelectorAll('[data-tick]').forEach(c => c.onchange = () => { c.checked ? ticked.add(c.dataset.tick) : ticked.delete(c.dataset.tick); const b = $('bulk'); if (b) { b.disabled = !ticked.size; b.textContent = `✓ Release ticked (${ticked.size})`; } });
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a, b.dataset.id, b));
  document.querySelectorAll('[data-detail]').forEach(a => a.onclick = (e) => { e.preventDefault(); e.stopPropagation(); detailModal(a.dataset.detail); });
  const sw = $('swbtn'); if (sw) sw.onclick = switchModal;
  const bk = $('bulk'); if (bk) bk.onclick = bulk;
}
const byId = id => (D.orders || []).find(o => o.id === id);
async function act(a, id, btn){
  const o = byId(id); if (!o) return;
  if (a === 'hold') return holdModal(o);
  if (a === 'release' && !pickSvc[id]) { toast('Pick the courier service first'); const s = document.querySelector(`[data-svc="${id}"]`); if (s) s.focus(); return; }
  busy = true; if (btn) btn.disabled = true;
  try {
    await api({ action: a === 'release' ? 'release' : a === 'van' ? 'van' : 'queue', id, service_id: a === 'release' ? +pickSvc[id] : undefined });
    toast(a === 'release' ? `${o.no} released · ${svcName(pickSvc[id])}` : a === 'van' ? `${o.no} sent to the van` : `${o.no} back in the queue`);
    ticked.delete(id); delete pickSvc[id];
    await load();
  } catch(e){ toast(e.message); if (btn) btn.disabled = false; }
  busy = false;
}
async function bulk(){
  const items = [...ticked].map(id => ({ id, service_id: +pickSvc[id] || 0 }));
  const missing = items.filter(i => !i.service_id).map(i => (byId(i.id) || {}).no);
  if (missing.length) return toast('No courier picked for ' + missing.join(', '));
  busy = true;
  try {
    const r = await api({ action: 'release_many', items });
    const bad = (r.results || []).filter(x => !x.ok);
    toast(bad.length ? `${items.length - bad.length} released, ${bad.length} failed` : `${items.length} released`);
    ticked.clear(); items.forEach(i => delete pickSvc[i.id]);
    await load();
  } catch(e){ toast(e.message); }
  busy = false;
}
async function detailModal(id){
  const o = byId(id);
  modal('<h3>Loading…</h3>');
  try {
    const d = await api({ action: 'detail', id });
    const rows = (d.lines || []).map(l => {
      const short = N(l.bo) > 0 && l.available != null && N(l.available) < 0;
      return `<tr><td>${esc(l.sku)}</td><td>${esc(l.name)}</td><td style="text-align:right">${N(l.qty)}</td>
        <td style="text-align:right">${N(l.bo) || ''}</td>
        <td style="text-align:right">${l.on_hand != null ? N(l.on_hand) : '—'}</td>
        <td style="text-align:right">${l.on_order != null ? N(l.on_order) : '—'}</td>
        <td style="text-align:right${short ? ';color:var(--bad);font-weight:700' : ''}">${l.available != null ? N(l.available) : '—'}</td>
        <td class="meta">${l.next_delivery ? new Date(l.next_delivery + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : ''}</td></tr>`;
    }).join('');
    const badge = o && o.backorder ? (o.ready === 'all' ? '<span class="tag bo" style="background:#1f3b2a;color:var(--good)">Backorder · stock in now</span>'
      : o.ready === 'some' ? '<span class="tag bo">Backorder · partial stock</span>' : '<span class="tag bo">Backorder · still short</span>') : '';
    modal(`<h3>${esc(d.no)}</h3>
      <div class="sub">${esc(d.customer)} · ${esc(d.address || [d.town, d.postcode].filter(Boolean).join(', '))}</div>
      <div class="tags">${badge}</div>
      <div class="meta">${esc(d.carrier || 'No delivery method')}${N(d.weight) ? ' · ' + (Math.round(N(d.weight) * 10) / 10) + ' kg' : ''}${d.value ? ' · ' + gbp(d.value) + ' ex VAT' : ''}${d.rep ? ' · ' + esc(d.rep) : ''}</div>
      ${d.notes ? `<div class="note">${esc(d.notes)}</div>` : ''}
      ${d.sent_back ? `<div class="backmsg">↩ Sent back by ${esc(d.sent_back.by || 'warehouse')}: ${esc(d.sent_back.reason || '')}${d.sent_back.note ? ' · “' + esc(d.sent_back.note) + '”' : ''}</div>` : ''}
      <div style="overflow:auto;max-height:50vh"><table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="color:var(--muted);text-align:left"><th>SKU</th><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">B/O</th><th style="text-align:right">On hand</th><th style="text-align:right">On order</th><th style="text-align:right">Available</th><th>Next in</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8" class="empty">No lines</td></tr>'}</tbody>
      </table></div>
      <div style="display:flex;justify-content:flex-end"><button class="btn" id="dc">Close</button></div>`);
    $('dc').onclick = closeModal;
  } catch (e) {
    modal(`<h3>Couldn't load</h3><div class="sub">${esc(e.message)}</div><div style="display:flex;justify-content:flex-end"><button class="btn" id="dc">Close</button></div>`);
    $('dc').onclick = closeModal;
  }
}
function modal(html){ $('mbox').innerHTML = html; $('modal').style.display = 'flex'; }
function closeModal(){ $('modal').style.display = 'none'; }
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
function holdModal(o){
  const R = ['Waiting on stock (backorder)', 'Calling the customer', 'Waiting on payment / credit', 'Customer wants a later date', 'Address or details to check', 'Other'];
  modal(`<h3>Hold ${esc(o.no)}</h3><div class="sub">${esc(o.customer)}. It stays here, out of the warehouse, until you release it.</div>
    <select id="hr">${R.map(r => `<option ${o.backorder && r.startsWith('Waiting on stock') ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>
    <input id="hn" placeholder="Note (optional)" maxlength="300">
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" id="hc">Cancel</button><button class="btn y" id="hok">Hold it</button></div>`);
  $('hc').onclick = closeModal;
  $('hok').onclick = async () => {
    $('hok').disabled = true;
    try { await api({ action: 'hold', id: o.id, reason: $('hr').value, note: $('hn').value }); closeModal(); toast(o.no + ' on hold'); await load(); }
    catch(e){ toast(e.message); $('hok').disabled = false; }
  };
}
function switchModal(){
  const on = !D.on;
  // default cut-off: 5pm on the last working day, so overnight and today's orders wait for you; older ones are already in the warehouse
  const cut = new Date(); cut.setHours(17, 0, 0, 0); do { cut.setDate(cut.getDate() - 1); } while (cut.getDay() === 0 || cut.getDay() === 6);
  const loc = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const waiting = d => (D.orders || []).filter(o => o.state === 'queued' && o.arrived && new Date(o.arrived) >= d).length;
  modal(on
    ? `<h3>Switch dispatch control on?</h3>
       <div>From now on the warehouse only sees orders released here, with the courier fixed. They lose the "Going on own van", "Collection" and "Priority" buttons; their only way out is "Send back to the office".</div>
       <label class="sub" style="display:flex;flex-direction:column;gap:6px">Orders that came in from this time wait for you. Anything older stays on the warehouse screens as it is, so nothing disappears from under them.
         <input type="datetime-local" id="ssince" value="${loc(cut)}"></label>
       <div class="sub" id="scount"></div>
       <div class="sub">No one gets a notification. You can switch it off again at any time and everything goes back to how it was.</div>
       <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" id="sc">Cancel</button><button class="btn y" id="sok">Switch on</button></div>`
    : `<h3>Switch dispatch control off?</h3><div>The warehouse goes back to seeing every order and choosing couriers and the van themselves. Your decisions here are kept.</div>
       <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" id="sc">Cancel</button><button class="btn r" id="sok">Switch off</button></div>`);
  $('sc').onclick = closeModal;
  const ss = $('ssince');
  const count = () => { const d = new Date(ss.value); $('scount').innerHTML = isNaN(d) ? '' : `<b>${waiting(d)}</b> order${waiting(d) === 1 ? '' : 's'} will wait for you; the rest stay in the warehouse.`; };
  if (ss) { ss.oninput = count; count(); }
  $('sok').onclick = async () => {
    $('sok').disabled = true;
    const since = ss && ss.value ? new Date(ss.value).toISOString() : null;
    try { const r = await api({ action: 'switch', on, since }); closeModal(); toast(on ? `On. ${r.queued ?? 0} waiting for you, ${r.kept || 0} kept in the warehouse.` : 'Off'); await load(); }
    catch(e){ toast(e.message); $('sok').disabled = false; }
  };
}

if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });
</script>

button,input,select,textarea{font-family:inherit;font-size:15px}
.wrap{padding:16px 20px 40px;max-width:1040px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--panel);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:56px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.y{background:var(--accent);color:#262727;border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:default}.btn.sm{padding:5px 10px;font-size:13px}
.tabs{display:flex;gap:6px}.tabs button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}.tabs button.on{background:var(--accent);color:#262727;border-color:var(--accent)}
.res{border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:300px;overflow:auto}
.res .it{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between}.res .it:last-child{border:0}.res .it:hover{background:var(--panel2)}
.sel{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel2);border-radius:8px;padding:10px 12px}
table.t{width:100%;border-collapse:collapse;margin-top:8px}table.t th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line)}table.t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t input{padding:6px 8px}.r{text-align:right}.q{width:78px}.pr{width:100px}.dc{width:70px}
.tot{margin-left:auto;width:300px;margin-top:10px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .gt{border-top:2px solid var(--line);font-weight:800;font-size:19px;margin-top:4px;padding-top:6px}
.warn{background:rgba(255,122,107,.14);border:1px solid var(--bad);border-radius:8px;padding:8px 10px;margin:8px 0}
.ok{background:rgba(125,219,152,.14);border:1px solid var(--good);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.st{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--line)}.st.open{background:var(--blue);color:#262727}.st.paid{background:var(--good);color:#262727}
.lt{width:100%;border-collapse:collapse}.lt th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}.lt td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.chips{display:flex;gap:6px;margin:8px 0}.chips button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:13px}.chips button.on{border-color:var(--accent);color:var(--ink)}
.late{color:var(--accent);font-weight:700}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:120}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
#msg{padding:40px;text-align:center;color:var(--muted)}.er{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><div id="msg">Loading…</div></div>
<div id="toast"></div>
<script src="auth.js?v=20261112115455"></script>
<script src="activity.js?v=20261112115455"></script>
<script src="pay.js?v=20261112115455"></script>
<script>
const SELL = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/sell';
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
let token = store.get('tsd_me_token'), META = null, S = null, TAB = new URLSearchParams(location.search).get('tab') === 'links' ? 'links' : 'new', LK = null, LF = 'open', timer;
const MODE = (() => { const o = new URLSearchParams(location.search).get('open') || ''; return o === 'new:quote' ? 'quote' : o === 'new:order' ? 'order' : ''; })();   // 12 Nov: the + button in Bob's top bar opens this as a new quote or a new order
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gbp = n => '£' + Number(n || 0).toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const $ = id => document.getElementById(id);
const ago = s => { const m = (Date.now() - new Date(s)) / 60000; return m < 60 ? Math.max(1, Math.round(m)) + ' min' : m < 1440 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' d'; };
function toast(t){ const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 3500); }
function showLogin(msg){ clearInterval(timer); $('app').style.display = 'none'; $('login').style.display = 'flex'; const e = $('lerr'); if (e) e.textContent = msg || ''; }
async function api(qs, body){
  const r = await fetch(SELL + (qs || ''), body ? {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({})); if (j.error || (body && j.ok === false)) throw new Error(j.error || "Couldn't do that"); return j;
}
const fresh = () => ({ cust: null, info: null, newc: false, lines: [], charges: [], addrs: [] });
function gotoOrders(no){ try { if (window.parent !== window) { window.parent.postMessage({ tsdGoto: { screen: 'orders', open: no } }, location.origin); return; } } catch(e){} location.href = 'orders.html?open=' + encodeURIComponent(no); }

async function start(){
  $('login').style.display = 'none'; $('app').style.display = 'block';
  try { META = await api(''); } catch(x){ if (x.message !== 'login') $('app').innerHTML = `<div class="card er">${esc(x.message)}</div>`; return; }
  S = fresh(); shell(); clearInterval(timer);
  timer = setInterval(() => { if (TAB === 'links' && !document.activeElement?.matches('input')) loadLinks(); }, 60000);
}
function shell(){
  $('app').innerHTML = `<header><div><div class="title">${MODE === 'quote' ? 'New quote' : MODE === 'order' ? 'New order' : 'New sale'}</div><div class="sub">Raise a quote or an order. It goes straight into Cin7. Then make the payment link and email it from here.</div></div>
    <div class="tabs"><button id="t1" class="${TAB === 'new' ? 'on' : ''}">New sale</button><button id="t2" class="${TAB === 'links' ? 'on' : ''}">Payment links <span id="nopen"></span></button></div></header>
    <div id="pa" style="display:${TAB === 'new' ? 'block' : 'none'}"></div><div id="pb" style="display:${TAB === 'links' ? 'block' : 'none'}"></div>`;
  $('t1').onclick = () => { TAB = 'new'; shell(); }; $('t2').onclick = () => { TAB = 'links'; shell(); };
  if (TAB === 'new') form(); else loadLinks();
  api('?links=1').then(j => { const n = j.links.filter(l => l.status === 'open').length; const e = $('nopen'); if (e && n) e.textContent = '(' + n + ' waiting)'; }).catch(() => {});
}

// ---------- the form ----------
function form(){
  $('pa').innerHTML = `<div class="card"><div class="k">1 · Customer</div><div id="cust"></div>
      <div class="g3" style="margin-top:10px"><div><div class="k">Contact</div><input id="ct" placeholder="Name"></div><div><div class="k">Phone</div><input id="ph"></div><div><div class="k">Email</div><input id="em" type="email" placeholder="Where the quote / link is sent"></div></div></div>
    <div class="card"><div class="k">2 · Delivery</div>
      <div id="adsel"></div>
      <div class="g4"><div><div class="k">Address line 1</div><input id="l1"></div><div><div class="k">Line 2</div><input id="l2"></div><div><div class="k">Town</div><input id="cy"></div><div><div class="k">Postcode</div><input id="pc"></div></div>
      <div class="g4" style="margin-top:10px"><div><div class="k">Delivery method</div><input id="ca" list="cal" placeholder="e.g. Next Working Day (Cut-off 2pm)"><datalist id="cal">${META.carriers.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
        <div><div class="k">Needed by</div><input id="sb" type="date"></div><div><div class="k">Stock from</div><select id="lc"><option>Bromham</option><option>Wootton Bassett</option></select></div><div><div class="k">Customer ref / PO</div><input id="rf"></div></div>
      <div class="g2" style="margin-top:10px"><div><div class="k">Delivery notes (on the pick sheet)</div><textarea id="dn"></textarea></div><div><div class="k">Internal note (not sent to the customer)</div><textarea id="nt"></textarea></div></div></div>
    <div class="card"><div class="k">3 · Products</div><input id="ps" placeholder="Search by code or name, e.g. TTACS100 or ardex grout grey" autocomplete="off"><div id="pres"></div>
      <div id="lines"></div>
      <div class="k" style="margin-top:14px">Delivery and other charges (ex VAT)</div><div id="chg"></div><button class="btn sm" id="addch" style="margin-top:6px">+ Add a charge</button>
      <datalist id="chl">${META.charges.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <div id="tot"></div></div>
    <div class="card"><div id="err" class="er"></div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn y" id="bq">Save as quote</button><button class="btn y" id="bo">Create order (skip the quote)</button><button class="btn" id="bd">Save quote as draft</button>
      <span class="sub" style="flex:1;min-width:200px">Both go into Cin7 as you. A quote can be turned into an order later, and the payment link can be made for either.</span></div></div>`;
  drawCust(); drawLines(); drawCharges();
  let t; $('ps').oninput = e => { clearTimeout(t); t = setTimeout(() => prodSearch(e.target.value.trim()), 300); };
  $('addch').onclick = () => { S.charges.push({ desc: '', price: '' }); drawCharges(); };
  if (MODE === 'order') { $('bq').style.display = 'none'; $('bd').style.display = 'none'; } else if (MODE === 'quote') $('bo').style.display = 'none';
  $('bq').onclick = () => submit('quote', false); $('bo').onclick = () => submit('order', false); $('bd').onclick = () => submit('quote', true);
}
function drawCust(){
  const c = S.cust, e = $('cust');
  if (c) { const i = S.info || {};
    e.innerHTML = `<div class="sel"><div><b style="font-size:17px">${esc(c.name)}</b><div class="sub">${esc(i.terms || '')}${i.tier ? ' · ' + esc(i.tier) : ''}${i.discount ? ' · ' + i.discount + '% discount' : ''}${i.rep ? ' · rep ' + esc(i.rep) : ''}</div></div><button class="btn sm" id="cch">Change</button></div>${i.on_hold ? '<div class="warn"><b>On credit hold in Cin7.</b> Only an admin can raise a sale for this customer.</div>' : ''}`;
    $('cch').onclick = () => { S.cust = null; S.info = null; drawCust(); };
  } else if (S.newc) {
    e.innerHTML = `<div class="g2"><div><div class="k">New customer's name</div><input id="ncn" placeholder="Person or company"></div><div class="sub" style="align-self:end">Cin7 creates them when you save. Fill the contact, email and address below.</div></div><button class="btn sm" id="ncb" style="margin-top:8px">← Search existing customers instead</button>`;
    $('ncb').onclick = () => { S.newc = false; drawCust(); };
  } else {
    e.innerHTML = `<input id="cs" placeholder="Start typing the customer's name" autocomplete="off"><div id="cres"></div><button class="btn sm" id="ncb" style="margin-top:8px">+ New customer</button>`;
    let t; $('cs').oninput = ev => { clearTimeout(t); t = setTimeout(async () => { const q = ev.target.value.trim(); if (q.length < 2) { $('cres').innerHTML = ''; return; }
      try { const j = await api('?customers=' + encodeURIComponent(q)); $('cres').innerHTML = j.customers.length ? `<div class="res">${j.customers.map(x => `<div class="it" data-c="${x.customer_id}"><b>${esc(x.name)}</b><span class="sub">${esc(x.sales_rep || '')}</span></div>`).join('')}</div>` : '<div class="sub" style="margin-top:6px">No match. Try less of the name, or add them as a new customer.</div>';
        document.querySelectorAll('[data-c]').forEach(d => d.onclick = () => pickCust(d.dataset.c)); } catch(x){} }, 300); };
    $('ncb').onclick = () => { S.newc = true; drawCust(); };
    $('cs').focus();
  }
}
async function pickCust(id){
  try {
    const j = await api('?customer=' + id), c = j.customer; S.cust = { id: c.id, name: c.name }; S.info = c; drawCust();
    const dc = (c.contacts.find(k => k.default) || c.contacts[0]) || {};
    if (!$('ct').value) $('ct').value = dc.name || ''; if (!$('ph').value) $('ph').value = dc.phone || ''; if (!$('em').value) $('em').value = dc.email || '';
    S.addrs = c.addresses.filter(a => a.type === 'Shipping'); if (!S.addrs.length) S.addrs = c.addresses;
    if (S.addrs.length > 1) { $('adsel').innerHTML = `<div class="k">Saved addresses</div><select id="adp"><option value="">Choose a saved address…</option>${S.addrs.map((a, i) => `<option value="${i}">${esc([a.line1, a.line2, a.city, a.postcode].filter(Boolean).join(', '))}${a.default ? ' (default)' : ''}</option>`).join('')}</select><div style="height:8px"></div>`; $('adp').onchange = ev => { if (ev.target.value !== '') fillAddr(S.addrs[+ev.target.value]); }; }
    else $('adsel').innerHTML = '';
    const a = S.addrs.find(x => x.default) || S.addrs[0]; if (a) fillAddr(a);
    if (c.carrier && !$('ca').value) $('ca').value = c.carrier;
    if (S.lines.length) { toast('Re-pricing the lines for ' + c.name); for (const l of S.lines) await price(l); drawLines(); }
  } catch(x){ if (x.message !== 'login') toast(x.message); }
}
function fillAddr(a){ $('l1').value = a.line1 || ''; $('l2').value = a.line2 || ''; $('cy').value = a.city || ''; $('pc').value = a.postcode || ''; }
async function price(l){
  try { const j = await api('?price=' + encodeURIComponent(l.sku) + (S.cust ? '&customer=' + S.cust.id : '')); l.price = j.price; l.special = j.special; l.product_id = j.product_id; l.discount = l.discount || (S.info ? S.info.discount : 0) || 0; } catch(x){ if (x.message === 'login') throw x; }
}
async function prodSearch(q){
  const r = $('pres'); if (q.length < 2) { r.innerHTML = ''; return; }
  try { const j = await api('?products=' + encodeURIComponent(q));
    r.innerHTML = j.results.length ? `<div class="res">${j.results.map((p, i) => `<div class="it" data-p="${i}"><div><b>${esc(p.sku)}</b> ${esc(p.name)}<div class="sub">${esc(p.category || '')}${p.web ? ' · website ' + gbp(p.web) + ' ex VAT' : ''}</div></div><div class="sub r" style="white-space:nowrap">Bromham <b style="color:${p.bromham > 0 ? 'var(--good)' : 'var(--bad)'}">${p.bromham}</b><br>Wootton B. <b>${p.wb}</b></div></div>`).join('')}</div>` : '<div class="sub" style="margin-top:6px">Nothing matches.</div>';
    document.querySelectorAll('[data-p]').forEach(d => d.onclick = async () => { const p = j.results[+d.dataset.p]; r.innerHTML = ''; $('ps').value = ''; await addLine(p); });
  } catch(x){ if (x.message !== 'login') r.innerHTML = `<div class="er">${esc(x.message)}</div>`; }
}
async function addLine(p){
  const ex = S.lines.find(l => l.sku === p.sku);
  if (ex) { ex.qty = (+ex.qty || 0) + 1; drawLines(); return; }
  const l = { sku: p.sku, name: p.name, product_id: p.product_id, qty: 1, price: 0, discount: 0, bromham: p.bromham };
  S.lines.push(l); drawLines(); await price(l); drawLines();
}
function rate(){ const m = String((S.info && S.info.tax_rule) || '').match(/(\d+(?:\.\d+)?)\s*%/); return m ? +m[1] / 100 : 0.2; }
const lineNet = l => Math.round((+l.qty || 0) * (+l.price || 0) * (1 - (+l.discount || 0) / 100) * 100) / 100;
function drawLines(){
  $('lines').innerHTML = S.lines.length ? `<table class="t"><tr><th>Code</th><th>Description</th><th class="r">Qty</th><th class="r">Price ex VAT</th><th class="r">Disc %</th><th class="r">Total ex VAT</th><th></th></tr>${S.lines.map((l, i) => `<tr><td><b>${esc(l.sku)}</b></td><td>${esc(l.name)}${l.special ? ' <span class="st">special price</span>' : ''}${+l.qty > l.bromham ? `<div class="sub" style="color:var(--accent)">Only ${l.bromham} available at Bromham</div>` : ''}</td>
    <td class="r"><input class="q r" data-f="qty" data-i="${i}" type="number" min="0" step="any" value="${l.qty}"></td><td class="r"><input class="pr r" data-f="price" data-i="${i}" type="number" min="0" step="0.01" value="${l.price}"></td><td class="r"><input class="dc r" data-f="discount" data-i="${i}" type="number" min="0" max="100" step="any" value="${l.discount || 0}"></td>
    <td class="r" id="lt${i}">${gbp(lineNet(l))}</td><td><button class="btn sm" data-x="${i}">✕</button></td></tr>`).join('')}</table>` : '<div class="sub" style="margin-top:8px">No products yet. Search above and click one to add it.</div>';
  document.querySelectorAll('#lines input').forEach(inp => inp.oninput = () => { const l = S.lines[+inp.dataset.i]; l[inp.dataset.f] = inp.value; const c = $('lt' + inp.dataset.i); if (c) c.textContent = gbp(lineNet(l)); totals(); });
  document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { S.lines.splice(+b.dataset.x, 1); drawLines(); });
  totals();
}
function drawCharges(){
  $('chg').innerHTML = S.charges.map((c, i) => `<div class="g3" style="grid-template-columns:3fr 1fr auto;margin-bottom:6px"><input list="chl" data-cf="desc" data-ci="${i}" value="${esc(c.desc)}" placeholder="e.g. Next Working Day Delivery"><input type="number" step="0.01" data-cf="price" data-ci="${i}" value="${c.price}" placeholder="£ ex VAT"><button class="btn sm" data-cx="${i}">✕</button></div>`).join('');
  document.querySelectorAll('[data-cf]').forEach(inp => inp.oninput = () => { S.charges[+inp.dataset.ci][inp.dataset.cf] = inp.value; totals(); });
  document.querySelectorAll('[data-cx]').forEach(b => b.onclick = () => { S.charges.splice(+b.dataset.cx, 1); drawCharges(); totals(); });
  totals();
}
function totals(){
  const net = Math.round((S.lines.reduce((t, l) => t + lineNet(l), 0) + S.charges.reduce((t, c) => t + (+c.price || 0), 0)) * 100) / 100, vat = Math.round(net * rate() * 100) / 100;
  $('tot').innerHTML = `<div class="tot"><div><span>Total ex VAT</span><span>${gbp(net)}</span></div><div><span>VAT (${Math.round(rate() * 100)}%)</span><span>${gbp(vat)}</span></div><div class="gt"><span>Total inc VAT</span><span>${gbp(net + vat)}</span></div></div>`;
}
async function submit(mode, draft){
  const err = t => $('err').textContent = t || ''; err('');
  if (!S.cust && !(S.newc && $('ncn') && $('ncn').value.trim())) return err('Pick a customer first.');
  if (!S.lines.length) return err('Add at least one product.');
  if (S.lines.some(l => !(+l.qty > 0) || !l.product_id)) return err('Check the quantities. Every line needs a quantity above zero.');
  const ca = $('ca').value.trim(), collect = /collect/i.test(ca);
  if (!collect && !$('l1').value.trim() && !$('pc').value.trim()) return err('Add a delivery address, or put "Collection" as the delivery method.');
  const body = { action: 'create', mode, draft, customer_id: S.cust && S.cust.id, new_customer: S.newc ? { name: $('ncn').value.trim() } : undefined,
    contact: $('ct').value.trim(), phone: $('ph').value.trim(), email: $('em').value.trim(), ship: { line1: $('l1').value, line2: $('l2').value, city: $('cy').value, postcode: $('pc').value },
    carrier: ca, ship_by: $('sb').value, location: $('lc').value, reference: $('rf').value.trim(), delivery_notes: $('dn').value.trim(), note: $('nt').value.trim(),
    lines: S.lines.map(l => ({ sku: l.sku, product_id: l.product_id, name: l.name, qty: +l.qty, price: +l.price, discount: +l.discount || 0 })), charges: S.charges.filter(c => c.desc && +c.price).map(c => ({ desc: c.desc, price: +c.price })) };
  ['bq', 'bo', 'bd'].forEach(b => $(b).disabled = true); $('bq').textContent = 'Saving to Cin7…';
  try { const j = await api('', body); done(j, body); }
  catch(x){ if (x.message === 'login') return; err(x.message); ['bq', 'bo', 'bd'].forEach(b => $(b).disabled = false); $('bq').textContent = 'Save as quote'; }
}
function done(j, body){
  $('pa').innerHTML = `<div class="ok"><div class="title" style="font-size:30px">${esc(j.number || 'Saved')}</div><div style="font-size:16px"><b>${j.mode === 'order' ? 'Order' : 'Quote'}</b> for ${esc(S.cust ? S.cust.name : body.new_customer.name)} · ${gbp(j.total)} inc VAT. It's in Cin7 now.</div>
      <div class="sub" style="margin-top:4px">It can take a couple of minutes to show up in the other Bob screens.</div></div>
    <div id="payhost"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${j.stage === 'quote' ? '<button class="btn y" id="toord">Turn this quote into an order</button>' : ''}<button class="btn" id="opn">Open it in Sales orders</button><button class="btn" id="again">Start another sale</button></div><div id="derr" class="er" style="margin-top:8px"></div>`;
  const draw = () => TSDPay.panel($('payhost'), { token: () => token, saleId: j.sale_id, toast });
  draw();
  $('again').onclick = () => { S = fresh(); form(); window.scrollTo(0, 0); };
  $('opn').onclick = () => gotoOrders(j.number);
  const to = $('toord'); if (to) to.onclick = async () => { to.disabled = true; $('derr').textContent = ''; try { const r = await api('', { action: 'to_order', sale_id: j.sale_id }); toast(r.number + ' is now an order'); to.remove(); draw(); } catch(x){ $('derr').textContent = x.message; to.disabled = false; } };
}

// ---------- payment links tab ----------
async function loadLinks(){
  try { LK = await api('?links=1'); drawLinks(); } catch(x){ if (x.message !== 'login' && $('pb')) $('pb').innerHTML = `<div class="card er">${esc(x.message)}</div>`; }
}
function drawLinks(){
  if (!$('pb')) return;
  const all = LK.links, open = all.filter(l => l.status === 'open'), paid = all.filter(l => l.status === 'paid');
  const rows = LF === 'open' ? open : LF === 'paid' ? paid : all;
  const sum = a => a.reduce((t, l) => t + (+(l.status === 'paid' ? l.paid_amount : l.amount) || 0), 0);
  $('pb').innerHTML = `<div class="card"><div style="display:flex;gap:24px;flex-wrap:wrap"><div><div class="k">Waiting for payment</div><div class="title" style="font-size:30px">${open.length} · ${gbp(sum(open))}</div></div><div><div class="k">Paid, last 90 days</div><div class="title" style="font-size:30px">${paid.length} · ${gbp(sum(paid))}</div></div></div>
    <div class="chips"><button data-f="open" class="${LF === 'open' ? 'on' : ''}">Waiting (${open.length})</button><button data-f="paid" class="${LF === 'paid' ? 'on' : ''}">Paid (${paid.length})</button><button data-f="all" class="${LF === 'all' ? 'on' : ''}">All</button></div>
    ${rows.length ? `<table class="lt"><tr><th>Order</th><th>Customer</th><th class="r">Amount</th><th>Status</th><th>Made by</th><th></th></tr>${rows.map(l => { const old = l.status === 'open' && Date.now() - new Date(l.created_at) > 2 * 86400e3;
      return `<tr><td><a href="#" data-o="${esc(l.order_number)}" style="color:var(--blue);font-weight:700;text-decoration:none">${esc(l.order_number)}</a></td><td>${esc(l.customer || '')}${l.email ? `<div class="sub">${esc(l.email)}</div>` : ''}</td><td class="r"><b>${gbp(l.status === 'paid' ? l.paid_amount : l.amount)}</b></td>
      <td><span class="st ${l.status}">${l.status === 'open' ? 'Waiting' : l.status === 'paid' ? 'PAID' : 'Switched off'}</span><div class="sub ${old ? 'late' : ''}">${l.status === 'paid' ? 'paid ' + ago(l.paid_at) + ' ago' : l.status === 'open' ? (l.emailed_at ? 'emailed ' + ago(l.emailed_at) + ' ago' : 'not emailed yet') + (old ? ' · chase?' : '') : ''}</div></td>
      <td class="sub">${esc(l.created_by_name || '')}<br>${ago(l.created_at)} ago</td>
      <td style="white-space:nowrap">${l.status === 'open' ? `<button class="btn sm" data-cp="${esc(l.url)}">Copy link</button> <button class="btn sm" data-em="${l.id}" data-s="${l.sale_id}">Email</button> <button class="btn sm" data-cx="${l.id}">Switch off</button>` : ''}${l.status === 'paid' ? `<button class="btn sm y" data-pk="${l.sale_id}">🖨 Pick sheet</button>` : ''}</td></tr>`; }).join('')}</table>` : '<div class="sub" style="padding:14px 0">Nothing here.</div>'}</div>`;
  document.querySelectorAll('.chips button').forEach(b => b.onclick = () => { LF = b.dataset.f; drawLinks(); });
  document.querySelectorAll('[data-o]').forEach(a => a.onclick = e => { e.preventDefault(); gotoOrders(a.dataset.o); });
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.cp); toast('Link copied'); } catch(e){ prompt('Copy this link', b.dataset.cp); } });
  document.querySelectorAll('[data-em]').forEach(b => b.onclick = () => TSDPay.emailDlg({ token: () => token, saleId: b.dataset.s, toast, onChange: loadLinks }, +b.dataset.em));
  document.querySelectorAll('[data-cx]').forEach(b => b.onclick = async () => { if (!confirm('Switch this link off? The customer will no longer be able to pay with it.')) return; try { await api('', { action: 'cancel', id: +b.dataset.cx }); loadLinks(); } catch(x){ toast(x.message); } });
  document.querySelectorAll('[data-pk]').forEach(b => b.onclick = async () => { b.disabled = true; try { await TSDPay.call(() => token, 'orders', { action: 'print', id: b.dataset.pk, doc: 'pick', printer: 'dispatch' }); toast('Pick sheet sent to the dispatch printer'); } catch(x){ toast(x.message); b.disabled = false; } });
}
if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });
</script>
<script>
(function(){
  const BUILD = '20261112115455';
  const busy = () => { const a = document.activeElement; return (a && a.matches && a.matches('input,textarea,select')) || (S && (S.lines.length || S.cust)) ; };
  let newer = false;
  async function check(){ try { if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); } if (newer && !busy()) location.reload(); } catch(e){} }
  setInterval(check, 120000);
})();
</script>

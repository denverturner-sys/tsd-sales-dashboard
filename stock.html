<title>Stock · TSD</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#262727; --panel:#323333; --panel2:#3B3C3C; --line:#474949; --ink:#FFFFFF; --muted:#B9BCBC;
  --accent:#EED107; --good:#7DDB98; --bad:#FF7A6B; --blue:#8EC5FF;
  --num:'Bebas Neue','DIN Condensed','Arial Narrow',Arial,sans-serif;
  --body:Barlow,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
#tabs{max-width:1600px;margin:0 auto;padding:12px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
#tabs a{color:var(--muted);text-decoration:none;font-weight:700;font-size:15px;padding:9px 16px;border:1px solid var(--line);border-radius:999px}
#tabs a:hover{color:var(--ink);border-color:var(--muted)}
#tabs a.on{background:var(--accent);color:#262727;border-color:var(--accent)}
.wrap{max-width:1600px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
header img{height:44px}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px}
#q{width:100%;max-width:760px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-size:20px;font-family:inherit}
#q:focus{outline:none;border-color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:6px 2px 14px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
@media (max-width:600px){.res{grid-template-columns:minmax(0,1fr)}}
.p{background:var(--panel);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--line)}
.p.ok{border-left-color:var(--good)} .p.low{border-left-color:var(--accent)} .p.none{border-left-color:var(--bad)}
.p .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.p .sku{font-family:var(--num);font-size:26px;letter-spacing:1px;line-height:1}
.p .nm{font-weight:600;line-height:1.3}
.p .meta{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
td.big{font-family:var(--num);font-size:24px;line-height:1}
.g{color:var(--good)} .b{color:var(--bad)} .y{color:var(--accent)} .m{color:var(--muted)}
.pos{font-size:13px;line-height:1.5;background:rgba(142,197,255,.08);border-radius:8px;padding:6px 9px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:4px;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.empty{color:var(--muted);padding:20px 4px;font-size:16px}
footer{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<script>
(function(){ // tabs between the warehouse screens; add &nav=0 to a link to hide them
  const q = new URLSearchParams(location.search); if (q.get('nav') === '0') return;
  const k = encodeURIComponent(q.get('k') || '');
  const t = [['pick','Pick &amp; Dispatch','warehouse.html?k=' + k], ['van','Van Team','van.html?k=' + k], ['coll','Collections','warehouse.html?k=' + k + '&tab=collections'], ['gi','Goods In','goodsin.html?k=' + k], ['stock','Stock','stock.html?k=' + k]];
  const n = document.createElement('nav'); n.id = 'tabs';
  n.innerHTML = t.map(([id, label, url]) => `<a href="${url}" class="${id === 'stock' ? 'on' : ''}">${label}</a>`).join('');
  document.body.prepend(n);
})();
</script>

  <div class="hint">On hand = physically here · Allocated = on customer orders · Available = on hand minus allocated · On order = on POs not yet received</div>
  <div id="out"><div class="empty">Type at least 2 characters.</div></div>

<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/stock';
const key = new URLSearchParams(location.search).get('k') || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n = v => v == null ? '–' : (+v).toLocaleString('en-GB', {maximumFractionDigits: 2});
const dmy = s => s ? new Date(String(s).slice(0,10) + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}) : null;
const SITES = ['Bromham', 'Wootton Bassett'];
let seq = 0, timer;

function card(p){
  const lv = p.levels || {};
  const br = lv.Bromham || {};
  const cls = (+br.available || 0) > 0 ? 'ok' : (+br.on_hand || 0) > 0 ? 'low' : 'none';
  const rows = SITES.filter(s => lv[s] || s === 'Bromham').map(s => { const l = lv[s] || {};
    const av = +l.available || 0;
    return `<tr><td>${s}</td><td class="big">${n(l.on_hand ?? 0)}</td><td>${n(l.allocated ?? 0)}</td><td class="big ${av > 0 ? 'g' : av < 0 ? 'b' : 'm'}">${n(l.available ?? 0)}</td><td>${n(l.on_order ?? 0)}${l.next ? `<div class="m" style="font-size:12px">next ${dmy(l.next)}</div>` : ''}</td></tr>`; }).join('');
  const pos = (p.pos || []).slice(0, 4).map(o => `<div>📦 <b>${n(o.qty)}</b> on ${esc(o.po)} · ${esc(o.supplier || '')}${o.location && o.location !== 'Bromham' ? ' · ' + esc(o.location) : ''} · ${o.expected ? 'due ' + dmy(o.expected) : '<span class="m">no date</span>'}</div>`).join('');
  return `<div class="p ${cls}">
    <div class="top"><span class="sku">${esc(p.sku)}</span>${p.status && p.status !== 'Active' ? `<span class="tag">${esc(p.status)}</span>` : ''}</div>
    <div class="nm">${esc(p.name)}</div>
    <div class="meta">${[p.category, p.supplier ? 'from ' + p.supplier : null, p.uom && p.uom !== 'Item' ? 'sold per ' + p.uom : null].filter(Boolean).map(esc).join(' · ')}</div>
    <table><thead><tr><th>Site</th><th>On hand</th><th>Allocated</th><th>Available</th><th>On order</th></tr></thead><tbody>${rows}</tbody></table>
    ${pos ? `<div class="pos">${pos}${(p.pos || []).length > 4 ? `<div class="m">+ ${p.pos.length - 4} more POs</div>` : ''}</div>` : ''}
  </div>`;
}
async function search(q){
  const my = ++seq;
  if (q.length < 2) { document.getElementById('out').innerHTML = '<div class="empty">Type at least 2 characters.</div>'; return; }
  document.getElementById('out').style.opacity = .6;
  try {
    const r = await fetch(API + '?q=' + encodeURIComponent(q) + '&k=' + encodeURIComponent(key), {cache:'no-store'});
    if (r.status === 403) { document.getElementById('out').innerHTML = '<div class="empty">Access link not recognised.</div>'; return; }
    const j = await r.json(); if (my !== seq) return;
    if (j.error) throw new Error(j.error);
    document.getElementById('out').innerHTML = j.results.length ? `<div class="res">${j.results.map(card).join('')}</div>${j.results.length >= 60 ? '<div class="hint">Showing the first 60. Add another word to narrow it down.</div>' : ''}`
      : `<div class="empty">Nothing matches “${esc(q)}”. Try fewer words or part of the SKU.</div>`;
    document.getElementById('foot').textContent = j.stock_synced ? 'Stock from Cin7, updated ' + new Date(j.stock_synced).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) + ' (every 15 minutes). Goods booked in on the Goods In screen show straight away.' : '';
  } catch(e) { if (my === seq) document.getElementById('out').innerHTML = `<div class="empty">Couldn't search: ${esc(e.message)}</div>`; }
  finally { if (my === seq) document.getElementById('out').style.opacity = 1; }
}
const qEl = document.getElementById('q');
qEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search(qEl.value.trim()), 250); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); qEl.select(); } if (e.key === 'Escape') { qEl.value = ''; search(''); } });
if (!key) document.getElementById('out').innerHTML = '<div class="empty">This screen needs its access link.</div>';
</script>
<script>
// Self-update: every 2 minutes, check GitHub for a newer copy of this page and reload into it (waits while someone is typing).
(function(){
  const BUILD = '20261026215051';
  let newer = false;
  async function check(){
    try {
      if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); }
      if (newer && !document.getElementById('q').value) location.reload();
    } catch(e){}
  }
  setInterval(check, 120000);
})();
</script>

button,input,select,textarea{font-family:inherit;font-size:17px}
.wrap{padding:14px 14px 90px;max-width:900px;margin:0 auto}
.title{font-family:var(--num);font-size:34px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.card{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--accent);color:#262727;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}
.btn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%;margin-top:10px}
.btn:disabled{opacity:.5}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--accent);color:#262727;border-color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-weight:600}
.msg.ok{background:rgba(125,219,152,.15);color:var(--good)} .msg.bad{background:rgba(255,122,107,.15);color:var(--bad)}
.m{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;position:sticky;top:0;background:var(--panel)}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td.sku{font-family:var(--num);font-size:20px;letter-spacing:.8px;white-space:nowrap}
td input{width:90px;text-align:right;padding:9px;font-size:18px;font-weight:700}
tr.done td input{border-color:var(--good)}
.pos{color:var(--blue);font-weight:700}.neg{color:var(--bad);font-weight:700}.zero{color:var(--good)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:5}
.bar .btn{white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:14px;cursor:pointer}
.chk input{width:auto}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--panel2)}
.tag.warn{background:rgba(238,209,7,.18);color:var(--accent)}.tag.ok{background:rgba(125,219,152,.15);color:var(--good)}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
.pr{display:none}
.mini{font-size:12px;color:var(--muted);line-height:1.3}
.flag{display:inline-block;margin-top:3px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.flag.bad{background:rgba(255,122,107,.18);color:var(--bad)}.flag.warn{background:rgba(238,209,7,.18);color:var(--accent)}
tr.flash td{background:rgba(238,209,7,.22)}
#scanbox{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--panel);border-bottom:2px solid var(--accent);padding:10px 14px;display:none;max-width:900px;margin:0 auto}
#reader{width:100%;max-height:34vh;overflow:hidden;border-radius:10px;background:#000}
.hit{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;cursor:pointer}
.hit b{font-family:var(--num);font-size:20px;letter-spacing:1px;font-weight:400}.hit small{display:block;color:var(--muted)}
@media print{
  body{background:#fff;color:#000}.noprint,.bar{display:none!important}.pr{display:block}
  .card{background:#fff;padding:0}th{background:#fff;color:#000;position:static}td{border-top:1px solid #999;padding:7px 6px}
  td.sku{font-size:16px}.box{display:inline-block;width:90px;height:26px;border:1px solid #000}
  .screen{display:none}
}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div id="scanbox"></div>
<div class="wrap" id="app" style="display:none"><div class="m">Loading…</div></div>
<script src="auth.js?v=20261110221656"></script>
<script src="activity.js?v=20261110221656"></script>
<script src="html5-qrcode.min.js?v=20261110221656"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/stockcount';
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){ mem[k] = v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
const SITES = ['Wootton Bassett', 'Bromham'];
const qs = new URLSearchParams(location.search);
let token = store.get('tsd_me_token'), ME = null, tab = (qs.get('open') || qs.get('count')) ? 'counts' : 'count', busy = false;
let site = store.get('sc_site') || 'Wootton Bassett', suppliers = null, supplier = '', zero = false, blind = false, scanAdd = true, scanner = null, lastCode = '', lastAt = 0, unknown = null, hits = [], qseq = 0, qtimer;
let lines = null, vals = {}, loaded = {}, filter = '', note = '', result = null, err = '';
let counts = null, detail = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => (+v).toLocaleString('en-GB', {maximumFractionDigits: 2});
const A = () => document.getElementById('app');
function showLogin(m){ A().style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = m || ''; }
async function api(q, body){
  const r = await fetch(API + (q ? '?' + q : ''), body ? {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (j.error || j.ok === false) throw new Error(j.error || "Couldn't do that");
  return j;
}
const dkey = () => `sc_draft|${site}|${supplier}|${zero ? 1 : 0}`;
function saveDraft(){ if (lines) store.set(dkey(), JSON.stringify({vals, loaded, note, extra: lines.filter(l => l.extra)})); }
function loadDraft(){ try { const d = JSON.parse(store.get(dkey()) || 'null'); if (d) { vals = d.vals || {}; loaded = d.loaded || {}; note = d.note || ''; for (const x of (d.extra || [])) if (!lines.some(l => l.product_id === x.product_id)) lines.push(x); } } catch(e){} }

async function boot(){
  try {
    const j = await api('suppliers=1&site=' + encodeURIComponent(site));
    ME = j.me; suppliers = j.suppliers;
    if ((qs.get('open') || qs.get('count'))) { tab = 'counts'; await openCount(qs.get('open') || qs.get('count')); return; }
    render();
  } catch(x){ if (x.message !== 'login') A().innerHTML = `<div class="msg bad">${esc(x.message)}</div>`; }
}
async function setSite(s){ stopScan(); site = s; store.set('sc_site', s); supplier = ''; lines = null; result = null; suppliers = null; render(); await boot(); }
async function loadSheet(){
  if (!supplier) { lines = null; return render(); }
  busy = true; err = ''; render();
  try {
    const j = await api(`site=${encodeURIComponent(site)}&supplier=${encodeURIComponent(supplier)}${zero ? '&zero=1' : ''}`);
    lines = j.lines; vals = {}; loaded = {}; note = '';
    for (const l of lines) loaded[l.product_id] = l.expected;
    loadDraft();
  } catch(x){ if (x.message !== 'login') err = x.message; lines = null; }
  busy = false; render();
}
function other(){ return site === 'Bromham' ? 'Wootton Bassett' : 'Bromham'; }
function flagFor(l, v){ if (blind || v === '' || !isFinite(+v)) return ''; const c = +v, e = l.expected, d = c - e; if (!d) return '';
  if (e > 0 && c < e * 0.5 && e - c >= 3) return `<span class="flag bad">Bob has ${num(e)}, you've got ${num(c)}. Might be stored elsewhere, have a look before submitting</span>`;
  if (c > e * 1.5 && d >= 3) return `<span class="flag warn">${num(d)} more than Bob has. Double check it's the right product</span>`;
  return `<span class="mini">${d > 0 ? '+' : ''}${num(d)} vs Bob</span>`; }
function setVal(id, v){ if (v === '') delete vals[id]; else vals[id] = v; saveDraft(); const fl = document.getElementById('f' + id), L = lines.find(x => x.product_id === id); if (fl && L) fl.innerHTML = flagFor(L, v); const tr = document.getElementById('r' + id); if (tr) tr.classList.toggle('done', v !== ''); stat(); }
function counted(){ return Object.keys(vals).filter(k => vals[k] !== '' && isFinite(+vals[k])).length; }
function stat(){ const e = document.getElementById('stat'); if (e) e.textContent = `${counted()} of ${lines.length} counted`; const b = document.getElementById('sub'); if (b) b.disabled = !counted() || busy; }
function setFilter(v){ filter = v.toLowerCase(); const f = filter.trim();
  document.querySelectorAll('#tb tr').forEach(tr => { tr.style.display = !f || tr.dataset.t.includes(f) ? '' : 'none'; }); }
function nextOnEnter(ev){ if (ev.key === 'Enter') { ev.preventDefault(); let tr = ev.target.closest('tr').nextElementSibling; while (tr && tr.style.display === 'none') tr = tr.nextElementSibling; const i = tr && tr.querySelector('input'); if (i) i.focus(); else ev.target.blur(); } }

async function submit(){
  const gaps = lines.filter(l => vals[l.product_id] !== undefined && vals[l.product_id] !== '' && /bad/.test(flagFor(l, vals[l.product_id]))).length;
  if (gaps && !confirm(`${gaps} line${gaps > 1 ? 's are' : ' is'} way under what Bob has. That stock may just be in another spot. Submit anyway?`)) return;
  const left = lines.filter(l => !l.extra).length - counted();
  if (left > 0 && !confirm(`${left} line${left > 1 ? 's' : ''} left blank. Those won't be adjusted, only the ones you've counted.\n\nSubmit now?`)) return;
  busy = true; err = ''; render();
  try {
    const out = lines.filter(l => vals[l.product_id] !== undefined && vals[l.product_id] !== '' && isFinite(+vals[l.product_id]))
      .map(l => ({product_id: l.product_id, counted: +vals[l.product_id], expected_loaded: loaded[l.product_id]}));
    result = await api('', {action:'submit', site, supplier, note, lines: out});
    store.del(dkey()); lines = null; vals = {}; supplier = ''; note = '';
  } catch(x){ if (x.message !== 'login') err = x.message; }
  busy = false; render();
}
async function loadCounts(){ counts = null; render(); try { counts = (await api('view=counts&site=' + encodeURIComponent(site))).counts; } catch(x){ if (x.message !== 'login') err = x.message; } render(); }
async function openCount(id){ tab = 'counts'; try { detail = await api('view=count&id=' + id + '&site=' + encodeURIComponent(site)); } catch(x){ if (x.message !== 'login') err = x.message; } render(); }
async function markAdjusted(id){ if (!confirm('Tick this count off? Only do this once the adjustments are made in Cin7.')) return;
  try { await api('', {action:'adjusted', id}); await openCount(id); } catch(x){ err = x.message; render(); } }
function csv(){
  const rows = [['SKU','Name','Unit','Bob had','Counted','Difference']].concat(detail.lines.map(l => [l.sku, l.name, l.uom || '', l.expected_now, l.counted, l.variance]));
  const t = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], {type:'text/csv'})); a.download = `stock-count-${detail.count.id}.csv`; a.click();
}
const fdt = s => new Date(s).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});

function render(){
  const a = A(); a.style.display = ''; document.getElementById('login').style.display = 'none';
  if (!ME) { a.innerHTML = `<div class="m">Loading…</div>`; return; }
  const head = `<div class="noprint"><div class="title">Stock count</div><div class="sub">Count what's on the shelf, submit, and the differences go to Toby to adjust in Cin7.</div>
    <div class="seg"><button class="${tab === 'count' ? 'on' : ''}" onclick="tab='count';detail=null;render()">New count</button>
    <button class="${tab === 'counts' ? 'on' : ''}" onclick="tab='counts';detail=null;loadCounts()">${ME.can_review ? 'All counts' : 'My counts'}</button></div>
    ${err ? `<div class="msg bad">${esc(err)}</div>` : ''}</div>`;
  a.innerHTML = head + (tab === 'count' ? countView() : countsView());
  if (tab === 'count' && lines) stat();
}
function countView(){
  if (result) return `<div class="card noprint"><div class="msg ok">Submitted. ${result.counted} lines counted.</div>
    <p>${result.differences ? `<b>${result.differences}</b> ${result.differences > 1 ? 'differences' : 'difference'} found (${num(result.over)} units over, ${num(result.under)} under). Sent to Toby to adjust.` : 'Everything matched Bob\'s figures. Nothing to adjust.'}</p>
    <button class="btn full" onclick="result=null;render()">Count another supplier</button>
    <button class="btn alt full" onclick="tab='counts';openCount(${result.id});result=null">See this count</button></div>`;
  const pick = `<div class="card noprint"><div class="g2"><div><div class="k">Site</div><select onchange="setSite(this.value)">${SITES.map(s => `<option ${s === site ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    <div><div class="k">Supplier</div><select onchange="supplier=this.value;loadSheet()"><option value="">${suppliers ? 'Choose a supplier…' : 'Loading…'}</option>
    ${(suppliers || []).map(s => `<option value="${esc(s.name)}" ${s.name === supplier ? 'selected' : ''}>${esc(s.name)} (${s.n})</option>`).join('')}
    <option value="*" ${supplier === '*' ? 'selected' : ''}>Everything (all suppliers)</option></select></div></div>
    <label class="chk"><input type="checkbox" ${zero ? 'checked' : ''} onchange="zero=this.checked;if(supplier)loadSheet()"> Include products Bob shows as zero stock (so you can add stock he doesn't know about)</label>
    <label class="chk"><input type="checkbox" ${blind ? 'checked' : ''} onchange="blind=this.checked;render()"> Blind count: hide what Bob expects</label></div>`;
  if (busy && !lines) return pick + `<div class="m">Loading the sheet…</div>`;
  if (!lines) return pick + (supplier ? '' : `<div class="m">Pick a site and supplier to get the count sheet.</div>`);
  if (!lines.length) return pick + `<div class="card">Nothing in stock for that supplier at ${esc(site)}. Tick "include zero stock" if you want to count anyway.</div>`;
  const rows = lines.map(l => { const v = vals[l.product_id] ?? '';
    return `<tr id="r${l.product_id}" class="${v !== '' ? 'done' : ''}" data-t="${esc((l.sku + ' ' + l.name).toLowerCase())}"><td class="sku">${esc(l.sku)}</td><td>${esc(l.name)}<div class="m">${esc(l.uom || '')}${l.extra ? ' · added by scan' : ''}</div><div id="f${l.product_id}">${flagFor(l, v)}</div></td>
      ${blind ? '' : `<td class="r">${num(l.expected)}<div class="mini">${l.allocated ? num(l.allocated) + ' allocated' : ''}${l.elsewhere ? (l.allocated ? '<br>' : '') + num(l.elsewhere) + ' at ' + esc(other()) : ''}</div></td>`}
      <td class="r"><span class="pr"><span class="box"></span></span><input id="i${l.product_id}" class="noprint" type="number" inputmode="decimal" min="0" step="any" value="${esc(v)}" oninput="setVal('${l.product_id}', this.value)" onkeydown="nextOnEnter(event)"></td></tr>`; }).join('');
  return pick + `<div class="card"><div class="pr"><b>Stock count sheet: ${esc(site)} · ${esc(supplier === '*' ? 'All suppliers' : supplier)}</b> · ${new Date().toLocaleDateString('en-GB')} · Counted by: ____________</div>
    <div class="noprint" style="display:flex;gap:10px;margin-bottom:10px"><input type="search" placeholder="Filter by SKU or name" oninput="setFilter(this.value)"><button class="btn" onclick="startScan()">📷 Scan</button><button class="btn alt" onclick="print()">Print</button></div>
    <table><thead><tr><th>SKU</th><th>Product</th>${blind ? '' : '<th class="r">Bob has</th>'}<th class="r">Counted</th></tr></thead><tbody id="tb">${rows}</tbody></table></div>
    <div class="card noprint"><div class="k">Note for Toby (optional)</div><textarea rows="2" placeholder="e.g. pallet 3 was damaged, 2 boxes in the wrong bay" oninput="note=this.value;saveDraft()">${esc(note)}</textarea>
    <div class="m" style="margin-top:6px">Leave a line blank if you didn't count it. Only counted lines are compared. Your numbers save on this device as you go.</div></div>
    <div class="bar noprint"><span id="stat" class="m"></span><button id="sub" class="btn" onclick="submit()" ${busy ? 'disabled' : ''}>${busy ? 'Sending…' : 'Submit count'}</button></div>`;
}
function countsView(){
  if (detail) { const c = detail.count, ls = detail.lines, d = ls.filter(l => l.variance !== 0);
    return `<div class="card"><button class="btn alt noprint" onclick="detail=null;loadCounts()">← All counts</button>
      <h3 style="margin:12px 0 2px">${esc(c.site)} · ${esc(c.supplier === '*' ? 'All suppliers' : c.supplier)}</h3>
      <div class="m">${esc(c.counted_by_name)} · ${fdt(c.counted_at)} · ${c.n_counted} counted · ${c.n_variance} different · <span class="tag ${c.status === 'adjusted' ? 'ok' : 'warn'}">${c.status === 'adjusted' ? 'Adjusted by ' + esc(c.adjusted_by) : 'Waiting for adjustment'}</span></div>
      ${c.note ? `<p>Note: ${esc(c.note)}</p>` : ''}
      <div class="noprint" style="display:flex;gap:8px;margin:10px 0"><button class="btn alt" onclick="csv()">Download CSV</button><button class="btn alt" onclick="print()">Print</button>
      ${ME.can_review && c.status !== 'adjusted' ? `<button class="btn" onclick="markAdjusted(${c.id})">Mark adjusted</button>` : ''}</div>
      ${d.length ? `<table><thead><tr><th>SKU</th><th>Product</th><th class="r">Bob had</th><th class="r">Counted</th><th class="r">Adjust by</th></tr></thead><tbody>${d.map(l => `<tr><td class="sku">${esc(l.sku)}</td><td>${esc(l.name)}${l.moved ? '<div class="m">stock moved during the count, check before adjusting</div>' : ''}</td><td class="r">${num(l.expected_now)}</td><td class="r">${num(l.counted)}</td><td class="r ${l.variance > 0 ? 'pos' : 'neg'}">${l.variance > 0 ? '+' : ''}${num(l.variance)}</td></tr>`).join('')}</tbody></table>` : '<div class="msg ok">Everything matched. Nothing to adjust.</div>'}
      ${ls.length - d.length ? `<div class="m" style="margin-top:8px">${ls.length - d.length} lines matched exactly.</div>` : ''}</div>`; }
  if (!counts) return `<div class="m">Loading…</div>`;
  if (!counts.length) return `<div class="card">No counts yet.</div>`;
  return `<div class="card">${counts.map(c => `<div class="row" onclick="openCount(${c.id})"><div><b>${esc(c.site)} · ${esc(c.supplier === '*' ? 'All suppliers' : c.supplier)}</b><div class="m">${esc(c.counted_by_name)} · ${fdt(c.counted_at)} · ${c.n_counted} counted</div></div>
    <div style="text-align:right">${c.n_variance ? `<span class="tag ${c.status === 'adjusted' ? 'ok' : 'warn'}">${c.status === 'adjusted' ? 'Adjusted' : c.n_variance + ' to adjust'}</span>` : '<span class="tag ok">All matched</span>'}</div></div>`).join('')}</div>`;
}

// ---------- scanning (10 Nov): scan a barcode to jump to the product and count it ----------
const validCode = c => { if (!/^(\d{8}|\d{12}|\d{13}|\d{14})$/.test(c)) return false; const d = c.split('').map(Number), k = d.pop(); return (10 - d.reverse().reduce((a, v, i) => a + v * (i % 2 ? 1 : 3), 0) % 10) % 10 === k; };
function box(){ return document.getElementById('scanbox'); }
function paintScan(msg, bad){
  box().style.display = 'block';
  box().innerHTML = `<div id="reader" style="${scanner ? '' : 'display:none'}"></div>
    <div id="sm" class="${bad ? 'msg bad' : 'm'}" style="margin:8px 0">${msg || ''}</div>
    ${unknown ? unknownHtml() : ''}
    <div style="display:flex;gap:10px;align-items:center;justify-content:space-between"><label class="chk" style="margin:0"><input type="checkbox" ${scanAdd ? 'checked' : ''} onchange="scanAdd=this.checked"> Each scan adds 1</label>
    <button class="btn alt" onclick="stopScan()">Close scanner</button></div>`;
}
function unknownHtml(){ return `<div class="card" style="margin:8px 0 0"><div class="k">Not saved yet: ${esc(unknown)}</div><input id="uq" type="search" placeholder="Which product is this? SKU or name" autocomplete="off" oninput="uSearch(this.value)"><div id="uh">${hits.map((p, i) => `<button class="hit" onclick="uSave(${i})"><b>${esc(p.sku)}</b><small>${esc(p.name)}</small></button>`).join('')}</div>
  <button class="btn alt" style="margin-top:8px" onclick="unknown=null;hits=[];startScan()">Skip, scan the next</button></div>`; }
function uSearch(v){ clearTimeout(qtimer); qtimer = setTimeout(async () => { const my = ++qseq; if (v.trim().length < 2) { hits = []; const h = document.getElementById('uh'); if (h) h.innerHTML = ''; return; }
  try { const j = await api(`site=${encodeURIComponent(site)}&q=${encodeURIComponent(v.trim())}`); if (my === qseq) { hits = j.results; const h = document.getElementById('uh'); if (h) h.innerHTML = hits.map((p, i) => `<button class="hit" onclick="uSave(${i})"><b>${esc(p.sku)}</b><small>${esc(p.name)}</small></button>`).join(''); } } catch(e){} }, 250); }
async function uSave(i){ const p = hits[i]; if (!p) return;
  try { const j = await api('', {action:'barcode', barcode: unknown, sku: p.sku, site}); const c = unknown; unknown = null; hits = []; await startScan(); countLine(j.line, `Saved ${c} against ${j.line.sku}. `); }
  catch(x){ const m = document.getElementById('sm'); if (m) { m.className = 'msg bad'; m.textContent = x.message; } } }
function countLine(l, pre){
  if (!lines) return;
  let L = lines.find(x => x.product_id === l.product_id);
  if (!L) { L = {...l, extra: true}; lines.push(L); render(); }
  const cur = +(vals[L.product_id] || 0), nv = scanAdd ? cur + 1 : cur;
  if (scanAdd) { vals[L.product_id] = String(nv); saveDraft(); }
  const inp = document.getElementById('i' + L.product_id), tr = document.getElementById('r' + L.product_id);
  if (inp && scanAdd) inp.value = nv;
  if (tr) { tr.classList.add('done', 'flash'); setTimeout(() => tr.classList.remove('flash'), 1500); const f = document.getElementById('f' + L.product_id); if (f) f.innerHTML = flagFor(L, String(vals[L.product_id] ?? '')); tr.scrollIntoView({block:'center', behavior:'smooth'}); }
  stat();
  const m = document.getElementById('sm'); if (m) { m.className = 'm'; m.innerHTML = `${esc(pre || '')}<b style="color:var(--ink)">${esc(L.sku)}</b> ${esc(L.name)} · counted ${scanAdd ? nv : 'so far ' + (vals[L.product_id] || 0)}${L.extra ? ' (not on this sheet, added)' : ''}`; }
}
async function onCode(c){
  const now = Date.now(); if (c === lastCode && now - lastAt < 2000) return; lastCode = c; lastAt = now; if (navigator.vibrate) navigator.vibrate(60);
  try {
    const j = await api(`site=${encodeURIComponent(site)}&code=${c}`);
    if (j.found) return countLine(j.line);
    await stopScan(true); unknown = c; hits = []; paintScan(`Barcode ${c} isn't saved against a product yet. Pick the right one and it's remembered from now on.`);
  } catch(x){ if (x.message !== 'login') paintScan(esc(x.message), true); }
}
async function startScan(){
  if (!lines) return;
  if (!window.Html5Qrcode) { paintScan("The scanner didn't load. Refresh the page.", true); return; }
  await stopScan(true); unknown = null;
  scanner = true; paintScan('Starting the camera…');
  const F = Html5QrcodeSupportedFormats, sc = new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.ITF], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  scanner = sc;
  sc.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => ({ width: Math.floor(w * 0.9), height: Math.floor(Math.min(h, w) * 0.5) }) },
    txt => { const c = String(txt).replace(/\D/g, ''); if (validCode(c)) onCode(c); }, () => {})
   .then(() => { const m = document.getElementById('sm'); if (m && /Starting/.test(m.textContent)) m.textContent = 'Scan a product. Hold it steady, 15-20cm away.'; })
   .catch(e => { scanner = null; paintScan("Couldn't start the camera. Allow camera access for this site in your browser settings.", true); });
}
async function stopScan(keepOpen){
  const s = scanner; scanner = null;
  if (s && s !== true) { try { await s.stop(); s.clear(); } catch(e){} }
  if (!keepOpen) { unknown = null; box().style.display = 'none'; box().innerHTML = ''; }
}

if (token) boot(); else showLogin();
TSDAuth.mount(t => { document.getElementById('login').style.display = 'none'; token = t; boot(); });
</script>

    if (newer && !busy && !document.activeElement?.matches('input,textarea,select') && !Object.keys(vals).length) location.reload(); } catch(e){} }, 120000);

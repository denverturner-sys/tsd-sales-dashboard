button,input,select,textarea{font-family:inherit;font-size:17px}
.wrap{padding:14px 14px 40px;max-width:640px;margin:0 auto}
.title{font-family:var(--num);font-size:34px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.card{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{width:100%;background:var(--accent);color:#262727;border:0;border-radius:10px;padding:14px;font-weight:800;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.hit{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.hit b{font-family:var(--num);font-size:22px;letter-spacing:1px;font-weight:400}
.hit small{display:block;color:var(--muted)}
.lv{display:flex;gap:16px;margin:8px 0;flex-wrap:wrap} .lv div{background:var(--bg);border-radius:8px;padding:6px 12px} .lv b{font-family:var(--num);font-size:26px;font-weight:400;display:block;line-height:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px;font-weight:700}
.seg button.on{background:var(--accent);color:#262727;border-color:var(--accent)}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-weight:600}
.msg.ok{background:rgba(125,219,152,.15);color:var(--good)} .msg.bad{background:rgba(255,122,107,.15);color:var(--bad)}
.tr{padding:10px 0;border-bottom:1px solid var(--line)} .tr:last-child{border-bottom:0}
.m{color:var(--muted);font-size:13px}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><div class="m">Loading…</div></div>
<script src="auth.js?v=20261105154936"></script>
<script src="activity.js?v=20261105154936"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/stockmove';
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
let token = store.get('tsd_me_token'), D = null, pick = null, msg = null, mode = new URLSearchParams(location.search).get('mode'), sub = 'send', busy = false, qseq = 0, hits = [];
const SITES = ['Bromham', 'Wootton Bassett'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n = v => v == null ? '0' : (+v).toLocaleString('en-GB', {maximumFractionDigits: 2});
function showLogin(m){ document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = m || ''; }
async function api(body, q){
  const r = await fetch(API + (q ? '?q=' + encodeURIComponent(q) : ''), body ? {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (body && !j.ok) throw new Error(j.error || "Couldn't do that");
  if (j.error) throw new Error(j.error);
  return j;
}
async function refresh(){
  try { D = await api(); if (!mode) mode = D.me.can_transfer ? 'transfer' : 'adjust'; render(); }
  catch(x){ if (x.message !== 'login') document.getElementById('app').innerHTML = `<div class="msg bad">${esc(x.message)}</div>`; }
}
function site(p, s){ const l = (p.levels || {})[s] || {}; return `<div><span class="m">${s}</span><b>${n(l.on_hand)}</b><span class="m">${n(l.available)} free</span></div>`; }
function pickBox(){
  if (pick) return `<div class="card"><div class="k">Product</div><b style="font-family:var(--num);font-size:26px;letter-spacing:1px;font-weight:400">${esc(pick.sku)}</b><div>${esc(pick.name)}</div>
    <div class="lv">${SITES.map(s => site(pick, s)).join('')}</div><div class="m">Levels from the 15-minute sync; the exact figure is checked in Cin7 when you confirm.</div>
    <button class="btn alt" onclick="pick=null;hits=[];render()">Pick a different product</button></div>`;
  return `<div class="card"><div class="k">Find the product</div><input id="q" type="search" placeholder="SKU or name" autocomplete="off" oninput="search(this.value)">
    <div id="hits">${hits.map((p, i) => `<button class="hit" onclick="choose(${i})"><b>${esc(p.sku)}</b><small>${esc(p.name)}</small></button>`).join('')}</div></div>`;
}
let timer;
function search(v){ clearTimeout(timer); timer = setTimeout(async () => { const my = ++qseq; if (v.trim().length < 2) { hits = []; return paintHits(); }
  try { const j = await api(null, v.trim()); if (my === qseq) { hits = j.results; paintHits(); } } catch(e){} }, 250); }
function paintHits(){ const h = document.getElementById('hits'); if (h) h.innerHTML = hits.map((p, i) => `<button class="hit" onclick="choose(${i})"><b>${esc(p.sku)}</b><small>${esc(p.name)}</small></button>`).join('') || '<div class="m" style="margin-top:8px">Nothing found</div>'; }
function choose(i){ pick = hits[i]; msg = null; render(); }
function banner(){ return msg ? `<div class="msg ${msg.ok ? 'ok' : 'bad'}">${esc(msg.t)}</div>` : ''; }
function adjustView(){
  return banner() + pickBox() + (pick ? `<div class="card"><div class="k">Adjust</div>
    <select id="asite">${SITES.map(s => `<option>${s}</option>`).join('')}</select>
    <div class="row"><select id="amode"><option value="change">Add / remove</option><option value="set">Set to exactly</option></select><input id="aqty" type="number" inputmode="numeric" placeholder="Qty (use − to remove)"></div>
    <div class="k" style="margin-top:10px">Reason</div><input id="areason" placeholder="e.g. damaged, found on shelf, recount" maxlength="200">
    <button class="btn" ${busy ? 'disabled' : ''} onclick="doAdjust()">Confirm adjustment</button></div>` : '');
}
async function doAdjust(){
  const qty = parseFloat(document.getElementById('aqty').value), site = document.getElementById('asite').value, m = document.getElementById('amode').value, reason = document.getElementById('areason').value.trim();
  if (!Number.isFinite(qty)) return alert('Enter a quantity'); if (!reason) return alert('Give a reason');
  if (!confirm(`${m === 'set' ? 'Set' : 'Change'} ${pick.sku} at ${site} ${m === 'set' ? 'to' : 'by'} ${qty}?`)) return;
  busy = true; render();
  try { const j = await api({action:'adjust', product_id: pick.product_id, site, mode: m, qty, reason}); msg = {ok:true, t:`Done. ${j.sku} at ${site}: ${j.was} → ${j.now}`}; pick = null; hits = []; }
  catch(x){ if (x.message === 'login') return; msg = {ok:false, t:x.message}; }
  busy = false; refresh();
}
function transferView(){
  const it = D.intransit || [];
  const recv = `<div class="card"><div class="k">On the way (waiting to be received)</div>${it.length ? it.map(t => `<div class="tr"><b>${esc(t.number)}</b> <span class="m">${esc(t.from)} → ${esc(t.to)}</span>
      ${t.lines.map(l => `<div>${n(l.qty)} × ${esc(l.sku)} <span class="m">${esc(l.name)}</span></div>`).join('')}
      <button class="btn" ${busy ? 'disabled' : ''} onclick="doReceive('${esc(t.task_id)}','${esc(t.number)}')">Received at ${esc(t.to)}</button></div>`).join('') : '<div class="m">Nothing in transit.</div>'}</div>`;
  const send = pickBox() + (pick ? `<div class="card"><div class="k">Send</div><div class="row"><select id="tfrom" onchange="document.getElementById('tto').value=this.value==='Bromham'?'Wootton Bassett':'Bromham'">${SITES.map(s => `<option>${s}</option>`).join('')}</select>
      <select id="tto"><option>Wootton Bassett</option><option>Bromham</option></select></div>
      <div class="k" style="margin-top:10px">Quantity</div><input id="tqty" type="number" inputmode="numeric" min="1" placeholder="How many">
      <button class="btn" ${busy ? 'disabled' : ''} onclick="doSend()">Send it</button></div>` : '');
  return banner() + `<div class="seg"><button class="${sub === 'send' ? 'on' : ''}" onclick="sub='send';render()">Send</button><button class="${sub === 'recv' ? 'on' : ''}" onclick="sub='recv';render()">Receive${it.length ? ' (' + it.length + ')' : ''}</button></div>` + (sub === 'send' ? send : recv);
}
async function doSend(){
  const qty = parseFloat(document.getElementById('tqty').value), from = document.getElementById('tfrom').value, to = document.getElementById('tto').value;
  if (!(qty > 0)) return alert('Enter a quantity'); if (from === to) return alert('Pick two different sites');
  if (!confirm(`Send ${qty} × ${pick.sku} from ${from} to ${to}?`)) return;
  busy = true; render();
  try { const j = await api({action:'send', product_id: pick.product_id, from, to, qty}); msg = {ok:true, t:`Sent as ${j.number || 'a transfer'}. It stays "in transit" until ${to} receives it.`}; pick = null; hits = []; }
  catch(x){ if (x.message === 'login') return; msg = {ok:false, t:x.message}; }
  busy = false; refresh();
}
async function doReceive(id, num){
  if (!confirm(`Mark ${num} as received?`)) return;
  busy = true; render();
  try { await api({action:'receive', task_id: id}); msg = {ok:true, t:`${num} received.`}; }
  catch(x){ if (x.message === 'login') return; msg = {ok:false, t:x.message}; }
  busy = false; refresh();
}
function recent(){ return (D.recent || []).length ? `<div class="card"><div class="k">Recent moves</div>${D.recent.map(r => `<div class="tr m">${new Date(r.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · <b style="color:var(--ink)">${esc(r.by_name)}</b> · ${r.kind === 'adjust' ? 'adjusted' : r.kind === 'send' ? 'sent' : 'received'} ${esc(r.sku || '')} ${r.qty != null ? n(r.qty) : ''}${r.to_site ? ` ${esc(r.site)}→${esc(r.to_site)}` : r.site ? ' at ' + esc(r.site) : ''}${r.ok ? '' : ' <span style="color:var(--bad)">FAILED: ' + esc(r.error) + '</span>'}</div>`).join('')}</div>` : '';
}
function render(){
  const a = document.getElementById('app'); a.style.display = 'block';
  const adj = mode === 'adjust';
  if (adj && !D.me.can_adjust || !adj && !D.me.can_transfer) { a.innerHTML = '<div class="msg bad">You don\'t have access to this screen.</div>'; return; }
  const keep = document.activeElement && document.activeElement.id === 'q' ? document.getElementById('q').value : null;
  a.innerHTML = `<div class="title">${adj ? 'Stock adjustment' : 'Stock transfers'}</div><div class="sub">${adj ? 'Change stock levels in Cin7. Everything is logged with your name.' : 'Bromham ↔ Wootton Bassett. Send from one site, receive at the other.'}</div>` + (adj ? adjustView() : transferView()) + recent();
  if (keep !== null) { const q = document.getElementById('q'); q.value = keep; q.focus(); }
}
if (token) refresh(); else showLogin();
TSDAuth.mount(t => { document.getElementById('login').style.display = 'none'; token = t; refresh(); });
</script>
<script>
(function(){ const BUILD = '20261105154936'; let newer = false;
  setInterval(async () => { try { if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); }
    if (newer && !busy && !document.activeElement?.matches('input,textarea,select')) location.reload(); } catch(e){} }, 120000);
})();
</script>
</body>
</html>

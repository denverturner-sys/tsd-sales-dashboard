html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
button,input,textarea{font-family:inherit;font-size:16px}
.wrap{padding:16px 16px 40px;max-width:760px;margin:0 auto}
.title{font-family:var(--num);font-size:40px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px;line-height:1.4}
.card{background:var(--panel);border-radius:12px;padding:16px 18px;margin-top:12px}
.q{font-weight:700;font-size:17px;line-height:1.3}
.hint{color:var(--muted);font-size:13px;margin:2px 0 8px}
textarea{width:100%;min-height:84px;resize:vertical;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}
textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.scale{display:flex;gap:8px;margin-top:8px}
.scale button{flex:1;padding:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:700;font-size:18px;cursor:pointer}
.scale button.on{background:var(--accent);color:#262727;border-color:var(--accent)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;font-size:15px}
.chips button.on{background:var(--blue);color:#262727;border-color:var(--blue);font-weight:700}
.anon{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.anon input{width:22px;height:22px;margin-top:2px;accent-color:#EED107}
.btn{background:var(--accent);color:#262727;border:0;border-radius:10px;padding:14px 22px;font-weight:800;font-size:17px;cursor:pointer;width:100%;margin-top:14px}
.btn:disabled{opacity:.5}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--num);font-size:44px;line-height:1}
.row{display:flex;gap:10px;align-items:center;margin:6px 0}
.row .bar{flex:1;height:14px;background:var(--panel2);border-radius:99px;overflow:hidden}.row .bar i{display:block;height:100%;background:var(--accent)}
.say{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:10px 0;white-space:pre-wrap;line-height:1.4}
.say small{display:block;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;font-weight:700}.tabs button.on{background:var(--accent);color:#262727}
#msg{padding:40px;text-align:center;color:var(--muted)}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><div id="msg">Loading…</div></div>
<script src="auth.js?v=20261103090318"></script>
<script src="activity.js?v=20261103090318"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/survey';
window.TSD_SCREEN = 'Feedback survey';
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
let token = store.get('tsd_me_token'), ME = null, MYSCREENS = [], DONE = false, VIEW = 'form', R = null;
const A = { ease:null, speed:null, screens:new Set(), best:'', annoy:'', missing:'', rename:'', other:'' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showLogin(msg){ document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = msg || ''; }
async function start(){
  document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block';
  try {
    const r = await fetch(API, { headers:{ Authorization:'Bearer ' + token }, cache:'no-store' });
    if (r.status === 401) { token = null; store.del('tsd_me_token'); return showLogin('Please log in again.'); }
    const j = await r.json(); if (j.error) throw new Error(j.error);
    ME = j.me; DONE = j.done; MYSCREENS = j.screens || []; render();
  } catch(x){ document.getElementById('app').innerHTML = `<div id="msg">${esc(x.message)}</div>`; }
}
async function loadResults(){
  const r = await fetch(API + '?results=1', { headers:{ Authorization:'Bearer ' + token }, cache:'no-store' });
  R = await r.json(); if (R.error) { R = null; alert(R && R.error || 'Could not load the results'); } render();
}

function render(){
  const tabs = ME.is_admin ? `<div class="tabs"><button class="${VIEW === 'form' ? 'on' : ''}" data-v="form">The survey</button><button class="${VIEW === 'res' ? 'on' : ''}" data-v="res">Results</button></div>` : '';
  const head = `<div class="title">How is the new system working for you?</div>`;
  let body;
  if (VIEW === 'res' && ME.is_admin) body = results();
  else if (DONE) body = `<div class="card"><div class="q">Thanks ${esc(ME.name)}, that's in.</div><div class="sub" style="margin-top:6px">We'll go through everything and tell you what's changing. If you think of something else, just tell Denver.</div></div>`;
  else body = form(ME);
  document.getElementById('app').innerHTML = head + tabs + body;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { VIEW = b.dataset.v; if (VIEW === 'res') loadResults(); else render(); });
  if (VIEW !== 'res' && !DONE) wire();
}

function scale(key, lo, hi){
  return `<div class="scale" data-k="${key}">${[1,2,3,4,5].map(n => `<button data-n="${n}" class="${A[key] === n ? 'on' : ''}">${n}</button>`).join('')}</div><div class="ends"><span>${lo}</span><span>${hi}</span></div>`;
}
function form(me){
  return `<div class="sub" style="margin-top:8px">Hi ${esc(me.name)}. You've had a week with the new system, so tell us what's working and what isn't. It takes about three minutes, and the honest answer is the useful one. Your answers come to Denver with your name on, so he can come back to you if he needs to ask what you meant. Skip anything you don't have an opinion on.</div>
  <div class="card"><div class="q">How easy is the new system to use day to day?</div>${scale('ease', '1 · Painful', '5 · Easy')}</div>
  <div class="card"><div class="q">How fast does it feel?</div>${scale('speed', '1 · Slow', '5 · Quick')}</div>
  <div class="card"><div class="q">Which screens do you actually use?</div><div class="hint">These are the ones you can open. Tap all that apply.</div><div class="chips" id="chips">${MYSCREENS.map(s => `<button data-s="${esc(s)}" class="${A.screens.has(s) ? 'on' : ''}">${esc(s)}</button>`).join('')}</div></div>
  <div class="card"><div class="q">What's the best thing about it?</div><textarea id="best" placeholder="Something it does better than the old way">${esc(A.best)}</textarea></div>
  <div class="card"><div class="q">What annoys you, or doesn't work?</div><div class="hint">Bugs, slow bits, confusing bits. Say which screen if you can.</div><textarea id="annoy">${esc(A.annoy)}</textarea></div>
  <div class="card"><div class="q">What's missing? What would save you time?</div><textarea id="missing">${esc(A.missing)}</textarea></div>
  <div class="card"><div class="q">What name should we give this new system?</div><textarea id="rename" style="min-height:56px" placeholder="Your suggestion">${esc(A.rename)}</textarea></div>
  <div class="card"><div class="q">Anything else?</div><textarea id="other">${esc(A.other)}</textarea></div>
  <button class="btn" id="send">Send</button><div class="sub" id="err" style="color:var(--bad);margin-top:8px"></div>`;
}
function wire(){
  document.querySelectorAll('.scale').forEach(el => el.onclick = e => { const b = e.target.closest('button'); if (!b) return; A[el.dataset.k] = +b.dataset.n; el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
  document.getElementById('chips').onclick = e => { const b = e.target.closest('button'); if (!b) return; const s = b.dataset.s; A.screens.has(s) ? A.screens.delete(s) : A.screens.add(s); b.classList.toggle('on'); };
  ['best','annoy','missing','rename','other'].forEach(k => document.getElementById(k).oninput = e => A[k] = e.target.value);
  document.getElementById('send').onclick = send;
}
async function send(){
  const b = document.getElementById('send'), err = document.getElementById('err'); b.disabled = true; err.textContent = '';
  try {
    const r = await fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token },
      body: JSON.stringify({ answers: { ease:A.ease, speed:A.speed, screens:[...A.screens], best:A.best, annoy:A.annoy, missing:A.missing, rename:A.rename, other:A.other } }) });
    const j = await r.json();
    if (r.status === 401) { token = null; store.del('tsd_me_token'); return showLogin('Please log in again.'); }
    if (!j.ok) throw new Error(j.error || 'Something went wrong');
    DONE = true; window.scrollTo(0, 0); render();
  } catch(x){ err.textContent = x.message; b.disabled = false; }
}

function results(){
  if (!R) return `<div id="msg">Loading…</div>`;
  const rs = R.responses || [], n = rs.length, avg = k => { const v = rs.map(r => r.answers[k]).filter(Boolean); return v.length ? (v.reduce((a,b) => a + b, 0) / v.length).toFixed(1) : '–'; };
  const cnt = {}; rs.forEach(r => (r.answers.screens || []).forEach(s => cnt[s] = (cnt[s] || 0) + 1));
  const sc = Object.entries(cnt).sort((a,b) => b[1] - a[1]);
  const say = (k, title) => { const l = rs.filter(r => r.answers[k]); return `<div class="card"><div class="k">${title} (${l.length})</div>${l.map(r => `<div class="say">${esc(r.answers[k])}<small>${esc(r.who)}</small></div>`).join('') || '<div class="sub">Nothing yet.</div>'}</div>`; };
  return `<div class="card"><div class="k">Replies</div><div class="big">${n} <span style="font-size:24px;color:var(--muted)">of ${(R.answered || []).length + (R.waiting || []).length}</span></div>
      <div class="sub" style="margin-top:6px"><b>Waiting on:</b> ${(R.waiting || []).map(esc).join(', ') || 'nobody, everyone has replied'}</div></div>
    <div class="card"><div class="k">Average (out of 5)</div><div class="row"><span style="width:90px">Ease of use</span><b class="big" style="font-size:32px">${avg('ease')}</b></div><div class="row"><span style="width:90px">Speed</span><b class="big" style="font-size:32px">${avg('speed')}</b></div></div>
    <div class="card"><div class="k">Screens people use</div>${sc.map(([s, c]) => `<div class="row"><span style="width:130px">${esc(s)}</span><div class="bar"><i style="width:${Math.round(c / Math.max(1, n) * 100)}%"></i></div><b>${c}</b></div>`).join('') || '<div class="sub">Nothing yet.</div>'}</div>
    ${say('best', 'Best thing')}${say('annoy', 'Annoys / doesn\'t work')}${say('missing', 'Missing / would save time')}${say('rename', 'Name ideas')}${say('other', 'Anything else')}`;
}

if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });
</script>
</body>
</html>

html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
button,input{font-family:inherit}
.wrap{max-width:1600px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
header img{height:44px}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px}
#q{width:100%;max-width:760px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-size:20px}
#q:focus{outline:none;border-color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:6px 2px 14px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:12px}
@media (max-width:600px){.res{grid-template-columns:minmax(0,1fr)} #q{font-size:18px}}
.o{background:var(--panel);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--line)}
.o.good{border-left-color:var(--good)} .o.go{border-left-color:var(--blue)} .o.wait{border-left-color:var(--accent)} .o.bad{border-left-color:var(--bad)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.no{font-family:var(--num);font-size:28px;letter-spacing:1px;line-height:1}
.cust{font-weight:700;font-size:16px;line-height:1.3}
.meta{font-size:13px;color:var(--muted);line-height:1.45}
.st{border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.04)}
.st .h{font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st .d{font-size:14px;color:var(--muted);margin-top:3px;line-height:1.45}
.o.good .st .h{color:var(--good)} .o.go .st .h{color:var(--blue)} .o.wait .st .h{color:var(--accent)} .o.bad .st .h{color:var(--bad)}
.parcel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;margin-top:6px}
.tn{font-family:ui-monospace,Consolas,monospace;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--accent);color:#262727;border-color:var(--accent)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
details{font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-weight:600}
.ln{display:flex;gap:8px;line-height:1.5;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.ln .q{min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.ln .s{color:var(--muted);min-width:90px}
.bo{color:var(--accent);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:4px;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.empty{color:var(--muted);padding:20px 4px;font-size:16px}
footer{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#262727;border-radius:10px;padding:12px 16px;font-weight:600;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:20}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
#login form{background:var(--panel);border-radius:14px;padding:28px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
#login img{height:50px;align-self:flex-start}
#login input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:16px}
#login button{background:var(--accent);color:#262727;border:0;border-radius:8px;padding:12px;font-weight:700;cursor:pointer;font-size:16px}
#lerr{color:var(--bad);font-size:14px;min-height:18px}
</style>
</head>

  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
const params = new URLSearchParams(location.search);
const key = params.get('k') || '';            // warehouse screens can open this with their key instead of a login
let token = store.get('tsd_me_token');
let seq = 0, timer, R = [];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy = s => s ? new Date(String(s).slice(0,10) + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}) : '';
const hm = s => s ? new Date(s).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) : '';
const num = v => (+v || 0).toLocaleString('en-GB', {maximumFractionDigits: 2});
function toast(t){ const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 3000); }

// ---------- couriers ----------
function guessCourier(n){
  n = String(n || '').trim().toUpperCase();
  if (/^\d{14}$/.test(n)) return 'DPD';
  if (/^[A-Z]{2}\d{9}GB$/.test(n)) return 'Royal Mail';
  if (/^\d{12}$/.test(n)) return 'FedEx';
  return null;
}
function trackUrl(courier, n, postcode){
  const t = encodeURIComponent(String(n).trim()), c = String(courier || '').toLowerCase();
  if (c.includes('dpd')) return `https://track.dpd.co.uk/search?reference=${t}${postcode ? '&postcode=' + encodeURIComponent(postcode) : ''}`;
  if (c.includes('royal mail')) return `https://www.royalmail.com/track-your-item#/tracking-results/${t}`;
  if (c.includes('parcelforce')) return `https://www.parcelforce.com/track-trace?trackNumber=${t}`;
  if (c.includes('fedex')) return `https://www.fedex.com/fedextrack/?trknbr=${t}`;
  return `https://www.google.com/search?q=${encodeURIComponent((courier || '') + ' tracking ' + n)}`;
}
// Cin7's tracking box holds real numbers, or notes like "Own Van Delivery 01/10/2026" / "Collected 01/10/2026" / "Direct on 00592"
function cin7Numbers(t){ return String(t || '').split(/[,;\s]+/).map(x => x.trim()).filter(x => /^[A-Z0-9]{8,}$/i.test(x) && /\d{6,}/.test(x)); }

// one parcel set per courier shipment; falls back to Cin7's tracking box when Shiptheory has nothing
function parcels(o){
  const out = [], seen = new Set();
  for (const s of o.shipments || []) {
    if (!s.tracking) continue;
    for (const n of String(s.tracking).split(/[,\s]+/).filter(Boolean)) {
      if (seen.has(n)) continue; seen.add(n);
      out.push({courier: s.courier, service: s.service, n, boxes: s.parcels, when: s.created});
    }
  }
  for (const n of cin7Numbers(o.cin7_tracking)) if (!seen.has(n)) { seen.add(n); out.push({courier: guessCourier(n), n}); }
  return out;
}

// ---------- what's happening with this order ----------
function stage(o){
  const lines = o.lines || [];
  const boLines = lines.filter(l => +l.bo > 0);
  const ct = String(o.cin7_tracking || '');
  const v = o.van;
  const ps = parcels(o);
  const shipped = o.ship === 'SHIPPED', part = o.ship === 'PARTIALLY SHIPPED';
  const vanDone = v && (v.status_id === 3 || /^deliver/i.test(v.status || ''));
  const vanFailed = v && v.route_status === 'Closed' && v.status && !vanDone;
  const nextDates = () => {
    const ds = boLines.map(l => l.next || (l.po && l.po.due)).filter(Boolean).sort();
    if (ds.length) return `Next stock due ${dmy(ds[0])}`;
    const pos = [...new Set(boLines.map(l => l.po && l.po.no).filter(Boolean))];
    return pos.length ? `On order (${pos.map(esc).join(', ')}) but no delivery date on the PO yet` : 'Not on a purchase order yet. Check with purchasing.';
  };

  if (o.order_status === 'DRAFT' || o.status === 'ORDERING') return {cls:'wait', h:'Not authorised yet', d:'Still a draft in Cin7, so the warehouse can\'t see it.'};
  if (o.status === 'CREDITED') return {cls:'bad', h:'Credited', d:'This order has been credited.'};

  // collections
  if (o.collection) {
    if (shipped || /collected/i.test(ct)) return {cls:'good', h:'✓ Collected', d: /collected/i.test(ct) ? esc(ct) : 'Marked as shipped in Cin7.'};
    if (o.pick === 'PICKED' || o.pick === 'PARTIALLY PICKED') return {cls:'go', h:'Ready to collect', d:`From ${esc(o.location || 'Bromham')}. Picked and waiting at the trade counter.`};
  }

  // our own van (Track-POD)
  if (v) {
    if (vanDone) return {cls:'good', h:'✓ Delivered by our van', d:`${dmy(v.date)}${v.driver ? ' · ' + esc(v.driver) : ''}${v.signed_by ? ' · signed by ' + esc(v.signed_by) : ''}${v.photo ? ' · photo taken' : ''}`, ps};
    if (vanFailed) {
      const rest = shipped ? (ps.length ? 'The rest has gone by courier, see below.' : 'Cin7 shows the rest as sent.') : 'The rest still needs sending.';
      return {cls: shipped ? 'go' : 'bad', h: v.status_id === 4 ? 'Van: part delivered' : `Van: ${esc(v.status)}`, d:`${dmy(v.date)}${v.driver ? ' · ' + esc(v.driver) : ''}${v.signed_by ? ' · signed by ' + esc(v.signed_by) : ''}. ${rest}`, ps};
    }
    if (v.date) return {cls:'go', h:`Booked on our van · ${dmy(v.date)}`, d: v.route_status && v.route_status !== 'Draft'
      ? `Route ${esc(v.route || '')}${v.driver ? ' · ' + esc(v.driver) : ''}${v.eta ? ' · ETA about ' + hm(v.eta) : ''}`
      : 'Booked for that day. Not on a route yet, so no ETA.'};
  }
  if (/own ?van/i.test(ct) && (shipped || part)) return {cls:'good', h:'✓ Sent on our van', d: esc(ct)};
  if (/direct/i.test(ct)) return {cls:'go', h:'Going direct from the supplier', d: esc(ct)};

  if (shipped && ps.length) return {cls:'go', h:`Sent with ${esc(ps[0].courier || 'courier')}`, d:`${ps[0].when ? dmy(ps[0].when) + ' · ' : ''}${ps[0].service ? esc(ps[0].service) : ''}`, ps};
  if (shipped) return {cls:'go', h:'Sent', d:`Shipped in Cin7${o.carrier ? ' · ' + esc(o.carrier) : ''}. No tracking number recorded.${ct ? ' Cin7 note: ' + esc(ct) : ''}`};
  if (part) return {cls:'wait', h:'Part sent · rest on backorder', d: boLines.length ? nextDates() : 'Some of it has gone, the rest is still to send.', ps};

  if (o.status === 'BACKORDERED') {
    if (o.stock_in === 'all') return {cls:'go', h:'Stock\'s in · ready to go out', d:'Everything it was waiting for has arrived. It should be on the dispatch list now.'};
    return {cls:'wait', h: o.stock_in === 'some' ? 'Waiting for stock · some has arrived' : 'Waiting for stock', d: nextDates()};
  }
  if (o.pack === 'PACKED' || o.pick === 'PICKED') return {cls:'go', h:'Picked · waiting for the courier', d: o.carrier ? esc(o.carrier) : ''};
  return {cls:'wait', h:'Waiting to be picked', d:`${o.ship_by ? 'Due out ' + dmy(o.ship_by) : ''}${o.carrier ? ' · ' + esc(o.carrier) : ' · no delivery method set'}`};
}

// a line Coty can paste straight into an email or text to the customer
function customerLine(o, s){
  const p = (s.ps || [])[0];
  if (p) return `Your order ${o.no} went out${p.when ? ' on ' + dmy(p.when) : ''} with ${p.courier || 'our courier'}. Tracking number ${p.n}: ${trackUrl(p.courier, p.n, o.postcode)}`;
  const strip = t => String(t).replace(/<[^>]+>/g, '').replace(/&amp;/g, '&');
  return `Order ${o.no}: ${strip(s.h).replace('✓ ', '')}${s.d ? '. ' + strip(s.d) : ''}`;
}

function card(o, i){
  const s = stage(o);
  const ps = s.ps || [];
  const lines = o.lines || [];
  const bo = lines.filter(l => +l.bo > 0).length;
  const parcelsHtml = ps.map(p => `<div class="parcel"><b>${esc(p.courier || 'Courier')}</b>${p.boxes > 1 ? `<span class="tag">${p.boxes} parcels</span>` : ''}<span class="tn">${esc(p.n)}</span>
      <a class="btn go" href="${esc(trackUrl(p.courier, p.n, o.postcode))}" target="_blank" rel="noopener">Track it ↗</a>
      <button class="btn" data-copy="${esc(p.n)}">Copy no.</button></div>`).join('');
  return `<div class="o ${s.cls}">
    <div class="top"><span class="no">${esc(o.no)}</span><span class="meta">Ordered ${dmy(o.order_date)}${o.location && o.location !== 'Bromham' ? ' · ' + esc(o.location) : ''}</span></div>
    <div class="cust">${esc(o.customer)}${o.ship_name && o.ship_name !== o.customer ? ` <span class="meta">· ${esc(o.ship_name)}</span>` : ''}</div>
    <div class="meta">${[o.contact, o.phone, [o.town, o.postcode].filter(Boolean).join(' ')].filter(Boolean).map(esc).join(' · ')}</div>
    <div class="st"><div class="h">${s.h}</div>${s.d ? `<div class="d">${s.d}</div>` : ''}${parcelsHtml}</div>
    <div class="acts"><button class="btn" data-line="${i}">Copy update for customer</button></div>
    <details><summary>${lines.length} line${lines.length === 1 ? '' : 's'}${bo ? ` · <span class="bo">${bo} on backorder</span>` : ''} · ${esc(o.carrier || 'no delivery method')}</summary>
      ${lines.map(l => `<div class="ln"><span class="q">${num(l.qty)}</span><span class="s">${esc(l.sku)}</span><span>${esc(l.name)}${+l.bo > 0 ? ` <span class="bo">· ${num(l.bo)} on backorder${(l.next || (l.po && l.po.due)) ? ', due ' + dmy(l.next || l.po.due) : l.po ? ', on ' + esc(l.po.no) + ' (no date)' : ', not on a PO'}</span>` : ''}</span></div>`).join('')}
    </details>
  </div>`;
}

async function search(q){
  const my = ++seq;
  const out = document.getElementById('out');
  if (q.length < 2) { out.innerHTML = '<div class="empty">Type at least 2 characters.</div>'; return; }
  out.style.opacity = .6;
  try {
    const r = await fetch(API + '?q=' + encodeURIComponent(q) + (key ? '&k=' + encodeURIComponent(key) : ''), {cache:'no-store', headers: token && !key ? {Authorization: 'Bearer ' + token} : {}});
    if (r.status === 401) { if (key) { out.innerHTML = '<div class="empty">Access link not recognised.</div>'; return; } token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); return; }
    const j = await r.json(); if (my !== seq) return;
    if (j.error) throw new Error(j.error);
    R = j.results || [];
    out.innerHTML = R.length ? `<div class="res">${R.map(card).join('')}</div>${R.length >= 40 ? '<div class="hint">Showing the 40 newest. Add more to narrow it down.</div>' : ''}`
      : `<div class="empty">Nothing matches “${esc(q)}”. Try part of the name, the order number digits, or the postcode.</div>`;
    document.getElementById('foot').textContent = [j.st_synced ? 'Shiptheory updated ' + hm(j.st_synced) : '', j.tp_synced ? 'Track-POD updated ' + hm(j.tp_synced) : '', 'Cin7 every few minutes'].filter(Boolean).join(' · ');
  } catch(e) { if (my === seq) out.innerHTML = `<div class="empty">Couldn't search: ${esc(e.message)}</div>`; }
  finally { if (my === seq) out.style.opacity = 1; }
}

async function copy(t){
  try { await navigator.clipboard.writeText(t); toast('Copied'); }
  catch(e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('Copied'); }
}
document.getElementById('out').addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (c) return copy(c.dataset.copy);
  const l = e.target.closest('[data-line]'); if (l) { const o = R[+l.dataset.line]; copy(customerLine(o, stage(o))); }
});

// ---------- login (same as My Sales) ----------
function showLogin(msg){ document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; document.getElementById('lerr').textContent = msg || ''; }
function showApp(){ document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block'; const q = document.getElementById('q'); q.focus(); if (q.value.trim()) search(q.value.trim()); }
document.getElementById('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('lerr'); err.textContent = 'Checking…';
  try {
    const r = await fetch(ME_API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'login', email: document.getElementById('em').value, pin: document.getElementById('pin').value})});
    const j = await r.json(); if (!j.ok) { err.textContent = j.error || 'Login failed'; return; }
    token = j.token; store.set('tsd_me_token', token); document.getElementById('pin').value = ''; showApp();
  } catch(x) { err.textContent = "Can't reach the server. Check your connection."; }
});

const qEl = document.getElementById('q');
qEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search(qEl.value.trim()), 300); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); qEl.select(); } if (e.key === 'Escape') { qEl.value = ''; search(''); } });
if (params.get('q')) qEl.value = params.get('q');
if (key || token) showApp(); else showLogin();
// name + PIN login (auth.js)
TSDAuth.mount(t => { token = t; showApp(); });
</script>
<script>
// Self-update: every 2 minutes, check GitHub for a newer copy of this page and reload into it (waits while someone has a search in).
(function(){
  const BUILD = '20261028104446';
  let newer = false;
  async function check(){
    try {
      if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); }
      if (newer && !document.getElementById('q').value) location.reload();
    } catch(e){}
  }
  setInterval(check, 120000);
})();
</script>

  --accent:#EED107; --good:#7DDB98; --bad:#FF7A6B; --blue:#8EC5FF;
  --num:'Bebas Neue','DIN Condensed','Arial Narrow',Arial,sans-serif;
  --body:Barlow,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
button,input{font-family:inherit}
.wrap{padding:16px 20px 28px;max-width:1900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
header .l{display:flex;align-items:center;gap:16px}
header img{height:48px}
.title{font-family:var(--num);font-size:38px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;min-width:110px}
.chip .k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.chip .v{font-family:var(--num);font-size:28px;line-height:1.05}
.chip.warn .v{color:var(--accent)}
#search{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
#search input{flex:1;max-width:620px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;font-family:inherit}
#search input:focus{outline:none;border-color:var(--accent)}
#search button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:15px;font-family:inherit}
.issue{font-size:12px;background:rgba(255,122,107,.12);border:1px solid var(--bad);border-radius:6px;padding:6px 8px;line-height:1.4}
.btn.ship{background:var(--good);color:#262727;border-color:var(--good)}
.topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.topbar #search{flex:1 1 520px;margin:0}
.topbar #search input{max-width:none;padding:14px 16px;font-size:19px}
.addbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addbar input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;width:130px;text-transform:uppercase}
.addbar input:focus{outline:2px solid var(--accent);border-color:transparent}
.addbar button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-weight:700;font-size:14px;cursor:pointer}
.addbar .msg{font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.sec{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:16px}
.sec h2{margin:0 0 10px;display:flex;align-items:baseline;gap:10px;font-family:var(--num);font-weight:400;font-size:28px;letter-spacing:1px}
.sec h2 .n{background:var(--accent);color:#262727;border-radius:6px;padding:0 8px;font-size:22px}
.sec h2 .h{font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:0}
.sec.urgent{border:2px solid var(--accent)}
h3.day{font-family:var(--num);font-weight:400;font-size:22px;letter-spacing:1px;margin:12px 0 8px;color:var(--accent)}
h3.day:first-of-type{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.side .cards{grid-template-columns:minmax(0,1fr)}
.card{background:var(--panel2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--line)}
.card.tobook{border-left-color:var(--accent)} .card.booked{border-left-color:var(--blue)} .card.delivered{border-left-color:var(--good);opacity:.85}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.no{font-family:var(--num);font-size:30px;letter-spacing:1px;line-height:1}
.cust{font-weight:700;font-size:15px;line-height:1.25}
.meta{font-size:13px;color:var(--muted)}
.addr{font-size:14px;line-height:1.35}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.6px;padding:3px 7px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.t-pick{background:transparent;border:1px solid var(--muted);color:var(--ink)} .t-ok{background:var(--good);color:#262727}
.t-bo{background:transparent;border:1px solid var(--bad);color:var(--bad)} .t-route{background:var(--blue);color:#262727}
.t-draft{background:transparent;border:1px solid var(--blue);color:var(--blue)} .t-add{background:transparent;border:1px solid var(--line);color:var(--muted)}
.carrier{font-size:12px;color:var(--muted);font-style:italic}
ul.lines{margin:2px 0 0;padding:6px 0 0;list-style:none;font-size:13px;line-height:1.45;border-top:1px solid var(--line)}
ul.lines li{display:flex;gap:8px} ul.lines .q{font-weight:700;min-width:34px;text-align:right}
ul.lines .s{color:var(--muted);min-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.lines .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;background:rgba(238,209,7,.12);border-radius:6px;padding:5px 7px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--accent);color:#262727;border-color:var(--accent)}
.btn.out{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal .box{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
#modal h3{margin:0;font-family:var(--num);font-weight:400;font-size:30px;letter-spacing:1px}
#modal input[type=date]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;color-scheme:dark}
#modal .row{display:flex;gap:10px;justify-content:flex-end}
#modal .err{color:var(--bad);font-size:13px;min-height:16px}
.warnbox{background:rgba(238,209,7,.12);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.4}
.plist{font-size:13px;margin:2px 0 4px;padding-left:18px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#262727;border-radius:10px;padding:12px 16px;font-weight:600;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
footer{color:var(--muted);font-size:12px;margin-top:4px}
#msg{color:var(--muted);padding:40px;text-align:center;font-size:18px}
#tabs{max-width:1900px;margin:0 auto;padding:12px 20px 0;display:flex;gap:6px;flex-wrap:wrap}
#tabs a{color:var(--muted);text-decoration:none;font-weight:700;font-size:15px;padding:9px 16px;border:1px solid var(--line);border-radius:999px}
#tabs a:hover{color:var(--ink);border-color:var(--muted)}
#tabs a.on{background:var(--accent);color:#262727;border-color:var(--accent)}
</style>
</head>

<script>
(function(){ // tabs between the warehouse screens; add &nav=0 to a link to hide them (e.g. the trade counter)
  const q = new URLSearchParams(location.search); if (q.get('nav') === '0') return;
  const k = encodeURIComponent(q.get('k') || ''), here = location.pathname.endsWith('van.html') ? 'van' : q.get('tab') === 'collections' ? 'coll' : 'pick';
  const t = [['pick','Pick &amp; Dispatch','warehouse.html?k=' + k], ['van','Van Team','van.html?k=' + k], ['coll','Collections','warehouse.html?k=' + k + '&tab=collections'], ['gi','Goods In','goodsin.html?k=' + k], ['stock','Stock','stock.html?k=' + k]];
  const n = document.createElement('nav'); n.id = 'tabs';
  n.innerHTML = t.map(([id, label, url]) => `<a href="${url}" class="${id === here ? 'on' : ''}">${label}</a>`).join('');
  document.body.prepend(n);
})();
</script>

const key = new URLSearchParams(location.search).get('k') || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dlong = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'}) : '';
const dshort = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'}) : '';
let data = null, toastTimer, addMsg = '';

async function load(){
  if (!key) { document.getElementById('app').innerHTML = '<div id="msg">This screen needs its access link.</div>'; return; }
  try {
    const r = await fetch(API + '?view=van&k=' + encodeURIComponent(key), {cache:'no-store'});
    if (r.status === 403) { document.getElementById('app').innerHTML = '<div id="msg">Access link not recognised.</div>'; return; }
    const j = await r.json(); if (j.error) throw new Error(j.error);
    data = j; render();
  } catch(e) { if (!data) document.getElementById('app').innerHTML = '<div id="msg">Can\'t reach the server. Retrying…</div>'; }
}
async function post(body){
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({k:key, ...body})});
  return r.json().catch(() => ({ok:false, error:'No response'}));
}
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 6000); }
function closeModal(){ document.getElementById('modal').style.display = 'none'; }
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function lines(o){
  const l = o.lines || [];
  const shown = l.slice(0, 6).map(x => `<li><span class="q">${(+x.qty).toLocaleString('en-GB')}×</span><span class="s">${esc(x.sku)}</span><span class="nm">${esc(x.name)}</span></li>`).join('');
  return l.length ? `<ul class="lines">${shown}${l.length > 6 ? `<li class="meta">+ ${l.length - 6} more</li>` : ''}</ul>` : '';
}
function pickTag(o){
  if (o.backorder && o.stock_in === 'all') return '<span class="tag t-pick">Backorder stock now in</span>';
  if (o.backorder) return '<span class="tag t-bo">Backordered</span>' + (o.stock_in === 'some' ? '<span class="tag t-pick">Some stock now in</span>' : '');
  if (o.pick === 'PICKED') return '<span class="tag t-ok">Picked</span>';
  if (o.pick === 'PARTIALLY PICKED') return '<span class="tag t-pick">Part picked</span>';
  return '<span class="tag t-pick">Not picked</span>';
}
function card(o){
  const addr = o.address || [o.town, o.postcode].filter(Boolean).join(', ');
  const who = [o.contact, o.phone].filter(Boolean).join(' · ');
  let tags = pickTag(o);
  if (o.added_from) tags += `<span class="tag t-add">Added from ${esc(o.added_from)}</span>`;
  if (o.stage === 'booked') tags += o.route && o.route !== o.no ? `<span class="tag t-route">Route ${esc(o.route)}</span>` : '<span class="tag t-draft">Not routed yet</span>';
  let extra = '', btns = '';
  if (o.stage === 'to_book') {
    btns = `<button class="btn go" data-a="push" data-id="${o.id}">${o.backorder && o.stock_in !== 'all' ? '📦 Send what we have: Track-POD + Cin7' : 'Send to Track-POD &amp; fulfil'}</button>
            <button class="btn out" data-a="out" data-id="${o.id}">🚚 Send to courier</button>
            <button class="btn out" data-a="coll" data-id="${o.id}">🏪 Collection</button>`;
    if (o.ship_by) extra = `<div class="meta">Needed by ${dshort(o.ship_by)}</div>`;
  } else if (o.stage === 'booked') {
    extra = `<div class="meta">${o.driver ? 'Driver ' + esc(o.driver) : 'No driver yet'}${o.eta ? ' · ETA ' + new Date(o.eta).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : ''}${o.route_status ? ' · route ' + esc(o.route_status.toLowerCase()) : ''}</div>`;
    btns = `${o.ship !== 'SHIPPED' ? `<button class="btn ship" data-a="ful" data-id="${o.id}">✓ Pick, pack &amp; ship in Cin7</button>` : ''}
            <button class="btn out" data-a="out" data-id="${o.id}">🚚 Send to courier</button>
            <button class="btn out" data-a="coll" data-id="${o.id}">🏪 Collection</button>`;
  } else {
    extra = `<div class="meta">Delivered ${dshort(o.tp_date)}${o.signed_by ? ' · signed by ' + esc(o.signed_by) : ''}${o.photo ? ' · photo taken' : ''}</div>`;
  }
  return `<div class="card ${o.stage === 'to_book' ? 'tobook' : o.stage}">
    <div class="top"><span class="no">${esc(o.no || '')}</span><span class="meta">${esc(o.location || '')} · ordered ${dshort(o.order_date)}</span></div>
    <div class="cust">${esc(o.customer)}</div>
    <div class="tags">${tags}</div>
    ${addr ? `<div class="addr">${esc(addr)}</div>` : '<div class="note">No delivery address on the Cin7 order</div>'}
    ${who ? `<div class="meta">${esc(who)}</div>` : ''}
    ${o.carrier ? `<div class="carrier">“${esc(o.carrier)}”</div>` : ''}
    ${o.notes ? `<div class="note">${esc(o.notes)}</div>` : ''}
    ${extra}
    ${o.stage === 'booked' ? `<div class="meta">Cin7: ${o.ship === 'SHIPPED' ? '<b style="color:var(--good)">shipped ✓</b>' : o.ship === 'PARTIALLY SHIPPED' ? 'part shipped' : '<b style="color:var(--accent)">not fulfilled yet</b>'}</div>` : ''}
    ${o.fulfil_error && o.ship !== 'SHIPPED' ? `<div class="issue"><b>Cin7 wouldn't ${esc(o.fulfil_error.step)}</b> · ${new Date(o.fulfil_error.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}<br>“${esc(o.fulfil_error.message)}”</div>` : ''}
    ${o.stage !== 'delivered' ? lines(o) : ''}
    ${btns ? `<div class="btns">${btns}</div>` : ''}
  </div>`;
}

let query = '';
const norm = t => String(t ?? '').toLowerCase().replace(/[\s\-]/g, '');
function matches(o, q){
  const digits = q.replace(/\D/g, '');
  if (digits.length >= 3 && String(o.no || '').replace(/\D/g, '').replace(/^0+/, '').includes(digits.replace(/^0+/, ''))) return true;
  const hay = [o.no, o.customer, o.address, o.town, o.postcode, o.contact, o.phone, o.carrier, o.notes, o.route, o.driver, ...(o.lines || []).flatMap(l => [l.sku, l.name])].map(norm).join('|');
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(norm(w)));
}
const STAGE = {to_book:'To book', booked:'Booked in Track-POD', delivered:'Delivered'};
function render(){
  if (!data) return;
  const all = data.orders;
  const toBook = all.filter(o => o.stage === 'to_book');
  const booked = all.filter(o => o.stage === 'booked');
  const done = all.filter(o => o.stage === 'delivered');
  const days = [...new Set(booked.map(o => o.tp_date))].sort();
  const todayCount = booked.filter(o => o.tp_date === data.today).length;
  const bookedHtml = days.length ? days.map(d => `<h3 class="day">${d === data.today ? 'Today · ' : ''}${dlong(d)} (${booked.filter(o => o.tp_date === d).length})</h3><div class="cards">${booked.filter(o => o.tp_date === d).map(card).join('')}</div>`).join('') : '<div class="empty">Nothing booked.</div>';
  document.getElementById('app').innerHTML = `
  <header>
    <div class="l"><img src="${LOGO}" alt="TSD"><div><div class="title">Van Team · Own van deliveries</div><div class="sub">Everything going on our own vans, and where it's at in Track-POD.</div></div></div>
    <div class="chips">
      <div class="chip ${toBook.length ? 'warn' : ''}"><span class="k">To book</span><span class="v">${toBook.length}</span></div>
      <div class="chip"><span class="k">Booked</span><span class="v">${booked.length}</span></div>
      <div class="chip"><span class="k">Out today</span><span class="v">${todayCount}</span></div>
      <div class="chip"><span class="k">Delivered (3 days)</span><span class="v">${done.length}</span></div>
    </div>
  </header>
  ${query ? (() => { const hits = all.filter(o => matches(o, query)); return `<section class="sec urgent"><h2>Search: “${esc(query)}” <span class="n">${hits.length}</span> <span class="h">across every section on this screen</span></h2>
    ${hits.length ? `<div class="cards">${hits.map(o => `<div><div class="meta" style="font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px">${STAGE[o.stage] || ''}${o.tp_date ? ' · ' + dshort(o.tp_date) : ''}</div>${card(o)}</div>`).join('')}</div>`
      : '<div class="empty">Nothing matches. If it\'s a van order it may not be on this list yet: add it by number above.</div>'}</section>`; })() : `<div class="layout">
    <div>
      <section class="sec urgent"><h2>To book in Track-POD <span class="n">${toBook.length}</span> <span class="h">Pick a date and send. It lands in Track-POD ready to route, and is picked, packed &amp; shipped in Cin7.</span></h2>
        ${toBook.length ? `<div class="cards">${toBook.map(card).join('')}</div>` : '<div class="empty">All van orders are in Track-POD.</div>'}</section>
    </div>
    <div class="side">
      <section class="sec"><h2>Booked in Track-POD <span class="n">${booked.length}</span></h2>${bookedHtml}</section>
      <details class="sec"><summary style="cursor:pointer;list-style:none"><h2>Delivered <span class="n">${done.length}</span> <span class="h">Last 3 days · tap to show</span></h2></summary>
        ${done.length ? `<div class="cards">${done.map(card).join('')}</div>` : '<div class="empty">None yet.</div>'}</details>
    </div>
  </div>`}
  <footer>Orders from Cin7 · last update ${data.last_synced ? new Date(data.last_synced).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '–'} · Track-POD checked ${data.tp_synced ? new Date(data.tp_synced).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '–'} (every 10 minutes). Van orders = anything already in Track-POD, "own van" deliveries in Cin7, and anything moved here from the pick screen. Orders with no delivery method go to "Check delivery method" on Pick &amp; Dispatch.</footer>`;
  document.querySelectorAll('[data-a=push]').forEach(b => b.onclick = () => openPush(b.dataset.id));
  document.querySelectorAll('[data-a=out]').forEach(b => b.onclick = () => openOut(b.dataset.id, false));
  document.querySelectorAll('[data-a=coll]').forEach(b => b.onclick = () => openOut(b.dataset.id, true));
  document.querySelectorAll('[data-a=ful]').forEach(b => b.onclick = () => openFul(b.dataset.id));
}

async function addOrder(){
  const v = document.getElementById('addno').value.trim(); if (!v) return;
  document.getElementById('addmsg').textContent = 'Adding…';
  const j = await post({action:'van_add', number:v});
  document.getElementById('addmsg').innerHTML = j.ok ? `<span style="color:var(--good)">${esc(j.no)} (${esc(j.customer)}) added.</span>` : `<span style="color:var(--bad)">${esc(j.error || 'Could not add')}</span>`;
  if (j.ok) document.getElementById('addno').value = '';
  await load(); setTimeout(() => { document.getElementById('addmsg').innerHTML = ''; }, 8000);
}

function partWarn(o){
  const l = o.lines || [], li = (x, q) => `<li><b>${(+q).toLocaleString('en-GB')}×</b> ${esc(x.sku)} · ${esc(x.name)}</li>`;
  const going = l.filter(x => (+x.qty || 0) > (+x.bo || 0)), staying = l.filter(x => (+x.bo || 0) > 0);
  return `<div class="warnbox">⚠ <b>This order is part backordered, so it will go in two deliveries.</b><br>That means a second van trip for the rest. Only do this if the customer needs it now. <b>Are you sure you want to continue?</b></div>
    <div class="sub" style="color:var(--ink)"><b>Going on the van</b></div><ul class="plist">${going.map(x => li(x, x.qty - (+x.bo || 0))).join('') || '<li>Nothing is in stock yet</li>'}</ul>
    <div class="sub" style="color:var(--ink)"><b>Staying on backorder</b> (book it again when it arrives)</div><ul class="plist">${staying.map(x => li(x, x.bo)).join('')}</ul>`;
}
function openPush(id){
  const o = data.orders.find(x => x.id === id); if (!o) return;
  const def = o.ship_by && o.ship_by >= data.next_working_day ? o.ship_by : data.next_working_day;
  document.getElementById('mbox').innerHTML = `
    <h3>Send to Track-POD · ${esc(o.no)}</h3>
    <div class="sub">${esc(o.customer)}<br>${esc(o.address || [o.town, o.postcode].filter(Boolean).join(', '))}</div>
    <label class="sub">Delivery date <input type="date" id="pdate" value="${def}" min="${data.today}"></label>
    ${o.backorder && o.stock_in !== 'all' ? partWarn(o) : ''}
    <div class="sub">It goes into Track-POD with the address, contact, ${o.backorder && o.stock_in !== 'all' ? 'in-stock items' : 'items'} and notes, ready to add to a route. <b style="color:var(--ink)">It's also picked, packed &amp; shipped in Cin7${o.backorder && o.stock_in !== 'all' ? ' (just what\'s on the shelf; the rest stays on backorder)' : ''}.</b></div>
    <div class="err" id="perr"></div>
    <div class="row"><button class="btn" id="pc">Cancel</button><button class="btn go" id="pok">${o.backorder && o.stock_in !== 'all' ? 'Yes, send what we have' : 'Send &amp; fulfil'}</button></div>`;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('pc').onclick = closeModal;
  document.getElementById('pok').onclick = async () => {
    const date = document.getElementById('pdate').value;
    if (!date) { document.getElementById('perr').textContent = 'Pick a date.'; return; }
    document.getElementById('pok').disabled = true; document.getElementById('pok').textContent = 'Sending to Track-POD and Cin7…';
    const j = await post({action:'tp_push', id, date, fulfil: true});
    if (!j.ok) { document.getElementById('perr').textContent = j.error || 'Track-POD didn\'t accept it.'; document.getElementById('pok').disabled = false; document.getElementById('pok').textContent = 'Try again'; return; }
    const tp = j.already ? `${o.no} was already in Track-POD (linked up)` : `${o.no} sent to Track-POD for ${dshort(date)}`;
    if (j.fulfil && !j.fulfil.ok) {
      document.getElementById('mbox').innerHTML = `<h3>Half done · ${esc(o.no)}</h3>
        <div class="sub" style="color:var(--ink)">✓ ${tp}.</div>
        <div class="issue" style="font-size:14px"><b>✗ Cin7 stopped at the ${esc(j.fulfil.step || '?')} step</b><br>“${esc(j.fulfil.error || 'unknown error')}”</div>
        <div class="sub">Sort it in Cin7, then use <b>✓ Pick, pack &amp; ship in Cin7</b> on the order's card (it's now under Booked).</div>
        <div class="row"><button class="btn go" id="hok">OK</button></div>`;
      document.getElementById('hok').onclick = () => { closeModal(); load(); }; return;
    }
    closeModal(); toast(`${tp} · ${j.fulfil?.already ? 'already fulfilled in Cin7' : j.fulfil?.part ? 'in-stock items picked, packed & shipped in Cin7' : 'picked, packed & shipped in Cin7'} ✓`); load();
  };
}
function openFul(id){
  const o = data.orders.find(x => x.id === id); if (!o) return;
  const part = o.backorder && o.stock_in !== 'all';
  document.getElementById('mbox').innerHTML = `
    <h3>Pick, pack &amp; ship · ${esc(o.no)}</h3>
    <div class="sub">${esc(o.customer)}. This authorises pick, pack and ship in Cin7 for this van order${part ? ': <b style="color:var(--ink)">only what\'s on the shelf; the rest stays on backorder</b>' : ''}. It doesn't change anything in Track-POD.</div>
    ${part ? partWarn(o) : ''}
    <div class="err" id="ferr"></div>
    <div class="row"><button class="btn" id="fc">Cancel</button><button class="btn go" id="fok">Yes, fulfil in Cin7</button></div>`;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('fc').onclick = closeModal;
  document.getElementById('fok').onclick = async () => {
    const b = document.getElementById('fok'); b.disabled = true; b.textContent = 'Working in Cin7…';
    const j = await post({action:'fulfil', id, boxes: 1, part, van: true});
    if (!j.ok) { document.getElementById('ferr').innerHTML = `Cin7 stopped at the <b>${esc(j.step || '?')}</b> step: “${esc(j.error || 'unknown error')}”`; b.disabled = false; b.textContent = 'Try again'; return; }
    closeModal(); toast(`${o.no} ${j.already ? 'was already fulfilled in Cin7' : 'picked, packed & shipped in Cin7'} ✓`); load();
  };
}
function openOut(id, coll){
  const o = data.orders.find(x => x.id === id); if (!o) return;
  const inTp = o.stage === 'booked';
  const what = coll ? 'Collection' : 'Send to courier';
  document.getElementById('mbox').innerHTML = `
    <h3>${what} · ${esc(o.no)}</h3>
    <div class="sub">${esc(o.customer)}. ${coll ? 'This takes it off the van list and puts it on the Collections screen for the trade counter.' : 'This takes it off the van list and puts it on the Pick &amp; Dispatch screen to go by courier.'} If the delivery method in Cin7 is wrong, update it there too.</div>
    ${inTp ? `<label class="sub" style="display:flex;gap:10px;align-items:flex-start;color:var(--ink)"><input type="checkbox" id="odel" checked style="width:20px;height:20px;accent-color:#EED107;margin-top:1px">
      <span>Also delete it from Track-POD (booked for ${dshort(o.tp_date)}${o.route && o.route !== o.no ? ', route ' + esc(o.route) : ''}) so it doesn't go out on the van as well</span></label>` : ''}
    <div class="err" id="oerr"></div>
    <div class="row"><button class="btn" id="oc">Cancel</button><button class="btn go" id="ook">${coll ? 'Move to collections' : 'Send to courier'}</button></div>`;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('oc').onclick = closeModal;
  document.getElementById('ook').onclick = async () => {
    const del = inTp && document.getElementById('odel').checked;
    document.getElementById('ook').disabled = true;
    const j = await post({action: coll ? 'to_collection' : 'to_courier', id, delete_tp: del});
    if (!j.ok) { document.getElementById('oerr').textContent = j.error || 'Something went wrong. Try again.'; document.getElementById('ook').disabled = false; return; }
    closeModal(); toast(`${o.no} moved to ${coll ? 'collections' : 'courier dispatch'}${del ? ' and removed from Track-POD' : ''}.`); load();
  };
}

const qEl = document.getElementById('q'), qClear = document.getElementById('qclear'); let qT;
qEl.addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { query = qEl.value.trim(); qClear.style.display = query ? '' : 'none'; render(); window.scrollTo(0, 0); }, 150); });
const clearSearch = () => { qEl.value = ''; query = ''; qClear.style.display = 'none'; render(); };
qClear.onclick = () => { clearSearch(); qEl.focus(); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl && !document.activeElement?.matches('input,textarea')) { e.preventDefault(); qEl.focus(); qEl.select(); }
  if (e.key === 'Escape' && document.activeElement === qEl) { clearSearch(); qEl.blur(); }
});
document.getElementById('addbtn').onclick = addOrder;
document.getElementById('addno').onkeydown = e => { if (e.key === 'Enter') addOrder(); };
load();
setInterval(() => { if (document.getElementById('modal').style.display !== 'flex' && document.activeElement?.id !== 'addno') load(); }, 60000);
setTimeout(() => location.reload(), 6 * 3600e3);
</script>
<script>
// Self-update: every 2 minutes, check GitHub for a newer copy of this page. If there is one, reload into it
// (waits if someone has a pop-up open or is typing). So nobody ever needs a new link or a forced refresh.
(function(){
  const BUILD = '20261026231700';
  const busy = () => { const m = document.getElementById('modal'); const a = document.activeElement;
    return (m && getComputedStyle(m).display !== 'none') || (a && a.matches && a.matches('input,textarea,select')); };
  let newer = false;
  async function check(){
    try {
      if (!newer) {
        const t = await (await fetch(location.href, {cache:'reload'})).text();   // also refreshes the browser's saved copy
        const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD);
      }
      if (newer && !busy()) location.reload();
    } catch(e){}
  }
  setInterval(check, 120000);
})();
</script>
</body>

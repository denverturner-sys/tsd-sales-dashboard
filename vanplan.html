#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
.wrap{padding:16px 18px 30px;max-width:1600px;margin:0 auto}
h1{font-family:var(--num);font-size:40px;letter-spacing:1px;margin:0;line-height:1}
h2{font-family:var(--num);font-size:24px;letter-spacing:.5px;margin:0;font-weight:400}
.sub{color:var(--muted);font-size:13px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:600;padding:7px 12px;border-radius:10px;cursor:pointer;transition:transform .08s ease,border-color .15s}
.btn:hover{border-color:var(--muted)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:default}
.btn.y{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.g{background:var(--tint-good);border-color:var(--good);color:var(--good)}
input,select{background:var(--bg);border:1px solid var(--line);color:var(--ink);font:inherit;padding:6px 9px;border-radius:9px;color-scheme:dark}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--ink)}
.grid{display:grid;grid-template-columns:minmax(380px,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
#map{height:calc(100vh - 150px);min-height:520px;border-radius:14px;border:1px solid var(--line);position:sticky;top:10px}
.col{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 150px);overflow:auto;padding-right:4px}
.run{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;border-left:6px solid var(--c)}
.run .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.run .hd h2{flex:1;min-width:120px}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.num{background:var(--panel2);border-radius:10px;padding:6px 8px}
.num .k{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.num .v{font-family:var(--num);font-size:24px;line-height:1.05}
.num.bad .v{color:var(--bad)}.num.good .v{color:var(--good)}
.money{font-size:13px;color:var(--muted);line-height:1.5}.money b{color:var(--ink)}
.stops{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.stop{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start;background:var(--panel2);border-radius:10px;padding:7px 9px}
.stop .i{width:22px;height:22px;border-radius:50%;background:var(--c);color:#111;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.stop .t{font-weight:700}.stop .m{color:var(--muted);font-size:12px}
.stop select{font-size:12px;padding:3px 6px}
.flag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin:2px 4px 0 0}
.f-warn{background:var(--tint-warn);color:var(--warn)}.f-bad{background:var(--tint-bad);color:var(--bad)}.f-cour{background:var(--tint-info);color:var(--blue)}.f-ok{background:var(--tint-good);color:var(--good)}
.note{font-size:12px;color:var(--warn);margin-top:2px}
.pool{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:12px}
.empty{color:var(--muted);padding:10px 0}
.booked{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;z-index:2000}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px}
#modal h3{margin:0;font-family:var(--num);font-size:28px;font-weight:400}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-weight:700;padding:10px 16px;border-radius:10px;display:none;z-index:2100}
.leaflet-popup-content{font-family:var(--body);font-size:13px}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #111;display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);font-weight:700;font-size:11px;color:#111}
details summary{cursor:pointer}
@media (max-width:1000px){.grid{grid-template-columns:1fr}#map{position:relative;height:420px}.col{max-height:none}}

<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none">
  <div class="bar" style="margin-top:0">
    <div style="flex:1;min-width:260px"><h1>VAN PLANNING</h1><div class="sub">Plan the runs, check the money, then book them into Track-POD. Suggested runs are a starting point: move drops between runs to suit.</div></div>
    <label class="sub">Run day <input type="date" id="day"></label>
    <button class="btn y" id="suggest">Suggest runs</button>
    <button class="btn" id="reload">Refresh</button>
  </div>
  <div class="bar" id="chips"></div>
  <div class="grid">
    <div class="col" id="left"><div class="empty">Loading…</div></div>
    <div id="map"></div>
  </div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="auth.js?v=20261118182011"></script>
<script src="activity.js?v=20261118182011"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/vanplan';
const WH = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/warehouse';
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
let token = store.get('tsd_me_token');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = v => Number(v) || 0;
const gbp = v => (N(v) < 0 ? '−£' : '£') + Math.round(Math.abs(N(v))).toLocaleString('en-GB');
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500); };
const dshort = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'}) : '';
const COLORS = ['#EED107', '#7DDB98', '#8AB4FF', '#FF9F6B', '#D69BFF', '#5FD3D3'];

// ---- assumptions (shown on screen) ----
const MPH = 32, STOP_MIN = 15, ROAD = 1.25, DAY_MIN = 600;   // average speed incl. A-roads/motorway, minutes per drop, straight line -> road, a full working day
const CONGESTION = /^(EC\d|WC\d|E1W?|N1|NW1|SE1|SE11|SW1[A-Z]?|SW3|SW5|SW7|SW10|W1[A-Z]?|W2|W8|W11|W14)$/;   // central London (rough), adds the London extra
// rough courier cost for the same order, to flag drops that might be cheaper by courier
const courierCost = w => w <= 0 ? 12 : w <= 30 ? 12 : w <= 100 ? 12 * Math.ceil(w / 25) : 55;
const SITE_WORDS = /(no hgv|no lorr|access|restrict|before \d|after \d|by \d|call|phone|ring|tail ?lift|forklift|narrow|parking|gate|site closes|timed|booking|booked slot)/i;

let D = null, day = null, runs = [], map, layer;

async function api(body){
  const r = await fetch(API, body ? {method:'POST', headers:{Authorization:'Bearer ' + token, 'Content-Type':'application/json'}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('Please log in again'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error && j.ok !== false) throw new Error(j.error || 'Something went wrong');
  return j;
}
function showLogin(msg){ $('app').style.display = 'none'; $('login').style.display = 'flex'; if (msg) $('lerr').textContent = msg; }
function start(){ $('login').style.display = 'none'; $('app').style.display = 'block'; initMap(); load(); }

function nextWorkingDay(){ const d = new Date(); do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6); return d.toLocaleDateString('en-CA'); }
function save(){ store.set('vp_runs_' + day, JSON.stringify(runs.map(r => ({ ...r, google: r.google ? { ...r.google, line: null } : null })))); }
function restore(){ try { const r = JSON.parse(store.get('vp_runs_' + day) || '[]'); const ids = new Set((D.orders || []).map(o => o.id)); runs = r.map(x => ({ ...x, stops: x.stops.filter(id => ids.has(id)), google: null })); } catch(e){ runs = []; } }

async function load(){
  try {
    D = await api();
    if (!day) { day = nextWorkingDay(); $('day').value = day; }
    restore(); render();
  } catch(e){ $('left').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ---- maths ----
const R = 3958.8, rad = x => x * Math.PI / 180;
function hav(a, b){ const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng); const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2; return 2 * R * Math.asin(Math.sqrt(h)); }
const byId = id => (D.orders || []).find(o => o.id === id);
const located = o => o && o.lat != null && o.lng != null;
function nnOrder(ids){   // nearest-neighbour tour from the depot
  const left = ids.map(byId).filter(located), out = []; let cur = D.depot;
  while (left.length) { let bi = 0, bd = 1e9; left.forEach((o, i) => { const d = hav(cur, o); if (d < bd) { bd = d; bi = i; } }); cur = left.splice(bi, 1)[0]; out.push(cur.id); }
  return out.concat(ids.filter(id => !located(byId(id))));
}
function tourMiles(ids){ const pts = ids.map(byId).filter(located); if (!pts.length) return 0; let m = 0, cur = D.depot; for (const p of pts) { m += hav(cur, p); cur = p; } return (m + hav(cur, D.depot)) * ROAD; }
function outcode(pc){ return String(pc || '').trim().toUpperCase().split(' ')[0]; }
function costs(){ return D.costs || { driver_default: 153, fuel_per_mile: 0.3, vans: {}, extras: { LDN: 18 }, van_days_per_month: 21.7, drivers: {} }; }
function runNumbers(r){
  const os = r.stops.map(byId).filter(Boolean);
  const est = !r.google;
  const miles = r.google ? r.google.miles : tourMiles(r.stops);
  const minutes = (r.google ? r.google.minutes : miles / MPH * 60) + os.length * STOP_MIN;
  const kg = os.reduce((a, o) => a + N(o.weight), 0);
  const van = (D.vans || []).find(v => v.reg === r.van) || (D.vans || [])[0] || { kg: 1300 };
  const C = costs();
  const dayRate = N((C.drivers || {})[r.driver]) || N(C.driver_default) || 153;
  const driver = dayRate * (minutes > DAY_MIN * 0.55 ? 1 : 0.5);
  const vanDay = N((C.vans || {})[r.van] ?? Object.values(C.vans || {})[0]) / (N(C.van_days_per_month) || 21.7);
  const fuel = miles * (N(C.fuel_per_mile) || 0.3);
  const london = os.some(o => CONGESTION.test(outcode(o.postcode))) ? N((C.extras || {}).LDN) : 0;
  const cost = driver + vanDay + fuel + london;
  const delivery = os.reduce((a, o) => a + N(o.delivery), 0);
  const margin = os.reduce((a, o) => a + N(o.goods) - N(o.cost), 0);
  return { os, est, miles, minutes, kg, cap: van.kg || 1300, driver, vanDay, fuel, london, cost, delivery, margin, profit: delivery + margin - cost };
}
// each drop's extra miles on this run, and whether a courier would be cheaper for it
function detour(r, id){
  if (r.stops.length < 2) return null;
  const without = tourMiles(nnOrder(r.stops.filter(x => x !== id)));
  const extra = Math.max(0, tourMiles(nnOrder(r.stops)) - without);
  const C = costs();
  const pounds = extra * (N(C.fuel_per_mile) || 0.3) + (extra / MPH * 60 + STOP_MIN) / 60 * ((N(C.driver_default) || 153) / 10);
  return { miles: extra, pounds };
}

// ---- suggestion: sweep round Bromham by direction, fill each van to weight / time, nearest-neighbour order ----
function suggest(){
  const pool = (D.orders || []).filter(o => located(o) && !(o.backorder && o.stock_in !== 'all'));
  const ang = o => Math.atan2(o.lat - D.depot.lat, (o.lng - D.depot.lng) * Math.cos(rad(D.depot.lat)));
  pool.sort((a, b) => ang(a) - ang(b));
  // start the sweep at the biggest gap between drops, so one area isn't split across two runs
  let gapAt = 0, gap = -1;
  pool.forEach((o, i) => { const nx = pool[(i + 1) % pool.length]; let g = ang(nx) - ang(o); if (g <= 0) g += 2 * Math.PI; if (g > gap) { gap = g; gapAt = (i + 1) % pool.length; } });
  const ordered = pool.slice(gapAt).concat(pool.slice(0, gapAt));
  const dow = new Date(day + 'T12:00:00').getDay();
  const drivers = (D.drivers || []).filter(d => (d.days || []).includes(dow));
  const vans = (D.vans || []).slice(0, Math.max(1, Math.min((D.vans || []).length, drivers.length || 1)));
  const out = []; let cur = null;
  for (const o of ordered) {
    if (!cur) { const v = vans[out.length]; if (!v) break; cur = { id: 'r' + Date.now() + out.length, van: v.reg, driver: (drivers[out.length] || drivers[0] || {}).name || '', stops: [], google: null }; out.push(cur); }
    const trial = { ...cur, stops: nnOrder([...cur.stops, o.id]) };
    const n = runNumbers(trial);
    if (cur.stops.length && (n.kg > n.cap || n.minutes > DAY_MIN)) {
      const v = vans[out.length]; if (!v) continue;
      cur = { id: 'r' + Date.now() + out.length, van: v.reg, driver: (drivers[out.length] || drivers[0] || {}).name || '', stops: [o.id], google: null }; out.push(cur);
    } else cur.stops = trial.stops;
  }
  runs = out; save(); render();
  toast(out.length ? `${out.length} run${out.length === 1 ? '' : 's'} suggested. Check them, then get the Google route.` : 'Nothing to plan for that day');
}

// ---- render ----
function flags(o, r){
  const f = [];
  if (o.ship_by && o.ship_by < day) f.push(`<span class="flag f-bad">Needed by ${dshort(o.ship_by)}</span>`);
  if (o.backorder && o.stock_in !== 'all') f.push('<span class="flag f-bad">Stock not all in</span>');
  if (!located(o)) f.push('<span class="flag f-bad">No location: check postcode</span>');
  if (!N(o.weight)) f.push('<span class="flag f-warn">No weight in Cin7</span>');
  if (SITE_WORDS.test(o.notes || '')) f.push('<span class="flag f-warn">Site note</span>');
  if (D.dispatch_on && o.office && o.office.state !== 'van') f.push('<span class="flag f-warn">Not sent to van by the office</span>');
  if (r) {
    const dt = detour(r, o.id);
    if (dt && N(o.weight) < 60 && dt.pounds > courierCost(N(o.weight)) + 5) f.push(`<span class="flag f-cour">Courier ≈ ${gbp(courierCost(N(o.weight)))} vs +${Math.round(dt.miles)} mi (≈${gbp(dt.pounds)})</span>`);
  }
  return f.join('');
}
function runOptions(sel){ return runs.map((r, i) => `<option value="${r.id}" ${r.id === sel ? 'selected' : ''}>Run ${String.fromCharCode(65 + i)}</option>`).join('') + `<option value="" ${!sel ? 'selected' : ''}>Not on a run</option><option value="__new">+ New run</option>`; }
function stopRow(o, r, i){
  return `<div class="stop" style="--c:${r ? COLORS[runs.indexOf(r) % COLORS.length] : '#888'}">
    <span class="i">${r ? i + 1 : '·'}</span>
    <div><div><span class="t">${esc(o.no)}</span> ${esc(o.customer)}</div>
      <div class="m">${esc([o.town, o.postcode].filter(Boolean).join(' · '))} · ${N(o.weight) ? Math.round(N(o.weight)) + ' kg' : '? kg'} · ${N(o.delivery) ? 'delivery ' + gbp(o.delivery) : 'free delivery'}${r && r.google && r.google.legs && r.google.legs[i] ? ' · ' + r.google.legs[i].miles + ' mi, ' + r.google.legs[i].minutes + ' min' : ''}</div>
      ${flags(o, r)}${o.notes ? `<div class="note">“${esc(o.notes)}”</div>` : ''}</div>
    <select data-move="${o.id}">${runOptions(r ? r.id : '')}</select>
  </div>`;
}
function render(){
  if (!D) return;
  const onRun = new Set(runs.flatMap(r => r.stops));
  const pool = (D.orders || []).filter(o => !onRun.has(o.id));
  const bookedDay = (D.booked || []).filter(b => b.tp_date === day);
  const C = costs();
  $('chips').innerHTML = `<span class="chip">To book <b>${(D.orders || []).length}</b></span>
    <span class="chip">Already booked ${dshort(day)} <b>${bookedDay.length}</b>${bookedDay.length ? ' · ' + Math.round(bookedDay.reduce((a, b) => a + b.weight, 0)) + ' kg' : ''}</span>
    <span class="chip">Google routes today <b>${D.google.used}/${D.google.cap}</b></span>
    <span class="chip" title="${esc(C.basis || '')}">Costs: driver ${gbp(C.driver_default)}/day · fuel £${N(C.fuel_per_mile).toFixed(2)}/mi · London +${gbp((C.extras || {}).LDN)} (Van profit settings)</span>`;
  $('left').innerHTML = `
    ${runs.length ? '' : `<div class="booked">No runs planned for ${dshort(day)} yet. Press <b>Suggest runs</b>, or put drops on a run with the dropdowns below.</div>`}
    ${runs.map((r, ri) => {
      const n = runNumbers(r), c = COLORS[ri % COLORS.length];
      return `<div class="run" style="--c:${c}">
        <div class="hd"><h2>Run ${String.fromCharCode(65 + ri)}</h2>
          <select data-van="${r.id}">${(D.vans || []).map(v => `<option value="${esc(v.reg)}" ${v.reg === r.van ? 'selected' : ''}>${esc(v.reg)} · ${esc(v.name)}</option>`).join('')}</select>
          <select data-driver="${r.id}"><option value="">Driver…</option>${(D.drivers || []).map(d => `<option ${d.name === r.driver ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>
        <div class="nums">
          <div class="num ${n.kg > n.cap ? 'bad' : ''}"><div class="k">Weight</div><div class="v">${Math.round(n.kg).toLocaleString('en-GB')}<span style="font-size:14px"> / ${n.cap} kg</span></div></div>
          <div class="num"><div class="k">${n.est ? 'Miles (est)' : 'Miles'}</div><div class="v">${Math.round(n.miles)}</div></div>
          <div class="num ${n.minutes > DAY_MIN ? 'bad' : ''}"><div class="k">${n.est ? 'Time (est)' : 'Time'}</div><div class="v">${Math.floor(n.minutes / 60)}h ${String(Math.round(n.minutes % 60)).padStart(2, '0')}</div></div>
          <div class="num ${n.profit >= 0 ? 'good' : 'bad'}"><div class="k">Run profit</div><div class="v">${gbp(n.profit)}</div></div>
        </div>
        <div class="money">Delivery charges <b>${gbp(n.delivery)}</b> + goods margin <b>${gbp(n.margin)}</b> − run cost <b>${gbp(n.cost)}</b> (driver ${gbp(n.driver)}, van ${gbp(n.vanDay)}, fuel ${gbp(n.fuel)}${n.london ? ', London ' + gbp(n.london) : ''})${n.est ? ' · <i>miles and time are estimates until you get the Google route</i>' : ''}</div>
        <div class="stops">${n.os.map((o, i) => stopRow(o, r, i)).join('') || '<div class="empty">No drops on this run.</div>'}</div>
        <div class="bar" style="margin-bottom:0">
          <button class="btn" data-g="${r.id}" ${r.stops.length ? '' : 'disabled'}>${r.google ? 'Re-check' : 'Get'} Google route</button>
          <button class="btn g" data-book="${r.id}" ${r.stops.length ? '' : 'disabled'}>Book run in Track-POD for ${dshort(day)}</button>
          <button class="btn" data-del="${r.id}" title="Remove this run (the drops go back to the list)">✕</button>
        </div>
      </div>`; }).join('')}
    <div class="pool"><h2>Not on a run <span class="sub">(${pool.length})</span></h2>
      <div class="stops">${pool.map(o => stopRow(o, null, 0)).join('') || '<div class="empty">Everything is on a run.</div>'}</div></div>
    ${bookedDay.length ? `<details class="booked"><summary>Already in Track-POD for ${dshort(day)} (${bookedDay.length}) · shown grey on the map</summary>${bookedDay.map(b => `<div>${esc(b.no)} ${esc(b.customer)} · ${esc(b.postcode)} · ${Math.round(b.weight)} kg${b.route ? ' · route ' + esc(b.route) : ''}${b.driver ? ' · ' + esc(b.driver) : ''}</div>`).join('')}</details>` : ''}
    <div class="sub">Assumptions: ${MPH} mph average, ${STOP_MIN} min per drop, straight line × ${ROAD} for road miles until Google is asked, a full day is ${DAY_MIN / 60} hours (over ${Math.round(DAY_MIN * 0.55 / 60)}h counts a full driver day, under is half). Courier comparison is rough (£12 a parcel, £55 a pallet).</div>`;
  wire(); drawMap();
}
function wire(){
  document.querySelectorAll('[data-move]').forEach(s => s.onchange = () => {
    const id = s.dataset.move; let to = s.value;
    runs.forEach(r => { r.stops = r.stops.filter(x => x !== id); });
    if (to === '__new') { const v = (D.vans || [])[runs.length % Math.max(1, (D.vans || []).length)] || {}; const nr = { id: 'r' + Date.now(), van: v.reg, driver: '', stops: [], google: null }; runs.push(nr); to = nr.id; }
    const r = runs.find(x => x.id === to); if (r) { r.stops = nnOrder([...r.stops, id]); r.google = null; }
    runs.forEach(x => { if (x.id !== to && x.google) x.google = null; });
    save(); render();
  });
  document.querySelectorAll('[data-van]').forEach(s => s.onchange = () => { const r = runs.find(x => x.id === s.dataset.van); r.van = s.value; save(); render(); });
  document.querySelectorAll('[data-driver]').forEach(s => s.onchange = () => { const r = runs.find(x => x.id === s.dataset.driver); r.driver = s.value; save(); render(); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { runs = runs.filter(x => x.id !== b.dataset.del); save(); render(); });
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => google(b.dataset.g, b));
  document.querySelectorAll('[data-book]').forEach(b => b.onclick = () => bookModal(b.dataset.book));
}
async function google(rid, btn){
  const r = runs.find(x => x.id === rid); if (!r) return;
  const stops = r.stops.map(byId).filter(located).map(o => ({ id: o.id, lat: o.lat, lng: o.lng }));
  btn.disabled = true; btn.textContent = 'Asking Google…';
  try {
    const j = await api({ action: 'route', stops });
    if (!j.ok) { toast(j.error || 'Google said no'); btn.disabled = false; return render(); }
    r.stops = j.order.concat(r.stops.filter(id => !j.order.includes(id)));
    r.google = { miles: j.miles, minutes: j.minutes, legs: j.legs, line: j.line };
    D.google.used++; save(); render();
  } catch(e){ toast(e.message); btn.disabled = false; }
}
function modal(h){ $('mbox').innerHTML = h; $('modal').style.display = 'flex'; }
function closeModal(){ $('modal').style.display = 'none'; }
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
function bookModal(rid){
  const r = runs.find(x => x.id === rid), ri = runs.indexOf(r), n = runNumbers(r);
  const warn = [n.kg > n.cap ? `Over the van's ${n.cap} kg.` : '', n.minutes > DAY_MIN ? 'Longer than a working day.' : '', n.os.some(o => o.backorder && o.stock_in !== 'all') ? 'Some stock isn’t all in yet (only what’s in goes on the van).' : ''].filter(Boolean).join(' ');
  modal(`<h3>Book Run ${String.fromCharCode(65 + ri)} for ${dshort(day)}</h3>
    <div class="sub">${n.os.length} drops · ${Math.round(n.kg)} kg · ${esc(r.van || '')}${r.driver ? ' · ' + esc(r.driver) : ''}. Each order goes into Track-POD for ${dshort(day)} in this order, ready to route. The warehouse then sees it on their van screen to pick and load.</div>
    ${warn ? `<div style="color:var(--bad)">${esc(warn)}</div>` : ''}
    <ol style="margin:0;padding-left:20px">${n.os.map(o => `<li>${esc(o.no)} ${esc(o.customer)} · ${esc(o.postcode || '')}</li>`).join('')}</ol>
    <label class="sub"><input type="checkbox" id="bful"> Also pick, pack &amp; ship them in Cin7 now (the old way). Leave unticked so the warehouse ships each one when it's loaded.</label>
    <div id="bprog" class="sub"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" id="bc">Cancel</button><button class="btn g" id="bok">Book ${n.os.length} drops</button></div>`);
  $('bc').onclick = closeModal;
  $('bok').onclick = async () => {
    $('bok').disabled = true; $('bc').disabled = true;
    const fulfil = $('bful').checked; let ok = 0; const bad = [];
    for (const [i, o] of n.os.entries()) {
      $('bprog').textContent = `Booking ${i + 1} of ${n.os.length}: ${o.no}…`;
      try {
        const res = await fetch(WH, { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'tp_push', id: o.id, date: day, fulfil }) });
        const j = await res.json().catch(() => ({}));
        if (res.ok && j.ok !== false) ok++; else bad.push(`${o.no}: ${j.error || res.status}`);
      } catch(e){ bad.push(`${o.no}: no connection`); }
    }
    $('bprog').innerHTML = `${ok} booked.${bad.length ? '<br><span style="color:var(--bad)">' + bad.map(esc).join('<br>') + '</span>' : ''}`;
    if (!bad.length) { runs = runs.filter(x => x.id !== rid); save(); setTimeout(() => { closeModal(); load(); }, 900); toast(`Run booked: ${ok} drops in Track-POD for ${dshort(day)}`); }
    else { $('bc').disabled = false; $('bc').textContent = 'Close'; load(); }
  };
}

// ---- map ----
function initMap(){
  if (map || !window.L) return;
  map = L.map('map', { zoomControl: true }).setView([51.45, -1.6], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap contributors' }).addTo(map);
  layer = L.layerGroup().addTo(map);
}
const pinIcon = (c, t) => L.divIcon({ className: '', html: `<div class="pin" style="background:${c}"><span>${t}</span></div>`, iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] });
function drawMap(){
  if (!map) return; layer.clearLayers();
  const pts = [[D.depot.lat, D.depot.lng]];
  L.marker([D.depot.lat, D.depot.lng], { icon: pinIcon('#fff', '⌂') }).bindPopup('<b>TSD Bromham</b>').addTo(layer);
  (D.booked || []).filter(b => b.tp_date === day && b.lat != null).forEach(b => {
    L.circleMarker([b.lat, b.lng], { radius: 6, color: '#888', fillColor: '#666', fillOpacity: .8 }).bindPopup(`<b>${esc(b.no)}</b> ${esc(b.customer)}<br>Already booked ${dshort(b.tp_date)}`).addTo(layer);
  });
  const onRun = new Map(); runs.forEach((r, ri) => r.stops.forEach((id, i) => onRun.set(id, [ri, i])));
  runs.forEach((r, ri) => {
    const c = COLORS[ri % COLORS.length];
    const line = r.google && r.google.line ? r.google.line : [[D.depot.lat, D.depot.lng], ...r.stops.map(byId).filter(located).map(o => [o.lat, o.lng]), [D.depot.lat, D.depot.lng]];
    L.polyline(line, { color: c, weight: 4, opacity: .85, dashArray: r.google ? null : '6 8' }).addTo(layer);
  });
  (D.orders || []).filter(located).forEach(o => {
    const at = onRun.get(o.id), c = at ? COLORS[at[0] % COLORS.length] : '#9aa0a8';
    L.marker([o.lat, o.lng], { icon: pinIcon(c, at ? at[1] + 1 : '·') })
      .bindPopup(`<b>${esc(o.no)}</b> ${esc(o.customer)}<br>${esc(o.postcode || '')} · ${Math.round(N(o.weight))} kg · delivery ${gbp(o.delivery)}${o.notes ? '<br><i>' + esc(o.notes) + '</i>' : ''}`).addTo(layer);
    pts.push([o.lat, o.lng]);
  });
  if (!drawMap.fitted && pts.length > 1) { map.fitBounds(pts, { padding: [30, 30] }); drawMap.fitted = true; }
}

$('day').onchange = () => { day = $('day').value; drawMap.fitted = false; restore(); render(); };
$('suggest').onclick = () => { if (runs.length && !confirm('Replace the runs you have for this day with a new suggestion?')) return; suggest(); };
$('reload').onclick = load;
if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });
</script>

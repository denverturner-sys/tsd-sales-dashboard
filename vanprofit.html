.wrap{padding:18px 20px 40px;max-width:1300px;margin:0 auto}
h1{font-family:var(--num);font-size:42px;letter-spacing:1px;margin:0;line-height:1}
.sub{color:var(--muted);font-size:14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;padding:8px 16px;cursor:pointer}
.seg button.on{background:var(--accent);color:#262727}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--muted)}.btn.y{background:var(--accent);color:#262727;border-color:var(--accent)}
input,select{background:#1c1d1d;border:1px solid var(--line);color:var(--ink);font:inherit;padding:8px 10px;border-radius:10px;color-scheme:dark}
.warn{background:rgba(238,209,7,.08);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.warn b{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .k{color:var(--muted);font-size:14px;font-weight:600}
.tile .n{font-family:var(--num);font-size:46px;line-height:1.05;margin-top:2px}
.tile .s{color:var(--muted);font-size:13px}
.tile.good .n,.good{color:var(--good)}.tile.bad .n,.bad{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h2{font-family:var(--num);font-size:28px;letter-spacing:.5px;margin:0;font-weight:400}
.rhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.pill{display:inline-block;padding:2px 9px;border-radius:9px;background:var(--panel2);font-size:12px;color:var(--muted);margin-left:6px;font-weight:600}
.pill.lon{background:rgba(238,209,7,.15);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td.l{white-space:normal}
tr.sumrow td{border-bottom:0;padding-top:4px;padding-bottom:4px;color:var(--muted)}
tr.sumrow.tot td{color:var(--ink);font-weight:700;font-size:16px;border-top:2px solid var(--line);padding-top:8px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.flag{color:var(--accent);font-size:12px;font-weight:700;margin-left:4px}
.scroll{overflow-x:auto}
.chart{width:100%;height:220px;display:block}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.empty{color:var(--muted);padding:20px 0;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:620px;width:100%}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.frow label{font-size:15px}.frow .h{color:var(--muted);font-size:12px;display:block}
.frow input{width:120px;text-align:right}
.ftitle{font-family:var(--num);font-size:22px;margin:16px 0 2px;letter-spacing:.5px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:#262727;font-weight:700;padding:10px 16px;border-radius:10px;display:none;z-index:60}
.so{display:none;color:var(--muted);font-size:12px;white-space:normal;font-weight:400}
@media (max-width:640px){.hm{display:none}.so{display:block}td.cs{display:none}.wrap{padding:14px 12px 30px}.tile .n{font-size:36px}.cols{grid-template-columns:1fr}h1{font-size:34px}}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none">
  <h1>VAN PROFIT</h1>
  <div class="sub">Our own van deliveries: what each route took, what it cost to run, and what was left. Management only.</div>
  <div class="bar">
    <div class="seg"><button id="mDay" class="on">Day</button><button id="mMonth">Month</button></div>
    <button class="btn" id="prev">◀</button>
    <input type="date" id="pDay"><input type="month" id="pMonth" style="display:none">
    <button class="btn" id="next">▶</button>
    <button class="btn" id="todayBtn">Today</button>
    <span style="flex:1"></span>
    <button class="btn y" id="costsBtn">⚙ Running costs</button>
  </div>
  <div id="out"><div class="empty">Loading…</div></div>
  <div class="sub" id="foot"></div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script src="auth.js?v=20261116083847"></script>
<script src="activity.js?v=20261116083847"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/vanprofit';
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
let token = store.get('tsd_me_token');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = v => Number(v) || 0;
const gbp = (v, dp = 0) => (N(v) < 0 ? '−£' : '£') + Math.abs(N(v)).toLocaleString('en-GB', {minimumFractionDigits: dp, maximumFractionDigits: dp});
const gbp2 = v => gbp(v, 2);
const ukToday = () => new Date().toLocaleDateString('en-CA', {timeZone: 'Europe/London'});
const dlong = s => new Date(s + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const dshort = s => new Date(s + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
const hm = s => s ? new Date(s).toLocaleTimeString('en-GB', {timeZone:'Europe/London', hour:'2-digit', minute:'2-digit'}) : '–';
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '–';
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2600); };

let mode = store.get('vp_mode') === 'month' ? 'month' : 'day';
let day = new URLSearchParams(location.search).get('day') || ukToday();
let month = day.slice(0, 7);
let last = null;

async function api(qs, body){
  const r = await fetch(API + (qs || ''), body ? {method:'POST', headers:{Authorization:'Bearer ' + token, 'Content-Type':'application/json'}, body: JSON.stringify(body)}
    : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('Please log in again'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || 'Something went wrong');
  return j;
}
function showLogin(msg){ $('app').style.display = 'none'; $('login').style.display = 'flex'; if (msg) $('lerr').textContent = msg; }
function start(){ $('login').style.display = 'none'; $('app').style.display = 'block'; setMode(mode); }

function setMode(m){
  mode = m; store.set('vp_mode', m);
  $('mDay').classList.toggle('on', m === 'day'); $('mMonth').classList.toggle('on', m === 'month');
  $('pDay').style.display = m === 'day' ? '' : 'none'; $('pMonth').style.display = m === 'month' ? '' : 'none';
  $('pDay').value = day; $('pMonth').value = month;
  load();
}
async function load(){
  $('out').innerHTML = '<div class="empty">Loading…</div>';
  try {
    if (mode === 'day') { last = await api('?day=' + day); drawDay(last); }
    else {
      const [y, m] = month.split('-').map(Number);
      const from = month + '-01', to = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
      last = await api('?from=' + from + '&to=' + to); drawMonth(last, from, to);
    }
    $('foot').textContent = last.synced ? 'Routes from Track-POD, updated ' + new Date(last.synced).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) + '. Order figures from Cin7 (ex VAT).' : '';
  } catch(x){ $('out').innerHTML = `<div class="empty">${esc(x.message)}</div>`; }
}

// what's not filled in yet, so a half-costed figure is never mistaken for the real one
function missing(routes, s){
  const m = [];
  if (routes.some(r => !r.drv_set)) m.push('driver pay');
  if (routes.some(r => !r.fuel_set)) m.push('fuel');
  if (routes.some(r => !r.van_set)) m.push('van costs');
  return m;
}
function sum(routes, k){ return routes.reduce((a, r) => a + N(r[k]), 0); }
function totalsTiles(routes, extra){
  const sales = sum(routes, 'goods') + sum(routes, 'carriage'), gross = sum(routes, 'gross'), costs = sum(routes, 'van_costs'), net = gross - costs, drops = sum(routes, 'drops');
  const carr = sum(routes, 'carriage');
  return `<div class="tiles">
    <div class="tile"><div class="k">Sales on the vans</div><div class="n">${gbp(sales)}</div><div class="s">${drops} drop${drops === 1 ? '' : 's'} · ${routes.length} route${routes.length === 1 ? '' : 's'}${extra || ''}</div></div>
    <div class="tile"><div class="k">Carriage charged</div><div class="n">${gbp(carr)}</div><div class="s">${costs ? 'covers ' + pct(carr, costs) + ' of van costs' : pct(carr, sales) + ' of sales'}</div></div>
    <div class="tile"><div class="k">Gross profit</div><div class="n">${gbp(gross)}</div><div class="s">${pct(gross, sales)} margin, before van costs</div></div>
    <div class="tile"><div class="k">Van running costs</div><div class="n">${gbp(costs)}</div><div class="s">driver, fuel, van, extras</div></div>
    <div class="tile ${net >= 0 ? 'good' : 'bad'}"><div class="k">Net profit</div><div class="n">${gbp(net)}</div><div class="s">${pct(net, sales)} of sales</div></div>
    <div class="tile"><div class="k">Net per drop</div><div class="n">${drops ? gbp(net / drops) : '–'}</div><div class="s">${drops ? 'van costs ' + gbp(costs / drops) + ' a drop' : ''}</div></div>
  </div>`;
}
function warnBox(routes, s){
  const m = missing(routes, s);
  return m.length ? `<div class="warn"><b>Not fully costed yet:</b> ${m.join(', ')} ${m.length > 1 ? "aren't" : "isn't"} filled in, so net profit is higher than it really is. <a href="#" onclick="costs();return false" style="color:var(--accent)">Fill in running costs</a></div>` : '';
}

function drawDay(d){
  const routes = d.routes || [];
  if (!routes.length) { $('out').innerHTML = `<div class="card"><h2>${dlong(day)}</h2><div class="empty">No van routes in Track-POD for this day.</div></div>`; return; }
  const zero = routes.reduce((a, r) => a + N(r.zero_cost), 0);
  let h = `<div class="sub" style="font-size:16px;color:var(--ink);font-weight:600">${dlong(day)}</div>` + warnBox(routes, d.settings) + totalsTiles(routes);
  if (zero) h += `<div class="warn"><b>${zero} order${zero > 1 ? 's have' : ' has'} a £0 cost in Cin7</b> (marked ⚠ below), so ${zero > 1 ? 'their' : 'its'} profit is overstated. Fix the product's average cost in Cin7.</div>`;
  for (const r of routes) {
    const orders = r.orders || [];
    h += `<div class="card"><div class="rhead"><div><h2 style="display:inline">${esc(r.code)}</h2><span class="pill ${r.rtype === 'London' ? 'lon' : ''}">${esc(r.rtype)}</span></div>
      <div class="sub">${esc(r.driver || 'No driver')} · ${esc(r.vehicle || 'no van')} · ${hm(r.start_at)}–${hm(r.close_at)} (${N(r.hrs).toFixed(1)} h) · ${N(r.miles)} miles${r.planned_dist ? ' <span class="flag" title="Track-POD didn\'t track the whole route, so this uses the planned distance">planned</span>' : ''}</div></div>
      <div class="scroll"><table><thead><tr><th>Order</th><th class="l hm">Customer</th><th>Goods</th><th class="hm">Carriage</th><th class="hm">Cost of goods</th><th>Profit</th></tr></thead><tbody>
      ${orders.map(o => `<tr><td><b>${esc(o.no)}</b>${o.zero_cost ? '<span class="flag" title="£0 cost in Cin7">⚠ £0 cost</span>' : ''}${o.multi ? '<span class="flag" title="This order is on more than one day\'s route (part deliveries), so its full value shows on each">part delivery</span>' : ''}<div class="so">${o.missing ? 'Not found in Cin7' : esc(o.customer)}</div></td>
        <td class="l hm">${o.missing ? '<span class="sub">Not found in Cin7</span>' : esc(o.customer)}</td><td>${gbp2(o.goods)}</td><td class="hm">${N(o.carriage) ? gbp2(o.carriage) : '<span class="sub">free</span>'}</td><td class="hm">${gbp2(o.cost)}</td><td>${gbp2(o.profit)}</td></tr>`).join('')}
      <tr class="sumrow"><td colspan="2" class="l">Gross profit (${N(r.drops)} drop${N(r.drops) === 1 ? '' : 's'}, incl. ${gbp2(r.carriage)} carriage)</td><td class="cs" colspan="3"></td><td><b style="color:var(--ink)">${gbp2(r.gross)}</b></td></tr>
      <tr class="sumrow"><td colspan="2" class="l">− Driver${r.drv_set ? '' : ' <span class="flag">not set</span>'}</td><td class="cs" colspan="3"></td><td>${r.drv_set ? gbp2(-N(r.c_driver)) : '–'}</td></tr>
      <tr class="sumrow"><td colspan="2" class="l">− Fuel (${N(r.miles)} miles)${r.fuel_set ? '' : ' <span class="flag">not set</span>'}</td><td class="cs" colspan="3"></td><td>${r.fuel_set ? gbp2(-N(r.c_fuel)) : '–'}</td></tr>
      <tr class="sumrow"><td colspan="2" class="l">− Van (lease, insurance, tax, servicing)${r.van_set ? '' : ' <span class="flag">not set</span>'}</td><td class="cs" colspan="3"></td><td>${r.van_set ? gbp2(-N(r.c_van)) : '–'}</td></tr>
      ${N(r.c_extra) ? `<tr class="sumrow"><td colspan="2" class="l">− Extras (tolls, ULEZ, congestion)</td><td class="cs" colspan="3"></td><td>${gbp2(-N(r.c_extra))}</td></tr>` : ''}
      <tr class="sumrow tot"><td colspan="2" class="l">Net profit</td><td class="cs" colspan="3"></td><td class="${N(r.net) >= 0 ? 'good' : 'bad'}">${gbp2(r.net)}</td></tr>
      </tbody></table></div></div>`;
  }
  $('out').innerHTML = h;
}

function group(routes, key){
  const m = new Map();
  for (const r of routes) { const k = r[key] || '–'; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  return [...m.entries()];
}
function breakdown(title, rows){
  return `<div class="card"><h2>${title}</h2><div class="scroll"><table><thead><tr><th class="l"></th><th>Routes</th><th>Drops</th><th>Sales</th><th>Carriage</th><th>Gross</th><th>Van costs</th><th>Net</th><th>Net / route</th></tr></thead><tbody>
    ${rows.map(([k, rs]) => { const sales = sum(rs, 'goods') + sum(rs, 'carriage'), net = sum(rs, 'net');
      return `<tr><td class="l"><b>${esc(k)}</b></td><td>${rs.length}</td><td>${sum(rs, 'drops')}</td><td>${gbp(sales)}</td><td>${gbp(sum(rs, 'carriage'))}</td><td>${gbp(sum(rs, 'gross'))}</td><td>${gbp(sum(rs, 'van_costs'))}</td><td class="${net >= 0 ? 'good' : 'bad'}">${gbp(net)}</td><td>${gbp(net / rs.length)}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;
}
function chart(days){
  if (!days.length) return '';
  const W = 900, H = 220, pad = 34, max = Math.max(1, ...days.map(d => Math.abs(d.net))), min = Math.min(0, ...days.map(d => d.net));
  const top = Math.max(0, ...days.map(d => d.net)), range = (top - min) || 1, bw = (W - pad) / days.length;
  const y = v => 10 + (top - v) / range * (H - 40);
  const bars = days.map((d, i) => { const x = pad + i * bw + bw * 0.15, w = bw * 0.7, y0 = y(0), y1 = y(d.net);
    return `<g class="click" onclick="goDay('${d.date}')" style="cursor:pointer"><title>${dshort(d.date)}: ${gbp(d.net)} net from ${d.routes} route${d.routes === 1 ? '' : 's'}</title>
      <rect x="${x}" y="${Math.min(y0, y1)}" width="${w}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="3" fill="${d.net >= 0 ? 'var(--good)' : 'var(--bad)'}"/>
      ${days.length <= 31 ? `<text x="${x + w / 2}" y="${H - 8}" fill="var(--muted)" font-size="11" text-anchor="middle">${+d.date.slice(8)}</text>` : ''}</g>`; }).join('');
  void max;
  return `<div class="card"><h2>Net profit by day</h2><div class="sub">Tap a bar to open that day.</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${pad}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <text x="0" y="${y(top) + 4}" fill="var(--muted)" font-size="11">${gbp(top)}</text>${min < 0 ? `<text x="0" y="${y(min) + 4}" fill="var(--muted)" font-size="11">${gbp(min)}</text>` : ''}${bars}</svg></div>`;
}
function drawMonth(d, from, to){
  const routes = d.routes || [];
  const label = new Date(from + 'T12:00:00').toLocaleDateString('en-GB', {month:'long', year:'numeric'});
  if (!routes.length) { $('out').innerHTML = `<div class="card"><h2>${label}</h2><div class="empty">No van routes in Track-POD for this month.</div></div>`; return; }
  const byDay = group(routes, 'route_date').map(([date, rs]) => ({ date, routes: rs.length, drops: sum(rs, 'drops'), sales: sum(rs, 'goods') + sum(rs, 'carriage'),
    carriage: sum(rs, 'carriage'), gross: sum(rs, 'gross'), costs: sum(rs, 'van_costs'), net: sum(rs, 'net'), rs })).sort((a, b) => a.date < b.date ? -1 : 1);
  const zero = routes.reduce((a, r) => a + N(r.zero_cost), 0);
  let h = `<div class="sub" style="font-size:16px;color:var(--ink);font-weight:600">${label}</div>` + warnBox(routes, d.settings) + totalsTiles(routes, ` · ${byDay.length} day${byDay.length === 1 ? '' : 's'} out`);
  if (zero) h += `<div class="warn"><b>${zero} order${zero > 1 ? 's' : ''} this month ${zero > 1 ? 'have' : 'has'} a £0 cost in Cin7</b>, so gross profit is overstated. Open the day to see which.</div>`;
  h += chart(byDay);
  h += `<div class="cols">${breakdown('London vs local', group(routes, 'rtype'))}${breakdown('By van', group(routes, 'vehicle'))}</div>`;
  h += breakdown('By driver', group(routes, 'driver'));
  h += `<div class="card"><h2>Every day</h2><div class="scroll"><table><thead><tr><th class="l">Day</th><th>Routes</th><th>Drops</th><th>Sales</th><th>Carriage</th><th>Gross</th><th>Van costs</th><th>Net</th></tr></thead><tbody>
    ${byDay.map(x => `<tr class="click" onclick="goDay('${x.date}')"><td class="l"><b>${dshort(x.date)}</b> <span class="sub">${x.rs.map(r => esc(r.code)).join(', ')}</span></td><td>${x.routes}</td><td>${x.drops}</td><td>${gbp(x.sales)}</td><td>${gbp(x.carriage)}</td><td>${gbp(x.gross)}</td><td>${gbp(x.costs)}</td><td class="${x.net >= 0 ? 'good' : 'bad'}">${gbp(x.net)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  $('out').innerHTML = h;
}
function goDay(d){ day = d; month = d.slice(0, 7); setMode('day'); }

// ---------- running costs ----------
function costs(){
  const s = (last && last.settings) || {};
  const drivers = new Set(Object.keys(s.drivers || {})), vans = new Set(Object.keys(s.vans || {}));
  for (const r of (last && last.routes) || []) { if (r.driver) drivers.add(r.driver); if (r.vehicle) vans.add(r.vehicle); }
  const v = x => x == null ? '' : x;
  const row = (id, label, hint, val, step = '0.01') => `<div class="frow"><label>${label}${hint ? `<span class="h">${hint}</span>` : ''}</label><input type="number" min="0" step="${step}" data-k="${id}" value="${v(val)}" placeholder="£"></div>`;
  $('mbox').innerHTML = `<h2 style="font-family:var(--num);font-size:30px;margin:0">Running costs</h2>
    <div class="sub">Rough is fine to start. Leave a box empty if you don't know it yet: the screen will say it's not costed.</div>
    <div class="ftitle">Drivers (cost per day out)</div>
    ${row('driver_default', 'Default day rate', 'Used for anyone without their own rate. Include employer NI and pension if you can.', s.driver_default)}
    ${[...drivers].sort().map(n => row('drivers.' + n, esc(n), '', (s.drivers || {})[n])).join('')}
    <div class="ftitle">Fuel</div>
    ${row('fuel_per_mile', 'Cost per mile', 'Diesel at about £1.45 a litre in a van doing 30 mpg is roughly £0.22 a mile.', s.fuel_per_mile, '0.001')}
    <div class="ftitle">Vans (fixed cost per month)</div>
    <div class="sub">Lease or finance + insurance + road tax + servicing and tyres, per month. Shared over the days the van goes out.</div>
    ${[...vans].sort().map(n => row('vans.' + n, esc(n), '', (s.vans || {})[n])).join('')}
    ${row('van_days_per_month', 'Working days a month', 'Days a van is normally out. 21.7 is every weekday.', s.van_days_per_month ?? 21.7, '0.1')}
    <div class="ftitle">Extras per run</div>
    ${row('extras.LDN', 'London run', 'Congestion charge, ULEZ, tolls, parking.', (s.extras || {}).LDN)}
    ${row('extras.LCL', 'Local run', '', (s.extras || {}).LCL)}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeM()">Cancel</button><button class="btn y" id="saveC">Save</button></div>`;
  $('modal').style.display = 'flex';
  $('saveC').onclick = async () => {
    const out = { drivers: {}, vans: {}, extras: {} };
    document.querySelectorAll('#mbox input[data-k]').forEach(i => { const [a, b] = i.dataset.k.split(/\.(.+)/); const val = i.value === '' ? null : Number(i.value); if (b) out[a][b] = val; else out[a] = val; });
    $('saveC').disabled = true;
    try { await api('', { action: 'settings', value: out }); closeM(); toast('Running costs saved'); load(); }
    catch(x){ $('saveC').disabled = false; toast(x.message); }
  };
}
function closeM(){ $('modal').style.display = 'none'; }
$('modal').onclick = e => { if (e.target.id === 'modal') closeM(); };

$('mDay').onclick = () => setMode('day');
$('mMonth').onclick = () => setMode('month');
$('pDay').onchange = e => { if (e.target.value) { day = e.target.value; load(); } };
$('pMonth').onchange = e => { if (e.target.value) { month = e.target.value; load(); } };
$('prev').onclick = () => { if (mode === 'day') { day = addDays(day, -1); $('pDay').value = day; } else { const [y, m] = month.split('-').map(Number); month = new Date(Date.UTC(y, m - 2, 1)).toISOString().slice(0, 7); $('pMonth').value = month; } load(); };
$('next').onclick = () => { if (mode === 'day') { day = addDays(day, 1); $('pDay').value = day; } else { const [y, m] = month.split('-').map(Number); month = new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 7); $('pMonth').value = month; } load(); };
$('todayBtn').onclick = () => { day = ukToday(); month = day.slice(0, 7); $('pDay').value = day; $('pMonth').value = month; load(); };
$('costsBtn').onclick = costs;

if (token) start(); else showLogin();
TSDAuth.mount(t => { token = t; start(); });
</script>
<script>
(function(){
  const BUILD = '20261116083847';
  let newer = false;
  async function check(){
    try {
      if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); }
      if (newer) location.reload();
    } catch(e){}
  }
  setInterval(check, 120000);
})();
</script>

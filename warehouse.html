*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
button{font-family:inherit}
.wrap{padding:16px 20px 28px;max-width:1900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
header .l{display:flex;align-items:center;gap:16px}
header img{height:48px}
.title{font-family:var(--num);font-size:38px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px}
.clock{font-family:var(--num);font-size:44px;line-height:1}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;min-width:120px}
.chip .k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.chip .v{font-family:var(--num);font-size:28px;line-height:1.05}
.chip.warn .v{color:var(--accent)} .chip.bad .v{color:var(--bad)} .chip.done .v{color:var(--muted);text-decoration:line-through}
.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.sec{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:16px}
.sec h2{margin:0 0 10px;display:flex;align-items:baseline;gap:10px;font-family:var(--num);font-weight:400;font-size:28px;letter-spacing:1px}
.sec h2 .n{background:var(--accent);color:#262727;border-radius:6px;padding:0 8px;font-size:22px}
.sec h2 .h{font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:0}
.sec.urgent{border:2px solid var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.side .cards{grid-template-columns:minmax(0,1fr)}
.card{background:var(--panel2);border-radius:10px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--line)}
.card.am{border-left-color:var(--bad)} .card.next{border-left-color:var(--accent)} .card.late{border-left-color:var(--bad)} .card.standard{border-left-color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.no{font-family:var(--num);font-size:30px;letter-spacing:1px;line-height:1}
.cust{font-weight:700;font-size:15px;line-height:1.25}
.meta{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.6px;padding:3px 7px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.t-am{background:var(--bad);color:#262727} .t-next{background:var(--accent);color:#262727} .t-std{background:var(--ink);color:#262727}
.t-late{background:var(--bad);color:#262727} .t-chk{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.t-web{background:transparent;border:1px solid var(--line);color:var(--muted)} .t-part{background:transparent;border:1px solid var(--muted);color:var(--ink)}
.t-bo{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.carrier{font-size:12px;color:var(--muted);font-style:italic}
ul.lines{margin:2px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.45;border-top:1px solid var(--line);padding-top:6px}
ul.lines li{display:flex;gap:8px} ul.lines .q{font-weight:700;min-width:34px;text-align:right}
ul.lines .s{color:var(--muted);min-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.lines .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;background:rgba(238,209,7,.12);border-radius:6px;padding:5px 7px}
.vanbtn{margin-top:4px;align-self:flex-start;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
.vanbtn:hover{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
details.sec summary{cursor:pointer;list-style:none}
details.sec summary::-webkit-details-marker{display:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.shipbtn{margin-top:4px;width:100%;background:var(--good);color:#262727;border:0;border-radius:8px;padding:11px 12px;font-weight:700;font-size:15px;cursor:pointer}
.shipbtn:hover{filter:brightness(1.08)}
.stockbtn{background:transparent;color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
.stockbtn:hover{background:rgba(255,122,107,.12)}
.foundbtn{background:transparent;color:var(--good);border:1px solid var(--good);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
.issue{font-size:13px;background:rgba(255,122,107,.12);border:1px solid rgba(255,122,107,.4);border-radius:6px;padding:6px 8px;line-height:1.4}
.issue b{color:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal .box{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
#modal h3{margin:0;font-family:var(--num);font-weight:400;font-size:30px;letter-spacing:1px}
#modal label.it{display:flex;gap:10px;align-items:center;font-size:15px;padding:6px 8px;border-radius:6px;background:var(--panel2);cursor:pointer}
#modal input[type=checkbox]{width:20px;height:20px;accent-color:#EED107}
#modal textarea{width:100%;min-height:90px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:15px}
#modal .row{display:flex;gap:10px;justify-content:flex-end}
#modal .cancel{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:15px}
#modal .ok{background:var(--bad);color:#262727;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:15px}
#modal .ok.green{background:var(--good)}
#modal .err{color:var(--bad);font-size:13px;min-height:16px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#262727;border-radius:10px;padding:12px 16px;font-weight:600;display:none;gap:14px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast button{background:#262727;color:var(--accent);border:0;border-radius:6px;padding:7px 12px;font-weight:700;cursor:pointer}
footer{color:var(--muted);font-size:12px;margin-top:4px}
#msg{color:var(--muted);padding:40px;text-align:center;font-size:18px}
#search{max-width:1900px;margin:0 auto;padding:14px 20px 0;display:flex;gap:10px;align-items:center}
#search input{flex:1;max-width:620px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;font-family:inherit}
#search input:focus{outline:none;border-color:var(--accent)}
#search button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:15px;font-family:inherit}
#search .hint{color:var(--muted);font-size:13px}
.collbtn{margin-top:4px;align-self:flex-start;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
.collbtn:hover{border-color:var(--accent);color:var(--accent)}
.partbtn{margin-top:4px;width:100%;background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:8px;padding:9px 12px;font-weight:700;font-size:15px;cursor:pointer}
.partbtn:hover{background:rgba(238,209,7,.1)}
.warnbox{background:rgba(238,209,7,.12);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.4;margin:8px 0}
.plist{font-size:14px;margin:4px 0 8px;padding-left:18px}.plist li{margin:2px 0}
.where{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
#tabs{max-width:1900px;margin:0 auto;padding:12px 20px 0;display:flex;gap:6px;flex-wrap:wrap}
#tabs a{color:var(--muted);text-decoration:none;font-weight:700;font-size:15px;padding:9px 16px;border:1px solid var(--line);border-radius:999px}
#tabs a:hover{color:var(--ink);border-color:var(--muted)}
#tabs a.on{background:var(--accent);color:#262727;border-color:var(--accent)}
</style>
</head>

<script>
(function(){ // tabs between the warehouse screens; add &nav=0 to a link to hide them (e.g. the trade counter)
  const q = new URLSearchParams(location.search); if (q.get('nav') === '0') return;
  const here = location.pathname.endsWith('van.html') ? 'van' : q.get('tab') === 'collections' ? 'coll' : 'pick';
  const t = [['pick','Pick &amp; Dispatch','warehouse.html'], ['van','Van Team','van.html'], ['coll','Collections','warehouse.html?tab=collections'], ['gi','Goods In','goodsin.html'], ['stock','Stock','stock.html']];
  const n = document.createElement('nav'); n.id = 'tabs';
  n.innerHTML = t.map(([id, label, url]) => `<a href="${url}" class="${id === here ? 'on' : ''}">${label}</a>`).join('');
  document.body.prepend(n);
})();
</script>

const key = '';   // access is now the login in wh-auth.js (sent as a header), not a key in the link
const COLL = new URLSearchParams(location.search).get('tab') === 'collections';
if (COLL) document.title = 'Collections · TSD';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hidden = new Set();      // orders moved to van on this screen, hidden until the next refresh confirms it
let data = null, undoId = null, toastTimer;

async function load(){
  try {
    const r = await fetch(API + '?k=' + encodeURIComponent(key) + (COLL ? '&view=collections' : ''), {cache:'no-store'});
    if (r.status === 401) return;
    const j = await r.json(); if (j.error) throw new Error(j.error);
    data = j; hidden.clear(); render();
  } catch(e) { if (!data) document.getElementById('app').innerHTML = '<div id="msg">Can\'t reach the server. Retrying…</div>'; }
}

function hm(t){ const [h,m] = t.split(':').map(Number); const d = new Date(); d.setHours(h,m,0,0); return d; }
function left(t){ const ms = hm(t) - new Date(); if (ms <= 0) return null; const m = Math.round(ms/60000); return m >= 60 ? Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m' : m+'m'; }

function card(o){
  const cls = o.late ? 'late' : o.grp;
  const tags = [];
  if (o.grp === 'am') tags.push('<span class="tag t-am">AM / Pre-12</span>');
  if (o.grp === 'next') tags.push('<span class="tag t-next">Next day</span>');
  if (o.grp === 'standard') tags.push(o.late ? `<span class="tag t-late">2–3 day · day ${o.age + 1}</span>` : '<span class="tag t-std">2–3 day</span>');
  if (o.grp === 'check') tags.push('<span class="tag t-chk">Check delivery</span>');
  if (o.partial) tags.push('<span class="tag t-part">Part picked</span>');
  if (o.backorder) tags.push(o.stock_in === 'all' ? '<span class="tag t-next">Backorder stock now in</span>' : '<span class="tag t-bo">Backordered</span>');
  if (o.backorder && o.stock_in === 'some') tags.push('<span class="tag t-next">Some stock now in</span>');
  if (o.part_shipped) tags.push('<span class="tag t-part">Part sent already</span>');
  if (COLL) tags.push('<span class="tag t-std">Collection</span>');
  if (o.web) tags.push('<span class="tag t-web">Web</span>');
  const lines = (o.lines || []);
  const shown = lines.slice(0, 6).map(l => `<li><span class="q">${(+l.qty).toLocaleString('en-GB')}×</span><span class="s">${esc(l.sku)}</span><span class="nm">${esc(l.name)}</span></li>`).join('');
  const more = lines.length > 6 ? `<li class="meta">+ ${lines.length - 6} more line${lines.length - 6 === 1 ? '' : 's'}</li>` : '';
  const where = [o.town, o.postcode].filter(Boolean).join(' · ');
  return `<div class="card ${cls}">
    <div class="top"><span class="no">${esc(o.no || '')}</span><span class="meta">${o.section === 4 && o.dispatch_by ? 'goes out ' + new Date(o.dispatch_by + 'T00:00:00').toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'}) : (o.age === 0 ? 'today' : o.age + ' day' + (o.age === 1 ? '' : 's') + ' ago')}</span></div>
    <div class="cust">${esc(o.customer)}</div>
    <div class="tags">${tags.join('')}</div>
    ${o.carrier ? `<div class="carrier">“${esc(o.carrier)}”</div>` : ''}
    ${where ? `<div class="meta">${esc(where)}</div>` : ''}
    ${o.notes ? `<div class="note">${esc(o.notes)}</div>` : ''}
    ${lines.length ? `<ul class="lines">${shown}${more}</ul>` : (o.line_count ? `<div class="meta">${o.line_count} lines</div>` : '')}
    ${o.stock_issue ? `<div class="issue"><b>Can't find stock</b> · flagged ${new Date(o.stock_issue.raised_at).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'})}${(o.stock_issue.items||[]).length ? '<br>' + o.stock_issue.items.map(i => esc(i.sku || i.name)).join(', ') : ''}${o.stock_issue.note ? '<br>“' + esc(o.stock_issue.note) + '”' : ''}</div>` : ''}
    ${o.fulfil_error ? `<div class="issue"><b>Cin7 wouldn't ${esc(o.fulfil_error.step === 'start' ? 'start fulfilment' : o.fulfil_error.step)}</b> · ${new Date(o.fulfil_error.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}<br>“${esc(o.fulfil_error.message)}”<br>Check the order in Cin7, fix it, then try again.</div>` : ''}
    ${o.section !== 5 && (!o.backorder || o.stock_in === 'all') && !o.stock_issue ? `<button class="shipbtn" data-id="${o.id}">${COLL ? '✓ Collected' : '✓ Pick, pack &amp; ship'}</button>` : ''}
    ${canPart(o) ? `<button class="partbtn" data-id="${o.id}">📦 ${COLL ? 'Collect what we have' : (o.part_shipped ? 'Send the next part' : 'Send what we have')}</button>` : ''}
    <div class="btns">
      ${COLL ? `<button class="collbtn" data-id="${o.id}" data-no="${esc(o.no || '')}">🚚 Back to delivery</button>`
        : `<button class="vanbtn" data-id="${o.id}" data-no="${esc(o.no || '')}">🚐 Going on own van</button>
      <button class="collbtn" data-id="${o.id}" data-no="${esc(o.no || '')}">🏪 Collection</button>`}
      ${o.stock_issue ? `<button class="foundbtn" data-id="${o.id}" data-no="${esc(o.no || '')}">✓ Stock found</button>` : `<button class="stockbtn" data-id="${o.id}">⚠ Can't find stock</button>`}
    </div>
  </div>`;
}

// part dispatch: a backordered order with at least one line that isn't fully on backorder
function canPart(o){ return o.section === 5 && o.backorder && !o.stock_issue && (o.lines || []).some(l => (+l.qty || 0) > (+l.bo || 0)); }

function section(title, hint, list, extra=''){
  return `<section class="sec ${extra}"><h2>${title} <span class="n">${list.length}</span> <span class="h">${hint}</span></h2>
    ${list.length ? `<div class="cards">${list.map(card).join('')}</div>` : '<div class="empty">Nothing here.</div>'}</section>`;
}

const SECTION_NAME = {1:'Due out today', 2:'2–3 day', 3:'Check delivery method', 4:'Not due out yet', 5:'Waiting on stock', 6:'Ready to collect'};
let query = '';
const norm = t => String(t ?? '').toLowerCase().replace(/[\s\-]/g, '');
function matches(o, q){
  const qn = norm(q), digits = q.replace(/\D/g, '');
  if (digits.length >= 3 && String(o.no || '').replace(/\D/g, '').replace(/^0+/, '').includes(digits.replace(/^0+/, ''))) return true;
  const hay = [o.no, o.customer, o.postcode, o.town, o.carrier, o.notes, ...(o.lines || []).flatMap(l => [l.sku, l.name])].map(norm).join('|');
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(norm(w)));
}
function renderSearch(all){
  const hits = all.filter(o => matches(o, query));
  return `<section class="sec urgent"><h2>Search: “${esc(query)}” <span class="n">${hits.length}</span> <span class="h">across every section on this screen</span></h2>
    ${hits.length ? `<div class="cards">${hits.map(o => `<div><div class="where">${SECTION_NAME[o.section] || ''}</div>${card(o)}</div>`).join('')}</div>`
      : `<div class="empty">Nothing matches. If it's a real order, it's probably already picked, on the own-van list, a collection, or from more than 60 days ago. Orders appear here within a couple of minutes of being authorised in Cin7.</div>`}</section>`;
}

function wire(){
  document.querySelectorAll('.vanbtn').forEach(b => b.onclick = () => move('van', b.dataset.id, b.dataset.no, true));
  document.querySelectorAll('.collbtn').forEach(b => b.onclick = () => move('collection', b.dataset.id, b.dataset.no, !COLL));
  document.querySelectorAll('.stockbtn').forEach(b => b.onclick = () => openStock(b.dataset.id));
  document.querySelectorAll('.shipbtn').forEach(b => b.onclick = () => openShip(b.dataset.id, false));
  document.querySelectorAll('.partbtn').forEach(b => b.onclick = () => openShip(b.dataset.id, true));
  document.querySelectorAll('.foundbtn').forEach(b => b.onclick = () => openFound(b.dataset.id, b.dataset.no));
}
function renderCollections(all){
  const ready = all.filter(o => o.section !== 5), wait = all.filter(o => o.section === 5);
  const now = new Date();
  document.getElementById('app').innerHTML = `
  <header>
    <div class="l"><img src="${LOGO}" alt="TSD"><div><div class="title">Collections · Bromham</div><div class="sub">Trade counter. Orders the customer is collecting. Hand it over, then tap Collected.</div></div></div>
    <div class="chips">
      <div class="chip"><span class="k">Now</span><span class="v">${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span></div>
      <div class="chip ${ready.length ? 'warn' : ''}"><span class="k">Ready to collect</span><span class="v">${ready.length}</span></div>
      <div class="chip"><span class="k">Waiting on stock</span><span class="v">${wait.length}</span></div>
    </div>
  </header>
  ${query ? renderSearch(all) : `<div class="layout">
    <div>${section('Ready to collect', 'Oldest first', ready, 'urgent')}</div>
    <div class="side">${section('Waiting on stock', 'Backordered or flagged “can’t find stock”', wait)}</div>
  </div>`}
  <footer>Live from Cin7 · last update ${data.last_synced ? new Date(data.last_synced).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '–'} · refreshes every minute. Collected orders drop off straight away.</footer>`;
  wire();
}

function render(){
  if (!data) return;
  const all = data.orders.filter(o => !hidden.has(o.id));
  if (COLL) return renderCollections(all);
  const by = n => all.filter(o => o.section === n);
  const s1 = by(1), s2 = by(2), s3 = by(3), s4 = by(4), s5 = by(5);
  const now = new Date();
  const cut = left(data.cutoff);
  const coll = (data.collections || []).map(c => { const l = left(c.time); return `<div class="chip ${l ? (hm(c.time) - now < 3600e3 ? 'bad' : '') : 'done'}"><span class="k">${esc(c.name)} ${esc(c.time)}</span><span class="v">${l || 'gone'}</span></div>`; }).join('');
  const late = all.filter(o => o.late).length;
  document.getElementById('app').innerHTML = `
  <header>
    <div class="l"><img src="${LOGO}" alt="TSD"><div><div class="title">Pick &amp; Dispatch · Bromham</div><div class="sub">Courier orders to pick, most urgent first. Collections and own-van orders aren't shown (they have their own screens).</div></div></div>
    <div class="chips">
      <div class="chip"><span class="k">Now</span><span class="v">${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span></div>
      <div class="chip ${cut ? 'warn' : 'done'}"><span class="k">Next-day cut-off ${esc(data.cutoff)}</span><span class="v">${cut || 'passed'}</span></div>
      ${coll}
      <div class="chip ${s1.length ? 'warn' : ''}"><span class="k">Due out today</span><span class="v">${s1.length}</span></div>
      ${late ? `<div class="chip bad"><span class="k">Late 2–3 day</span><span class="v">${late}</span></div>` : ''}
      <div class="chip"><span class="k">Picked, awaiting dispatch</span><span class="v">${data.picked_waiting}</span></div>
      <div class="chip"><span class="k">On own van list</span><span class="v">${data.van_count}</span></div>
    </div>
  </header>
  ${query ? renderSearch(all) : `<div class="layout">
    <div>
      ${section('Due out today', 'AM and next-day orders, plus 2–3 day orders on day 3 or later', s1, 'urgent')}
      ${section('2–3 day', 'Oldest first', s2)}
    </div>
    <div class="side">
      ${section('Check delivery method', 'Delivery method in Cin7 doesn’t say which service', s3)}
      ${section('Not due out yet', 'Goes out on the next working day or later (after the cut-off, or a later Ship By date in Cin7)', s4)}
      <details class="sec" ${s5.some(o => o.stock_issue) ? "open" : ""}><summary><h2>Waiting on stock <span class="n">${s5.length}</span> <span class="h">Backordered or flagged \u201ccan\u2019t find stock\u201d · tap to show</span></h2></summary>
        ${s5.length ? `<div class="cards">${s5.map(card).join('')}</div>` : '<div class="empty">Nothing waiting.</div>'}</details>
    </div>
  </div>`}
  <footer>Live from Cin7 · last update ${data.last_synced ? new Date(data.last_synced).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '–'} · refreshes every minute. Orders drop off once picked in Cin7.</footer>`;
  wire();
}

async function post(action, id, on){
  return fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({k:key, action, id, on})});
}
let undoAction = null;
// action 'van' or 'collection'; on=true moves it there, on=false sends it back to delivery
async function move(action, id, no, on){
  hidden.add(id); render();
  const where = action === 'van' ? 'the own van list' : on ? 'Collections' : 'delivery (Pick & Dispatch)';
  try { const r = await post(action, id, on); if (!r.ok) throw 0; undoAction = {action, on: !on}; showToast(`${no} moved to ${where}`, id); }
  catch(e){ hidden.delete(id); render(); showToast(`Couldn't move ${no}. Try again.`, null); }
}
function showToast(msg, id){
  const t = document.getElementById('toast'); document.getElementById('tmsg').textContent = msg;
  document.getElementById('undo').style.display = id ? '' : 'none'; undoId = id;
  t.style.display = 'flex'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 8000);
}
document.getElementById('undo').onclick = async () => {
  const id = undoId; if (!id) return; document.getElementById('toast').style.display = 'none';
  try { await post(undoAction.action, id, undoAction.on); } catch(e){}
  hidden.delete(id); load();
};

function closeModal(){ document.getElementById('modal').style.display = 'none'; }
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
function openStock(id){
  const o = data.orders.find(x => x.id === id); if (!o) return;
  const items = (o.lines || []).map((l, i) => `<label class="it"><input type="checkbox" data-i="${i}"><span><b>${(+l.qty).toLocaleString('en-GB')}×</b> ${esc(l.sku)} · ${esc(l.name)}</span></label>`).join('');
  document.getElementById('mbox').innerHTML = `
    <h3>Can't find stock · ${esc(o.no)}</h3>
    <div class="sub">${esc(o.customer)}. This sends the order to the purchasing list for the office to sort.</div>
    ${items ? `<div class="sub">Which items? (tick all that apply)</div>${items}` : ''}
    <div class="sub">Notes, e.g. checked racking and overflow, only 3 left, stock out of date</div>
    <textarea id="snote" placeholder="What have you checked? What's the problem?"></textarea>
    <div class="err" id="serr"></div>
    <div class="row"><button class="cancel" id="scancel">Cancel</button><button class="ok" id="sok">Confirm: can't find stock</button></div>`;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('scancel').onclick = closeModal;
  document.getElementById('sok').onclick = async () => {
    const picked = [...document.querySelectorAll('#mbox input[type=checkbox]:checked')].map(c => o.lines[+c.dataset.i]);
    const note = document.getElementById('snote').value.trim();
    if (!picked.length && !note) { document.getElementById('serr').textContent = 'Tick the item(s) or add a note so the office knows what to look at.'; return; }
    document.getElementById('sok').disabled = true;
    try {
      const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({k:key, action:'stock', id, items:picked, note})});
      if (!r.ok) throw 0; closeModal(); showToast(`${o.no} flagged to purchasing`, null); load();
    } catch(e){ document.getElementById('serr').textContent = "Couldn't save. Check the connection and try again."; document.getElementById('sok').disabled = false; }
  };
}
function openShip(id, part){
  const o = data.orders.find(x => x.id === id); if (!o) return;
  const lines = o.lines || [];
  const going = lines.filter(l => (+l.qty || 0) > (+l.bo || 0)), staying = lines.filter(l => (+l.bo || 0) > 0);
  const li = (l, q) => `<li><b>${(+q).toLocaleString('en-GB')}×</b> ${esc(l.sku)} · ${esc(l.name)}</li>`;
  const title = COLL ? (part ? 'Collect what we have' : 'Collected') : (part ? 'Send what we have' : 'Pick, pack &amp; ship');
  const partBlock = !part ? '' : `
    <div class="warnbox">⚠ <b>${COLL ? 'This splits the order into two collections.' : 'This order will go in two consignments.'}</b><br>
      ${COLL ? 'The customer will have to come back for the rest.' : 'That costs us a second delivery.'} Only do this if the customer needs it now. <b>Are you sure you want to continue?</b></div>
    <div class="sub" style="color:var(--ink)"><b>Going now</b> (whatever's in stock)</div><ul class="plist">${going.map(l => li(l, l.qty - (+l.bo || 0))).join('')}</ul>
    <div class="sub" style="color:var(--ink)"><b>Staying on backorder</b> (follows later)</div><ul class="plist">${staying.map(l => li(l, l.bo)).join('')}</ul>
    ${o.part_shipped ? '<div class="sub">Some of this has already gone out in an earlier part. Cin7 only sends what hasn’t.</div>' : ''}`;
  const ask = COLL ? (part ? '' : '<div class="sub" style="font-size:16px;color:var(--ink)">Has the customer collected this order?</div>')
    : (part ? '' : '<div class="sub" style="font-size:16px;color:var(--ink)">Are you sure you want to pick, pack and ship this order?</div>');
  document.getElementById('mbox').innerHTML = `
    <h3>${title} · ${esc(o.no)}</h3>
    ${ask}
    <div class="sub">${esc(o.customer)}${o.carrier ? ' · “' + esc(o.carrier) + '”' : ''}<br>${COLL ? 'This picks, packs and ships it in Cin7 so it comes off the list.' : 'This authorises all three steps in Cin7 so it goes to Shiptheory on its next scan.'}</div>
    ${partBlock}
    ${COLL ? '' : `<label class="sub" style="display:flex;align-items:center;gap:12px;color:var(--ink);font-size:16px">Number of boxes / parcels
      <span style="display:flex;align-items:center;gap:6px">
        <button type="button" class="cancel" id="bminus" style="padding:6px 14px;font-size:18px">−</button>
        <input id="boxes" type="number" min="1" max="50" value="1" inputmode="numeric" style="width:70px;text-align:center;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:18px;font-family:inherit">
        <button type="button" class="cancel" id="bplus" style="padding:6px 14px;font-size:18px">+</button>
      </span></label>`}
    <div class="err" id="xerr"></div>
    <div class="row"><button class="cancel" id="xno" style="min-width:110px">${part ? 'No, wait for the rest' : 'No'}</button><button class="ok ${part ? '' : 'green'}" id="xyes" style="min-width:110px">${part ? (COLL ? 'Yes, collect what we have' : 'Yes, send what we have') : 'Yes'}</button></div>`;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('xno').onclick = closeModal;
  const bx = document.getElementById('boxes');
  const clampB = v => Math.max(1, Math.min(50, Math.round(+v || 1)));
  if (bx) {
    document.getElementById('bminus').onclick = () => { bx.value = clampB(+bx.value - 1); };
    document.getElementById('bplus').onclick = () => { bx.value = clampB(+bx.value + 1); };
  }
  document.getElementById('xyes').onclick = async () => {
    const boxes = bx ? clampB(bx.value) : 1; if (bx) bx.value = boxes;
    const yes = document.getElementById('xyes'), no = document.getElementById('xno');
    yes.disabled = true; no.disabled = true; yes.textContent = 'Working in Cin7…';
    let j = {ok:false, error:'No response'};
    try { const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({k:key, action:'fulfil', id, boxes, part: !!part})}); j = await r.json(); } catch(e){}
    if (j.ok) {
      closeModal(); hidden.add(id); render();
      const bxs = `${j.boxes || boxes} box${(j.boxes || boxes) === 1 ? '' : 'es'}`;
      showToast(j.already ? `${o.no} was already fulfilled in Cin7.`
        : COLL ? (part ? `${o.no}: part collected. The rest stays on backorder.` : `${o.no} marked as collected.`)
        : part ? `${o.no}: in-stock items sent (${bxs}). The rest stays on backorder.` : `${o.no} picked, packed and shipped (${bxs}). Queued for Shiptheory.`, null);
      setTimeout(load, 3000); return;
    }
    document.getElementById('xerr').innerHTML = `Cin7 stopped at the <b>${esc(j.step || '?')}</b> step: “${esc(j.error || 'unknown error')}”.<br>Check the order in Cin7.`;
    yes.textContent = 'Try again'; yes.disabled = false; no.disabled = false; no.textContent = 'Close';
    no.onclick = () => { closeModal(); load(); };
  };
}
function openFound(id, no){
  document.getElementById('mbox').innerHTML = `
    <h3>Stock found · ${esc(no)}</h3>
    <div class="sub">This clears the flag and puts the order back in the pick list.</div>
    <textarea id="fnote" placeholder="Optional: where was it?"></textarea>
    <div class="row"><button class="cancel" id="fcancel">Cancel</button><button class="ok green" id="fok">Confirm: stock found</button></div>`;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('fcancel').onclick = closeModal;
  document.getElementById('fok').onclick = async () => {
    try { await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({k:key, action:'stock_found', id, note: document.getElementById('fnote').value})}); } catch(e){}
    closeModal(); load();
  };
}

const qEl = document.getElementById('q'), qClear = document.getElementById('qclear');
let qTimer;
qEl.addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { query = qEl.value.trim(); qClear.style.display = query ? '' : 'none'; render(); window.scrollTo(0, 0); }, 150); });
const clearSearch = () => { qEl.value = ''; query = ''; qClear.style.display = 'none'; render(); };
qClear.onclick = () => { clearSearch(); qEl.focus(); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl && !document.activeElement?.matches('input,textarea')) { e.preventDefault(); qEl.focus(); qEl.select(); }
  if (e.key === 'Escape' && document.activeElement === qEl) { clearSearch(); qEl.blur(); }
});
load(); setInterval(() => { if (document.getElementById('modal').style.display !== 'flex') load(); }, 60000); setInterval(render, 30000);
setTimeout(() => location.reload(), 6 * 3600e3);
</script>
<script>
// Self-update: every 2 minutes, check GitHub for a newer copy of this page. If there is one, reload into it
// (waits if someone has a pop-up open or is typing). So nobody ever needs a new link or a forced refresh.
(function(){
  const BUILD = '20261028104446';
  const busy = () => { const m = document.getElementById('modal'); const a = document.activeElement;
    return (m && getComputedStyle(m).display !== 'none') || (a && a.matches && a.matches('input,textarea,select')); };
  let newer = false;
  async function check(){
    try {
      if (!newer) {
        const t = await (await fetch(location.href, {cache:'reload'})).text();   // also refreshes the browser's saved copy
        const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD);
      }
      if (newer && !busy()) location.reload();
    } catch(e){}
  }
  setInterval(check, 120000);
})();
</script>

html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
.wrap{padding:16px 20px 28px;max-width:1500px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
header .l{display:flex;align-items:center;gap:16px}
header img{height:44px}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border-radius:12px;padding:16px 18px}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--num);font-size:72px;line-height:1;margin-top:6px}
.mid{font-family:var(--num);font-size:48px;line-height:1;margin-top:6px}
.line{font-size:15px;color:var(--muted);margin-top:6px}
.line b{color:var(--ink)}
.good{color:var(--good)} .bad{color:var(--bad)}
.bar{position:relative;height:18px;background:var(--panel2);border-radius:999px;margin-top:14px;overflow:visible}
.bar .fill{height:100%;background:var(--accent);border-radius:999px}
.bar .pace{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink);border-radius:2px}
.bar .pacel{position:absolute;top:24px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
svg text{font-family:var(--body);fill:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
@media (max-width:600px){.big{font-size:52px}.big span{font-size:24px!important}.title{font-size:28px}header img{height:34px}.wrap{padding:12px 12px 24px}}
#msg{padding:40px;text-align:center;color:var(--muted);font-size:18px}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
</style>

const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
let token = store.get('tsd_me_token'), D = null, C = null, timer;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gbp = v => v == null ? '–' : '£' + Math.round(Number(v)).toLocaleString('en-GB');
const gbpk = v => '£' + (Math.abs(v) >= 1000 ? (v/1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : Math.round(v));
const mon = s => new Date(s + 'T12:00:00').toLocaleDateString('en-GB',{month:'short'});

function showLogin(msg){ clearInterval(timer); document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = msg || ''; }
function start(){
  document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block';
  refresh(); clearInterval(timer); timer = setInterval(refresh, 120000);
}
async function refresh(){
  try {
    const r = await fetch(API, {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
    if (r.status === 401) { token = null; store.del('tsd_me_token'); return showLogin('Please log in again.'); }
    const j = await r.json(); if (j.error) throw new Error(j.error);
    D = j.data; C = j.customers || null; render();
  } catch(x){ if (!D) document.getElementById('app').innerHTML = `<div id="msg">${esc(x.message)}<br><span class="sub">Retrying shortly.</span></div>`; }
}

function render(){
  const d = D, t = d.target, mtd = Number(d.mtd_sales) || 0;
  const pct = t ? mtd / t : null, pace = d.pace_target != null ? Number(d.pace_target) : null;
  const remainingDays = Math.max(0, d.wd_total - d.wd_elapsed) + 1;   // today still counts until it's over
  const needPerDay = t ? Math.max(0, t - mtd) / Math.max(1, remainingDays) : null;
  const ahead = pace != null ? mtd - pace : null;
  const lw = Number(d.lastweek_sales) || 0, today = Number(d.today_sales) || 0;
  const monthName = new Date(d.month + 'T12:00:00').toLocaleDateString('en-GB',{month:'long'});
  document.getElementById('app').innerHTML = `
  <header>
    <div class="l"><img src="${LOGO}" alt="TSD"><div><div class="title">Wootton Bassett · Sales</div><div class="sub">${esc(monthName)} so far · ex VAT, after credit notes · updated ${new Date(d.generated_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div></div></div>
  </header>
  <div class="grid">
    <div class="card">
      <div class="k">Month to date${t ? ' vs target' : ''}</div>
      <div class="big">${gbp(mtd)}${t ? `<span style="font-size:32px;color:var(--muted)"> / ${gbp(t)}</span>` : ''}</div>
      ${t ? `<div class="bar"><div class="fill" style="width:${Math.min(100, pct*100).toFixed(1)}%"></div>
          ${pace != null ? `<div class="pace" style="left:${Math.min(100, pace/t*100).toFixed(1)}%"></div><div class="pacel" style="left:${Math.min(100, pace/t*100).toFixed(1)}%;transform:translateX(${pace/t < .2 ? '-6px' : pace/t > .8 ? 'calc(-100% + 6px)' : '-50%'})">where we should be today</div>` : ''}</div>
        <div class="line" style="margin-top:30px"><b>${Math.round(pct*100)}%</b> of target ·
          ${ahead >= 0 ? `<b class="good">${gbp(ahead)} ahead</b> of pace` : `<b class="bad">${gbp(-ahead)} behind</b> pace`} ·
          need <b>${gbp(needPerDay)}</b> a day for the rest of the month</div>`
        : `<div class="line">No target set for ${esc(monthName)} yet.</div>`}
    </div>
    <div class="card">
      <div class="k">Today</div>
      <div class="mid">${gbp(today)}</div>
      <div class="line"><b>${d.today_orders}</b> order${d.today_orders === 1 ? '' : 's'}${d.daily_target ? ` · daily target <b>${gbp(d.daily_target)}</b>` : ''}</div>
      <div class="line">Same day last week <b>${gbp(lw)}</b> ${lw ? (today >= lw ? '<span class="good">▲</span>' : '<span class="bad">▼</span>') : ''}</div>
    </div>
    <div class="card">
      <div class="k">Last month vs month before</div>
      ${momCard(d.months)}
    </div>
  </div>
  <div class="charts">
    <div class="card"><div class="k">Each day this month</div>${dayChart(d)}
      <div class="legend"><span><i style="background:var(--accent)"></i>Sales</span>${d.daily_target ? '<span><i style="background:var(--ink);height:3px;vertical-align:3px"></i>Daily target</span>' : ''}</div></div>
    <div class="card"><div class="k">Month on month since opening</div>${monthChart(d.months)}
      <div class="legend"><span><i style="background:var(--accent)"></i>Full month</span><span><i style="background:var(--line)"></i>This month so far</span><span><i style="background:var(--ink);height:3px;vertical-align:3px"></i>Target</span></div></div>
  </div>
  ${trendCard(d)}
  ${custCard(C)}`;
}

function momCard(ms){
  const full = (ms || []).filter(m => !m.partial);
  if (full.length < 2) return `<div class="line">Needs two full months.</div>`;
  const a = full.at(-1), b = full.at(-2), ch = (a.sales - b.sales) / (b.sales || 1);
  return `<div class="mid ${ch >= 0 ? 'good' : 'bad'}">${ch >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(ch*100))}%</div>
    <div class="line">${mon(a.m)} <b>${gbp(a.sales)}</b> vs ${mon(b.m)} <b>${gbp(b.sales)}</b></div>`;
}

// Who is buying at WB (3 Nov): existing customers (Cin7 history at Bromham + Sage back to 2019) or new ones
const BK = {existing_active:['Existing customers','#8EC5FF'], existing_lapsed:['Came back after a gap','#B79CFF'], new_repeat:['New, buying again','#7DDB98'], new_once:['New, one visit so far','#EED107'], anon:['Cash sales (no name)','#6B6E6E']};
function custCard(c){
  if (!c || !c.buckets) return '';
  const B = {}; c.buckets.forEach(b => B[b.bucket] = b);
  const named = ['existing_active','existing_lapsed','new_repeat','new_once'], nsum = named.reduce((a,k) => a + (B[k] ? Number(B[k].spend) : 0), 0);
  const anon = B.anon ? Number(B.anon.spend) : 0, all = nsum + anon || 1;
  const ex = (B.existing_active ? Number(B.existing_active.spend) : 0) + (B.existing_lapsed ? Number(B.existing_lapsed.spend) : 0);
  const nw = nsum - ex, exN = (B.existing_active ? B.existing_active.customers : 0) + (B.existing_lapsed ? B.existing_lapsed.customers : 0);
  const nwN = (B.new_repeat ? B.new_repeat.customers : 0) + (B.new_once ? B.new_once.customers : 0);
  const seg = ['existing_active','existing_lapsed','new_repeat','new_once','anon'].filter(k => B[k] && Number(B[k].spend) > 0)
    .map(k => `<div style="width:${(Number(B[k].spend)/all*100).toFixed(2)}%;background:${BK[k][1]};height:100%" title="${BK[k][0]}: ${gbp(B[k].spend)}"></div>`).join('');
  const rows = ['existing_active','existing_lapsed','new_repeat','new_once','anon'].filter(k => B[k]).map(k =>
    `<tr><td><i style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${BK[k][1]};margin-right:7px"></i>${BK[k][0]}</td><td class="r">${B[k].customers == null ? '–' : B[k].customers}</td><td class="r">${B[k].orders}</td><td class="r"><b>${gbp(B[k].spend)}</b></td><td class="r">${Math.round(Number(B[k].spend)/all*100)}%</td></tr>`).join('');
  const es = c.existing_shift, months = es && es.months ? Number(es.months) : 0;
  let shift = '';
  if (es && months >= 1 && es.pre90_per_month > 0) {
    const brom = Number(es.brom_since) / months, wb = Number(es.wb_since) / months, tot = brom + wb, was = Number(es.pre90_per_month), ch = (tot - was) / was;
    shift = `<div class="line" style="margin-top:12px"><b>Are Bromham customers just moving over?</b> The ${es.customers} existing customers we can track spent about <b>${gbp(was)}</b> a month with us before WB opened (Sage). Since then they spend about <b>${gbp(brom)}</b> a month at Bromham plus <b>${gbp(wb)}</b> at WB:
      <b class="${ch >= 0 ? 'good' : 'bad'}">${gbp(tot)} a month, ${ch >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(ch*100))}%</b>.
      ${Number(es.wb_since) > 0 ? `So about <b>${Math.round(wb/tot*100)}%</b> of what they spend now goes through WB.` : ''}</div>`;
  }
  const mons = (c.monthly || []).filter(m => Number(m.total) > 0);
  const mmax = Math.max(1, ...mons.map(m => Number(m.total) || 0));
  const mbars = mons.map(m => { const e = Number(m.existing)||0, n = Number(m.new)||0, a = Number(m.anon)||0, h = v => (v/mmax*100).toFixed(1);
    return `<div style="flex:1;text-align:center"><div style="height:110px;display:flex;flex-direction:column-reverse;align-items:center"><div style="width:62%;display:flex;flex-direction:column-reverse;height:100%;justify-content:flex-start">
      <div style="height:${h(e)}%;background:#8EC5FF" title="Existing ${gbp(e)}"></div><div style="height:${h(n)}%;background:#7DDB98" title="New ${gbp(n)}"></div><div style="height:${h(a)}%;background:#6B6E6E" title="Cash sales ${gbp(a)}"></div></div></div>
      <div class="sub" style="margin-top:4px">${mon(m.m + '-01')}${m.m === mons.at(-1).m ? '*' : ''}</div><div class="sub"><span style="color:#8EC5FF">${gbpk(e)}</span> · <span style="color:#7DDB98">${gbpk(n)}</span></div></div>`; }).join('');
  const top = (c.top || []).slice(0, 10).map(t => `<tr><td>${esc(t.name).slice(0, 38)}</td><td><span style="color:${(BK[t.bucket]||['','#fff'])[1]}">${(BK[t.bucket]||[''])[0]}</span></td><td class="r">${t.orders}</td><td class="r"><b>${gbp(t.wb)}</b></td></tr>`).join('');
  return `<style>.ct{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.ct td,.ct th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}.ct th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}.ct .r{text-align:right}</style>
  <div class="card" style="margin-top:12px">
    <div class="k">Who is buying at Wootton Bassett?</div>
    <div class="line" style="margin-top:8px">Of the <b>${gbp(nsum)}</b> spent by customers we can name, <b>${Math.round(ex/(nsum||1)*100)}%</b> (${exN} customers) were already customers of ours and <b>${Math.round(nw/(nsum||1)*100)}%</b> (${nwN} customers) are new to us.
      Another <b>${gbp(anon)}</b> (${Math.round(anon/all*100)}% of everything at WB) is cash sales with no name on them, so we can't say who they are.</div>
    <div style="display:flex;height:22px;border-radius:999px;overflow:hidden;margin-top:12px;background:var(--panel2)">${seg}</div>
    <div class="charts" style="margin-top:12px">
      <div><table class="ct"><tr><th>Customers</th><th class="r">People</th><th class="r">Orders</th><th class="r">Sales</th><th class="r">Share</th></tr>${rows}</table>
        ${shift}</div>
      <div><div class="k" style="margin-top:4px">By month</div><div style="display:flex;gap:6px;margin-top:8px;align-items:flex-end">${mbars}</div>
        <div class="legend"><span><i style="background:#8EC5FF"></i>Existing</span><span><i style="background:#7DDB98"></i>New</span><span><i style="background:#6B6E6E"></i>Cash sales (no name)</span><span>* month so far</span></div></div>
    </div>
    <div class="k" style="margin-top:14px">Biggest named customers at WB</div>
    <table class="ct"><tr><th>Customer</th><th></th><th class="r">Orders</th><th class="r">WB sales</th></tr>${top}</table>
    <div class="sub" style="margin-top:10px">"Existing" means we found them in Cin7 at Bromham before WB opened (10 Aug), or in our Sage ledger (customers back to 2019) with an invoice in the last 12 months. "Came back after a gap" is in Sage but hasn't bought for over a year. Matched on email, then phone, then name, so a customer using a different email and phone at WB would show as new.</div>
  </div>`;
}

// simple bar charts in SVG (no libraries)
function axis(max, W, H, P){
  const step = niceStep(max / 4), lines = [];
  for (let v = 0; v <= max + 1e-9; v += step) { const y = H - P.b - (v / max) * (H - P.t - P.b);
    lines.push(`<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="#474949" stroke-width="1"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end">${gbpk(v)}</text>`); }
  return lines.join('');
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, x)))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function dayChart(d){
  const days = d.days || [], W = 640, H = 240, P = {l:46, r:8, t:10, b:26};
  const dt = Number(d.daily_target) || 0;
  const max0 = Math.max(dt, ...days.map(x => Number(x.sales) || 0), 100); const step = niceStep(max0 / 4), max = Math.ceil(max0 / step) * step;
  const bw = (W - P.l - P.r) / Math.max(1, days.length), y = v => H - P.b - (v / max) * (H - P.t - P.b);
  const bars = days.map((x, i) => { const v = Number(x.sales) || 0, X = P.l + i * bw + bw * .15, w = bw * .7;
    const lbl = new Date(x.d + 'T12:00:00').getDate();
    return (x.sales != null ? `<rect x="${X}" y="${y(v)}" width="${w}" height="${Math.max(0, H - P.b - y(v))}" rx="2" fill="${dt && v >= dt ? '#7DDB98' : '#EED107'}"><title>${x.d}: ${gbp(v)}</title></rect>` : '')
      + `<text x="${X + w/2}" y="${H - 8}" text-anchor="middle" ${x.d === d.today ? 'style="fill:#fff;font-weight:700"' : ''}>${lbl}</text>`; }).join('');
  const tl = dt ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(dt)}" y2="${y(dt)}" stroke="#fff" stroke-width="2" stroke-dasharray="6 4"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily sales this month">${axis(max, W, H, P)}${bars}${tl}</svg>`;
}
// 5 Nov (Denver): every trading day since opening as a line, a 10-day average, and a projection to the end of next month.
// Projection = straight-line trend through all completed weekdays since opening (least squares). Band = how far the 10-day
// average has typically strayed from that trend. Weekends aren't projected (the odd Saturday sale is in the history only).
function trendFit(d){
  const DAY = 864e5, t0 = new Date(d.opened + 'T12:00:00').getTime(), x = s => (new Date(s + 'T12:00:00').getTime() - t0) / DAY;
  const hist = (d.history || []).map(h => ({ d: h.d, v: Number(h.sales) || 0, x: x(h.d), wd: new Date(h.d + 'T12:00:00').getDay() % 6 !== 0 }));
  const fitPts = hist.filter(h => h.wd && h.d !== d.today);
  if (fitPts.length < 15) return null;
  const n = fitPts.length, sx = fitPts.reduce((a, p) => a + p.x, 0), sy = fitPts.reduce((a, p) => a + p.v, 0);
  const sxy = fitPts.reduce((a, p) => a + p.x * p.v, 0), sxx = fitPts.reduce((a, p) => a + p.x * p.x, 0);
  const b = (n * sxy - sx * sy) / (n * sxx - sx * sx), a = (sy - b * sx) / n, at = X => Math.max(0, a + b * X);
  // 10-trading-day rolling average (weekdays only, today left out while it's still going)
  const roll = fitPts.map((p, i) => { const w = fitPts.slice(Math.max(0, i - 9), i + 1); return { x: p.x, d: p.d, v: w.reduce((s, q) => s + q.v, 0) / w.length, full: w.length === 10 }; });
  const res = roll.filter(r => r.full).map(r => r.v - at(r.x));
  const sd = res.length ? Math.sqrt(res.reduce((s, r) => s + r * r, 0) / res.length) : 0;
  const fut = (d.future_days || []).map(s => ({ d: s, x: x(s), v: at(x(s)) }));
  const thisM = d.month.slice(0, 7);
  const projThis = (Number(d.mtd_sales) || 0) + fut.filter(f => f.d.startsWith(thisM)).reduce((s, f) => s + f.v, 0);
  const nextM = fut.filter(f => !f.d.startsWith(thisM)), projNext = nextM.reduce((s, f) => s + f.v, 0);
  return { hist, roll, fut, a, b, at, sd, projThis, projNext, nextName: nextM.length ? new Date(nextM[0].d + 'T12:00:00').toLocaleDateString('en-GB', {month: 'long'}) : '' };
}
function trendCard(d){
  if (!d.history || !d.opened) return '';
  const f = trendFit(d);
  if (!f) return `<div class="card" style="margin-top:12px"><div class="k">Every day since opening</div><div class="line">Needs a few more weeks of trading to draw a trend.</div></div>`;
  const W = window.innerWidth < 700 ? 640 : 1300, H = window.innerWidth < 700 ? 340 : 300, P = {l:52, r:14, t:14, b:30};
  const xMax = f.fut.length ? f.fut[f.fut.length - 1].x : f.hist[f.hist.length - 1].x;
  // cap the scale so one huge day doesn't flatten everything; days above it are drawn at the top with their value
  const vals = f.hist.map(h => h.v).sort((p, q) => p - q), p95 = vals[Math.floor(vals.length * .95)] || 100;
  const max0 = Math.max(p95 * 1.15, ...f.fut.map(q => q.v + f.sd), 100), step = niceStep(max0 / 4), max = Math.ceil(max0 / step) * step;
  const X = v => P.l + (v / Math.max(1, xMax)) * (W - P.l - P.r), Y = v => H - P.b - (Math.min(v, max) / max) * (H - P.t - P.b);
  const path = pts => pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const lastX = f.roll.length ? f.roll[f.roll.length - 1].x : 0;
  // month gridlines + labels
  const t0 = new Date(d.opened + 'T12:00:00'), DAY = 864e5; let months = '';
  for (let m = new Date(t0.getFullYear(), t0.getMonth() + 1, 1, 12); (m - t0) / DAY <= xMax; m = new Date(m.getFullYear(), m.getMonth() + 1, 1, 12)) {
    const xx = X((m - t0) / DAY);
    months += `<line x1="${xx}" x2="${xx}" y1="${P.t}" y2="${H - P.b}" stroke="#474949" stroke-dasharray="2 4"/><text x="${xx + 4}" y="${H - 10}">${m.toLocaleDateString('en-GB',{month:'short'})}</text>`;
  }
  months += `<text x="${P.l + 2}" y="${H - 10}">Opened ${t0.getDate()} ${t0.toLocaleDateString('en-GB',{month:'short'})}</text>`;
  const daily = f.hist.filter(h => h.d !== d.today);
  const dots = daily.map(h => `<circle cx="${X(h.x).toFixed(1)}" cy="${Y(h.v).toFixed(1)}" r="${h.v > max ? 4 : 2.5}" fill="${h.v > max ? '#fff' : '#8EC5FF'}"><title>${new Date(h.d + 'T12:00:00').toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'})}: ${gbp(h.v)}</title></circle>`
    + (h.v > max ? `<text x="${X(h.x) + 6}" y="${Y(h.v) + 4}" style="fill:#fff">${gbpk(h.v)}</text>` : '')).join('');
  const tod = f.hist.find(h => h.d === d.today);
  const todDot = tod ? `<circle cx="${X(tod.x)}" cy="${Y(tod.v)}" r="4" fill="none" stroke="#fff" stroke-width="1.5"><title>Today so far: ${gbp(tod.v)}</title></circle>` : '';
  const band = f.fut.length && f.sd ? `<path d="${path([{x:lastX, v:f.at(lastX) + f.sd}, ...f.fut.map(q => ({x:q.x, v:q.v + f.sd}))])}L${[...f.fut].reverse().map(q => `${X(q.x).toFixed(1)},${Y(Math.max(0, q.v - f.sd)).toFixed(1)}`).join('L')}L${X(lastX).toFixed(1)},${Y(Math.max(0, f.at(lastX) - f.sd)).toFixed(1)}Z" fill="#EED107" opacity=".12"/>` : '';
  const trendPast = `<path d="${path([{x:0, v:f.at(0)}, {x:lastX, v:f.at(lastX)}])}" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 5" fill="none" opacity=".5"/>`;
  const proj = f.fut.length ? `<path d="${path([{x:lastX, v:f.at(lastX)}, ...f.fut])}" stroke="#fff" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/>` : '';
  const todayLine = `<line x1="${X(lastX)}" x2="${X(lastX)}" y1="${P.t}" y2="${H - P.b}" stroke="#B9BCBC" stroke-width="1"/><text x="${X(lastX) + 4}" y="${P.t + 10}" style="fill:#fff">Projection →</text>`;
  const avgLine = `<path d="${path(f.roll)}" stroke="#EED107" stroke-width="3" fill="none" stroke-linejoin="round"/>`;
  const perDay = f.at(lastX), wk = f.b * 7;
  const dir = Math.abs(wk) < 15 ? 'roughly flat so far' : (wk > 0 ? `rising about <b class="good">${gbp(wk)}</b> a day every week` : `falling about <b class="bad">${gbp(-wk)}</b> a day every week`);
  const nowName = new Date(d.month + 'T12:00:00').toLocaleDateString('en-GB',{month:'long'});
  return `<div class="card" style="margin-top:12px"><div class="k">Every trading day since opening, and where it's heading</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily sales since opening with projection">${axis(max, W, H, P)}${months}${band}${trendPast}${dots}${avgLine}${todDot}${todayLine}${proj}</svg>
    <div class="legend"><span><i style="background:#8EC5FF;border-radius:50%"></i>Each day</span><span><i style="background:var(--accent);height:3px;vertical-align:3px"></i>10-day average</span><span><i style="background:var(--ink);height:3px;vertical-align:3px"></i>Trend and projection</span><span><i style="background:var(--accent);opacity:.3"></i>Likely range</span></div>
    <div class="line" style="margin-top:10px">Trend is about <b>${gbp(perDay)}</b> a trading day, ${dir}. On that trend ${esc(nowName)} lands around <b>${gbp(f.projThis)}</b>${f.nextName ? ` and ${esc(f.nextName)} around <b>${gbp(f.projNext)}</b>` : ''}${d.target ? ` (target ${gbp(d.target)})` : ''}.</div>
    <div class="sub" style="margin-top:6px">The projection is a straight line through every weekday since opening, not a promise: it doesn't know about Christmas shutdowns, big one-off orders or seasonal slowdowns. Bank holidays are already left out. Days over ${gbpk(max)} are drawn at the top with their value.</div>
  </div>`;
}
function monthChart(ms){
  ms = ms || []; const W = 640, H = 240, P = {l:46, r:8, t:22, b:26};
  const max0 = Math.max(...ms.map(m => Math.max(Number(m.sales) || 0, Number(m.target) || 0)), 100); const step = niceStep(max0 / 4), max = Math.ceil(max0 / step) * step;
  const bw = (W - P.l - P.r) / Math.max(1, ms.length), y = v => H - P.b - (v / max) * (H - P.t - P.b);
  const bars = ms.map((m, i) => { const v = Number(m.sales) || 0, X = P.l + i * bw + bw * .2, w = bw * .6;
    const prev = i ? Number(ms[i-1].sales) : null, ch = prev && !m.partial ? (v - prev) / prev : null;
    return `<rect x="${X}" y="${y(v)}" width="${w}" height="${Math.max(0, H - P.b - y(v))}" rx="3" fill="${m.partial ? '#474949' : '#EED107'}"><title>${mon(m.m)}: ${gbp(v)}</title></rect>
      <text x="${X + w/2}" y="${y(v) - 6}" text-anchor="middle" style="fill:#fff;font-weight:700">${gbpk(v)}${ch != null ? ` <tspan style="fill:${ch >= 0 ? '#7DDB98' : '#FF7A6B'}">${ch >= 0 ? '+' : ''}${Math.round(ch*100)}%</tspan>` : ''}</text>
      ${m.target ? `<line x1="${X - 4}" x2="${X + w + 4}" y1="${y(m.target)}" y2="${y(m.target)}" stroke="#fff" stroke-width="3"/>` : ''}
      <text x="${X + w/2}" y="${H - 8}" text-anchor="middle">${mon(m.m)}${m.partial ? ' (so far)' : m.opened ? ' (from ' + new Date(m.opened + 'T12:00:00').getDate() + 'th)' : ''}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales month on month">${axis(max, W, H, P)}${bars}</svg>`;
}

button,input,select,textarea{font-family:inherit;font-size:16px}
.wrap{padding:14px 14px 50px;max-width:760px;margin:0 auto}
.title{font-family:var(--num);font-size:36px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
.back{color:var(--blue);text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin-bottom:8px}
.card{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px}
.k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.k:first-child{margin-top:0}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{background:var(--accent);color:#262727;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}
.btn.full{width:100%;margin-top:12px}
.btn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.hit{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.hit b{font-family:var(--num);font-size:22px;letter-spacing:1px;font-weight:400}
.hit small{display:block;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{color:var(--muted);font-size:13px}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-weight:600}
.msg.ok{background:rgba(125,219,152,.15);color:var(--good)} .msg.bad{background:rgba(255,122,107,.15);color:var(--bad)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.t-q{background:rgba(142,197,255,.18);color:var(--blue)} .t-ok{background:rgba(125,219,152,.18);color:var(--good)} .t-bad{background:rgba(255,122,107,.18);color:var(--bad)} .t-w{background:rgba(238,209,7,.2);color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:86px;height:86px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.thumb i{position:absolute;left:3px;bottom:3px;background:var(--accent);color:#262727;font-style:normal;font-size:10px;font-weight:800;padding:0 5px;border-radius:4px}
.file{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px}
.file span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{padding:10px 0;border-bottom:1px solid var(--line)} .tr:last-child{border-bottom:0}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:16px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login"><div id="lerr"></div></div>
<div class="wrap" id="app" style="display:none"><div class="m">Loading…</div></div>
<script src="auth.js?v=20261104115233"></script>
<script src="activity.js?v=20261104115233"></script>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/webprod';
const WEB_API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/web';   // same data as the Products to add tab
let W = null, showAll = false;
const mem = {};
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }, del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } } };
let token = store.get('tsd_me_token'), D = null, pick = null, hits = [], msg = null, busy = false, qseq = 0, timer, poll;
let imgs = [], sheets = [];            // File objects chosen but not yet uploaded: imgs = [{file, url}], sheets = [{file}]
let form = {price:'', weight:'', ship:'', info:'', notes:''};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gbp = v => v == null ? '–' : '£' + (+v).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
function showLogin(m){ document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; const e = document.getElementById('lerr'); if (e) e.textContent = m || ''; }
async function api(body, q){
  const r = await fetch(API + (q ? '?q=' + encodeURIComponent(q) : ''), body ? {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token}, body: JSON.stringify(body)} : {headers:{Authorization:'Bearer ' + token}, cache:'no-store'});
  if (r.status === 401) { token = null; store.del('tsd_me_token'); showLogin('Please log in again.'); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (body && !j.ok) throw new Error(j.error || "Couldn't do that");
  if (j.error) throw new Error(j.error);
  return j;
}
async function loadRec(){ try { const r = await fetch(WEB_API, {headers:{Authorization:'Bearer ' + token}, cache:'no-store'}); if (r.ok) { W = (await r.json()).data; render(); } } catch(e){} }
async function pickSku(sku){ try { const j = await api(null, sku); const p = (j.results || []).find(x => x.sku === sku); if (!p) return alert('Not found in Cin7'); if (p.on_site || p.requested) return alert('That one is already on the website or requested'); pick = p; msg = null; render(); window.scrollTo(0,0); } catch(e){ if (e.message !== 'login') alert(e.message); } }
function recHtml(){
  if (!W) return '';
  const taken = new Set((D.drafts || []).filter(d => d.status !== 'failed').map(d => d.sku));
  const todo = (W.todo || []).filter(t => t.sku && !t.on_site && t.status !== 'live' && !taken.has(t.sku));
  const sug = (W.suggestions || []).filter(x => !taken.has(x.sku));
  const list = showAll ? sug : sug.slice(0, 12);
  const row = (sku, name, extra) => `<button class="hit" onclick="pickSku('${esc(sku).replace(/'/g, '')}')"><b>${esc(sku)}</b><small>${esc(name)}</small><small>${extra}</small></button>`;
  return (todo.length ? `<div class="card"><div class="k">On your “to add” list</div>${todo.map(t => row(t.sku, t.name, esc(t.reason || '') + (t.avail != null ? ' · ' + t.avail + ' in stock' : ''))).join('')}</div>` : '')
    + (sug.length ? `<div class="card"><div class="k">Recommended: selling in Cin7, not on the website</div><div class="m" style="margin-bottom:4px">Ranked by sales in the last 12 weeks. Tap one to start.</div>${list.map(x => row(x.sku, x.name, `${gbp(x.rev12w)} sold · ${x.orders12w} order${x.orders12w === 1 ? '' : 's'} · ${x.avail != null ? x.avail + ' in stock' : ''}${x.supplier_name ? ' · ' + esc(x.supplier_name) : ''}`)).join('')}${sug.length > 12 ? `<button class="btn sm alt" style="margin-top:8px" onclick="showAll=!showAll;render()">${showAll ? 'Show fewer' : 'Show all ' + sug.length}</button>` : ''}</div>` : '');
}
async function refresh(){
  try { D = await api(); render(); schedulePoll(); if (!W) loadRec(); }
  catch(x){ if (x.message !== 'login') document.getElementById('app').innerHTML = `<div class="msg bad">${esc(x.message)}</div>`; }
}
function schedulePoll(){ clearTimeout(poll); if ((D.drafts || []).some(d => d.status === 'queued' || d.status === 'working')) poll = setTimeout(async () => { if (!busy) { try { D = await api(); paintList(); } catch(e){} } schedulePoll(); }, 20000); }

function search(v){ clearTimeout(timer); timer = setTimeout(async () => { const my = ++qseq; if (v.trim().length < 2) { hits = []; return paintHits(); }
  try { const j = await api(null, v.trim()); if (my === qseq) { hits = j.results; paintHits(); } } catch(e){} }, 250); }
function hitHtml(p, i){
  const note = p.on_site ? `<small style="color:var(--bad)">Already on the website (${esc(p.on_site.status)})</small>` : p.requested ? `<small style="color:var(--accent)">Already requested (${esc(p.requested)})</small>` : '';
  return `<button class="hit" ${p.on_site || p.requested ? 'disabled style="opacity:.6;cursor:default"' : `onclick="choose(${i})"`}><b>${esc(p.sku)}</b><small>${esc(p.name)}</small><small>${esc(p.brand || '')}${p.supplier_name ? ' · ' + esc(p.supplier_name) : ''}</small>${note}</button>`;
}
function paintHits(){ const h = document.getElementById('hits'); if (h) h.innerHTML = hits.map(hitHtml).join('') || '<div class="m" style="margin-top:8px">Nothing found</div>'; }
function choose(i){ pick = hits[i]; msg = null; render(); }
function cost(){ return pick ? (+pick.average_cost || +pick.supplier_cost || 0) : 0; }
function marginTxt(){ const p = parseFloat(form.price), c = cost(); if (!(p > 0)) return ''; if (!(c > 0)) return 'No cost in Cin7 to work margin from.'; const m = (p - c) / p * 100; return `Cost ${gbp(c)} → margin ${m.toFixed(1)}%`; }

async function addImages(list){
  for (const f of list) {
    if (!f.type.startsWith('image/')) continue;
    const blob = await shrink(f);
    imgs.push({file: blob, name: f.name.replace(/\.[^.]+$/, '') + '.jpg', url: URL.createObjectURL(blob)});
  }
  render();
}
function shrink(f){ // downscale big phone photos to max 2000px, JPEG
  return new Promise(res => { const im = new Image(); im.onload = () => { const s = Math.min(1, 2000 / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); c.toBlob(b => res(b || f), 'image/jpeg', .9); URL.revokeObjectURL(im.src); };
    im.onerror = () => res(f); im.src = URL.createObjectURL(f); });
}
function addSheets(list){ for (const f of list) if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') sheets.push({file: f, name: f.name}); render(); }
function rmImg(i){ imgs.splice(i, 1); render(); }
function rmSheet(i){ sheets.splice(i, 1); render(); }
function keep(){ for (const [id, k] of [['f_price','price'],['f_weight','weight'],['f_ship','ship'],['f_info','info'],['f_notes','notes']]) { const e = document.getElementById(id); if (e) form[k] = e.value; } }

async function upload(files){ // files: [{file,name}] -> [{url,path,name}]
  if (!files.length) return [];
  const s = await api({action:'sign', files: files.map(f => ({name: f.name}))});
  const out = [];
  for (let i = 0; i < files.length; i++) {
    const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', files[i].file);
    const r = await fetch(s.files[i].signed_url, {method:'PUT', body: fd});
    if (!r.ok) throw new Error('Upload failed for ' + files[i].name);
    out.push({url: s.files[i].url, path: s.files[i].path, name: files[i].name});
  }
  return out;
}
async function submit(){
  keep();
  if (!pick) return alert('Pick the Cin7 product first');
  if (!(parseFloat(form.price) > 0)) return alert('Enter the web price (ex VAT)');
  if (!imgs.length) return alert('Add at least one photo');
  busy = true; msg = {ok:true, t:'Uploading… keep this page open.'}; render();
  try {
    const im = await upload(imgs.map(i => ({file: i.file, name: i.name})));
    const ds = await upload(sheets);
    await api({action:'submit', product_id: pick.product_id, price: form.price, weight_kg: form.weight, shipping_class: form.ship, supplier_info: form.info, notes: form.notes, images: im, datasheets: ds});
    msg = {ok:true, t:`${pick.sku} is in the queue. Claude writes the listing and creates a DRAFT on the website (usually within 10 minutes). Nothing goes live until you publish it.`};
    pick = null; hits = []; imgs = []; sheets = []; form = {price:'', weight:'', ship:'', info:'', notes:''};
  } catch(x){ if (x.message === 'login') return; msg = {ok:false, t:x.message}; }
  busy = false; await refresh();
}
async function retry(id){ try { await api({action:'retry', id}); await refresh(); } catch(x){ alert(x.message); } }

function chip(d){
  if (d.status === 'queued') return '<span class="tag t-q">Waiting for Claude</span>';
  if (d.status === 'working') return '<span class="tag t-w">Claude is writing it</span>';
  if (d.status === 'draft_created') return '<span class="tag t-ok">Draft on website</span>';
  return '<span class="tag t-bad">Failed</span>';
}
function listHtml(){
  const L = D.drafts || [];
  return L.length ? L.map(d => `<div class="tr"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b>${esc(d.sku)}</b> <span class="m">${esc(d.name)}</span></div>${chip(d)}</div>
    <div class="m">${new Date(d.created_at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${esc(d.created_by_name || '')} · ${(d.images || []).length} photo${(d.images || []).length === 1 ? '' : 's'}${(d.datasheets || []).length ? ' · ' + d.datasheets.length + ' datasheet' + (d.datasheets.length === 1 ? '' : 's') : ''}</div>
    ${d.status === 'draft_created' && d.woo_edit_url ? `<a class="btn sm" style="display:inline-block;margin-top:6px;text-decoration:none" href="${esc(d.woo_edit_url)}" target="_blank" rel="noopener">Open draft to check &amp; publish</a>` : ''}
    ${d.status === 'failed' ? `<div style="color:var(--bad);margin-top:4px">${esc(d.error || '')}</div><button class="btn sm alt" style="margin-top:6px" onclick="retry(${d.id})">Try again</button>` : ''}</div>`).join('') : '<div class="m">Nothing requested yet.</div>';
}
function paintList(){ const e = document.getElementById('list'); if (e) e.innerHTML = listHtml(); }
function render(){
  const a = document.getElementById('app'); a.style.display = 'block';
  const q = document.getElementById('q'), keepQ = q && document.activeElement === q ? q.value : null;
  if (document.getElementById('f_price')) keep();
  const ship = (D.ship_classes || []);
  a.innerHTML = `<a class="back" href="website.html">← Website</a><div class="title">New web product</div>
    <div class="sub">Pick it from Cin7, add photos, datasheets and any notes. Claude writes the listing and SEO and creates a <b>draft</b> on the website. You check it and press publish.</div>
    ${msg ? `<div class="msg ${msg.ok ? 'ok' : 'bad'}">${esc(msg.t)}</div>` : ''}
    <div class="card"><div class="k">1 · Cin7 product</div>
    ${pick ? `<b style="font-family:var(--num);font-size:26px;letter-spacing:1px;font-weight:400">${esc(pick.sku)}</b><div>${esc(pick.name)}</div><div class="m">${esc(pick.brand || '')}${pick.supplier_name ? ' · ' + esc(pick.supplier_name) : ''}${cost() ? ' · cost ' + gbp(cost()) : ''}</div>
      <button class="btn sm alt" style="margin-top:8px" onclick="pick=null;hits=[];render()">Pick a different product</button>`
    : `<input id="q" type="search" placeholder="SKU or name" autocomplete="off" oninput="search(this.value)"><div id="hits">${hits.map(hitHtml).join('')}</div>`}</div>
    ${pick ? '' : recHtml()}
    ${pick ? `<div class="card"><div class="k">2 · Price and shipping</div>
      <div class="row"><div><div class="m">Web price, ex VAT (£)</div><input id="f_price" type="number" step="0.01" inputmode="decimal" value="${esc(form.price)}" oninput="keep();document.getElementById('mg').textContent=marginTxt()"><div class="m" id="mg" style="margin-top:4px">${marginTxt()}</div></div>
      <div><div class="m">Weight (kg, optional)</div><input id="f_weight" type="number" step="0.01" inputmode="decimal" value="${esc(form.weight)}"></div></div>
      <div class="k">Shipping class (optional)</div><select id="f_ship"><option value="">None / set it later</option>${ship.map(s => `<option value="${esc(s.slug)}" ${form.ship === s.slug ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div class="card"><div class="k">3 · Photos (first one is the main image)</div>
      <input type="file" accept="image/*" multiple onchange="addImages([...this.files]);this.value=''">
      <div class="thumbs">${imgs.map((im, i) => `<div class="thumb"><img src="${im.url}">${i === 0 ? '<i>MAIN</i>' : ''}<button onclick="rmImg(${i})">×</button></div>`).join('')}</div></div>
    <div class="card"><div class="k">4 · Datasheets and supplier info</div>
      <input type="file" accept="application/pdf,.pdf" multiple onchange="addSheets([...this.files]);this.value=''">
      ${sheets.map((s, i) => `<div class="file"><span>📄 ${esc(s.name)}</span><button class="btn sm alt" onclick="rmSheet(${i})">Remove</button></div>`).join('')}
      <div class="k">Supplier details (optional)</div><textarea id="f_info" placeholder="Supplier product code, lead time, anything from the supplier's email">${esc(form.info)}</textarea>
      <div class="k">Anything else Claude should know</div><textarea id="f_notes" placeholder="What it's for, sizes, finishes, selling points, things to avoid saying…">${esc(form.notes)}</textarea>
      <button class="btn full" ${busy ? 'disabled' : ''} onclick="submit()">${busy ? 'Working…' : 'Send to Claude → create draft'}</button></div>` : ''}
    <div class="card"><div class="k">Recent requests</div><div id="list">${listHtml()}</div></div>`;
  if (keepQ !== null) { const e = document.getElementById('q'); if (e) { e.value = keepQ; e.focus(); } }
}
if (token) refresh(); else showLogin();
TSDAuth.mount(t => { document.getElementById('login').style.display = 'none'; token = t; refresh(); });
</script>
<script>
(function(){ const BUILD = '20261104115233'; let newer = false;
  setInterval(async () => { try { if (!newer) { const t = await (await fetch(location.href, {cache:'reload'})).text(); const m = t.match(/const BUILD = '(\d+)'/); newer = !!(m && m[1] !== BUILD); }
    if (newer && !busy && !imgs.length && !sheets.length && !pick && !document.activeElement?.matches('input,textarea,select')) location.reload(); } catch(e){} }, 120000);
})();
</script>
</body>
</html>

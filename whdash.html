*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px}
.wrap{padding:18px 20px 30px;max-width:1300px;margin:0 auto}
h1{font-family:var(--num);font-size:42px;letter-spacing:1px;margin:0;line-height:1}
.sub{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tile .k{color:var(--muted);font-size:15px;font-weight:600}
.tile .n{font-family:var(--num);font-size:84px;line-height:1;margin:4px 0}
.tile .s{color:var(--muted);font-size:14px}
.tile.bad{border-color:var(--bad)}.tile.bad .n{color:var(--bad)}.tile.good .n{color:var(--good)}.tile.y .n{color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h2{font-family:var(--num);font-size:26px;letter-spacing:.5px;margin:0 0 8px;font-weight:400}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}.bar .l{flex:0 0 46%;font-size:15px}.bar .b{flex:1;background:var(--panel2);border-radius:6px;height:22px;overflow:hidden}.bar .b i{display:block;height:100%;background:var(--accent)}.bar .v{width:34px;text-align:right;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.row:first-of-type{border-top:0}
.row b{font-weight:700}.late{color:var(--bad);font-weight:700;white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.mini div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.mini b{font-family:var(--num);font-size:34px;display:block;font-weight:400}.mini span{color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:6px 0}.note{color:var(--muted);font-size:13px;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>WAREHOUSE TODAY</h1>
  <div class="sub" id="upd">Loading…</div>
  <div id="out"></div>
</div>
<script>
const API = 'https://uppxdrihpxsygaorffro.supabase.co/functions/v1/warehouse-dash';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dd = n => n === 1 ? '1 day' : n + ' days';
function draw(d){
  const pct = d.week_sent ? Math.round(100 * d.week_late / d.week_sent) : 0;
  const max = Math.max(1, ...d.by_service_today.map(x => x.n));
  const diff = d.sent_today - d.sent_yesterday;
  document.getElementById('out').innerHTML = `
  <div class="tiles">
    <div class="tile good"><div class="k">Sent out today</div><div class="n">${d.sent_today}</div><div class="s">Yesterday: ${d.sent_yesterday}</div></div>
    <div class="tile y"><div class="k">Still to go today</div><div class="n">${d.to_send}</div><div class="s">Orders that should leave by tonight</div></div>
    <div class="tile ${d.overdue_now ? 'bad' : 'good'}"><div class="k">Overdue right now</div><div class="n">${d.overdue_now}</div><div class="s">${d.overdue_now ? 'Should already have gone' : 'Nothing overdue'}</div></div>
    <div class="tile ${d.week_late ? 'bad' : 'good'}"><div class="k">Went out late (7 days)</div><div class="n">${d.week_late}</div><div class="s">${d.week_sent} sent · ${pct}% late</div></div>
  </div>
  <div class="cols">
    <div class="card"><h2>SENT TODAY BY SERVICE</h2>${d.by_service_today.length ? d.by_service_today.map(x => `<div class="bar"><div class="l">${esc(x.service)}</div><div class="b"><i style="width:${Math.round(100 * x.n / max)}%"></i></div><div class="v">${x.n}</div></div>`).join('') : '<div class="empty">Nothing sent yet today.</div>'}</div>
    <div class="card"><h2>OVERDUE RIGHT NOW</h2>${d.overdue_list.length ? d.overdue_list.map(x => `<div class="row"><span><b>${esc(x.no)}</b> ${esc(x.customer || '')}<br><span class="sub">${esc(x.service || 'No service set')}</span></span><span class="late">${dd(x.days_late)} late</span></div>`).join('') : '<div class="empty">All good. Nothing overdue.</div>'}</div>
    <div class="card"><h2>WENT OUT LATE (LAST 7 DAYS)</h2>${d.late_list.length ? d.late_list.map(x => `<div class="row"><span><b>${esc(x.no)}</b> ${esc(x.customer || '')}<br><span class="sub">${esc(x.service || 'No service set')} · sent ${new Date(x.sent + 'T12:00:00').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'})}</span></span><span class="late">${dd(x.days_late)} late</span></div>`).join('') : '<div class="empty">Nothing went out late.</div>'}</div>
  </div>
  <div class="mini">
    <div><b>${d.picked_waiting}</b><span>Picked, waiting to ship</span></div>
    <div><b>${d.stock_issues}</b><span>Can't find stock</span></div>
    <div><b>${d.backordered}</b><span>On backorder</span></div>
    <div><b>${d.van_count}</b><span>On the van list</span></div>
  </div>
  <div class="note"><b>How late is worked out:</b> next-day orders in before 2pm should go the same day (after 2pm, the next working day). 2-3 day orders should go by the end of day 2. Anything with a "required by" date uses that date. Orders that came in with no service and are wanted today aren't counted as late. Counts cover orders sent through Bob; collections aren't included.</div>`;
  document.getElementById('upd').textContent = 'Updated ' + new Date(d.generated_at).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', timeZone:'Europe/London'}) + ' · refreshes by itself';
}
async function load(){
  try { const r = await fetch(API, {cache:'no-store'}); if (!r.ok) throw 0; draw(await r.json()); }
  catch(e){ if (!document.getElementById('out').innerHTML) document.getElementById('upd').textContent = "Can't load right now. Check the connection."; }
}
load(); setInterval(load, 60000);
(function(){ const BUILD='20261110091908'; setInterval(async () => { try { const t = await (await fetch(location.pathname + '?_=' + Date.now(), {cache:'no-store'})).text(); const m = t.match(/const BUILD='(\d+)'/); if (m && m[1] !== BUILD) location.reload(); } catch(e){} }, 300000); })();
</script>
</body>
</html>
